*{box-sizing:border-box;margin:0;padding:0}

.section{margin-bottom:4px}

.row{display:grid;grid-template-columns:58px 1fr auto;align-items:start;gap:10px;padding:6px 8px;border-radius:6px;border:0.5px solid var(--border);margin-bottom:4px;cursor:default;transition:background .1s}
.row:hover{background:var(--surface-1)}
.num{font-size:10px;font-weight:500;color:var(--text-muted);padding-top:1px}
.name{font-size:12px;color:var(--text-primary);margin-bottom:2px}
.note{font-size:10px;color:var(--text-muted);line-height:1.5}
.pill{font-size:9px;font-weight:500;padding:2px 7px;border-radius:8px;white-space:nowrap;align-self:start}
.p-complete  {background:#EAF3DE;color:#3B6D11;border:0.5px solid #97C459}
.p-partial   {background:#FAEEDA;color:#854F0B;border:0.5px solid #EF9F27}

.p-open      {background:#FCEBEB;color:#A32D2D;border:0.5px solid #E24B4A}

.p-built     {background:#EAF3DE;color:#3B6D11;border:0.5px solid #97C459}
.hidden{display:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-secondary)}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}

  '120':{'s':'closed','n':'CORRECTED — RFR2 is not a gap, it is agnostic interaction-space infra','d':'v0.2 roadmap correction (2026-07-01/02): detectBottlenecks/clusterByAnomaly returning [] is an explicit design boundary, not a stub — RFR2s own delta module header says judgment is deferred to a sigma layer on purpose. That sigma layer already exists and already runs: lib/cfr/sigma.js + lib/sigma-writer.js + the event ledger baseline. RFR2 composes with them, does not get filled in by them. My earlier framing (this entry, and COMPONENT-MAP-CFR-RFR2.md) called this the load-bearing gap — that was wrong, corrected here.'},

  '121':{'s':'closed','n':'Lattice Path decision — alk-gl.js vs alk-lattice.html','d':'CLOSED — Path B: kept separate. alk-lattice.html stays the Architect bounded self-portrait (own hooks/blueprints, own WebGL1 context); alk-gl.js is the general substrate for Nerve/CFR/RFR2 nodes. Matches AXIOMS Group5.7 low coupling/high cohesion — two topologies with different update cadences do not belong on one substrate.'},

  '127':{'s':'complete','n':'AXIOMS v3.0 — held as active build gate','d':'14 groups, docs/AXIOMS-v3.0.md, real and complete. Nothing built from Phase 121 on proceeds without checking against it — §1.2/1.3 (no stubs pretending to work), §3.3 (map before build), §12.6 (every component gets a diagnostic engine — this is what answers "connect the diagnostic tool," not one tool: every LOOM/Warp component ships its own).'},
  '128':{'s':'sourced','n':'Warp v1.4 devkit integration','d':'source: warp-devkit-v1-0000-2026-0701-jamesbrooks-001. Zero-dependency, NEXUS imports WARP / WARP never imports NEXUS. Event to Gate to Stream to StreamLog+Axiom, unified dispatch (exact-cache, pre-gen filter, population, cascade, axiom-gate, score-retain, escalate). This is the mechanism that makes small-LLM-sized components cheap to regenerate correctly — becomes LOOM underlying dispatch engine, not a bolt-on. v1.4 real measurements in dispatch/benchmark.js; the unbenchmarked 10x-35x claims from the original patch doc were explicitly retracted in MANIFEST.json — hold to that correction.'},
  '129':{'s':'sourced','n':'LOOM — meta-system for the system itself (name provisional)','d':'Idearium, but for NEXUS own specs/repos/roadmap/changelog/notes/IDE/tagging. Not a new build — idearium/repo/index.js RepoLayer already treats a fork or dropped zip as a tracked idea with lineage; idearium/spec-engine/index.js already chunks specs with UUID/contract tracking. LOOM = RepoLayer pointed at the 50 iterations + all system specs, given its own roadmap-per-system view, not a second Idearium instance. Name flagged provisional — same naming-collision lesson as RAID in v0.1: confirm before it is load-bearing anywhere.'},
  '130':{'s':'pending','n':'LOOM auto-poll / drift tracking','d':'idearium/repo/watcher.js exists (7,934 bytes) but was unaudited before this session — contents still not read. Activating continuous poll-and-track-changes depends on confirming what it already does before wiring it live.'},
  '131':{'s':'next','n':'LOOM build order — component/seam/hook/wire schema + config layer','d':'first buildable unit, per explicit build order: (1) component/seam/hook/wire schema/config — the map/file/config layer, modeled on architect/registry-components.js existing per-component declaration pattern — (2) CLI, (3) API, (4) interaction contract, (5) UI last. Build now = step 1 only.'},

  '134':{'s':'pending','n':'Guardian server.js first-principles decomposition','d':'mapped, not decomposed: 4,365 lines (grew from 4,321 at phase 119), 99 route/function-declaration matches, 19 top-level requires, 2 remaining DISABLED comment blocks. Phase 119 already stripped the first dead block and rewrote dispatch functions — this is the rest: full route/NCP-handler split mirroring copilot/intuition/{shared,handlers/*}.js 1-handler-per-intent pattern. No test harness for guardian exists yet, unlike copilot (phase 117) — needed before, not after, decomposition, or regressions are invisible.'},

  '137':{'s':'sourced','n':'Hidden/background tab + service access via CLI+API','d':'source: clear-glass/src/main/index.js already has bgTabs (Map, agentId to hidden BrowserWindow), openBackgroundTab()/closeBackgroundTab()/listBackgroundTabs(), and ipc/bridge.js already exposes bgtab:open/close/list over IPC, plus §P-CG-01 auto-boots all NCP provider tabs hidden on startup. This is not a new build — it needs a CLI wrapper and LOOM registration, the mechanism already runs.'},
  '138':{'s':'sourced','n':'Separate ClearGlass-backend userscript','d':'source: clear-glass/src/userscripts/manager.js (8,979 bytes, real, contents unaudited this session) — a userscript manager already exists inside ClearGlass, distinct from Guardian per-provider tab userscripts (ui/agents/{claude,chatgpt,gemini,mistral,perplexity}). Extends existing scaffold, not a from-scratch system — audit manager.js contents before writing new code here.'},
  '139':{'s':'partial','n':'Copilot stabilization (continued)','d':'phase 117 fixed the intuition.js crash-loop and split it into handlers. Carried forward, not closed — "get copilot working" implies more than the one crash is still in scope, unaudited this session which parts.'},
  '140':{'s':'partial','n':'Ollama stabilization (continued)','d':'ollama/server.js, ollama-runtime.js, hooks/ollama.hooks.js all real (confirmed earlier session) with live ledger entries. Health/uptime not re-verified this session — "get it working" flagged as open until re-checked live, not assumed fixed because the files exist.'},
  '141':{'s':'built','n':'LOOM agent-suite','d':'built this session, mirrors idearium/agent-suite/index.js real pattern exactly (same tool surface shape: Cortex memory, gap diagnostic, system health, spec context, repair — over HTTP to Guardian/Cortex/Ollama ports) — LOOM own version, registered through LOOM own component/seam/hook/wire registry, tested.'},
  '142':{'s':'pending','n':'Guardian/Ollama/Copilot registered into LOOM','d':'once 134/139/140 have real, current structure (not the stale 2026-07-01 snapshot), map them the same way warp-map.js mapped Warp — one component per file, real require()/route edges only.'},

  '144':{'s':'built','n':'LOOM revision ingest — drag-and-drop backend','d':'built and verified this session against the real archives: ingestZip() hashes, lists via unzip -l, diffs against the last revision, writes to loom/data/revisions.json. Tested against your actual __30 to __31 upgrade (correctly found +37/-0/~0) and a 7-case synthetic suite. Drag-and-drop itself is UI (133, deferred) — this is the function a drop handler will call once that exists.'},
  '145':{'s':'built','n':'Generalized system-scaffold — build another NEXUS system on the fly','d':'built and verified this session: one operations list drives five generated projections (component/seam/hook/wire registered into LOOM, CLI first, API second, registry-components.js, interaction-contract.json shaped exactly like idearium real one) in the stated order. UI is not a code path that exists in the generator, not merely unused. Test suite actually spawns the generated CLI as a child process and hits the generated API over real HTTP, not just checking files exist — 9/9 pass, including a real bug the test run caught and fixed (invalid JS identifier from a hyphenated system name).'},
  '146':{'s':'pending','n':'Merge session0702b into nexus-consolidated__32','d':'loom/ingest and loom/templates injected into a verified copy of __31 to produce __32 — integrity-checked (unzip -t clean), entry count 10,991 to 10,998 (exactly the 7 new files), full 44-test regression run from the real internal path before packaging.'},

  '147':{'s':'closed','n':'Self-building loop traced end to end — Copilot to Guardian to ClearGlass to a real AI provider','d':'CLOSED, traced not assumed: copilot/lifeline.js escalates below 0.75 confidence to guardian:7820/api/copilot/prompt, guardian checks ncp.isConnected(provider), lib/ncp.js is a real SSE+fetch protocol (replacing WebSocket specifically to avoid TLS on localhost), guardian/userscript-claude.js (2,234 lines) is the real client with a genuine EventSource connection, and clear-glass/src/userscripts/manager.js auto-loads that exact userscript matched to https://claude.ai/* — confirmed wired at clear-glass/src/main/index.js:498. The loop is real, not aspirational. Not verified live/running.'},
  '148':{'s':'built','n':'clearglass-accounts — account manager with real dynamic usage routing','d':'built and tested this session (13/13, against a fake local vaultd over real HTTP, not mocked): accounts.add stores the session/cookie reference via cos/vaultd, never locally; accounts.usage-report records a usage percent; accounts.route skips any account at or above the 90% threshold and picks the least-loaded eligible one. Generated via loom/templates/system-scaffold.js — dogfooded, and doing so found and fixed a real generator bug (see 149).'},
  '149':{'s':'built','n':'system-scaffold route-ordering bug found and fixed','d':'the generator emitted routes in declaration order — a shorter path like /api/accounts always shadowed a longer, more specific one like /api/accounts/usage, making the longer route permanently dead code. Found by actually building clearglass-accounts (which has exactly this overlap) and running it. Fixed: routes now sort longest-path-first. Regression test added to system-scaffold.test.js so this cannot silently return.'},
  '150':{'s':'open','n':'COS is a complete, real, unused island','d':'confirmed this session: cos/vaultd/server.js is a real, running, encrypted, access-controlled secret daemon (GET /status, POST /secrets, GET+DELETE /secrets/:scope/:id, POST /grant+/revoke) with its own CLI (cos/cli/commands/vault.js, vaultd.js) — and grep for require(.*cos across guardian/server.js, clear-glass/src/main/index.js, clear-glass/src/copilot/bridge.js, orchestrator.js, and copilot/lifeline.js returns zero hits. Nothing outside cos/ knows it exists. This is the direct answer to "hook COS into NEXUS."'},
  '151':{'s':'open','n':'cos/vaultd default port (3750) collides with NEXUS copilot (3750)','d':'confirmed: cos/vaultd/server.js line ~172 defaults requestedPort to 3750 if none given; copilot/lifeline.js and clear-glass/src/copilot/bridge.js both confirm NEXUS copilot runs on :3750. Two real services claiming the same default port — must be resolved (redeploy vaultd on a distinct port, e.g. the 3760 placeholder clearglass-accounts already assumes) before vaultd can run alongside copilot.'},
  '152':{'s':'pending','n':'Userscripts re-identified as ClearGlass-native + import folder','d':'clear-glass/src/userscripts/manager.js already auto-loads Guardian userscripts from guardianDir and user scripts from .clear-glass/userscripts/ (confirmed real, wired) — what is still open: giving ClearGlass its own identity/namespace for these scripts rather than reaching into guardian/ by path, and a real import flow (folder or CLI) for adding new ones. Not started this session.'},
  '153':{'s':'pending','n':'CORS/security policy (135) now blocks more than tab-priority','d':'135 was already open (zero CORS/CSP hits in ClearGlass). This session adds two more things now waiting on it: account-manager cookie/session handling across origins, and any dynamic routing that opens a new provider tab automatically. Same root cause, now three dependents instead of one.'},

  '154':{'s':'closed','n':'cos create hung — root cause was a wizard with no non-interactive path','d':'CLOSED: cos/cli/commands/create.js only exposed runCreateWizard() (readline.createInterface + rl.question, 4 sequential prompts) — no flag-driven path, despite createCompartment() underneath already being a clean synchronous function per its own doc comment. In any non-TTY context this blocks forever, indistinguishable from a hang. Fixed: cli/index.js now takes a --purpose/--yes/--non-interactive path straight to createCompartment(), verified end to end (create, list, map all produce real output) from a fresh extraction of the actual shipped archive.'},
  '155':{'s':'closed','n':'cos/ inside nexus-consolidated was a stale, crashing copy — isKnownRuntimeId missing','d':'CLOSED: a second, deeper bug found while verifying 154 — cos/archetype/schema.js imports and calls isKnownRuntimeId from foundation/runtime-enum.js, which never defined it (only RUNTIMES/RUNTIME_MAP/RUNTIME_IDS existed). This crashed archetype/registry.js at require() time, which crashed cli/index.js at require() time — every single cos CLI command failed before argument parsing ever ran. This was very likely the actual "I could not get it to run" root cause, separate from 154. Confirmed the separately-uploaded cos-vaultd.zip already has this fixed (a newer, correct copy) — replaced the stale cos/ tree inside nexus-consolidated with that corrected version, reapplied the 154 fix on top of it, verified end to end from a fresh extraction of the final shipped archive.'},

  '156':{'s':'built','n':'loom/contracts — one compartment per component-chunk, registry does reassembly','d':'built and tested this session (11/11): resolves the 3-state-machine-reconciliation question raised earlier not by unifying Idearium/Guardian/COS state vocabularies but by containment — a Contract is bound to exactly one COS compartment scoped to exactly one component_id, and LOOM tracks only open/passed/failed plus an append-only handoff log. closeContract(pass) is the only path that writes hooks into the SHARED registry (same Phase-131 Gate+Axiom path, not reimplemented). Test proves the actual design claim end to end: two components pass in fully separate, mutually-unaware contracts, then a real wire-declare call (same mechanism as Warp mapping) connects their hooks — the registry, not the compartments, is what knows they relate. retryContract() mirrors COS real RECYCLED-is-terminal behavior (checked this session, phase 155-adjacent finding): closes the old contract, opens a fresh one for the same component_id, links by parentId — never reuses a compartment.'},
  '157':{'s':'closed','n':'LoomRegistry cross-instance staleness — found building 156, fixed at the source','d':'CLOSED: has()/get()/all()/graph() read from an in-memory _state loaded once at construct time and never refreshed. Two separate LoomDriver instances pointed at the same dataDir (exactly what a real CLI process and a real API process are) could not see each others writes. Directly violated the registry own header comment (§2.2 storage device IS the source of truth). Fixed: reread from disk before every read op, writes unchanged. Verified this did not break any of the 45 previously-passing tests across schema/agent-suite/ingest/system-scaffold before adding the new contracts suite on top (56/56 total).'},
  '158':{'s':'parked','n':'PARKED — from-scratch NEXUS render engine (parse/cascade/layout/paint, own HTML-alternative)','d':'Raised 2026-07-02 alongside the (kept) native compositor idea. Explicitly decided NOT NOW: real cost is weeks-months of native C++/C# work (parser, cascade, flexbox-only layout; Direct2D+DirectWrite kept, not reinvented, for text shaping) for a payoff — rendering NEXUS-authored UI — that WebView2 already does correctly today. Every real bug this session (copilot:send stub, missing extensions/manager.js, dead buttons) was the preload/ipcMain glue drifting apart, not Chromium rendering badly — a new engine does not touch that failure class. Kept instead: the native DirectComposition compositor (Tier2 nerve contract layer, phase 121-area work) which is smaller, targets the actual failure mode, and does not require replacing WebView2 for provider tabs. This entry exists so "didnt we already decide this" has a citable answer — re-open deliberately, dont let it silently resurface.'},
  '159':{'s':'sourced','n':'nexus-intelligence-system.spec — names the 7 real cognition layers and the 3 gaps between them','d':'Master doc, 2026-07-02. NEXUS intelligence is 7 layers, each real and independently correct: L1 measurement (RFR2 delta, built, not wired to live events), L2 scoring (cfr/sigma.js, real, running), L3 field (cfr/field.js, real, running), L4 memory (event-ledger + cortex chat_log, real, conditioning_log not yet written), L5 cognition (intuition/analysis in cortex/boot.js, real but reads 8 chat lines not the full picture), L6 simulation (cortex/core/raid/simulation.js, proposed, not built), L7 enforcement (RFR2 BoundaryIndex, built, not wired to live events). The 3 gaps: (1) L1+L7 have no event producer, (2) nothing sits between RAID _decide() and dispatch, (3) L5 never reads L1-L4 together. Every other spec below is one of these 3 gaps.'},
  '160':{'s':'sourced','n':'nexus-query-surface.spec — GET /api/cortex/query, the prerequisite gap-3 fix','d':'Single route joining gaps, sigma trajectory, CFR field, events, blueprint divergence, and Versionium commits into one narrative answer via mastermind(). Closes gap-3 from phase 159: co-pilot stops reading 8 chat_log lines and starts reading the actual joined state before responding. Everything downstream (relationship shape, project flow, optimization service) depends on this existing first — named as the literal first build phase in every other spec in this batch.'},
  '161':{'s':'sourced','n':'nexus-relationship-shape.spec v0.1 — CFR+RFR2 define a measurable shape for any two things','d':'Any interaction (systems, people, ideas, sessions) has a real shape: CFR coherence/friction/resonance/entropy as the 4-number snapshot, sigma as that shape compressed to one stress score, RFR2 delta as change-over-time, cfr/graph.js ancestors()/descendants() as causal root tracing, detectFractals() as repeat-pattern detection. Query surface extended to accept two subjects. Pairwise and query-triggered only — see 162 for what it does not cover.'},
  '162':{'s':'sourced','n':'nexus-relationship-shape.spec v0.2 — associative lattice, written this session','d':'Direct response to "I just want connections to form" — v0.1 only answers a named pair when asked; this makes the graph a standing thing. New relationship_lattice JAA table, edge = shape for every system pair, updated event-triggered (piggybacks on v0.1 step 3) plus a 10min background sweep for low-traffic pairs. New traversal surface: rank_by_sigma, walk_from(node,hops), find_unexpected_correlations (edges that move together with no shared causal ancestor). What-ifs compose COS N-way BranchEngine.fork() (already speced, branching-decision-loop doc) with RAID simulate(dry_run) against lattice edges — simulated edges tagged and stored separately from live ones, same separation Versionium already uses for simulation-vs-real history. Zero new engines — first thing that holds the combined CFR+RFR2+COS+RAID output as persistent state instead of recomputing per question.'},
  '163':{'s':'sourced','n':'copilot-system-programmer.spec — durable monitors, scheduled tasks, conversation memory written redundantly','d':'The actual new capability among the 5(+3): co-pilot creating schedules table entries that run independently ("monitor guardian sigma, alert if >0.5") instead of only responding when asked. Also: redundant conversation ledger (event_log write alongside chat_log, never just one copy), conditioning_log write after every response (closes gap-3 from 159 over time), lab session composition for feedback loops, multi-system task graphs via the contract queue.'},
  '164':{'s':'sourced','n':'nexus-project-flow.spec — empty-state behavior, idea to spec to repo, what-if engine','d':'When project_registry is empty, co-pilot reads idearium stalled phases + open gaps + sigma trajectory and opens a specific offer instead of asking how it can help. What-if engine is RAID simulate(dry_run:true) composed through natural language — same math as a live dispatch decision, not a separate guess. Chunked distribution via a Versionium tree.'},
  '165':{'s':'sourced','n':'nexus-optimization-service.spec — feedback flywheel, RAID fitness extension, explicit self-improvement boundary','d':'RAID Layer-2 fitness stubs (role_confidence, topological_proximity, snrTierGate — all hardcoded 1.0 today) get real values, computed by raid-simulation-engine (166). Morning briefing synthesizes last 24h into ranked opportunities. field_memory table records recovery paths per relationship — next stress event surfaces what worked last time. Hard, explicit boundary: observation and suggestion are automatic, modification always requires human intent — not a soft guideline, written into the spec directly.'},
  '166':{'s':'sourced','n':'raid-simulation-engine.spec — L6, the pre-commit dry-run between RAID deciding and dispatch actually happening','d':'Explicitly NOT an extension of RAID (v6.2.0, 313-line pure function, 21 tests, LAW_I/III load-bearing) — a new module, cortex/core/raid/simulation.js, wrapping _decide()s output. Runs the proposed dispatch through an ephemeral COS sandbox compartment (never reaches INTEGRATED, ships to Vault not event_log), scores it with RFR2 delta + cfr/sigma, checks all 25 enforcement invariants, returns commit/fallback/escalate/inconclusive. Never blocks on inconclusive — a dispatch that was going to succeed still succeeds. This is also what completes the 3 stubbed RAID fitness values feeding phase 165.'},
  '167':{'s':'sourced','n':'alk-gl-intelligence-canvas.spec (+ face v0.2 extension) — the particle field driven by intelligence state instead of audio','d':'canvas-cfr.js already drives ALK-GL from audio (RMS to structure, sub-band to entropy, hi-band to curl, kernel faults to injectStress) — this is the identical pattern with intelligence data as the source instead: CFR entropy/coherence/friction/resonance to the same 4 field uniforms, attractor mass from per-system sigma health, RFR2 S/C-field to temporary curl spikes and mass shifts. The face extension (v0.2, same UUID family) maps all 29 already-wired MediaPipe blendshapes to intelligence states — jaw-open pulses with token generation rate, frown to CONSTITUTIONAL faults with gaze locking onto the faulting attractor, gaze itself continuously points at whatever the query surface is currently reasoning about. Two real bugs already found and fixed building the driver: a float-precision test issue, and a genuine mutual-exclusion ordering bug (a one-shot smile could override a fault frown because the one-shot ran after the exclusion check) — fixed in both module and test, 22/22 passing.'},
  '168':{'s':'open','n':'59 of 113 specs have zero representation anywhere in this phase map','d':'Found running a systematic cross-reference (spec filename vs full phase-map text) while adding 159-167 above. This map only tracks 8 of the intelligence-layer specs because those are the ones actually read in depth this session — the other 51 (api-dispatch, autonomous-loop, cortex-dual-cognition, diagnostic-engines, gap-lifecycle, hot-module-loader, jaa-db, liminal-space, reflection-engine, replay-engine, seam-queue, siso, user-model, and ~38 more, full list not reproduced here to avoid guessing at content not yet read) are real spec files this map says nothing about. Deliberately not guess-mapping them — this entry exists so the gap itself is tracked honestly rather than silently implying phase-map coverage is more complete than it is.'},
  '169':{'s':'sourced','n':'nexus-system-foundation.spec (+addendum) — the L0-L5 contract every NEXUS system implements','d':'Not a module, a contract: L0 immutable core (axioms/schemas/constants) → L1 event bus → L2 CLI (reads component registry) → L3 API → L4 handshake (registers with orchestrator) → L5 UI (hotswappable, renders only). Couple only to L0/L1, never to L3-L5. Addendum v1.1 (superseded into base 2026-06-29) added AX-008 co-pilot reachability — checked live: copilot/cortex/guardian/ollama already wire hooks.out to copilot, bridge/idearium/architect/emerge/diagnostic do not, mechanism real but not universal.'},
  '170':{'s':'built','n':'nexus-nerve.spec v0.2 — the actual spec behind the already-built Phase 0/1 pulse+read work','d':'4-layer stack, precisely named: CFR (lib/cfr/field.js) = Truth, what happened frozen. nexus-bus.js = Motion, what is happening in transit. Nerve = Attention, what is locally knowable now, centered on where attention actually is. ALK-GL = Expression, how it feels when it moves. Explicitly a from-scratch rebuild — v0.1 was lost, never persisted, a real §2.1 violation named in its own supersedes note. This is the spec lib/nerve/index.js (getSnapshot/onChange/setRadius, 16/16 tests) was actually built against, confirmed earlier this session.'},
  '171':{'s':'sourced','n':'nexus-decomposition-architecture.spec — one component-to-file mapping — this entry supersedes nexus-system-foundation-addendum-v1.1.0.spec, promoted into the base foundation spec 2026-06-29 for every layer, backend and UI','d':'Seven layers smallest to largest, each separately trackable, each maps onto the one below — pick any layer and walk up or down without guessing. Consolidates component-file mapping, seam/role-confidence, hook/wire registry, variable-level call tracing, UI folder decomposition, causal sensation, dual-sided handoff state, universal hot-swap into one design, citing what is real vs proposed per its own §1.1 discipline.'},

  '173':{'s':'sourced','n':'ui-location.spec + ui-registry.spec — where each UI lives, and how sessions are tracked','d':'ui-location: each system owns its UI, lives with the system, orchestrator serves directly from each folder, no sync/mirror step, resolves a real dual-location problem and names Eravos as sovereign. ui-registry: POST /api/ui/register issues a sessionId, 30s heartbeat / 70s timeout, disconnect emits SSE to all clients, multiple UIs tracked simultaneously.'},
  '174':{'s':'sourced','n':'request-handler.spec + constitutional-ai.spec + context-builder.spec — the A/B/C/D request pipeline','d':'The constitutional choke point: single entry for every request, no bypasses. Phase A (constitutional-ai.spec): should we act — goal graph, constitution (USER_AUTONOMY/REVERSIBILITY/TRUTH_OVER_COHERENCE/EXPLAINABILITY), cost analysis, identity kernel that survives every patch. Phase B: grammar engine → SNR filter → memory synthesis (context-builder.spec — standard last-N JAA events, or semantic via vector-memory) → RAID selection → execute. Phase C: reflect. Phase D: learn.'},
  '175':{'s':'sourced','n':'contract-queue.spec + cfr-contract-wire.spec — every inter-system request is a tracked, disk-written contract','d':'contract_shape carries fromSystem/fromComponent/fromHook through toSystem/toComponent/toHook with status queued|dispatched|running|complete|failed|stuck — meta-poller watches for stuck contracts and unsticks them. cfr-contract-wire.spec: CFR tracks the same contracts through wires hook-to-hook, making CFR the relational field — every node a component, every edge a wire, deviation from the contracts declared shape is a gap. Direct match to lib/contract-queue.js, the file promoted from copilot/lib to shared lib/ earlier this session after being found genuinely needed by both orchestrator and copilot.'},
  '176':{'s':'sourced','n':'copilot-expansion.spec + copilot-migration-and-new-capabilities.spec — co-pilot self-expansion, and the hyphen-naming migration','d':'copilot-expansion: everything NEXUS can do, co-pilot can access and eventually build itself (map, spec, build bottom-up, QC, merge) — ollama primary, guardian fallback. copilot-migration (status partially-resolved, verified against live code): the naming tell is literal — "co-pilot" hyphenated means pre-sovereign-split legacy, "copilot" no-hyphen is the real :3750 system. MIG-01 fixed cli/co-pilot.js posting to a dead /api/guardian/copilot/prompt route — same dead-route shape as the guardian [DISABLED] copilot.agent comment found and the dead guardian/agents/co-pilot test file flagged, both earlier this session.'},
  '177':{'s':'sourced','n':'alk-gl-intelligence-canvas-face.spec is covered in 167 above. cortex-intelligence.spec — names the exact gap nexus-intelligence-system.spec (159) later calls L5','d':'Checked directly against live code: Phase 84/85 billed cortex/intelligence/{intuition,mastermind}.js as separate files with BEP+sigma+fault-taxonomy. Neither file exists — both are local functions inside cortex/boot.js, _intuitionAnswer() and _mastermindAnalysis(), real and queried live by copilot, but _intuitionAnswer does keyword-rule matching over live CFR field state, never touches lib/causal/compound.js BEP patterns or open-loop-taxonomy.js classify(). This is the earlier, narrower version of the same gap phase 159 names as L5 not synthesizing L1-L4 together.'},

  '182':{'s':'sourced','n':'meta-layer.spec + spatial.spec — six lazy-loaded intelligence modules, no ports, library not service','d':'meta-layer: topo-kernel (8-gate SNR pipeline: Entropy→Variance→Consistency→Fidelity→Causality→Pattern→IME→Bayesian, the primitive everything else mounts on) + telemetry-codec + 4 more, imported not registered, used internally by cortex/guardian/diagnostic/userscripts. spatial.spec: the sigma engine (regime states STABLE/ACTIVATING/UNGROUNDED/DYSREGULATED/OSCILLATORY/COLLAPSING/OFFLINE) plus the resonance-weighted associative lattice engine, path lib/meta/spatial/index.js — the exact file idearium/api/index.js references, whose broken relative-path require was fixed earlier this session (meta/spatial/lattice.js).'},
  '183':{'s':'sourced','n':'nexus-analysis-module-foundation.spec — the template copilot/module-builder.js should use for trend/growth/regime modules','d':'A specialization of the base system-foundation spec for any module analyzing a time series for shape — growth curves, saturation, regime changes, divergence from baseline. generateSpec() should reach for this template whenever the mapped plans purpose contains trend/curve/growth/saturation/trajectory/divergence/forecast/regime. Adds to L0 imports (computeSigma from lib/cfr/sigma.js) and L3 routes only — L1/L2/L4/L5 unchanged from the base foundation.'},
  '184':{'s':'sourced','n':'nexus-improvement-roadmap.spec — 30 improvements from two what-if rounds, engineering-reference half of NEXUS-IMPROVEMENT-MAP.md','d':'IMP-01 through IMP-30, leverage_tier 1 (changes the cost of future work) through 5 (hardening only). All status proposed, none built. IMP-01 example: session-to-spec compiler, mapping liminal assumption/structural detectors + CQL + module-builder.map() run over a transcript. Plain-language half lives in NEXUS-IMPROVEMENT-MAP.md; this is the engineering-reference half.'},

  '190':{'s':'open','n':'docs/specs/*.md — a third, older layer-numbered system (0-15) parallel to this phase maps own numbering','d':'COBALT-CORE (layer 0, immutable kernel, SISO bus + JAA only, sealed after v3.3.0), CAUSAL-NEXUS (layer 7, SNR gate + sigma/delta backup engine — only sigma-worthy changes trigger new revision snapshots), NEXUS-SELF (layer 15, hourly rolling self-portrait, explicitly above orchestrator: "Self observes, orchestrator routes"), ORCHESTRATOR-COS (layer 13, confirms orchestrator.js is literally "the unified HTTP proxy + CLI entry point + §AXIOM source of truth" — the real file behind every orchestrator/lib fix made this session), SYSTEM-MAP (v9.0, the whole layer-0-to-15 stack). A third numbering scheme (this phase map, LOOMs phase-121-157 registry, and now this 0-15 layer stack) describing overlapping territory — same pattern as the two disagreeing component registries and three disagreeing system-count files found earlier. Not reconciled here — flagged, matching how the other two were handled.'},
};

let activeFilter = 'all';
let visibleCount = 0;

const PILL_LABELS = {
  complete:'complete', partial:'partial', next:'build now',
  sourced:'source found', pending:'pending', open:'open loop',
  superseded:'superseded', closed:'closed ✓', unblocked:'unblocked',
  built:'built ✓', parked:'parked'
};

function pill(s) {
  const cls = s === 'closed' || s === 'built' ? 'p-complete' : 'p-' + s;
  return `<span class="pill ${cls}">${PILL_LABELS[s]||s}</span>`;
}

function matches(id, filter) {
  if (filter === 'all') return true;
  if (filter === 'open') return ['open','unblocked'].includes(DATA[id]?.s);
  return DATA[id]?.s === filter;
}

function filterRows() {
  const q = document.getElementById('search').value.toLowerCase();
  visibleCount = 0;
  document.querySelectorAll('.row[data-id]').forEach(row => {
    const id = row.dataset.id;
    const d = DATA[id];
    const textMatch = !q || id.toLowerCase().includes(q) || d.n.toLowerCase().includes(q) || d.d.toLowerCase().includes(q);
    const filterMatch = matches(id, activeFilter);
    const show = textMatch && filterMatch;
    row.classList.toggle('hidden', !show);
    if (show) visibleCount++;
  });
  document.querySelectorAll('.section').forEach(sec => {
    const visible = sec.querySelectorAll('.row:not(.hidden)').length;
    sec.querySelector('.section-count').textContent = visible;
    sec.classList.toggle('hidden', visible === 0);
  });
  updateStats();
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterRows();
}

function updateStats() {
  const counts = {};
  Object.values(DATA).forEach(d => { counts[d.s] = (counts[d.s]||0)+1; });
  const el = document.getElementById('stats');
  const total = Object.keys(DATA).length;
  el.innerHTML = `
    <span class="stat"><span>${total}</span> total</span>
    <span class="stat"><span style="color:#3B6D11">${counts.complete||0}</span> complete</span>
    <span class="stat"><span style="color:#EF9F27">${counts.partial||0}</span> partial</span>
    <span class="stat"><span style="color:#378ADD">${counts.sourced||0}</span> sourced</span>
    <span class="stat"><span style="color:#7F77DD">${(counts.next||0)}</span> build now</span>
    <span class="stat"><span style="color:#E24B4A">${(counts.open||0)+(counts.unblocked||0)}</span> open loops</span>
    <span class="stat"><span>${counts.pending||0}</span> pending</span>
    ${visibleCount < total ? `<span class="stat">showing <span>${visibleCount}</span></span>` : ''}
  `;
}

function render() {
  const map = document.getElementById('map');
  map.innerHTML = SECTIONS.map(sec => {
    const rows = sec.phases.map(id => {
      const d = DATA[id];
      if (!d) return '';
      return `<div class="row" data-id="${id}">
        <span class="num">${id}</span>
        <div>
          <div class="name">${d.n}</div>
          ${d.d ? `<div class="note">${d.d}</div>` : ''}
        </div>
        ${pill(d.s)}
      </div>`;
    }).join('');
    return `<div class="section" id="sec-${sec.id}">
      <div class="section-header">${sec.label} <span class="section-count">${sec.phases.length}</span></div>
      ${rows}
    </div>`;
  }).join('');
  filterRows();
}

render();
</script>
