  '156':{'s':'built','n':'loom/contracts — one compartment per component-chunk, registry does reassembly','d':'built and tested this session (11/11): resolves the 3-state-machine-reconciliation question raised earlier not by unifying Idearium/Guardian/COS state vocabularies but by containment — a Contract is bound to exactly one COS compartment scoped to exactly one component_id, and LOOM tracks only open/passed/failed plus an append-only handoff log. closeContract(pass) is the only path that writes hooks into the SHARED registry (same Phase-131 Gate+Axiom path, not reimplemented). Test proves the actual design claim end to end: two components pass in fully separate, mutually-unaware contracts, then a real wire-declare call (same mechanism as Warp mapping) connects their hooks — the registry, not the compartments, is what knows they relate. retryContract() mirrors COS real RECYCLED-is-terminal behavior (checked this session, phase 155-adjacent finding): closes the old contract, opens a fresh one for the same component_id, links by parentId — never reuses a compartment.','t':'done'},
  '157':{'s':'closed','n':'LoomRegistry cross-instance staleness — found building 156, fixed at the source','d':'CLOSED: has()/get()/all()/graph() read from an in-memory _state loaded once at construct time and never refreshed. Two separate LoomDriver instances pointed at the same dataDir (exactly what a real CLI process and a real API process are) could not see each others writes. Directly violated the registry own header comment (§2.2 storage device IS the source of truth). Fixed: reread from disk before every read op, writes unchanged. Verified this did not break any of the 45 previously-passing tests across schema/agent-suite/ingest/system-scaffold before adding the new contracts suite on top (56/56 total).','t':'done'},
  '158':{'s':'parked','n':'PARKED — from-scratch NEXUS render engine (parse/cascade/layout/paint, own HTML-alternative)','d':'Raised 2026-07-02 alongside the (kept) native compositor idea. Explicitly decided NOT NOW: real cost is weeks-months of native C++/C# work (parser, cascade, flexbox-only layout; Direct2D+DirectWrite kept, not reinvented, for text shaping) for a payoff — rendering NEXUS-authored UI — that WebView2 already does correctly today. Every real bug this session (copilot:send stub, missing extensions/manager.js, dead buttons) was the preload/ipcMain glue drifting apart, not Chromium rendering badly — a new engine does not touch that failure class. Kept instead: the native DirectComposition compositor (Tier2 nerve contract layer, phase 121-area work) which is smaller, targets the actual failure mode, and does not require replacing WebView2 for provider tabs. This entry exists so "didnt we already decide this" has a citable answer — re-open deliberately, dont let it silently resurface.','t':'n/a — explicitly not now'},
  '159':{'s':'sourced','n':'nexus-intelligence-system.spec — names the 7 real cognition layers and the 3 gaps between them','d':'Master doc, 2026-07-02. NEXUS intelligence is 7 layers, each real and independently correct: L1 measurement (RFR2 delta, built, not wired to live events), L2 scoring (cfr/sigma.js, real, running), L3 field (cfr/field.js, real, running), L4 memory (event-ledger + cortex chat_log, real, conditioning_log not yet written), L5 cognition (intuition/analysis in cortex/boot.js, real but reads 8 chat lines not the full picture), L6 simulation (cortex/core/raid/simulation.js, proposed, not built), L7 enforcement (RFR2 BoundaryIndex, built, not wired to live events). The 3 gaps: (1) L1+L7 have no event producer, (2) nothing sits between RAID _decide() and dispatch, (3) L5 never reads L1-L4 together. Every other spec below is one of these 3 gaps.','t':'XL — 1-2 weeks (estimated)'},
  '160':{'s':'sourced','n':'nexus-query-surface.spec — GET /api/cortex/query, the prerequisite gap-3 fix','d':'Single route joining gaps, sigma trajectory, CFR field, events, blueprint divergence, and Versionium commits into one narrative answer via mastermind(). Closes gap-3 from phase 159: co-pilot stops reading 8 chat_log lines and starts reading the actual joined state before responding. Everything downstream (relationship shape, project flow, optimization service) depends on this existing first — named as the literal first build phase in every other spec in this batch.','t':'L — 2-4 days (estimated)'},
  '161':{'s':'sourced','n':'nexus-relationship-shape.spec v0.1 — CFR+RFR2 define a measurable shape for any two things','d':'Any interaction (systems, people, ideas, sessions) has a real shape: CFR coherence/friction/resonance/entropy as the 4-number snapshot, sigma as that shape compressed to one stress score, RFR2 delta as change-over-time, cfr/graph.js ancestors()/descendants() as causal root tracing, detectFractals() as repeat-pattern detection. Query surface extended to accept two subjects. Pairwise and query-triggered only — see 162 for what it does not cover.','t':'L — 2-4 days (estimated)'},
  '162':{'s':'sourced','n':'nexus-relationship-shape.spec v0.2 — associative lattice, written this session','d':'Direct response to "I just want connections to form" — v0.1 only answers a named pair when asked; this makes the graph a standing thing. New relationship_lattice JAA table, edge = shape for every system pair, updated event-triggered (piggybacks on v0.1 step 3) plus a 10min background sweep for low-traffic pairs. New traversal surface: rank_by_sigma, walk_from(node,hops), find_unexpected_correlations (edges that move together with no shared causal ancestor). What-ifs compose COS N-way BranchEngine.fork() (already speced, branching-decision-loop doc) with RAID simulate(dry_run) against lattice edges — simulated edges tagged and stored separately from live ones, same separation Versionium already uses for simulation-vs-real history. Zero new engines — first thing that holds the combined CFR+RFR2+COS+RAID output as persistent state instead of recomputing per question.','t':'XL — 1-2 weeks (estimated)'},
  '163':{'s':'sourced','n':'copilot-system-programmer.spec — durable monitors, scheduled tasks, conversation memory written redundantly','d':'The actual new capability among the 5(+3): co-pilot creating schedules table entries that run independently ("monitor guardian sigma, alert if >0.5") instead of only responding when asked. Also: redundant conversation ledger (event_log write alongside chat_log, never just one copy), conditioning_log write after every response (closes gap-3 from 159 over time), lab session composition for feedback loops, multi-system task graphs via the contract queue.','t':'L — 2-4 days (estimated)'},
  '164':{'s':'sourced','n':'nexus-project-flow.spec — empty-state behavior, idea to spec to repo, what-if engine','d':'When project_registry is empty, co-pilot reads idearium stalled phases + open gaps + sigma trajectory and opens a specific offer instead of asking how it can help. What-if engine is RAID simulate(dry_run:true) composed through natural language — same math as a live dispatch decision, not a separate guess. Chunked distribution via a Versionium tree.','t':'L — 2-4 days (estimated)'},
  '165':{'s':'sourced','n':'nexus-optimization-service.spec — feedback flywheel, RAID fitness extension, explicit self-improvement boundary','d':'RAID Layer-2 fitness stubs (role_confidence, topological_proximity, snrTierGate — all hardcoded 1.0 today) get real values, computed by raid-simulation-engine (166). Morning briefing synthesizes last 24h into ranked opportunities. field_memory table records recovery paths per relationship — next stress event surfaces what worked last time. Hard, explicit boundary: observation and suggestion are automatic, modification always requires human intent — not a soft guideline, written into the spec directly. UPDATE 2026-07-06: topological_proximity now has a real, opt-in implementation path (Phase 192) — role_confidence and snrTierGate remain honest 1.0 stubs, unchanged.','t':'L — 2-4 days (estimated)'},
  '166':{'s':'sourced','n':'raid-simulation-engine.spec — L6, the pre-commit dry-run between RAID deciding and dispatch actually happening','d':'Explicitly NOT an extension of RAID (v6.2.0, 313-line pure function, 21 tests, LAW_I/III load-bearing) — a new module, cortex/core/raid/simulation.js, wrapping _decide()s output. Runs the proposed dispatch through an ephemeral COS sandbox compartment (never reaches INTEGRATED, ships to Vault not event_log), scores it with RFR2 delta + cfr/sigma, checks all 25 enforcement invariants, returns commit/fallback/escalate/inconclusive. Never blocks on inconclusive — a dispatch that was going to succeed still succeeds. This is also what completes the 3 stubbed RAID fitness values feeding phase 165.','t':'XL — 1-2 weeks (estimated)'},
  '167':{'s':'sourced','n':'alk-gl-intelligence-canvas.spec (+ face v0.2 extension) — the particle field driven by intelligence state instead of audio','d':'canvas-cfr.js already drives ALK-GL from audio (RMS to structure, sub-band to entropy, hi-band to curl, kernel faults to injectStress) — this is the identical pattern with intelligence data as the source instead: CFR entropy/coherence/friction/resonance to the same 4 field uniforms, attractor mass from per-system sigma health, RFR2 S/C-field to temporary curl spikes and mass shifts. The face extension (v0.2, same UUID family) maps all 29 already-wired MediaPipe blendshapes to intelligence states — jaw-open pulses with token generation rate, frown to CONSTITUTIONAL faults with gaze locking onto the faulting attractor, gaze itself continuously points at whatever the query surface is currently reasoning about. Two real bugs already found and fixed building the driver: a float-precision test issue, and a genuine mutual-exclusion ordering bug (a one-shot smile could override a fault frown because the one-shot ran after the exclusion check) — fixed in both module and test, 22/22 passing.','t':'L — 2-4 days (estimated)'},
  '168':{'s':'open','n':'59 of 113 specs have zero representation anywhere in this phase map','d':'Found running a systematic cross-reference (spec filename vs full phase-map text) while adding 159-167 above. This map only tracks 8 of the intelligence-layer specs because those are the ones actually read in depth this session — the other 51 (api-dispatch, autonomous-loop, cortex-dual-cognition, diagnostic-engines, gap-lifecycle, hot-module-loader, jaa-db, liminal-space, reflection-engine, replay-engine, seam-queue, siso, user-model, and ~38 more, full list not reproduced here to avoid guessing at content not yet read) are real spec files this map says nothing about. Deliberately not guess-mapping them — this entry exists so the gap itself is tracked honestly rather than silently implying phase-map coverage is more complete than it is.','t':'L — 2-4 days (estimated)'},
  '169':{'s':'sourced','n':'nexus-system-foundation.spec (+addendum) — the L0-L5 contract every NEXUS system implements','d':'Not a module, a contract: L0 immutable core (axioms/schemas/constants) → L1 event bus → L2 CLI (reads component registry) → L3 API → L4 handshake (registers with orchestrator) → L5 UI (hotswappable, renders only). Couple only to L0/L1, never to L3-L5. Addendum v1.1 (superseded into base 2026-06-29) added AX-008 co-pilot reachability — checked live: copilot/cortex/guardian/ollama already wire hooks.out to copilot, bridge/idearium/architect/emerge/diagnostic do not, mechanism real but not universal.','t':'L — 2-4 days (estimated)'},
  '170':{'s':'built','n':'nexus-nerve.spec v0.2 — the actual spec behind the already-built Phase 0/1 pulse+read work','d':'4-layer stack, precisely named: CFR (lib/cfr/field.js) = Truth, what happened frozen. nexus-bus.js = Motion, what is happening in transit. Nerve = Attention, what is locally knowable now, centered on where attention actually is. ALK-GL = Expression, how it feels when it moves. Explicitly a from-scratch rebuild — v0.1 was lost, never persisted, a real §2.1 violation named in its own supersedes note. This is the spec lib/nerve/index.js (getSnapshot/onChange/setRadius, 16/16 tests) was actually built against, confirmed earlier this session.','t':'done'},
  '171':{'s':'sourced','n':'nexus-decomposition-architecture.spec — one component-to-file mapping — this entry supersedes nexus-system-foundation-addendum-v1.1.0.spec, promoted into the base foundation spec 2026-06-29 for every layer, backend and UI','d':'Seven layers smallest to largest, each separately trackable, each maps onto the one below — pick any layer and walk up or down without guessing. Consolidates component-file mapping, seam/role-confidence, hook/wire registry, variable-level call tracing, UI folder decomposition, causal sensation, dual-sided handoff state, universal hot-swap into one design, citing what is real vs proposed per its own §1.1 discipline.','t':'L — 2-4 days (estimated)'},
  '172':{'s':'sourced','n':'nexus-shell-ui.spec — the TV-channel UI model, floating menu button is Layer 0','d':'Layer 0 meta shell (always visible, never reloads): floating menu button bottom-right, system grid overlay, status pulse, version badge, connection indicator. Layer 1 is the active channel, changes on click, each system its own sovereign animated page. This is the spec behind the exact floating-menu-button co-pilot CLI investigated and fixed earlier this session (ui/home/index.html asSend(), the Spotlight.execute() undefined-method bug) — that work was implementing this spec, just not cited as such at the time.','t':'L — 2-4 days (estimated)'},
  '173':{'s':'sourced','n':'ui-location.spec + ui-registry.spec — where each UI lives, and how sessions are tracked','d':'ui-location: each system owns its UI, lives with the system, orchestrator serves directly from each folder, no sync/mirror step, resolves a real dual-location problem and names Eravos as sovereign. ui-registry: POST /api/ui/register issues a sessionId, 30s heartbeat / 70s timeout, disconnect emits SSE to all clients, multiple UIs tracked simultaneously.','t':'M — 1 day (estimated)'},
  '174':{'s':'sourced','n':'request-handler.spec + constitutional-ai.spec + context-builder.spec — the A/B/C/D request pipeline','d':'The constitutional choke point: single entry for every request, no bypasses. Phase A (constitutional-ai.spec): should we act — goal graph, constitution (USER_AUTONOMY/REVERSIBILITY/TRUTH_OVER_COHERENCE/EXPLAINABILITY), cost analysis, identity kernel that survives every patch. Phase B: grammar engine → SNR filter → memory synthesis (context-builder.spec — standard last-N JAA events, or semantic via vector-memory) → RAID selection → execute. Phase C: reflect. Phase D: learn.','t':'L — 2-4 days (estimated)'},
  '175':{'s':'sourced','n':'contract-queue.spec + cfr-contract-wire.spec — every inter-system request is a tracked, disk-written contract','d':'contract_shape carries fromSystem/fromComponent/fromHook through toSystem/toComponent/toHook with status queued|dispatched|running|complete|failed|stuck — meta-poller watches for stuck contracts and unsticks them. cfr-contract-wire.spec: CFR tracks the same contracts through wires hook-to-hook, making CFR the relational field — every node a component, every edge a wire, deviation from the contracts declared shape is a gap. Direct match to lib/contract-queue.js, the file promoted from copilot/lib to shared lib/ earlier this session after being found genuinely needed by both orchestrator and copilot.','t':'L — 2-4 days (estimated)'},
  '176':{'s':'sourced','n':'copilot-expansion.spec + copilot-migration-and-new-capabilities.spec — co-pilot self-expansion, and the hyphen-naming migration','d':'copilot-expansion: everything NEXUS can do, co-pilot can access and eventually build itself (map, spec, build bottom-up, QC, merge) — ollama primary, guardian fallback. copilot-migration (status partially-resolved, verified against live code): the naming tell is literal — "co-pilot" hyphenated means pre-sovereign-split legacy, "copilot" no-hyphen is the real :3750 system. MIG-01 fixed cli/co-pilot.js posting to a dead /api/guardian/copilot/prompt route — same dead-route shape as the guardian [DISABLED] copilot.agent comment found and the dead guardian/agents/co-pilot test file flagged, both earlier this session.','t':'L — 2-4 days (estimated)'},
  '177':{'s':'sourced','n':'alk-gl-intelligence-canvas-face.spec is covered in 167 above. cortex-intelligence.spec — names the exact gap nexus-intelligence-system.spec (159) later calls L5','d':'Checked directly against live code: Phase 84/85 billed cortex/intelligence/{intuition,mastermind}.js as separate files with BEP+sigma+fault-taxonomy. Neither file exists — both are local functions inside cortex/boot.js, _intuitionAnswer() and _mastermindAnalysis(), real and queried live by copilot, but _intuitionAnswer does keyword-rule matching over live CFR field state, never touches lib/causal/compound.js BEP patterns or open-loop-taxonomy.js classify(). This is the earlier, narrower version of the same gap phase 159 names as L5 not synthesizing L1-L4 together.','t':'L — 2-4 days (estimated)'},
  '178':{'s':'sourced','n':'grammar-engine.spec + seam-component-registry.spec — command resolution trie + the self-describing identity kernel','d':'Grammar engine: reads the component registry, builds an O(k) trie, tab completion, live rebuild on SSE — "grammar owned by registry, engine reads, never writes" (§CR-006). Seam-component-registry v1.1: queryable identity for every component, comp_type earned not declared (§1.1). Both directly ground the component-registry.js and grammar-engine.js path fixes made earlier this session (guardian/lib/grammar-fallback.js, orchestrator/lib/request-handler.js) — these specs are what those two shared lib/ files actually implement.','t':'L — 2-4 days (estimated)'},
  '179':{'s':'sourced','n':'raid-snr-filter.spec + intelligence-bridge.spec — invariants first, patterns second, AI last; and RAID querying intelligence before every decision','d':'SNR filter resolution order: known invariant (tokens:0) → crystallised pattern with pre-staged fix (tokens:0) → open loop, dispatch with context flag → genuine unknown, dispatch to AI with context. intelligence-bridge: RAID queries crystallised patterns + failure precursors + user-model hypotheses + liminal items before routing, advisory only, never overrides — outcome logged back after execution, every output teaches the pattern engine.','t':'L — 2-4 days (estimated)'},
  '180':{'s':'sourced','n':'guardian-user-understanding.spec — a persistent model of how the user works, stays local','d':'Tracks work patterns (RAID cluster history, time-of-day flow states, session velocity, which providers produce best outcomes, recurring fault classes) and communication patterns (BDA 5-signal baseline: valence/certainty/openness/tension/selfref, regime shifts from STABLE to DYSREGULATED). Explicit framing: sovereignty not surveillance, nothing leaves NEXUS.','t':'M — 1 day (estimated)'},
  '181':{'s':'sourced','n':'behavioral-boundary.spec — the organ that watches the line between deterministic and fluid zones, not the fluid zone itself','d':'Deterministic zone (never touched by AI, same input same output always) explicitly enumerated: auth/, cortex/self-heal/escalation.js, lib/boot-sequence.js HARD phases, lib/spec-drift.js, lib/version.js, RAID LAW_I/LAW_III, jaa-db.js persistence schema, lib/component-registry.js, contracts/, every .spec file itself. Fluid zone is everything AI-assisted and adaptive within those bounds.','t':'M — 1 day (estimated)'},
  '182':{'s':'sourced','n':'meta-layer.spec + spatial.spec — six lazy-loaded intelligence modules, no ports, library not service','d':'meta-layer: topo-kernel (8-gate SNR pipeline: Entropy→Variance→Consistency→Fidelity→Causality→Pattern→IME→Bayesian, the primitive everything else mounts on) + telemetry-codec + 4 more, imported not registered, used internally by cortex/guardian/diagnostic/userscripts. spatial.spec: the sigma engine (regime states STABLE/ACTIVATING/UNGROUNDED/DYSREGULATED/OSCILLATORY/COLLAPSING/OFFLINE) plus the resonance-weighted associative lattice engine, path lib/meta/spatial/index.js — the exact file idearium/api/index.js references, whose broken relative-path require was fixed earlier this session (meta/spatial/lattice.js).','t':'L — 2-4 days (estimated)'},
  '183':{'s':'sourced','n':'nexus-analysis-module-foundation.spec — the template copilot/module-builder.js should use for trend/growth/regime modules','d':'A specialization of the base system-foundation spec for any module analyzing a time series for shape — growth curves, saturation, regime changes, divergence from baseline. generateSpec() should reach for this template whenever the mapped plans purpose contains trend/curve/growth/saturation/trajectory/divergence/forecast/regime. Adds to L0 imports (computeSigma from lib/cfr/sigma.js) and L3 routes only — L1/L2/L4/L5 unchanged from the base foundation.','t':'L — 2-4 days (estimated)'},
  '184':{'s':'sourced','n':'nexus-improvement-roadmap.spec — 30 improvements from two what-if rounds, engineering-reference half of NEXUS-IMPROVEMENT-MAP.md','d':'IMP-01 through IMP-30, leverage_tier 1 (changes the cost of future work) through 5 (hardening only). All status proposed, none built. IMP-01 example: session-to-spec compiler, mapping liminal assumption/structural detectors + CQL + module-builder.map() run over a transcript. Plain-language half lives in NEXUS-IMPROVEMENT-MAP.md; this is the engineering-reference half.','t':'L — 2-4 days (estimated)'},
  '185':{'s':'sourced','n':'eravos-agnostic-canvas.spec — Eravos node/wire/pack/transport primitives are domain-agnostic, host every visualization instead of building N canvases','d':'Directly extends the "Eravos as a living system" discussion from earlier this session. Argument: organism (spawnable unit) + wire (typed connection) + pack (installable content) + transport (playback control) are not audio-specific by construction. Named leverage: CFR field visualization as 3 wired organisms (fidelity/attention/entropy fields, sigma flowing between), the causal graph as organism-per-event/wire-per-causal-edge (literal shape match to lib/cfr/graph.js, not a metaphor), and the component/seam/wire decomposition map (171) as an organism type using the same field-tension color language Spotlight already proved.','t':'L — 2-4 days (estimated)'},
  '186':{'s':'sourced','n':'nexus-organisms.spec — the ERAVOS organism model (organism/behavior/genome/ecosystem/recipe) extended to NEXUS orchestration generally','d':'An organism is a sovereign unit: defined purpose, bus interface, wiring hooks, capability declaration — never reaches into other organisms directly, all connections are wires, all mutations recorded, all faults named. §1.1: nothing exists until registered in the organism registry. Draft, phase 24.0 per its own header — predates and generalizes what 185 later proposes narrowly for visualization.','t':'M — 1 day (estimated)'},
  '187':{'s':'built','n':'erosmancer.spec — ErosmancerOS, TypeScript CDP browser automation, built and staged','d':'Chrome DevTools Protocol automation platform, separate from Clear Glass — handles tasks where NCP userscripts are not sufficient (scraping, form filling, PDF generation, visual regression) without a user-facing tab. Spec status is explicit: "built, staged — needs npm run build to compile TypeScript."','t':'done'},
  '188':{'s':'sourced','n':'spec-compiler.spec — deterministic code emitter from .spec files, tokens only spent on genuine logic gaps','d':'T0/T1 tiers emit zero LLM tokens, fully deterministic structure emission. T2 (max 800 tokens) and T3 (max 2000) let AI fill genuine logic gaps only. CC-001: query Cortex before emitting, skip if it already exists. CC-005: every emitted file registered with Cortex via Versionium after write. "The spec is the intent. The compiler produces the code. Pay once, recover from spec."','t':'M — 1 day (estimated)'},
  '189':{'s':'closed','n':'diagnostic-fixes.spec + diagnostic-phase-map.spec — historical boot-bug log, and the diagnostic engines own remediation ladder','d':'diagnostic-fixes: named, closed fixes from an earlier session (e.g. spec-drift "bus: _bus" vs the real nexusBus variable name, idearium contract() path resolving one directory too high) — same root-cause shape as several requires fixed this session, just an earlier occurrence. diagnostic-phase-map: service/nexus-diagnostic.js :7825, the active remediation engine — detect (15s health poll across orchestrator/bridge/cortex/guardian/idearium), then a defined fix-attempt and escalation ladder, never silently failing.','t':'done'},
  '190':{'s':'open','n':'docs/specs/*.md — a third, older layer-numbered system (0-15) parallel to this phase maps own numbering','d':'COBALT-CORE (layer 0, immutable kernel, SISO bus + JAA only, sealed after v3.3.0), CAUSAL-NEXUS (layer 7, SNR gate + sigma/delta backup engine — only sigma-worthy changes trigger new revision snapshots), NEXUS-SELF (layer 15, hourly rolling self-portrait, explicitly above orchestrator: "Self observes, orchestrator routes"), ORCHESTRATOR-COS (layer 13, confirms orchestrator.js is literally "the unified HTTP proxy + CLI entry point + §AXIOM source of truth" — the real file behind every orchestrator/lib fix made this session), SYSTEM-MAP (v9.0, the whole layer-0-to-15 stack). A third numbering scheme (this phase map, LOOMs phase-121-157 registry, and now this 0-15 layer stack) describing overlapping territory — same pattern as the two disagreeing component registries and three disagreeing system-count files found earlier. Not reconciled here — flagged, matching how the other two were handled.','t':'L — 2-4 days (estimated)'},
  '191':{'s':'complete','n':'CFR _byComponent edge + componentProximity() — built and tested','d':'Fifth edge type, same ring-buffer pattern as the 4 live ones (causal, session, job, temporal, type-sequence) — zero new CFR API surface, matches docs/cfr.spec exactly. Tested against 4 real cases before touching RAID at all: same-component (1.0), causally-adjacent via a real edge (correctly high), never-co-occurred (0), unknown component (0). Closes Phase 40.6.','t':'S — half day (pattern already proven, 4 tested cases)'},
  '192':{'s':'partial','n':'RAID _fitness() wired to CFR componentProximity (topologicalProximity)','d':'First wiring passed a provider name (dispatchName, e.g. ollama) as the target componentId directly — tested before shipping, found this always returns 0 (namespace mismatch vs real graph IDs like ollama.generate), a worse regression than the original neutral stub. Fixed: _fitness() now requires an explicit targetComponentId from the caller — no fabricated mapping. No graph: neutral 1.0 (unchanged). Graph, no explicit target: still neutral, not silently wrong. Graph + correct mapping: real computed value. Zero production callers yet; role_confidence and snrTierGate remain honest 1.0 stubs. See Phase 165 update.','t':'S — half day (wiring + the caught bug fix)'},
  '193':{'s':'built','n':'RFR2-to-CJS bridge (lib/rfr2-bridge.js) — the one blocker named by raid-simulation-engine.spec, closed','d':'loadRFR2Module(name) dynamic-imports any of the 13 real meta/rfr2/* ESM submodules by name and caches the result — built generically, reusable for all 13, not a one-off for delta. This was the single named reason RFR2 had zero consumers across the entire codebase (confirmed by grep, Phase 223).','t':'S — half day (one generic bridge function)'},
  '194':{'s':'built','n':'RFR2 delta — first real consumer, ever, proven','d':'Loaded via the Phase 193 bridge, called the real (non-stubbed) computeEventDelta() with synthetic data (180ms gap vs ~100ms baseline) and got back real statistics: latencyImpact 16.481, structuralDeviation 1.732. Confirmed the bridge cache returns the same reference on a second call rather than re-importing.','t':'XS — 1-2 hrs (one proof call through an existing bridge)'},
  '195':{'s':'built','n':'RFR2 enforcement — second real consumer, confirming genuine reusability','d':'All 25 real invariants (identity/causality/time/arch/hostile/context/exec-model groups) loaded correctly through the same bridge; createRuntimeGuard() and getInvariant() both real and working. Honest limit: checkKernelInvariants(kernel, boundaryIndex, opts) needs an actual RFR2 kernel object to mean anything — exercising that requires the fuller raid-simulation-engine.spec build (Phase 166), which is scoped out, not done here.','t':'XS — 1-2 hrs (one proof call through an existing bridge)'},
  '196':{'s':'sourced','n':'NEXUS-PHASE-MAP-CROSSREF.md — 6 phases already mapped directly onto specific RFR2 submodules','d':'Phase 27 (System State VM) maps to rfr2/compress+context+time; Phase 30 (Time-Travel Debugging) maps to rfr2/clip+context, called the most direct one-to-one match in the whole corpus; Phase 109 (Epistemic Branch Runtime) maps to rfr2/clip+context+adapter-sandbox+observer, called the big one; Phase 95/OL-17 maps to rfr2/enforcement (see 195); Phase 99/OL-14 maps to rfr2/query (CQL); Phase 50 (Pattern Graph) is already covered by lib/causal/compound.js, explicitly no gap there.','t':'XS — 1-2 hrs (cross-reference reading, no code)'},

  '198':{'s':'complete','n':'Cortex snapshot rollback — built and proven as a real state machine','d':'POST /api/snapshot/rollback added. Tested the actual mechanism, not just response shape: mutated the CFR field, took a snapshot, mutated further, rolled back, confirmed the field genuinely returned to the snapshotted values (coherence: 0.1, friction: 0.9).','t':'M — 1 day (new endpoint + real state-machine test)'},
  '199':{'s':'pending','n':'Cortex self-heal/run — correctly deferred, not built carelessly','d':'Real trigger requires a generic bus-emit passthrough on orchestrator that does not exist yet — named as the actual dependency rather than rushed at the end of a long session.','t':'M — 1-2 days (blocked on orchestrator bus-emit passthrough first)'},
  '200':{'s':'closed','n':'Orchestrator heartbeat regression — self-caught before compounding','d':'An earlier fix in this same session (adding /api/heartbeat + /api/bus/stats) had added a duplicate route that fired before, and therefore permanently shadowed, a real richer pre-existing heartbeat handler (SYSTEM_REGISTRY tracking, SSE broadcast, full health-snapshot). Merged the one real line (nexusBus.emit, closing the Nerve _sources gap) into the actual pre-existing handler, deleted the duplicate. This is exactly the failure class AXIOMS v3.1 section 17.7 exists to catch — a fix that passed its own test while quietly breaking something adjacent.','t':'S — half day (merge + delete duplicate route, retest)'},
  '201':{'s':'built','n':'crystal-lattice reconnected as the real pattern engine feeding copilot/intuition.js','d':'intuition.js had called Cortex /api/intelligence/patterns expecting {precursor,outcome,count,confidence} since it was written; the real function behind that endpoint was a crude event-type tally producing {type,count,lastSeen} — every field intuition read has been undefined, silently rendering Crystallised patterns as undefined -> undefined (NaN%) forever, never a runtime error. Rewired _buildPatterns() to read meta/crystal-lattice.js real crystals JAA table. Proven: inserted a real crystal record, got back guardian:dispatch -> PASS (7x, 92%) exactly, then removed the test record.','t':'M — 1 day (rewire one function to a different real table)'},
  '202':{'s':'open','n':'orchestrator.js /api/autonomous jaaDB:null fix — real, but narrower than first claimed','d':'Fixed a real null-jaaDB bug in /api/autonomous init and the hot-loader init two lines above it. But crystal-lattice.js _getJAA() does its own independent require() of jaaDB, entirely bypassing that init chain — meaning crystal-lattice was never actually blocked by this specific null. The fix is still valid for whatever else depends on the injected parameter; it does not on its own prove crystal-lattice accumulates real data in production. Still genuinely open: whether /api/autonomous is ever invoked by anything besides a direct API call.','t':'XS — 1-2 hrs (two-line null fix; deeper claim already found to be moot)'},

let activeFilter = 'all';
let visibleCount = 0;

const PILL_LABELS = {
  complete:'complete', partial:'partial', next:'build now',
  sourced:'source found', pending:'pending', open:'open loop',
  superseded:'superseded', closed:'closed ✓', unblocked:'unblocked',
  built:'built ✓', parked:'parked'
};

function pill(s) {
  const cls = s === 'closed' || s === 'built' ? 'p-complete' : 'p-' + s;
  return `<span class="pill ${cls}">${PILL_LABELS[s]||s}</span>`;
}

function matches(id, filter) {
  if (filter === 'all') return true;
  if (filter === 'open') return ['open','unblocked'].includes(DATA[id]?.s);
  return DATA[id]?.s === filter;
}

function filterRows() {
  const q = document.getElementById('search').value.toLowerCase();
  visibleCount = 0;
  document.querySelectorAll('.row[data-id]').forEach(row => {
    const id = row.dataset.id;
    const d = DATA[id];
    const textMatch = !q || id.toLowerCase().includes(q) || d.n.toLowerCase().includes(q) || d.d.toLowerCase().includes(q);
    const filterMatch = matches(id, activeFilter);
    const show = textMatch && filterMatch;
    row.classList.toggle('hidden', !show);
    if (show) visibleCount++;
  });
  document.querySelectorAll('.section').forEach(sec => {
    const visible = sec.querySelectorAll('.row:not(.hidden)').length;
    sec.querySelector('.section-count').textContent = visible;
    sec.classList.toggle('hidden', visible === 0);
  });
  updateStats();
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterRows();
}

function updateStats() {
  const counts = {};
  Object.values(DATA).forEach(d => { counts[d.s] = (counts[d.s]||0)+1; });
  const el = document.getElementById('stats');
  const total = Object.keys(DATA).length;
  el.innerHTML = `
    <span class="stat"><span>${total}</span> total</span>
    <span class="stat"><span style="color:#3B6D11">${counts.complete||0}</span> complete</span>
    <span class="stat"><span style="color:#EF9F27">${counts.partial||0}</span> partial</span>
    <span class="stat"><span style="color:#378ADD">${counts.sourced||0}</span> sourced</span>
    <span class="stat"><span style="color:#7F77DD">${(counts.next||0)}</span> build now</span>
    <span class="stat"><span style="color:#E24B4A">${(counts.open||0)+(counts.unblocked||0)}</span> open loops</span>
    <span class="stat"><span>${counts.pending||0}</span> pending</span>
    ${visibleCount < total ? `<span class="stat">showing <span>${visibleCount}</span></span>` : ''}
  `;
}

function render() {
  const map = document.getElementById('map');
  map.innerHTML = SECTIONS.map(sec => {
    const rows = sec.phases.map(id => {
      const d = DATA[id];
      if (!d) return '';
      return `<div class="row" data-id="${id}">
        <span class="num">${id}</span>
        <div>
          <div class="name">${d.n}</div>
          ${d.d ? `<div class="note">${d.d}</div>` : ''}
        </div>
        ${d.t ? `<span class="time-tag" title="estimated build time">${d.t}</span>` : ''}
        ${pill(d.s)}
      </div>`;
    }).join('');
    return `<div class="section" id="sec-${sec.id}">
      <div class="section-header">${sec.label} <span class="section-count">${sec.phases.length}</span></div>
      ${rows}
    </div>`;
  }).join('');
  filterRows();
}

render();
</script>
