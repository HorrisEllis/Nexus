# docs/nexstore-writers.yaml — every writer that persists data: its node type, or the reason it is not one (DT1).
# A writer not listed here fails tests/modules/test-nexstore-writers.test.js. Add one with a reason, or a type:
#   "<file> · <call> · <target>": { reason: "…" }   or   { type: <catalogue type> }
# node lib/nexstore/writers.js --write adds new writers as OWED (then give each its reason).
register:
  name: nexstore writers
  map: docs/2026-10-01-idearium-agent-ready-master-phasemap.spec (DT1)
  generatedBy: lib/nexstore/writers.js
  stats:
    writers: 218
    files: 143
    typed: 27
    reason: 36
    owed: 155
rules:
  - match: '^(guardian/jaa-store\.js|idearium/lib/db\.js|lib/nexstore/(log|record)\.js) · '
    reason: the store engine itself — it writes for every table or type; the type is its caller's, and the caller is censused
  - match: ^idearium/index\.js · syncTable · TABLES\[key\]
    reason: syncs idearium's declared TABLES map — each table in it is typed by name (idearium.<table> in the catalogue)
  - match: '^lib/cortex-write\.js · '
    reason: the write-through adapter (cortex first, data/<system>/<table>.jsonl as the offline buffer) — the table is its caller's
  - match: '^lib/ledger-writer\.js · '
    reason: the unified ledger write surface — it writes for every ledger type its callers name
  - match: ^(cli|cos/cli|scripts)/
    reason: a command-line tool writing an output its user asked for (a report, an export, a config the user runs it to write) — outside the store
  - match: ^loom/templates/
    reason: scaffolding a new system's files (package.json, configs, code) — code being generated, not data being kept
  - match: ^cos/archetype/nexus-system/
    reason: >-
      the nexus-system template (0.39.359) — another system's code kept as a template; its writes are that system's own store (its node files, JAA tables and
      ledger), never Nexus's
