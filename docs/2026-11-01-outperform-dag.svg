ours)</text><rect x="622" y="160" width="250" height="64" rx="10" fill="#0f121b" stroke="#38bdf8" stroke-width="1.4"/><text x="636" y="187" fill="#e5e7ef" font-size="13" font-weight="600">OP3</text><text x="636" y="207" fill="#38bdf8" font-size="12">many cheap tries, tests choose</text><rect x="622" y="250" width="250" height="64" rx="10" fill="#0f121b" stroke="#38bdf8" stroke-width="1.4"/><text x="636" y="277" fill="#e5e7ef" font-size="13" font-weight="600">OP4</text><text x="636" y="297" fill="#38bdf8" font-size="12">sealed suite, hidden tests</text><rect x="30" y="250" width="250" height="64" rx="10" fill="#0f121b" stroke="#a78bfa" stroke-width="1.4"/><text x="44" y="277" fill="#e5e7ef" font-size="13" font-weight="600">EB1</text><text x="44" y="297" fill="#a78bfa" font-size="12">Emerge reads the whole project</text><rect x="918" y="70" width="250" height="64" rx="10" fill="#0f121b" stroke="#38bdf8" stroke-width="1.4"/><text x="932" y="97" fill="#e5e7ef" font-size="13" font-weight="600">OP5</text><text x="932" y="117" fill="#38bdf8" font-size="12">both arms, same start</text><rect x="1214" y="70" width="250" height="64" rx="10" fill="#0f121b" stroke="#38bdf8" stroke-width="1.4"/><text x="1228" y="97" fill="#e5e7ef" font-size="13" font-weight="600">OP6</text><text x="1228" y="117" fill="#38bdf8" font-size="12">the verdict, losses named</text><rect x="1510" y="70" width="250" height="64" rx="10" fill="#0f121b" stroke="#38bdf8" stroke-width="1.4"/><text x="1524" y="97" fill="#e5e7ef" font-size="13" font-weight="600">OP7</text><text x="1524" y="117" fill="#38bdf8" font-size="12">the screen + commands</text><rect x="1806" y="70" width="250" height="64" rx="10" fill="#0f121b" stroke="#fbbf24" stroke-width="1.4"/><text x="1820" y="97" fill="#e5e7ef" font-size="13" font-weight="600">OP8</text><text x="1820" y="117" fill="#fbbf24" font-size="12">first real run (your machine)</text><rect x="1510" y="160" width="250" height="64" rx="10" fill="#0f121b" stroke="#34d399" stroke