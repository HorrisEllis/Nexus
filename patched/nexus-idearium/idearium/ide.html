<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Idearium IDE — Alive Spec Editor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b10;--bg1:#0d1117;--bg2:#111620;--bg3:#161d2e;--panel:#0f1520;
  --b:rgba(56,189,248,.08);--b2:rgba(56,189,248,.18);--b3:rgba(56,189,248,.35);
  --sky:#38bdf8;--sky2:#7dd3fc;--mint:#34d399;--amber:#fbbf24;--coral:#f87171;
  --violet:#a78bfa;--cobalt:#60a5fa;--rose:#fb7185;--teal:#2dd4bf;
  --text:#c9d8f0;--text2:#6b82a8;--text3:#384d6b;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px)}
/* TOPBAR */
.topbar{height:40px;background:var(--bg1);border-bottom:1px solid var(--b2);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:100}
.logo{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--teal);letter-spacing:.15em;display:flex;align-items:center;gap:6px}
.logo-v{font-size:8px;color:var(--violet);align-self:flex-end;padding-bottom:2px}
.tsep{width:1px;height:20px;background:var(--b2)}
.pill{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 8px;border-radius:2px;border:1px solid var(--b2);letter-spacing:.08em;transition:all .3s;cursor:pointer}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.online{border-color:rgba(52,211,153,.4);color:var(--mint)}
.pill.offline{border-color:rgba(248,113,113,.3);color:var(--coral)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:2px;border:1px solid var(--b2);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.tbtn:hover{border-color:var(--b3);color:var(--text)}
/* AGENT DROPDOWN */
.agent-wrap{position:relative}
.agent-select{font-family:var(--mono);font-size:9px;background:var(--bg2);border:1px solid var(--b2);color:var(--sky2);padding:3px 24px 3px 8px;border-radius:2px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.agent-select:focus{border-color:var(--sky)}
.agent-arrow{position:absolute;right:6px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3);font-size:8px}
/* LAYOUT */
.app{height:calc(100vh - 40px);display:grid;grid-template-columns:260px 1fr 280px;grid-template-rows:1fr;gap:1px;background:var(--b)}
/* LEFT PANEL — Idea list */
.panel-left{background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.ph{height:32px;background:var(--bg2);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.ph-title{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.ph-badge{margin-left:auto;font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px;border:1px solid var(--b2);color:var(--text3)}
.ph-badge.live{border-color:rgba(52,211,153,.3);color:var(--mint)}.ph-badge.live::before{content:'● ';font-size:7px}
.idea-search{padding:8px;border-bottom:1px solid var(--b)}
.idea-search input{width:100%;font-family:var(--mono);font-size:10px;background:var(--bg2);border:1px solid var(--b2);color:var(--text);padding:4px 8px;border-radius:2px;outline:none}
.idea-search input:focus{border-color:var(--teal)}
.idea-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.idea-list::-webkit-scrollbar{width:2px}.idea-list::-webkit-scrollbar-thumb{background:var(--b2)}
.idea-row{padding:8px 12px;border-bottom:1px solid var(--b);cursor:pointer;transition:background .15s}
.idea-row:hover{background:var(--bg2)}.idea-row.active{background:var(--bg3);border-left:2px solid var(--teal)}
.idea-phase{font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.idea-text{font-size:11px;color:var(--text);line-height:1.4;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tension-bar{height:2px;background:var(--b);border-radius:1px;overflow:hidden}
.tension-fill{height:100%;border-radius:1px;transition:width .5s ease}
.idea-meta{display:flex;gap:8px;margin-top:4px;font-family:var(--mono);font-size:8px;color:var(--text3)}
.idea-add-btn{margin:8px;font-family:var(--mono);font-size:9px;padding:6px 12px;border-radius:2px;border:1px solid var(--teal);background:none;color:var(--teal);cursor:pointer;transition:all .15s;text-align:center}
.idea-add-btn:hover{background:rgba(45,212,191,.08)}
/* CENTER — Spec editor */
.panel-center{background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.spec-toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--b);flex-shrink:0}
.spec-title-input{flex:1;font-family:var(--mono);font-size:11px;background:none;border:none;color:var(--text);outline:none;font-weight:500}
.spec-save-btn,.spec-check-btn,.spec-ci-btn{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:2px;border:1px solid var(--b2);background:none;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.spec-save-btn:hover{border-color:var(--mint);color:var(--mint)}
.spec-check-btn:hover{border-color:var(--amber);color:var(--amber)}
.spec-ci-btn:hover{border-color:var(--violet);color:var(--violet)}
.sections-list{flex:1;overflow-y:auto;padding:12px}
.sections-list::-webkit-scrollbar{width:2px}.sections-list::-webkit-scrollbar-thumb{background:var(--b2)}
.section-block{margin-bottom:12px;border:1px solid var(--b);border-radius:3px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);cursor:pointer;user-select:none}
.section-head:hover{background:var(--bg3)}
.section-complete{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px}
.section-complete.done{border-color:var(--mint);background:rgba(52,211,153,.15);color:var(--mint)}
.section-title{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text2);flex:1;letter-spacing:.06em;text-transform:uppercase}
.section-progress{font-family:var(--mono);font-size:9px;color:var(--text3)}
.section-body{padding:10px 12px;background:var(--bg1)}
.section-textarea{width:100%;min-height:60px;font-family:var(--mono);font-size:10px;background:var(--bg2);border:1px solid var(--b);color:var(--text);padding:8px;border-radius:2px;outline:none;resize:vertical;line-height:1.5}
.section-textarea:focus{border-color:var(--teal)}
.checklist{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.check-item{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 0}
.check-item input[type=checkbox]{accent-color:var(--teal);cursor:pointer}
.check-label{font-family:var(--mono);font-size:9px;color:var(--text2)}
.check-label.done{color:var(--text3);text-decoration:line-through}
.empty-spec{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px}
.empty-spec p{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:center}
.create-spec-btn{font-family:var(--mono);font-size:10px;padding:6px 16px;border-radius:2px;border:1px solid var(--teal);background:none;color:var(--teal);cursor:pointer}
.create-spec-btn:hover{background:rgba(45,212,191,.08)}
/* RIGHT — panels */
.panel-right{display:flex;flex-direction:column;gap:1px;background:var(--b);overflow:hidden}
.panel-right > .panel-section{background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
/* SNR METER */
.snr-body{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.snr-bar-wrap{height:6px;background:var(--b);border-radius:3px;overflow:hidden;position:relative}
.snr-signal{height:100%;background:var(--mint);border-radius:3px;transition:width .8s ease}
.snr-noise{position:absolute;right:0;top:0;height:100%;background:var(--coral);border-radius:3px;transition:width .8s ease}
.snr-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text3)}
/* GAPS */
.gaps-body{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.gaps-body::-webkit-scrollbar{width:2px}
.gap-item{display:flex;align-items:baseline;gap:6px;padding:4px 6px;border-radius:2px;border:1px solid var(--b);background:var(--bg2)}
.gap-sev{font-family:var(--mono);font-size:8px;padding:0 4px;border-radius:2px;flex-shrink:0}
.gap-sev.high{background:rgba(248,113,113,.1);color:var(--coral);border:1px solid rgba(248,113,113,.2)}
.gap-sev.medium{background:rgba(251,191,36,.08);color:var(--amber);border:1px solid rgba(251,191,36,.18)}
.gap-sev.low{background:rgba(107,130,168,.1);color:var(--text2);border:1px solid var(--b)}
.gap-desc{font-family:var(--mono);font-size:9px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* DISPATCH */
.dispatch-body{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.dispatch-prompt{font-family:var(--mono);font-size:10px;background:var(--bg2);border:1px solid var(--b2);color:var(--text);padding:6px 8px;border-radius:2px;outline:none;resize:none;min-height:48px;width:100%}
.dispatch-prompt:focus{border-color:var(--teal)}
.dispatch-row{display:flex;gap:6px}
.dispatch-btn{flex:1;font-family:var(--mono);font-size:9px;padding:5px;border-radius:2px;border:1px solid var(--sky);background:none;color:var(--sky);cursor:pointer;transition:all .15s}
.dispatch-btn:hover{background:rgba(56,189,248,.08)}.dispatch-btn:disabled{opacity:.4;cursor:not-allowed}
/* STREAM */
.stream{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0;min-height:0}
.stream::-webkit-scrollbar{width:2px}.stream::-webkit-scrollbar-thumb{background:var(--b2)}
.sline{display:flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:9px;padding:1px 10px;border-bottom:1px solid rgba(0,0,0,.1)}
.sl-ts{color:var(--text3);flex-shrink:0;font-size:8px}
.sl-type{font-size:8px;padding:0 3px;border-radius:2px;flex-shrink:0;text-transform:uppercase;letter-spacing:.05em}
.sl-type.idea{background:rgba(45,212,191,.08);color:var(--teal)}.sl-type.spec{background:rgba(96,165,250,.08);color:var(--cobalt)}
.sl-type.gap{background:rgba(248,113,113,.08);color:var(--coral)}.sl-type.ci{background:rgba(167,139,250,.08);color:var(--violet)}
.sl-type.push{background:rgba(52,211,153,.08);color:var(--mint)}.sl-type.snr{background:rgba(107,130,168,.08);color:var(--text2)}
.sl-msg{color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* TOAST */
.toast-wrap{position:fixed;bottom:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:6px;max-width:320px}
.toast{font-family:var(--mono);font-size:10px;padding:8px 12px;border-radius:3px;border:1px solid var(--b2);background:var(--bg1);color:var(--text);animation:tslide .2s ease}
.toast.ok{border-color:rgba(52,211,153,.35);color:var(--mint)}.toast.warn{border-color:rgba(251,191,36,.35);color:var(--amber)}.toast.err{border-color:rgba(248,113,113,.35);color:var(--coral)}
@keyframes tslide{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
/* WIRING STATUS */
.wiring-row{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;font-family:var(--mono);font-size:9px}
.wire-item{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:2px;border:1px solid var(--b);cursor:pointer}
.wire-item.done{border-color:rgba(52,211,153,.3);color:var(--mint)}.wire-item.todo{border-color:var(--b);color:var(--text3)}
.wire-item:hover{border-color:var(--b2);color:var(--text2)}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:4px;padding:20px;min-width:360px;max-width:500px}
.modal h3{font-family:var(--mono);font-size:12px;color:var(--text);margin-bottom:12px;letter-spacing:.08em}
.modal input,.modal textarea{width:100%;font-family:var(--mono);font-size:10px;background:var(--bg1);border:1px solid var(--b2);color:var(--text);padding:6px 8px;border-radius:2px;outline:none;margin-bottom:8px}
.modal input:focus,.modal textarea:focus{border-color:var(--teal)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-btn{font-family:var(--mono);font-size:9px;padding:4px 12px;border-radius:2px;border:1px solid var(--b2);background:none;color:var(--text2);cursor:pointer}
.modal-btn.primary{border-color:var(--teal);color:var(--teal)}.modal-btn.primary:hover{background:rgba(45,212,191,.08)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">⬡ IDEARIUM<span class="logo-v">IDE v1.0</span></div>
  <div class="tsep"></div>
  <div class="pill offline" id="pill-idearium"><span class="pill-dot"></span>IDEARIUM :4800</div>
  <div class="pill offline" id="pill-nexus"><span class="pill-dot"></span>NEXUS :3748</div>
  <div class="pill offline" id="pill-guardian"><span class="pill-dot"></span>GUARDIAN :7820</div>
  <div class="tsep"></div>
  <!-- GUARDIAN AGENT DROPDOWN -->
  <div class="agent-wrap">
    <select class="agent-select" id="agent-select" title="Select Guardian agent">
      <option value="">— no agents —</option>
    </select>
    <span class="agent-arrow">▾</span>
  </div>
  <button class="tbtn" onclick="doDispatchFromDropdown()" id="agent-dispatch-btn" title="Dispatch spec context to selected agent">ASK AGENT</button>
  <div class="tr">
    <button class="tbtn" onclick="doPush()">↑ PUSH</button>
    <button class="tbtn" onclick="refreshAll()">↻ SYNC</button>
  </div>
</div>

<div class="app">
  <!-- LEFT: Idea list -->
  <div class="panel-left">
    <div class="ph"><span class="ph-title">Ideas</span><span class="ph-badge live" id="badge-ideas">0</span></div>
    <div class="idea-search"><input type="text" id="idea-search" placeholder="search ideas..." oninput="filterIdeas(this.value)"/></div>
    <div class="idea-list" id="idea-list"></div>
    <button class="idea-add-btn" onclick="openAddModal()">+ New Idea</button>
  </div>

  <!-- CENTER: Spec editor -->
  <div class="panel-center">
    <div class="spec-toolbar">
      <input class="spec-title-input" id="spec-title" type="text" placeholder="Select an idea to edit its spec..." readonly/>
      <button class="spec-save-btn" onclick="saveSpec()" id="save-btn" disabled>SAVE</button>
      <button class="spec-check-btn" onclick="checkSpec()" id="check-btn" disabled>CHECK</button>
      <button class="spec-ci-btn" onclick="runCI()" id="ci-btn" disabled>CI RUN</button>
    </div>
    <div id="spec-area" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="empty-spec" id="empty-spec">
        <p>Select an idea from the left panel.<br>If it has no spec, you can create one.</p>
      </div>
      <div class="sections-list" id="sections-list" style="display:none"></div>
    </div>
    <!-- Wiring status bar -->
    <div class="wiring-row" id="wiring-row" style="border-top:1px solid var(--b);display:none">
      <span style="font-family:var(--mono);font-size:8px;color:var(--text3);align-self:center">WIRED:</span>
    </div>
  </div>

  <!-- RIGHT panels -->
  <div class="panel-right">
    <!-- SNR Meter -->
    <div class="panel-section" style="flex:0 0 auto">
      <div class="ph"><span class="ph-title">Signal / Noise</span><span class="ph-badge" id="badge-snr">—</span></div>
      <div class="snr-body">
        <div class="snr-bar-wrap">
          <div class="snr-signal" id="snr-signal" style="width:0%"></div>
          <div class="snr-noise" id="snr-noise" style="width:0%"></div>
        </div>
        <div class="snr-labels"><span id="snr-label-signal">signal: —</span><span id="snr-label-noise">noise: —</span><span id="snr-label-ratio">ratio: —</span></div>
      </div>
    </div>
    <!-- Gaps -->
    <div class="panel-section" style="flex:0 0 140px">
      <div class="ph"><span class="ph-title">Open Gaps</span><span class="ph-badge" id="badge-gaps">—</span></div>
      <div class="gaps-body" id="gaps-body"><div style="font-family:var(--mono);font-size:9px;color:var(--text3);padding:8px;text-align:center">no gaps</div></div>
    </div>
    <!-- Agent Dispatch -->
    <div class="panel-section" style="flex:0 0 auto">
      <div class="ph"><span class="ph-title">Agent Dispatch</span><span class="ph-badge live" id="badge-agents">—</span></div>
      <div class="dispatch-body">
        <textarea class="dispatch-prompt" id="dispatch-prompt" placeholder="Prompt — or click ASK AGENT to send current spec context"></textarea>
        <div class="dispatch-row">
          <button class="dispatch-btn" id="disp-btn" onclick="doDispatch()">DISPATCH</button>
        </div>
      </div>
    </div>
    <!-- Event stream -->
    <div class="panel-section" style="flex:1;min-height:0">
      <div class="ph"><span class="ph-title">Event Stream</span><span class="ph-badge live" id="badge-stream">0</span></div>
      <div class="stream" id="stream"></div>
    </div>
  </div>
</div>

<!-- Add idea modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>NEW IDEA</h3>
    <input type="text" id="modal-idea-text" placeholder="Describe your idea in one sentence..."/>
    <input type="text" id="modal-idea-tags" placeholder="Tags (comma separated)"/>
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="submitIdea()">Create</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';
const I_URL = 'http://127.0.0.1:4800';
const N_URL = 'http://127.0.0.1:3748';
const G_URL = 'http://127.0.0.1:7820';

let ideas = [], gaps = [], agents = [], activeIdea = null, activeSpec = null;
let _sse_i = null, _sse_n = null;

// ── Fetch helpers ──────────────────────────────────────────────────────────
async function ifetch(path, method='GET', body=null) {
  try {
    const opts = { method, headers: {'Content-Type':'application/json'}, signal: AbortSignal.timeout(8000) };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(I_URL + path, opts);
    return r.ok ? r.json() : null;
  } catch { return null; }
}
async function gfetch(path) { try { const r = await fetch(G_URL+path, {signal:AbortSignal.timeout(3000)}); return r.ok ? r.json() : null; } catch { return null; } }
async function nfetch(path) { try { const r = await fetch(N_URL+path, {signal:AbortSignal.timeout(3000)}); return r.ok ? r.json() : null; } catch { return null; } }

// ── SSE ────────────────────────────────────────────────────────────────────
function connectIdeaSSE() {
  try {
    _sse_i = new EventSource(I_URL + '/sse');
    _sse_i.onopen = () => { pill('pill-idearium','online'); addStream('idea','Idearium :4800 connected'); };
    _sse_i.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (!d.type || d.type==='connected') return;
        const tc = d.type.startsWith('idea')?'idea':d.type.startsWith('spec')?'spec':d.type.startsWith('gap')?'gap':d.type.startsWith('ci')?'ci':d.type.startsWith('push')?'push':'snr';
        addStream(tc, `${d.type} — ${JSON.stringify(d.payload||{}).slice(0,80)}`);
        // Live refresh on key events
        if (d.type.startsWith('idea')||d.type.startsWith('spec')||d.type.startsWith('gap')) {
          setTimeout(() => { pollIdeas(); pollGaps(); }, 300);
        }
        if (d.type === 'snr.update') updateSNR(d.payload);
      } catch {}
    };
    _sse_i.onerror = () => { pill('pill-idearium','offline'); setTimeout(connectIdeaSSE, 6000); };
  } catch { setTimeout(connectIdeaSSE, 6000); }
}
function connectNexusSSE() {
  try {
    _sse_n = new EventSource(N_URL + '/sse');
    _sse_n.onopen = () => { pill('pill-nexus','online'); };
    _sse_n.onerror = () => { pill('pill-nexus','offline'); setTimeout(connectNexusSSE, 6000); };
  } catch { setTimeout(connectNexusSSE, 6000); }
}

// ── Polls ──────────────────────────────────────────────────────────────────
async function pollIdeas() {
  const d = await ifetch('/api/ideas?sort=tension&limit=100');
  if (!d?.ok) return;
  ideas = d.ideas;
  renderIdeas(ideas);
  el('badge-ideas').textContent = ideas.length;
}
async function pollGaps() {
  const d = await ifetch('/api/gaps?status=open');
  if (!d?.ok) return;
  gaps = d.gaps;
  renderGaps(gaps);
  el('badge-gaps').textContent = gaps.length || '0';
  el('badge-gaps').className = `ph-badge ${gaps.length > 0 ? 'err' : 'live'}`;
}
async function pollSNR() {
  const d = await ifetch('/api/snr');
  if (!d?.ok) return;
  updateSNR(d.snr);
}
async function pollAgents() {
  const d = await ifetch('/api/agents');
  if (d?.ok && d.guardianConnected) {
    agents = d.agents;
    pill('pill-guardian','online');
  } else {
    const gh = await gfetch('/health');
    if (gh) {
      agents = [
        {id:'guardian-claude', name:'Claude (Guardian)', provider:'claude'},
        {id:'guardian-chatgpt', name:'ChatGPT (Guardian)', provider:'chatgpt'},
        {id:'guardian-gemini', name:'Gemini (Guardian)', provider:'gemini'},
      ];
      pill('pill-guardian','online');
    } else {
      agents = [];
      pill('pill-guardian','offline');
    }
  }
  renderAgents(agents);
}
async function refreshAll() {
  await Promise.allSettled([pollIdeas(), pollGaps(), pollSNR(), pollAgents()]);
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderIdeas(list) {
  const e = el('idea-list');
  if (!list.length) { e.innerHTML = '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);padding:16px;text-align:center">no ideas yet</div>'; return; }
  e.innerHTML = list.map(idea => {
    const t = idea.tension || 0;
    const col = t > 0.7 ? 'var(--coral)' : t > 0.4 ? 'var(--amber)' : 'var(--mint)';
    const active = activeIdea?.uuid === idea.uuid ? 'active' : '';
    const phases = {seed:'gray',expanding:'#38bdf8',tensioned:'#fbbf24',specced:'#60a5fa',building:'#a78bfa',complete:'#34d399',archived:'#384d6b'};
    const pcol = phases[idea.phase] || '#6b82a8';
    return `<div class="idea-row ${active}" onclick="selectIdea('${idea.uuid}')">
      <div class="idea-phase" style="color:${pcol}">${idea.phase}</div>
      <div class="idea-text">${esc(idea.text)}</div>
      <div class="tension-bar"><div class="tension-fill" style="width:${t*100}%;background:${col}"></div></div>
      <div class="idea-meta"><span>${Math.round(t*100)}% tension</span>${idea.openGaps?.length ? `<span style="color:var(--coral)">${idea.openGaps.length} gaps</span>` : ''}</div>
    </div>`;
  }).join('');
}

function renderGaps(list) {
  const e = el('gaps-body');
  if (!list.length) { e.innerHTML = '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);padding:8px;text-align:center">no open gaps</div>'; return; }
  e.innerHTML = list.slice(0,10).map(g => `<div class="gap-item"><span class="gap-sev ${g.severity||'low'}">${g.severity||'low'}</span><span class="gap-desc">${esc(g.description||'')}</span></div>`).join('');
}

function renderAgents(list) {
  const sel = el('agent-select');
  const prev = sel.value;
  sel.innerHTML = list.length
    ? list.map(a => `<option value="${a.id}">${a.name}</option>`).join('')
    : '<option value="">— no agents —</option>';
  if (prev && list.find(a => a.id === prev)) sel.value = prev;
  el('badge-agents').textContent = list.length ? `${list.length} agents` : 'offline';
  el('badge-agents').className = `ph-badge ${list.length ? 'live' : ''}`;
}

function renderSpec(spec) {
  if (!spec) { el('empty-spec').style.display='flex'; el('sections-list').style.display='none'; el('wiring-row').style.display='none'; return; }
  el('empty-spec').style.display='none'; el('sections-list').style.display='block'; el('wiring-row').style.display='flex';
  el('spec-title').value = spec.name || '';
  el('save-btn').disabled = false; el('check-btn').disabled = false; el('ci-btn').disabled = false;

  // Sections
  el('sections-list').innerHTML = spec.sections.map((s, si) => {
    const done = s.checklist.filter(c=>c.done).length;
    const total = s.checklist.length;
    const complete = done === total;
    return `<div class="section-block">
      <div class="section-head" onclick="toggleSection('sec-${si}')">
        <div class="section-complete ${complete?'done'}">${complete?'✓':''}</div>
        <span class="section-title">${esc(s.title)}</span>
        <span class="section-progress">${done}/${total}</span>
      </div>
      <div class="section-body" id="sec-${si}" style="display:${s.content||si===0?'block':'none'}">
        <textarea class="section-textarea" data-section="${si}" placeholder="Document this section..."
          onchange="sectionChanged(${si}, this.value)">${esc(s.content||'')}</textarea>
        <div class="checklist">
          ${s.checklist.map((item,ci) => `<label class="check-item">
            <input type="checkbox" ${item.done?'checked':''} onchange="checkItemChanged(${si},${ci},this.checked)"/>
            <span class="check-label ${item.done?'done':''}">${esc(item.label)}</span>
          </label>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  // Wiring
  const w = spec.wired || {};
  const items = [{k:'cli',label:'CLI'},{k:'jaa',label:'JAA'},{k:'toast',label:'Toast'},{k:'eventBus',label:'Event Bus'},{k:'schemaValidated',label:'Schema'}];
  el('wiring-row').innerHTML = '<span style="font-family:var(--mono);font-size:8px;color:var(--text3);align-self:center">WIRED:</span>' +
    items.map(i => `<div class="wire-item ${w[i.k]?'done':'todo'}" onclick="toggleWiring('${i.k}')">${w[i.k]?'✓':'○'} ${i.label}</div>`).join('');
}

function updateSNR(snr) {
  if (!snr) return;
  const total = snr.signal + snr.noise + (snr.events - snr.signal - snr.noise);
  const sigPct = snr.events > 0 ? (snr.signal / snr.events * 100) : 0;
  const noisePct = snr.events > 0 ? (snr.noise / snr.events * 100) : 0;
  el('snr-signal').style.width = sigPct + '%';
  el('snr-noise').style.width = noisePct + '%';
  el('snr-label-signal').textContent = `signal: ${snr.signal}`;
  el('snr-label-noise').textContent = `noise: ${snr.noise}`;
  el('snr-label-ratio').textContent = `ratio: ${(snr.ratio||0).toFixed(2)}`;
  el('badge-snr').textContent = (snr.ratio||0).toFixed(2);
}

// ── Interactions ───────────────────────────────────────────────────────────
async function selectIdea(uuid) {
  const idea = ideas.find(i => i.uuid === uuid);
  if (!idea) return;
  activeIdea = idea;
  // Re-render ideas to highlight selected
  renderIdeas(ideas);

  if (idea.linkedSpec) {
    const d = await ifetch(`/api/specs/${idea.linkedSpec}`);
    if (d?.ok) { activeSpec = d.spec; renderSpec(d.spec); }
  } else {
    activeSpec = null;
    el('empty-spec').style.display='flex';
    el('sections-list').style.display='none';
    el('wiring-row').style.display='none';
    el('spec-title').value = '';
    el('save-btn').disabled=true; el('check-btn').disabled=true; el('ci-btn').disabled=true;
    el('empty-spec').innerHTML = `<p>Idea: "${esc(idea.text.slice(0,60))}"<br>No spec yet.</p><button class="create-spec-btn" onclick="createSpec()">Create Spec</button>`;
  }
  // Auto-run tension
  ifetch(`/api/ideas/${uuid}/tension`, 'POST');
}

async function createSpec() {
  if (!activeIdea) return;
  const d = await ifetch(`/api/ideas/${activeIdea.uuid}/spec`, 'POST');
  if (!d?.ok) { toast('Spec creation failed','err'); return; }
  activeSpec = d.spec;
  await pollIdeas();
  renderSpec(d.spec);
  toast('Spec created','ok');
  addStream('spec', `spec.created — ${d.spec.name?.slice(0,40)}`);
}

function toggleSection(id) {
  const e = el(id);
  if (e) e.style.display = e.style.display === 'none' ? 'block' : 'none';
}

function sectionChanged(sectionIdx, value) {
  if (!activeSpec) return;
  activeSpec.sections[sectionIdx].content = value;
  el('save-btn').style.borderColor = 'var(--amber)'; el('save-btn').style.color = 'var(--amber)';
}

function checkItemChanged(si, ci, checked) {
  if (!activeSpec) return;
  activeSpec.sections[si].checklist[ci].done = checked;
  const label = document.querySelectorAll('.check-label')[si * 10 + ci]; // approximate
  if (label) { label.classList.toggle('done', checked); }
  el('save-btn').style.borderColor = 'var(--amber)'; el('save-btn').style.color = 'var(--amber)';
}

async function toggleWiring(key) {
  if (!activeSpec) return;
  const current = activeSpec.wired || {};
  current[key] = !current[key];
  const d = await ifetch(`/api/specs/${activeSpec.uuid}`, 'PATCH', { wired: current });
  if (d?.ok) { activeSpec = d.spec; renderSpec(d.spec); }
}

async function saveSpec() {
  if (!activeSpec) return;
  const d = await ifetch(`/api/specs/${activeSpec.uuid}`, 'PATCH', { sections: activeSpec.sections, name: el('spec-title').value });
  if (d?.ok) {
    activeSpec = d.spec;
    el('save-btn').style.borderColor=''; el('save-btn').style.color='';
    toast('Spec saved','ok');
    addStream('spec', `spec.saved — ${activeSpec.name?.slice(0,40)}`);
  } else { toast('Save failed','err'); }
}

async function checkSpec() {
  if (!activeSpec) return;
  const d = await ifetch(`/api/specs/${activeSpec.uuid}/check`, 'POST');
  if (!d?.ok) { toast('Check failed','err'); return; }
  toast(d.complete ? `Spec complete ✓ (${d.done}/${d.total})` : `Spec: ${d.done}/${d.total} — ${d.missing?.length} missing`, d.complete ? 'ok' : 'warn');
  addStream('spec', `spec.check — ${d.done}/${d.total} complete`);
}

async function runCI() {
  if (!activeSpec) return;
  const d = await ifetch('/api/ci/run', 'POST', { specUuid: activeSpec.uuid });
  if (!d?.ok) { toast('CI failed to run','err'); return; }
  toast(d.ok ? `CI PASS ✓ ${d.passed}/${d.total}` : `CI FAIL ✗ ${d.passed}/${d.total}`, d.ok ? 'ok' : 'err');
  addStream('ci', `ci.run — ${d.ok ? 'PASS' : 'FAIL'} ${d.passed}/${d.total}`);
}

async function doPush() {
  const d = await ifetch('/api/snapshots', 'POST', { message: `auto-push ${new Date().toISOString().slice(0,16)}` });
  if (!d?.ok) { toast('Push failed','err'); return; }
  toast(`Push: ${d.snapshot?.hash?.slice(0,8)} committed`, 'ok');
  addStream('push', `push — ${d.snapshot?.hash?.slice(0,8)} ideas:${d.snapshot?.ideaCount}`);
}

async function doDispatch() {
  const agent = el('agent-select').value;
  const prompt = el('dispatch-prompt').value.trim();
  if (!agent || !prompt) { toast('Select an agent and enter a prompt','warn'); return; }
  el('disp-btn').disabled = true; el('disp-btn').textContent = '…';
  addStream('idea', `→ ${agent}: ${prompt.slice(0,60)}`);
  const d = await ifetch(`/api/agents/${agent}/dispatch`, 'POST', { service: agent.replace('guardian-',''), prompt });
  el('disp-btn').disabled = false; el('disp-btn').textContent = 'DISPATCH';
  if (d?.ok) {
    const text = d.result?.content || d.result?.text || 'dispatched';
    addStream('idea', `← ${agent}: ${text.slice(0,100)}`);
    toast(`${agent} responded (${text.length}ch)`, 'ok');
  } else { toast(`Dispatch failed: ${d?.error||'unknown'}`, 'err'); }
}

async function doDispatchFromDropdown() {
  const agent = el('agent-select').value;
  if (!agent) { toast('No agent selected','warn'); return; }
  // Build context from active idea + spec
  let prompt = el('dispatch-prompt').value.trim();
  if (!prompt && activeIdea) {
    const specSummary = activeSpec ? `Spec: ${activeSpec.name}. Sections: ${activeSpec.sections.map(s=>`${s.title}(${s.checklist.filter(c=>c.done).length}/${s.checklist.length})`).join(', ')}` : 'No spec yet.';
    prompt = `Idea: "${activeIdea.text}"\nPhase: ${activeIdea.phase}\nTension: ${Math.round((activeIdea.tension||0)*100)}%\n${specSummary}\n\nPlease analyze this idea and suggest next steps.`;
  }
  if (!prompt) { toast('No context to send — add a prompt or select an idea first','warn'); return; }
  el('dispatch-prompt').value = prompt;
  doDispatch();
}

function filterIdeas(query) {
  if (!query) return renderIdeas(ideas);
  const q = query.toLowerCase();
  renderIdeas(ideas.filter(i => i.text.toLowerCase().includes(q) || (i.tags||[]).some(t=>t.includes(q))));
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openAddModal() { el('add-modal').classList.add('open'); el('modal-idea-text').focus(); }
function closeModal() { el('add-modal').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function submitIdea() {
  const text = el('modal-idea-text').value.trim();
  const tags = el('modal-idea-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if (!text) { toast('Text required','err'); return; }
  const d = await ifetch('/api/ideas', 'POST', { text, tags });
  if (!d?.ok) { toast('Create failed: ' + d?.error, 'err'); return; }
  closeModal();
  el('modal-idea-text').value=''; el('modal-idea-tags').value='';
  await pollIdeas();
  toast('Idea created','ok');
  addStream('idea', `idea.created — ${text.slice(0,50)}`);
}

// ── Stream ─────────────────────────────────────────────────────────────────
function addStream(type, msg) {
  const d = new Date(); const ts = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  const se = el('stream'); const line = document.createElement('div'); line.className = 'sline';
  line.innerHTML = `<span class="sl-ts">${ts}</span><span class="sl-type ${type}">${type}</span><span class="sl-msg">${esc(msg.slice(0,120))}</span>`;
  se.prepend(line); if (se.children.length > 80) se.lastChild?.remove();
  el('badge-stream').textContent = se.children.length;
}

// ── Util ───────────────────────────────────────────────────────────────────
const el  = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function pill(id, cls) { const e = el(id); if (e) e.className = `pill ${cls}`; }
function toast(msg, type='ok', dur=3500) {
  const e = document.createElement('div'); e.className = `toast ${type}`; e.textContent = msg;
  el('toasts').appendChild(e); setTimeout(() => e.remove(), dur);
}

// ── Boot ───────────────────────────────────────────────────────────────────
el('modal-idea-text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) submitIdea(); });
connectIdeaSSE(); connectNexusSSE(); refreshAll();
setInterval(refreshAll, 6000);
setInterval(() => { if (!_sse_i || _sse_i.readyState === 2) connectIdeaSSE(); }, 15000);
addStream('idea', 'Idearium IDE booted — :4800 · :3748 · :7820');
</script>
