<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEARIUM — Idea Repository</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root {
  --bg:     #07090e;
  --bg1:    #0b0f18;
  --bg2:    #0f1520;
  --bg3:    #141c2e;
  --panel:  #0d1219;
  --b0:     rgba(56,189,248,0.06);
  --b1:     rgba(56,189,248,0.14);
  --b2:     rgba(56,189,248,0.28);
  --sky:    #38bdf8;
  --sky2:   #7dd3fc;
  --mint:   #34d399;
  --amber:  #fbbf24;
  --coral:  #f87171;
  --violet: #a78bfa;
  --rose:   #fb7185;
  --text:   #c4d4ee;
  --text2:  #607898;
  --text3:  #334560;
  --mono:   'IBM Plex Mono', monospace;
  --sans:   'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{height:38px;background:var(--bg1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 14px;gap:16px;flex-shrink:0}
.logo{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--sky);letter-spacing:.18em}
.logo span{color:var(--text3)}
.tb-sep{width:1px;height:18px;background:var(--b1)}
.tb-stat{font-family:var(--mono);font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px}
.tb-stat .v{font-weight:500}
.tb-stat .v.hi{color:var(--coral)}
.tb-stat .v.ok{color:var(--mint)}
.tb-stat .v.sky{color:var(--sky)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:3px;border:1px solid var(--b1);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.tb-btn:hover{border-color:var(--b2);color:var(--text)}
.tb-btn.active{background:rgba(56,189,248,.1);border-color:var(--b2);color:var(--sky)}

/* LAYOUT */
.body{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden;gap:1px;background:var(--b0)}

/* MAIN LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* PANEL HEADER */
.ph{height:30px;background:var(--bg2);border-bottom:1px solid var(--b0);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.ph-title{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.ph-badge{margin-left:auto;font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:2px;border:1px solid var(--b1);color:var(--text3)}
.ph-badge.live{border-color:rgba(52,211,153,.25);color:var(--mint)}
.ph-badge.live::before{content:'● ';font-size:7px}

/* TOOLBAR */
.toolbar{height:36px;border-bottom:1px solid var(--b0);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.mode-btn{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:3px;border:1px solid var(--b1);background:none;color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap}
.mode-btn:hover{color:var(--text2);border-color:var(--b1)}
.mode-btn.active{border-color:rgba(56,189,248,.35);color:var(--sky);background:rgba(56,189,248,.06)}
.search-input{flex:1;background:none;border:none;outline:none;font-family:var(--mono);font-size:11px;color:var(--text);caret-color:var(--sky)}
.search-input::placeholder{color:var(--text3)}

/* IDEA LIST */
.idea-list{flex:1;overflow-y:auto;padding:8px}
.idea-list::-webkit-scrollbar{width:3px}
.idea-list::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px}

.idea-card{background:var(--bg2);border:1px solid var(--b0);border-radius:6px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden}
.idea-card:hover{border-color:var(--b1);background:var(--bg3)}
.idea-card.selected{border-color:var(--b2);background:rgba(56,189,248,.04)}
.idea-card.forced{border-color:rgba(251,191,36,.25)}
.idea-card.crystallized{border-color:rgba(167,139,250,.2);opacity:.7}

/* tension bar — left edge */
.idea-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:6px 0 0 6px}
.idea-card.t-high::before{background:var(--coral)}
.idea-card.t-med::before{background:var(--amber)}
.idea-card.t-low::before{background:var(--mint)}

.ic-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.ic-name{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.3}
.ic-status{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px;flex-shrink:0}
.ic-intent{font-size:11px;color:var(--text2);margin-bottom:7px;line-height:1.5}
.ic-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ic-tag{font-family:var(--mono);font-size:9px;color:var(--text3);background:var(--bg3);border:1px solid var(--b0);padding:1px 5px;border-radius:2px}
.ic-gap{font-family:var(--mono);font-size:9px;color:var(--coral);display:flex;align-items:center;gap:3px}
.ic-phase{font-family:var(--mono);font-size:9px}
.ic-uuid{font-family:var(--mono);font-size:9px;color:var(--text3)}

/* tension meter */
.tension-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.tension-label{font-family:var(--mono);font-size:9px;color:var(--text3);width:50px}
.tension-track{flex:1;height:3px;background:var(--bg);border-radius:2px;overflow:hidden}
.tension-fill{height:100%;border-radius:2px;transition:width .8s ease}
.tension-pct{font-family:var(--mono);font-size:9px;width:28px;text-align:right}

/* PENDULUM MINI CHART */
.pend-chart{width:60px;height:20px;flex-shrink:0}

/* RIGHT PANEL */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--bg1)}

.detail-area{flex:1;overflow-y:auto;padding:12px}
.detail-area::-webkit-scrollbar{width:3px}
.detail-area::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px}

.detail-empty{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--mono);font-size:11px;color:var(--text3)}

/* detail sections */
.ds{margin-bottom:16px}
.ds-label{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.ds-value{font-size:12px;color:var(--text);line-height:1.6}
.ds-mono{font-family:var(--mono);font-size:10px;color:var(--text2);line-height:1.7}

.tag-row{display:flex;gap:5px;flex-wrap:wrap}
.tag-pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.15);color:var(--sky2)}

.gap-item{border:1px solid var(--b0);border-radius:4px;padding:7px 9px;margin-bottom:5px;background:var(--bg2)}
.gap-item.open{border-color:rgba(248,113,113,.2)}
.gap-sev{font-family:var(--mono);font-size:9px;margin-right:6px}
.gap-desc{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.5}
.gap-id{font-family:var(--mono);font-size:9px;color:var(--text3)}

.link-item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--b0);font-size:11px}
.link-item:last-child{border-bottom:none}
.link-type{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:2px}
.link-type.resonance{background:rgba(56,189,248,.1);color:var(--sky2)}
.link-type.tension{background:rgba(248,113,113,.1);color:var(--coral)}

/* pendulum detail */
.pend-detail{background:var(--bg2);border:1px solid var(--b0);border-radius:5px;padding:10px}
.pend-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--b0)}
.pend-row:last-child{border-bottom:none}
.pend-k{font-family:var(--mono);font-size:9px;color:var(--text3)}
.pend-v{font-family:var(--mono);font-size:10px;color:var(--text)}
.pend-v.forced{color:var(--amber)}
.pend-v.peak{color:var(--mint)}
.pend-v.trough{color:var(--coral)}

/* action buttons */
.action-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.action-btn{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:3px;border:1px solid var(--b1);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.action-btn:hover{border-color:var(--b2);color:var(--text)}
.action-btn.primary{border-color:rgba(56,189,248,.3);color:var(--sky)}
.action-btn.danger{border-color:rgba(248,113,113,.25);color:var(--coral)}

/* ADD IDEA MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg1);border:1px solid var(--b2);border-radius:8px;width:520px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.field-input,.field-textarea{background:var(--bg2);border:1px solid var(--b1);border-radius:4px;padding:7px 10px;font-family:var(--mono);font-size:11px;color:var(--text);outline:none;transition:border-color .15s;width:100%}
.field-input:focus,.field-textarea:focus{border-color:var(--b2)}
.field-input::placeholder,.field-textarea::placeholder{color:var(--text3)}
.field-textarea{resize:vertical;min-height:60px;font-family:var(--sans);font-size:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-btn{font-family:var(--mono);font-size:10px;padding:6px 14px;border-radius:4px;border:1px solid var(--b1);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.modal-btn.confirm{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.35);color:var(--sky)}
.modal-btn:hover{border-color:var(--b2);color:var(--text)}

/* GAP LOG PANE */
.gap-log{border-top:1px solid var(--b0);flex-shrink:0}
.gap-log-inner{max-height:140px;overflow-y:auto;padding:6px 10px}
.gap-log-inner::-webkit-scrollbar{width:3px}
.gap-log-inner::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px}
.gap-log-line{font-family:var(--mono);font-size:10px;color:var(--text2);display:flex;gap:8px;padding:2px 0;border-bottom:1px solid rgba(56,189,248,.04)}
.gl-ts{color:var(--text3);width:52px;flex-shrink:0}
.gl-type{width:72px;flex-shrink:0}
.gl-type.gap{color:var(--coral)}
.gl-type.snap{color:var(--sky)}
.gl-type.idea{color:var(--mint)}
.gl-type.pend{color:var(--violet)}

/* SNAPSHOT BAR */
.snap-bar{height:32px;border-top:1px solid var(--b0);display:flex;align-items:center;padding:0 12px;gap:8px;background:var(--bg2);flex-shrink:0}
.snap-input{flex:1;background:none;border:none;outline:none;font-family:var(--mono);font-size:11px;color:var(--text);caret-color:var(--sky)}
.snap-input::placeholder{color:var(--text3)}
.snap-btn{font-family:var(--mono);font-size:9px;padding:3px 9px;border-radius:3px;border:1px solid rgba(56,189,248,.25);background:rgba(56,189,248,.06);color:var(--sky);cursor:pointer;transition:all .15s}
.snap-btn:hover{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.4)}
.snap-latest{font-family:var(--mono);font-size:9px;color:var(--text3)}

/* status colors */
.st-seed{background:rgba(56,189,248,.1);color:var(--sky2)}
.st-growing{background:rgba(52,211,153,.1);color:var(--mint)}
.st-forced{background:rgba(251,191,36,.12);color:var(--amber)}
.st-crystallized{background:rgba(167,139,250,.12);color:var(--violet)}
.st-dissolved{background:rgba(100,116,139,.1);color:#64748b}

/* phase colors */
.ph-peak{color:var(--mint)}
.ph-rising{color:var(--sky2)}
.ph-falling{color:var(--amber)}
.ph-trough{color:var(--coral)}

/* pendulum sparkline */
canvas.spark{display:block}

/* TOAST */
.toast-area{position:fixed;bottom:50px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:400}
.toast{background:var(--bg2);border:1px solid var(--b1);border-radius:4px;padding:6px 12px;font-family:var(--mono);font-size:10px;color:var(--text2);opacity:0;transform:translateX(16px);animation:ti .2s ease forwards,to .2s ease forwards 2.4s;pointer-events:none}
@keyframes ti{to{opacity:1;transform:none}}
@keyframes to{to{opacity:0;transform:translateX(16px)}}
.toast.ok{border-color:rgba(52,211,153,.3);color:var(--mint)}
.toast.err{border-color:rgba(248,113,113,.3);color:var(--coral)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">IDEA<span>RIUM</span></div>
  <div class="tb-sep"></div>
  <div class="tb-stat">ideas <span class="v sky" id="stat-ideas">0</span></div>
  <div class="tb-stat">open gaps <span class="v hi" id="stat-gaps">0</span></div>
  <div class="tb-stat">snapshots <span class="v ok" id="stat-snaps">0</span></div>
  <div class="tb-stat">bus events <span class="v" id="stat-events">0</span></div>
  <div class="tb-right">
    <button class="tb-btn" onclick="openModal()">+ idea</button>
    <button class="tb-btn" onclick="doScan()">scan compartments</button>
    <button class="tb-btn active" id="btn-tension" onclick="setView('tension')">tension</button>
    <button class="tb-btn" id="btn-gap" onclick="setView('gap')">gaps</button>
    <button class="tb-btn" id="btn-all" onclick="setView('all')">all</button>
  </div>
</div>

<!-- BODY -->
<div class="body">

  <!-- LEFT — IDEA LIST -->
  <div class="left">
    <div class="ph">
      <span class="ph-title">Ideas</span>
      <span class="ph-badge live" id="list-badge">by tension</span>
    </div>
    <div class="toolbar">
      <input class="search-input" id="search" placeholder="search ideas..." oninput="filterIdeas()">
      <button class="mode-btn active" onclick="sortBy('tension',this)">tension ↓</button>
      <button class="mode-btn" onclick="sortBy('updated',this)">recent</button>
      <button class="mode-btn" onclick="sortBy('name',this)">a-z</button>
    </div>
    <div class="idea-list" id="idea-list"></div>
    <div class="snap-bar">
      <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">push</span>
      <input class="snap-input" id="snap-msg" placeholder="commit message..." onkeydown="if(event.key==='Enter')doSnapshot()">
      <span class="snap-latest" id="snap-latest"></span>
      <button class="snap-btn" onclick="doSnapshot()">snapshot ◆</button>
    </div>
    <div class="gap-log">
      <div class="ph" style="border-top:1px solid var(--b0)">
        <span class="ph-title">Event Stream</span>
        <span class="ph-badge live">live</span>
      </div>
      <div class="gap-log-inner" id="event-log"></div>
    </div>
  </div>

  <!-- RIGHT — DETAIL -->
  <div class="right">
    <div class="ph">
      <span class="ph-title" id="detail-title">Select an idea</span>
    </div>
    <div class="detail-area" id="detail-area">
      <div class="detail-empty">← select an idea to inspect</div>
    </div>
  </div>
</div>

<!-- ADD IDEA MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">+ New Idea</div>
    <div class="field-group">
      <div class="field-label">name</div>
      <input class="field-input" id="f-name" placeholder="causality tracker">
    </div>
    <div class="field-group">
      <div class="field-label">intent — one sentence</div>
      <input class="field-input" id="f-intent" placeholder="track what caused what, with meaning and conditions">
    </div>
    <div class="field-group">
      <div class="field-label">body (optional)</div>
      <textarea class="field-textarea" id="f-body" placeholder="full thought..."></textarea>
    </div>
    <div class="field-group">
      <div class="field-label">tags (comma separated)</div>
      <input class="field-input" id="f-tags" placeholder="causality, nexus, versionium">
    </div>
    <div class="field-group">
      <div class="field-label">core files (comma separated)</div>
      <input class="field-input" id="f-files" placeholder="src/versionium.js, src/bus.js">
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">cancel</button>
      <button class="modal-btn confirm" onclick="submitIdea()">add idea</button>
    </div>
  </div>
</div>

<div class="toast-area" id="toast-area"></div>

<script>
// ════════════════════════════════════════════════════
// IN-MEMORY STATE (mirrors what idearium-core.js maintains on disk)
// ════════════════════════════════════════════════════

let IDEAS     = [];
let GAPS      = [];
let SNAPSHOTS = [];
let BUS_SEQ   = 0;
let BUS_LOG   = [];
let SELECTED  = null;
let CURRENT_VIEW = 'tension';
let CURRENT_SORT = 'tension';
let PEND_DATA = {}; // uuid → [{ts,value}]

function uuid4() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)});
}
function slug(t) { return t.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').slice(0,40); }
function ts() { return Date.now(); }
function r2(n) { return Math.round(n*100)/100; }
function hash(obj) {
  const s=JSON.stringify(obj);let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return Math.abs(h).toString(16).slice(0,8);
}

// ════════════════════════════════════════════════════
// TENSION ENGINE
// ════════════════════════════════════════════════════
function tensionScore(idea) {
  let t = 0;
  const openGaps = GAPS.filter(g => g.status === 'open' && g.between.includes(idea.uuid));
  t += Math.min(openGaps.length * 0.15, 0.45);

  // Pendulum forced signal
  const pend = pendulumProfile(idea.uuid);
  if (pend?.forced?.isForced) t += (pend.forced.tensionScore || 0) * 0.25;

  // Active tension links
  const active = new Set(IDEAS.filter(i=>i.status!=='dissolved').map(i=>i.uuid));
  const contras = (idea.tensionWith||[]).filter(u=>active.has(u));
  t += Math.min(contras.length * 0.10, 0.20);

  // Stale seed
  const staleDays = (Date.now() - idea.updatedAt) / 86400000;
  if (staleDays > 7  && idea.status === 'seed')    t += 0.08;
  if (staleDays > 21 && idea.status === 'seed')    t += 0.08;
  if (staleDays > 7  && idea.status === 'growing') t += 0.04;

  return r2(Math.min(t, 1.0));
}

// ════════════════════════════════════════════════════
// PENDULUM (in-memory simulation)
// ════════════════════════════════════════════════════
function pendulumObserve(ideaUuid, value, source) {
  if (!PEND_DATA[ideaUuid]) PEND_DATA[ideaUuid] = [];
  PEND_DATA[ideaUuid].push({ ts: Date.now(), value, source });
  if (PEND_DATA[ideaUuid].length > 80) PEND_DATA[ideaUuid].shift();
}

function pendulumProfile(ideaUuid) {
  const obs = PEND_DATA[ideaUuid] || [];
  if (obs.length < 3) return { status:'WARMING', phase:null, forced:{ isForced:false, tensionScore:0 }, damping:null };

  const vals  = obs.map(o=>o.value);
  const mean  = vals.reduce((a,b)=>a+b,0)/vals.length;
  const last  = vals[vals.length-1];
  const prev  = vals[vals.length-2] || mean;

  // Simple phase detection
  const rising  = last > prev && last > mean;
  const falling = last < prev && last < mean;
  const atPeak  = last > mean && prev > last;
  const atTrough= last < mean && prev < last;
  const phase   = atPeak ? 'peak' : atTrough ? 'trough' : rising ? 'rising' : falling ? 'falling' : 'neutral';

  // Detect forced — last 3 values all above 0.65 = forced high
  const last3 = vals.slice(-3);
  const isForced = last3.length === 3 && last3.every(v => v > 0.65);
  const tensionScore = isForced ? r2(Math.min((mean - 0.5) * 2, 1)) : 0;

  // Damping
  const first3 = vals.slice(0,3);
  const last3b  = vals.slice(-3);
  const avgFirst = first3.reduce((a,b)=>a+b,0)/first3.length;
  const avgLast  = last3b.reduce((a,b)=>a+b,0)/last3b.length;
  const damping  = avgLast < avgFirst - 0.1 ? 'damping' : avgLast > avgFirst + 0.1 ? 'amplifying' : 'neutral';

  return { status:'ACTIVE', phase, mean:r2(mean), last:r2(last), forced:{ isForced, tensionScore }, damping, observationCount: obs.length };
}

// ════════════════════════════════════════════════════
// BUS
// ════════════════════════════════════════════════════
function emit(type, payload={}) {
  BUS_SEQ++;
  const ev = { id:`ev-${BUS_SEQ.toString(36).padStart(5,'0')}`, type, payload, ts:Date.now() };
  BUS_LOG.push(ev);
  if (BUS_LOG.length > 300) BUS_LOG.shift();
  appendEventLog(ev);
  updateStats();
  return ev.id;
}

// ════════════════════════════════════════════════════
// IDEA CRUD
// ════════════════════════════════════════════════════
function addIdea(fields) {
  const idea = {
    uuid:          uuid4(),
    slug:          slug(fields.name||fields.intent||'untitled'),
    name:          fields.name||fields.intent?.slice(0,40)||'untitled',
    intent:        fields.intent||'',
    body:          fields.body||'',
    status:        'seed',
    tags:          fields.tags||[],
    coreFiles:     fields.coreFiles||[],
    resonanceWith: [],
    tensionWith:   [],
    compartment:   fields.compartment||null,
    createdAt:     ts(),
    updatedAt:     ts(),
  };
  IDEAS.push(idea);
  pendulumObserve(idea.uuid, 0.1, 'created');
  emit('idearium.idea.created', { uuid:idea.uuid, slug:idea.slug, intent:idea.intent });
  return idea;
}

function updateIdea(uuid, fields) {
  const idea = IDEAS.find(i=>i.uuid===uuid);
  if (!idea) return null;
  Object.assign(idea, fields, { uuid, updatedAt:ts() });
  pendulumObserve(uuid, 0.5, 'updated');
  emit('idearium.idea.updated', { uuid, fields });
  return idea;
}

function setStatus(uuid, status) {
  const idea = IDEAS.find(i=>i.uuid===uuid);
  if (!idea) return;
  const prev = idea.status;
  idea.status = status; idea.updatedAt = ts();
  const strengths = { seed:0.2, growing:0.5, forced:0.8, crystallized:1.0, dissolved:0.0 };
  pendulumObserve(uuid, strengths[status]||0.3, 'status-change');
  emit('idearium.idea.status.changed', { uuid, slug:idea.slug, from:prev, to:status });
}

function linkIdeas(uuidA, uuidB, type='resonance') {
  const a=IDEAS.find(i=>i.uuid===uuidA), b=IDEAS.find(i=>i.uuid===uuidB);
  if (!a||!b) return;
  if (type==='resonance') {
    if (!a.resonanceWith.includes(uuidB)) a.resonanceWith.push(uuidB);
    if (!b.resonanceWith.includes(uuidA)) b.resonanceWith.push(uuidA);
  } else {
    if (!a.tensionWith.includes(uuidB)) a.tensionWith.push(uuidB);
    if (!b.tensionWith.includes(uuidA)) b.tensionWith.push(uuidA);
  }
  a.updatedAt=b.updatedAt=ts();
  pendulumObserve(uuidA, 0.6, 'link');
  pendulumObserve(uuidB, 0.6, 'link');
  emit('idearium.idea.linked', { uuidA, uuidB, type });
}

// ════════════════════════════════════════════════════
// GAPS
// ════════════════════════════════════════════════════
function openGap({ type, between, description, severity='MEDIUM' }) {
  const gapId = `G-${type.slice(0,3).toUpperCase()}-${Date.now().toString(36).slice(-4).toUpperCase()}`;
  const gap = { gapId, type, between, description, severity, status:'open', openedAt:ts(), resolvedAt:null };
  GAPS.push(gap);
  for (const uid of between) pendulumObserve(uid, 0.7, 'gap.opened');
  emit('idearium.gap.opened', { gapId, type, between, severity });
  return gap;
}

function resolveGap(gapId) {
  const gap = GAPS.find(g=>g.gapId===gapId);
  if (!gap) return;
  gap.status='resolved'; gap.resolvedAt=ts();
  for (const uid of gap.between) pendulumObserve(uid, 0.3, 'gap.resolved');
  emit('idearium.gap.resolved', { gapId });
}

// ════════════════════════════════════════════════════
// SNAPSHOT
// ════════════════════════════════════════════════════
function doSnapshot() {
  const msg = document.getElementById('snap-msg').value.trim() || 'snapshot';
  const scores={};
  for (const idea of IDEAS) scores[idea.uuid]=tensionScore(idea);
  const snap = { snapshotId:hash({ts:Date.now(),msg}), message:msg, ts:Date.now(), ideasCount:IDEAS.length, openGaps:GAPS.filter(g=>g.status==='open').length, tension:scores };
  SNAPSHOTS.unshift(snap);
  emit('idearium.snapshot.committed', { snapshotId:snap.snapshotId, message:msg });
  document.getElementById('snap-msg').value='';
  document.getElementById('snap-latest').textContent = snap.snapshotId;
  toast(`snapshot: ${snap.snapshotId}`, 'ok');
  updateStats();
}

// ════════════════════════════════════════════════════
// SCAN COMPARTMENTS (simulated)
// ════════════════════════════════════════════════════
function doScan() {
  // Find ideas that share 2+ tags but have no declared link
  let found = 0;
  for (let i=0;i<IDEAS.length;i++) {
    for (let j=i+1;j<IDEAS.length;j++) {
      const a=IDEAS[i], b=IDEAS[j];
      const linked = a.resonanceWith.includes(b.uuid)||b.resonanceWith.includes(a.uuid)||a.tensionWith.includes(b.uuid)||b.tensionWith.includes(a.uuid);
      if (linked) continue;
      const shared=(a.tags||[]).filter(t=>(b.tags||[]).includes(t));
      if (shared.length>=2) {
        openGap({ type:'boundary_gap', between:[a.uuid,b.uuid], description:`"${a.name}" and "${b.name}" share [${shared.join(', ')}] but have no declared relationship`, severity:'LOW' });
        found++;
      }
    }
  }
  toast(found>0 ? `${found} boundary gap${found>1?'s':''} found` : 'no boundary gaps found', found>0?'err':'ok');
  renderList();
}

function getFilteredIdeas() {
  const q = document.getElementById('search').value.toLowerCase();
  let pool = IDEAS.filter(i => i.status !== 'dissolved');
  if (CURRENT_VIEW === 'gap') pool = pool.filter(i => GAPS.some(g=>g.status==='open'&&g.between.includes(i.uuid)));
  if (q) pool = pool.filter(i => i.name.toLowerCase().includes(q) || i.intent.toLowerCase().includes(q) || (i.tags||[]).some(t=>t.includes(q)));

  return pool.map(idea => ({ idea, tension: tensionScore(idea) }))
    .sort((a,b) => {
      if (CURRENT_SORT==='tension') return b.tension-a.tension;
      if (CURRENT_SORT==='updated') return b.idea.updatedAt-a.idea.updatedAt;
      return a.idea.name.localeCompare(b.idea.name);
    });
}

function renderList() {
  const list = document.getElementById('idea-list');
  const items = getFilteredIdeas();
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3)">no ideas yet — click + idea</div>`;
    return;
  }
  for (const { idea, tension } of items) {
    const card = document.createElement('div');
    const tClass = tension > 0.7 ? 't-high' : tension > 0.4 ? 't-med' : 't-low';
    const openGaps = GAPS.filter(g=>g.status==='open'&&g.between.includes(idea.uuid));
    const pend = pendulumProfile(idea.uuid);
    card.className = `idea-card ${tClass} ${idea.status}${SELECTED===idea.uuid?' selected':''}`;
    card.onclick = () => selectIdea(idea.uuid);

    const phaseHtml = pend?.phase ? `<span class="ic-phase ph-${pend.phase}">${pend.phase}</span>` : '';
    const gapsHtml  = openGaps.length ? `<span class="ic-gap">◆ ${openGaps.length} gap${openGaps.length>1?'s':''}</span>` : '';
    const tagsHtml  = (idea.tags||[]).map(t=>`<span class="ic-tag">#${t}</span>`).join('');

    const tColor = tension>0.7?'var(--coral)':tension>0.4?'var(--amber)':'var(--mint)';

    card.innerHTML = `
      <div class="ic-top">
        <div class="ic-name">${idea.name}</div>
        <span class="ic-status st-${idea.status}">${idea.status}</span>
      </div>
      ${idea.intent?`<div class="ic-intent">${idea.intent.slice(0,80)}</div>`:''}
      <div class="tension-row">
        <span class="tension-label">tension</span>
        <div class="tension-track"><div class="tension-fill" style="width:${tension*100}%;background:${tColor}"></div></div>
        <span class="tension-pct" style="color:${tColor}">${Math.round(tension*100)}%</span>
        ${renderSparkline(idea.uuid)}
      </div>
      <div class="ic-meta">${gapsHtml}${phaseHtml}${tagsHtml}<span class="ic-uuid">${idea.uuid.slice(0,8)}</span></div>
    `;
    list.appendChild(card);
  }
  updateStats();
}

function renderSparkline(ideaUuid) {
  const obs = PEND_DATA[ideaUuid]||[];
  if (obs.length<2) return `<svg class="pend-chart" viewBox="0 0 60 20"><line x1="0" y1="10" x2="60" y2="10" stroke="var(--text3)" stroke-width="0.5"/></svg>`;
  const recent = obs.slice(-20);
  const min=Math.min(...recent.map(o=>o.value));
  const max=Math.max(...recent.map(o=>o.value))||1;
  const pts = recent.map((o,i)=>{
    const x=i/(recent.length-1)*58+1;
    const y=20-((o.value-min)/(max-min||1))*18-1;
    return `${x},${y}`;
  }).join(' ');
  const pend=pendulumProfile(ideaUuid);
  const color=pend?.forced?.isForced?'var(--amber)':pend?.phase==='peak'?'var(--mint)':pend?.phase==='trough'?'var(--coral)':'var(--sky2)';
  return `<svg class="pend-chart" viewBox="0 0 60 20"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
}

function appendEventLog(ev) {
  const log  = document.getElementById('event-log');
  const time = new Date(ev.ts).toLocaleTimeString('en-GB',{hour12:false});
  const typeShort = ev.type.replace('idearium.','').replace('idea.','').replace('gap.','gap·').replace('snapshot.','snap·');
  const typeClass = ev.type.includes('gap')?'gap':ev.type.includes('snapshot')?'snap':ev.type.includes('pendulum')?'pend':'idea';
  const div  = document.createElement('div');
  div.className = 'gap-log-line';
  const keys = Object.keys(ev.payload||{}).slice(0,2);
  const preview = keys.map(k=>`${k}:${String(ev.payload[k]).slice(0,20)}`).join(' ');
  div.innerHTML = `<span class="gl-ts">${time}</span><span class="gl-type ${typeClass}">${typeShort}</span><span style="color:var(--text3)">${preview}</span>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

  // bus-log — stale, damping
  [0.6,0.5,0.4,0.3,0.2,0.15].forEach((v,i) => {
    PEND_DATA[e.uuid] = PEND_DATA[e.uuid]||[];
    PEND_DATA[e.uuid].push({ ts: now - (6-i)*86400000, value:v, source:'session' });
  });
  // versionium — forced high
  [0.7,0.75,0.8,0.8,0.85,0.8,0.82].forEach((v,i) => {
    PEND_DATA[f.uuid] = PEND_DATA[f.uuid]||[];
    PEND_DATA[f.uuid].push({ ts: now - (7-i)*3600000, value:v, source:'session' });
  });

  // Status updates
  setStatus(b.uuid, 'growing');
  setStatus(f.uuid, 'forced');
  setStatus(e.uuid, 'seed');

  renderList();
  updateStats();
}

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
window.addEventListener('load', () => {
  seedData();
  // Live tension refresh every 5 seconds
  setInterval(() => { renderList(); if (SELECTED) { const idea=IDEAS.find(i=>i.uuid===SELECTED); if(idea) renderDetail(idea); } }, 5000);
});
</script>
