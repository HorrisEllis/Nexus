<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idearium — Idea OS</title>
<style>
:root{--bg:#0a0a0c;--bg2:#111114;--bg3:#18181c;--border:#252530;
  --text:#e2e2ea;--muted:#4a4a5a;--signal:#3ecf8e;--warn:#f0a500;--err:#e85d3c;
  --purple:#9b7fe8;--amber:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font:12px/1.5 'Cascadia Code','Fira Mono',monospace;
  display:grid;grid-template-rows:44px 1fr;height:100vh;overflow:hidden;}
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;}
.logo{color:var(--purple);font-weight:700;font-size:14px;letter-spacing:.06em;}
.pill{font-size:10px;padding:1px 8px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);}
.pill.live{border-color:var(--signal);color:var(--signal);}
.snr-bar{height:3px;width:80px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.snr-fill{height:100%;background:var(--signal);border-radius:2px;transition:width .4s;}
.sp{flex:1;}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:3px 10px;border-radius:3px;cursor:pointer;font:inherit;font-size:11px;}
.btn:hover{border-color:var(--purple);color:var(--purple);}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff;}
#body{display:grid;grid-template-columns:200px 1fr;overflow:hidden;}
#nav{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;}
.nav-section{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:12px 12px 4px;}
.nav-item{padding:6px 14px;cursor:pointer;font-size:11px;color:var(--muted);border-left:2px solid transparent;transition:all .15s;}
.nav-item:hover{color:var(--text);background:var(--bg3);}
.nav-item.active{color:var(--purple);border-left-color:var(--purple);background:rgba(155,127,232,.06);}
#main{overflow:hidden;display:flex;flex-direction:column;}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden;}
.panel.active{display:flex;}
.panel-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--purple);
  display:flex;align-items:center;gap:8px;flex-shrink:0;}
.panel-body{flex:1;overflow-y:auto;padding:12px 16px;}
/* Idea cards */
.idea-card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.idea-card:hover{border-color:var(--purple);}
.idea-card.selected{border-color:var(--purple);background:rgba(155,127,232,.06);}
.idea-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px;}
.idea-meta{font-size:10px;color:var(--muted);display:flex;gap:8px;}
.phase-badge{font-size:9px;padding:1px 6px;border-radius:2px;}
.phase-seed{background:rgba(245,158,11,.12);border:1px solid var(--amber);color:var(--amber);}
.phase-building{background:rgba(62,207,142,.12);border:1px solid var(--signal);color:var(--signal);}
.phase-complete{background:rgba(155,127,232,.12);border:1px solid var(--purple);color:var(--purple);}
.tension-bar{height:2px;background:var(--bg3);border-radius:1px;margin-top:6px;overflow:hidden;}
.tension-fill{height:100%;border-radius:1px;transition:width .4s;}
/* Input */
.input-row{display:flex;gap:6px;margin-bottom:12px;}
.input-field{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;font:inherit;font-size:11px;outline:none;border-radius:3px;}
.input-field:focus{border-color:var(--purple);}
/* Tension gauge */
.tension-gauge{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:12px;}
.gauge-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.gauge-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.gauge-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--signal),var(--amber),var(--err));transition:width .6s;}
/* Spec */
.spec-block{background:var(--bg2);border:1px solid var(--border);border-radius:3px;
  padding:10px;margin-bottom:8px;}
.spec-status{font-size:9px;padding:1px 6px;border-radius:2px;border:1px solid var(--border);color:var(--muted);}
.spec-status.built{border-color:var(--signal);color:var(--signal);}
/* Gap */
.gap-item{background:var(--bg2);border-left:3px solid var(--err);border-radius:3px;
  padding:8px 10px;margin-bottom:6px;}
.gap-type{font-size:9px;color:var(--err);margin-bottom:2px;}
</style></head>
<body>
<div id="topbar">
  <span class="logo">◈ IDEARIUM</span>
  <span class="pill" id="conn-pill">connecting…</span>
  <div class="snr-bar"><div class="snr-fill" id="snr-fill" style="width:0%"></div></div>
  <span style="font-size:10px;color:var(--muted)" id="snr-label">SNR —</span>
  <span class="sp"></span>
  <button class="btn primary" onclick="showAddIdea()">+ idea</button>
  <span style="font-size:10px;color:var(--muted)">localhost:4800</span>
</div>
<div id="body">
  <div id="nav">
    <div class="nav-section">ideas</div>
    <div class="nav-item active" onclick="show('ideas')">💡 All Ideas</div>
    <div class="nav-item" onclick="show('tension')">⚡ Tension Map</div>
    <div class="nav-item" onclick="show('specs')">◉ Specs</div>
    <div class="nav-section">system</div>
    <div class="nav-item" onclick="show('gaps')">△ Gaps</div>
    <div class="nav-item" onclick="show('snr')">◆ SNR</div>
    <div class="nav-item" onclick="show('stream')">▶ Live</div>
  </div>
  <div id="main">

    <div class="panel active" id="panel-ideas">
      <div class="panel-header">💡 Ideas — CLI truth, API projection</div>
      <div class="panel-body">
        <div class="input-row" id="add-row" style="display:none">
          <input class="input-field" id="new-idea-text" placeholder="idea text…" onkeydown="if(event.key==='Enter')addIdea()">
          <button class="btn primary" onclick="addIdea()">add</button>
          <button class="btn" onclick="document.getElementById('add-row').style.display='none'">cancel</button>
        </div>
        <div id="idea-list"></div>
      </div>
    </div>

    <div class="panel" id="panel-tension">
      <div class="panel-header">⚡ Tension Map</div>
      <div class="panel-body" id="tension-body"></div>
    </div>

    <div class="panel" id="panel-specs">
      <div class="panel-header">◉ Specs</div>
      <div class="panel-body" id="spec-list"></div>
    </div>

    <div class="panel" id="panel-gaps">
      <div class="panel-header">△ Gaps</div>
      <div class="panel-body" id="gap-list"></div>
    </div>

    <div class="panel" id="panel-snr">
      <div class="panel-header">◆ Signal-to-Noise Ratio</div>
      <div class="panel-body">
        <div class="tension-gauge">
          <div class="gauge-label">system SNR</div>
          <div class="gauge-track"><div class="gauge-fill" id="snr-gauge" style="width:0%"></div></div>
          <div style="font-size:11px;color:var(--text);margin-top:6px" id="snr-val">—</div>
        </div>
        <div id="snr-breakdown"></div>
      </div>
    </div>

    <div class="panel" id="panel-stream">
      <div class="panel-header">▶ Live Events <span class="sp"></span><button class="btn" onclick="clearStream()">clear</button></div>
      <div class="panel-body" id="stream-log"></div>
    </div>

  </div>
</div>
<script>
const BASE = 'http://localhost:4800';
let ideas = [];

async function api(path, opts={}) {
  try { const r = await fetch(BASE+path,opts); return r.ok?r.json():null; } catch(e){return null;}
}

function show(id) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  event.currentTarget.classList.add('active');
  if(id==='ideas') loadIdeas();
  if(id==='tension') loadTension();
  if(id==='specs') loadSpecs();
  if(id==='gaps') loadGaps();
  if(id==='snr') loadSNR();
  if(id==='stream') startStream();
}

function showAddIdea() {
  const row = document.getElementById('add-row');
  row.style.display = row.style.display==='none'?'flex':'none';
  if(row.style.display!=='none') document.getElementById('new-idea-text').focus();
}

async function addIdea() {
  const text = document.getElementById('new-idea-text').value.trim();
  if(!text) return;
  await api('/api/ideas', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  document.getElementById('new-idea-text').value='';
  document.getElementById('add-row').style.display='none';
  loadIdeas();
}

function tensionColor(t) {
  if(t>=0.7) return 'var(--err)';
  if(t>=0.4) return 'var(--warn)';
  return 'var(--signal)';
}

async function loadIdeas() {
  const d = await api('/api/ideas');
  if(!d) return;
  ideas = d.ideas||d||[];
  const pill = document.getElementById('conn-pill');
  pill.textContent='● live'; pill.className='pill live';
  document.getElementById('idea-list').innerHTML = ideas.map(idea=>`
    <div class="idea-card">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="idea-title" style="flex:1">${idea.text||idea.title||'—'}</div>
        <span class="phase-badge phase-${idea.phase||'seed'}">${idea.phase||'seed'}</span>
      </div>
      <div class="idea-meta">
        <span>${idea.uuid?.slice(0,8)||'—'}</span>
        <span>${new Date(idea.ts||0).toLocaleDateString()}</span>
        ${idea.tension!=null?`<span>tension: ${(idea.tension*100).toFixed(0)}%</span>`:''}
      </div>
      ${idea.tension!=null?`<div class="tension-bar"><div class="tension-fill" style="width:${idea.tension*100}%;background:${tensionColor(idea.tension)}"></div></div>`:''}
    </div>`).join('') || '<div style="color:var(--muted);padding:20px">no ideas yet — add the first one</div>';
}

async function loadTension() {
  const d = await api('/api/ideas');
  const list = d?.ideas||d||[];
  const sorted = [...list].filter(i=>i.tension!=null).sort((a,b)=>b.tension-a.tension);
  document.getElementById('tension-body').innerHTML = sorted.map(idea=>`
    <div class="tension-gauge" style="margin-bottom:8px">
      <div class="gauge-label">${idea.text?.slice(0,50)||'—'}</div>
      <div class="gauge-track"><div class="gauge-fill" style="width:${(idea.tension||0)*100}%"></div></div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px">${((idea.tension||0)*100).toFixed(0)}% tension</div>
    </div>`).join('') || '<div style="color:var(--muted)">no tension data</div>';
}

async function loadSpecs() {
  const d = await api('/api/specs');
  const list = d?.specs||d||[];
  document.getElementById('spec-list').innerHTML = list.map(s=>`
    <div class="spec-block">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:12px;color:var(--text)">${s.title||s.text||'—'}</span>
        <span class="spec-status ${s.phase==='built'?'built':''}">${s.phase||'draft'}</span>
      </div>
      <div style="font-size:10px;color:var(--muted)">${s.uuid?.slice(0,12)||'—'}</div>
    </div>`).join('') || '<div style="color:var(--muted)">no specs yet</div>';
}

async function loadGaps() {
  const d = await api('/api/gaps');
  const list = d?.gaps||d||[];
  document.getElementById('gap-list').innerHTML = list.map(g=>`
    <div class="gap-item">
      <div class="gap-type">${g.type||'gap'}</div>
      <div style="font-size:11px">${g.description||g.text||'—'}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px">${g.status||'open'}</div>
    </div>`).join('') || '<div style="color:var(--muted)">no gaps</div>';
}

async function loadSNR() {
  const d = await api('/api/snr');
  if(!d) return;
  const snr = d.snr||0;
  document.getElementById('snr-gauge').style.width = (snr*100)+'%';
  document.getElementById('snr-val').textContent = 'SNR ' + (snr*100).toFixed(1) + '%';
  document.getElementById('snr-fill').style.width = (snr*100)+'%';
  document.getElementById('snr-label').textContent = 'SNR ' + (snr*100).toFixed(0)+'%';
}

let sseConn = null;
function startStream() {
  if(sseConn) return;
  sseConn = new EventSource(BASE+'/sse');
  sseConn.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      const log = document.getElementById('stream-log');
      const row = document.createElement('div');
      row.className = 'log-row';
      row.style = 'display:flex;gap:10px;font-size:11px;padding:2px 0;border-bottom:1px solid rgba(37,37,48,.3)';
      row.innerHTML = `<span style="color:var(--muted);width:80px">${new Date().toTimeString().slice(0,8)}</span>
        <span style="color:var(--purple);width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.type||'event'}</span>
        <span style="color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${JSON.stringify(d).slice(0,80)}</span>`;
      log.prepend(row);
      if(log.children.length>200) log.lastChild.remove();
    } catch(_){}
  };
}
function clearStream() { document.getElementById('stream-log').innerHTML=''; }

loadIdeas();
setInterval(loadIdeas, 15000);
</script>
</body></html>
