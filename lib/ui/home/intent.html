<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NEXUS — What do you want to do?</title>
<style>
  :root{
    --bg:#0a0e16; --bg2:#0e131e; --card:#121826; --card2:#161d2e;
    --border:#1e2940; --border2:#2a3a5a;
    --tx:#e6edf6; --tx2:#8a99b3; --tx3:#566180;
    --c:#3ea6ff; --g:#3ecf8e; --a:#f0a500; --r:#e85d5d; --p:#9b7fe8;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:32px 24px;max-width:1100px;margin:0 auto;}
  header{margin-bottom:28px}
  h1{font-size:24px;font-weight:600;letter-spacing:-0.3px}
  .sub{color:var(--tx2);font-size:14px;margin-top:4px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;
    color:var(--tx2);margin-top:10px;padding:4px 10px;background:var(--bg2);
    border:1px solid var(--border);border-radius:20px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
  .dot.on{background:var(--g)} .dot.off{background:var(--r)}

  .search{width:100%;background:var(--bg2);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 16px;color:var(--tx);font-size:15px;
    margin-bottom:24px}
  .search:focus{outline:none;border-color:var(--c)}

  .cat{margin-bottom:28px}
  .cat-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .cat-h h2{font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.8px;color:var(--c)}
  .cat-h .desc{font-size:13px;color:var(--tx2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .act{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;transition:.15s;position:relative}
  .act:hover{background:var(--card2);border-color:var(--border2);transform:translateY(-1px)}
  .act .intent{font-size:15px;font-weight:500;margin-bottom:6px;line-height:1.35}
  .act .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3);
    font-family:'SF Mono',ui-monospace,monospace}
  .act .verb{color:var(--p)}
  .act .sys{color:var(--tx2)}
  .act .method{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;
    background:var(--bg2);border:1px solid var(--border)}
  .act .method.GET{color:var(--g)} .act .method.POST{color:var(--a)}
  .act .method.DELETE,.act .method.PATCH{color:var(--r)}
  .act .comp{margin-top:8px;font-size:11px;color:var(--tx3);
    border-top:1px solid var(--border);padding-top:8px}

  .detail{position:fixed;inset:0;background:rgba(5,8,14,.7);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:50}
  .detail.show{display:flex}
  .panel{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
    max-width:520px;width:100%;padding:24px}
  .panel h3{font-size:18px;font-weight:600;margin-bottom:4px}
  .panel .pverb{color:var(--p);font-size:13px;font-family:monospace;margin-bottom:16px}
  .row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .row .k{color:var(--tx3);min-width:90px} .row .v{color:var(--tx);flex:1}
  .panel .btns{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border2);
    background:var(--bg2);color:var(--tx);font-size:14px;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--card2)}
  .btn.primary{background:var(--c);border-color:var(--c);color:#04121f;font-weight:600}
  .close{position:absolute;top:16px;right:20px;color:var(--tx3);cursor:pointer;font-size:20px}
  .empty{color:var(--tx3);text-align:center;padding:40px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>What do you want to do?</h1>
  <div class="sub">Every capability across NEXUS — organized by intent, not by system.</div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">connecting…</span></div>
</header>

<input class="search" id="search" placeholder="Search what you want to do…" autocomplete="off"/>
<div id="root"></div>

<div class="detail" id="detail">
  <div class="panel">
    <span class="close" id="close">×</span>
    <h3 id="d-intent"></h3>
    <div class="pverb" id="d-verb"></div>
    <div id="d-rows"></div>
    <div class="btns">
      <button class="btn" id="d-cancel">Close</button>
      <button class="btn primary" id="d-run">Run this</button>
    </div>
  </div>
</div>

<script>
const ORIGIN = location.origin || 'http://127.0.0.1:9000';
let MAP = null;
let current = null;

async function load(){
  try{
    const r = await fetch(ORIGIN + '/api/intent-map');
    MAP = await r.json();
    setStatus(true, MAP.totalInteractions + ' things you can do');
    render();
  }catch(e){
    setStatus(false, 'orchestrator offline — start it with: node orchestrator.js');
    document.getElementById('root').innerHTML =
      '<div class="empty">Can\\'t reach the system. Start the orchestrator, then refresh.</div>';
  }
}
function setStatus(on, txt){
  document.getElementById('dot').className = 'dot ' + (on?'on':'off');
  document.getElementById('statusTxt').textContent = txt;
}
function render(filter){
  const root = document.getElementById('root'); root.innerHTML='';
  const f = (filter||'').toLowerCase();
  let shown = 0;
  for(const key of Object.keys(MAP.map)){
    const group = MAP.map[key];
    const items = group.interactions.filter(ix =>
      !f || ix.intent.toLowerCase().includes(f) || ix.verb.toLowerCase().includes(f)
      || ix.system.toLowerCase().includes(f) || key.toLowerCase().includes(f));
    if(!items.length) continue;
    shown += items.length;
    const sec = document.createElement('div'); sec.className='cat';
    sec.innerHTML = '<div class="cat-h"><h2>'+key+'</h2><span class="desc">'+group.label+'</span></div>';
    const grid = document.createElement('div'); grid.className='grid';
    for(const ix of items){
      const card = document.createElement('div'); card.className='act';
      card.innerHTML =
        '<div class="intent">'+ix.intent+'</div>'+
        '<div class="meta"><span class="method '+ix.method+'">'+ix.method+'</span>'+
        '<span class="verb">'+ix.verb+'</span><span class="sys">· '+ix.system+'</span></div>'+
        (ix.componentName?'<div class="comp">'+ix.componentName+'</div>':'');
      card.onclick = ()=>openDetail(ix);
      grid.appendChild(card);
    }
    sec.appendChild(grid); root.appendChild(sec);
  }
  if(!shown) root.innerHTML='<div class="empty">Nothing matches that.</div>';
}
function openDetail(ix){
  current = ix;
  document.getElementById('d-intent').textContent = ix.intent;
  document.getElementById('d-verb').textContent = ix.method+' '+ix.system+ix.route;
  const rows = document.getElementById('d-rows');
  const mk = (k,v)=> v ? '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>' : '';
  rows.innerHTML =
    mk('Component', ix.componentName) +
    mk('What it does', ix.componentIntent) +
    mk('Needs', (ix.inputs&&ix.inputs.length)?ix.inputs.join(', '):'nothing') +
    mk('Success', ix.success) +
    mk('If it fails', ix.failure);
  document.getElementById('detail').classList.add('show');
}
function closeDetail(){ document.getElementById('detail').classList.remove('show'); }

document.getElementById('search').oninput = e=>render(e.target.value);
document.getElementById('close').onclick = closeDetail;
document.getElementById('d-cancel').onclick = closeDetail;
document.getElementById('detail').onclick = e=>{ if(e.target.id==='detail') closeDetail(); };
document.getElementById('d-run').onclick = async ()=>{
  if(!current) return;
  const btn = document.getElementById('d-run');
  if(current.method==='GET' && (!current.inputs || !current.inputs.length)){
    btn.textContent='Running…';
    try{
      const sys = current.system==='orchestrator' ? '' : '/api/remote/'+current.system;
      const url = ORIGIN + (current.system==='orchestrator'? current.route : current.route);
      const r = await fetch(ORIGIN + (current.system==='cortex'?'':'') + current.route.split('?')[0]);
      const d = await r.json();
      btn.textContent='✓ Done — check console'; console.log('['+current.id+']', d);
    }catch(e){ btn.textContent='✗ '+e.message; }
    setTimeout(()=>{btn.textContent='Run this';},2000);
  } else {
    alert('This action needs inputs ('+(current.inputs||[]).join(', ')+').\\nUse the CLI or wire a form: '+current.method+' '+current.route);
  }
};
load();
</script>
</body>
</html>
