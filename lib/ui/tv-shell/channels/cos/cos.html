<!doctype html>
<!-- lib/ui/tv-shell/channels/cos/cos.html — the COS channel (MG34, 2026-11-01).
     James, 2026-11-01: "not tension, thats noise. cos ui needs a channel." COS's cockpit (:7797), framed when it answers; when it does not,
     which part of COS is down and why, and Start COS. Every read goes through the orchestrator (:9000, TV_D1): /api/cos-ui/{status,start}. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COS</title>
<style>
  :root { --bg:#05070b; --line:rgba(255,255,255,.08); --fg:rgba(255,255,255,.88); --dim:rgba(255,255,255,.45); --acc:#38bdf8; --bad:#f87171; --ok:#34d399; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif; }
  #frame { width:100%; height:100%; border:none; display:none; background:var(--bg); }
  #down { display:none; max-width:560px; margin:0 auto; position:relative; top:12vh; padding:22px 24px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.02); }
  h1 { font:600 13px ui-monospace,monospace; letter-spacing:.14em; margin:0 0 14px; } h1 b { color:var(--acc); }
  .row { display:flex; gap:10px; align-items:baseline; margin:6px 0; font:12px ui-monospace,monospace; }
  .row .k { width:80px; color:var(--dim); } .up { color:var(--ok); } .dn { color:var(--bad); }
  button { margin-top:16px; padding:8px 16px; border-radius:6px; border:1px solid var(--acc); background:rgba(56,189,248,.1); color:var(--acc); font:600 12px ui-monospace,monospace; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:wait; }
  #msg { margin-top:12px; font-size:12px; color:var(--dim); white-space:pre-wrap; } #msg.bad { color:var(--bad); }
  .hint { margin-top:14px; font-size:11px; color:var(--dim); }
</style>
</head><body>
<iframe id="frame" title="COS cockpit"></iframe>
<div id="down">
  <h1><b>⬢</b> COS IS NOT SHOWING</h1>
  <div class="row"><span class="k">cockpit</span><span id="s-ui"></span></div>
  <div class="row"><span class="k">manager</span><span id="s-mgr"></span></div>
  <button id="start">Start COS</button>
  <div id="msg"></div>
  <div class="hint">npm run start:all starts COS's manager, and it starts this cockpit. Start COS here starts only what is down.</div>
</div>
<script src="cos.js"></script>
</body></html>
