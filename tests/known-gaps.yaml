# tests/known-gaps.yaml — every test file that fails for a known, stated reason (docs/2026-09-29-nex-node-store-phasemap.spec N19).
# Each entry is a gap node: the file, how many cases may fail (a count ABOVE it is a new failure and fails the run), the
# kind, and why. tests/modules/run-all.js reads this: a registered file failing at or under its count is reported as a
# KNOWN GAP, not a failure; a registered file that now passes is reported so the entry can be retired (archived, §0.3).
# A file that crashes before printing a summary counts as 1 failing (run-all's own rule).
# kinds: missing-module (tests code that is not in the tree) · missing-archive (asserts an _archive/ path; the archive was
#        not part of the 0.39.258 upload, so §0.3's "archived, not deleted" cannot be shown from this tree)
#        · stale-ui · unbuilt (the test specifies a feature never built) · needs-live-data (a running system or a real,
#        migrated store) · needs-live-service (a real guardian/provider) · spec-drift (tied to a mapped phase)
#        · decision (needs James's call) · regression (a feature a rebuild dropped).
type: gap_register
version: 1.0.0
