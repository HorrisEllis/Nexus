<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortex — NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--void:#04080a;--surface:#0a1014;--panel:#0f1820;--border:#1a2830;--border2:#243848;--green:#00ff88;--green2:#00cc6a;--cyan:#00e5ff;--amber:#ffaa00;--red:#ff3355;--text:#d0f0e8;--text2:#7aa898;--text3:#3a6055;--mono:'Space Mono',monospace;--ui:'Space Grotesk',sans-serif}
html,body{height:100%;background:var(--void);color:var(--text);font-family:var(--ui);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
#topbar{height:48px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,8,10,.9);backdrop-filter:blur(10px);flex-shrink:0;padding:0 20px;gap:16px}
#cx-glyph{font-size:22px;color:var(--green);animation:glyph 3s ease-in-out infinite}
@keyframes glyph{0%,100%{opacity:.5}50%{opacity:1;filter:drop-shadow(0 0 10px var(--green))}}
.cx-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.15em;color:var(--green)}
.cx-sub{font-size:11px;color:var(--text3);margin-left:auto}
.hbadge{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid rgba(0,255,136,.3);color:var(--green);background:rgba(0,255,136,.07)}

#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;background:rgba(4,8,10,.6)}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab.on{color:var(--green);border-bottom-color:var(--green)}

#content{flex:1;overflow:hidden;display:flex}
.panel{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:20px;gap:14px;animation:in .2s ease}
.panel.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.slbl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.btn-sm{padding:5px 11px;border-radius:6px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--text2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s}
.btn-sm:hover{background:rgba(255,255,255,.07);border-color:var(--green)}

.evt-stream{display:flex;flex-direction:column;gap:0;max-height:340px;overflow-y:auto;font-family:var(--mono);font-size:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px}
.evt-row{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid rgba(26,40,48,.6);animation:rowIn .25s ease}
@keyframes rowIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.evt-ts{color:var(--text3);flex-shrink:0;width:60px}
.evt-src{color:var(--green2);flex-shrink:0;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt-type{color:var(--cyan);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gap-card{border-left:3px solid;padding:10px 13px;margin-bottom:6px;border-radius:0 8px 8px 0;background:var(--surface);animation:in .25s ease}
.gap-card.high{border-left-color:var(--red)}.gap-card.medium{border-left-color:var(--amber)}.gap-card.low{border-left-color:var(--text3)}
.gap-type{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.gap-body{font-size:12px;color:var(--text2)}

.tbl-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.tbl-card:hover{border-color:var(--border2)}
.tbl-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.tbl-name{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green)}
.tbl-count{font-family:var(--mono);font-size:10px;color:var(--text3)}
.tbl-body{padding:10px 14px;max-height:200px;overflow-y:auto;font-family:var(--mono);font-size:10px;color:var(--text2)}

input{background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--ui);font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;width:100%}
input:focus{border-color:var(--green2)}

.metric-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:4px}
.metric-box{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px;text-align:center}
.metric-val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--text)}
.metric-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}

*::-webkit-scrollbar{width:3px;height:3px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="shell">
  <div id="topbar">
    <span id="cx-glyph">◈</span>
    <span class="cx-title">CORTEX</span>
    <span class="cx-sub mono">Memory · :3748</span>
    <span class="hbadge" id="hbadge">CONNECTING</span>
  </div>
  <div id="tabs">
    <button class="tab on" data-t="stream" onclick="ct('stream')">Event Stream</button>
    <button class="tab" data-t="gaps" onclick="ct('gaps')">Open Loops</button>
    <button class="tab" data-t="memory" onclick="ct('memory')">Memory</button>
    <button class="tab" data-t="tables" onclick="ct('tables')">Tables</button>
    <button class="tab" data-t="failures" onclick="ct('failures')">Failures</button>
    <button class="tab" data-t="snapshots" onclick="ct('snapshots')">Snapshots</button>
  </div>
  <div id="content">
    <div class="panel on" id="p-stream">
      <div class="metric-row" id="metrics"></div>
      <div class="slbl">Live Events <span id="ev-count" style="color:var(--green)">0</span></div>
      <div class="evt-stream" id="evt-stream"><div style="color:var(--text3);font-size:11px">Connecting to Cortex SSE...</div></div>
    </div>
    <div class="panel" id="p-gaps">
      <div class="slbl">Open Loops <button class="btn-sm" onclick="loadGaps()">↺</button></div>
      <div id="gaps-list"></div>
    </div>
    <div class="panel" id="p-memory">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="mq" placeholder="Search memory...">
        <button class="btn-sm" onclick="searchMem()" style="white-space:nowrap">Search</button>
      </div>
      <div id="mem-res" style="font-family:var(--mono);font-size:11px;color:var(--text2)"></div>
    </div>
    <div class="panel" id="p-tables">
      <div class="slbl">JAA Tables <button class="btn-sm" onclick="loadTables()">↺</button></div>
      <div id="tables-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px"></div>
    </div>
    <div class="panel" id="p-failures">
      <div class="slbl">Failures <button class="btn-sm" onclick="loadFailures()">↺</button></div>
      <div id="failures-list"></div>
    </div>
    <div class="panel" id="p-snapshots">
      <div class="slbl">Snapshots <button class="btn-sm" onclick="loadSnaps()">↺</button></div>
      <div id="snaps-list" style="font-family:var(--mono);font-size:11px"></div>
    </div>
  </div>
</div>
<script>
const BASE='http://127.0.0.1:3748';
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H,pts=[],t=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
class Pt{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.15;this.vy=(Math.random()-.5)*.15;this.p=Math.random()*Math.PI*2;this.r=Math.random()*1.2+.3}}
function frame(){
  t+=.01;ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(4,8,10,.04)';ctx.fillRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
    pts[i].x+=pts[i].vx;pts[i].y+=pts[i].vy;pts[i].p+=.018;
    if(pts[i].x<0||pts[i].x>W||pts[i].y<0||pts[i].y>H)pts[i]=new Pt();
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<90){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(0,200,100,${(1-d/90)*.06})`;ctx.lineWidth=.4;ctx.stroke()}
    }
    ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,pts[i].r,0,Math.PI*2);
    ctx.fillStyle=`hsla(150,70%,60%,${.08+Math.sin(pts[i].p)*.06})`;ctx.fill();
  }
  requestAnimationFrame(frame);
}
resize();window.addEventListener('resize',resize);for(let i=0;i<50;i++)pts.push(new Pt());frame();

async function api(url,opts={}){try{const r=await fetch(BASE+url,{headers:{'Content-Type':'application/json'},...opts});return await r.json()}catch{return null}}
function ct(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));if(t==='gaps')loadGaps();if(t==='tables')loadTables();if(t==='failures')loadFailures();if(t==='snapshots')loadSnaps()}

let evCount=0,sseConn=null;
function connectSSE(){
  try{
    sseConn=new EventSource(BASE+'/sse');
    sseConn.onmessage=e=>{
      try{const d=JSON.parse(e.data);addEvent(d)}catch(_){}
    };
    sseConn.onerror=()=>setTimeout(connectSSE,5000);
  }catch(_){}
}
function addEvent(d){
  evCount++;document.getElementById('ev-count').textContent=evCount;
  const el=document.getElementById('evt-stream');
  const ts=new Date(d.ts||Date.now()).toISOString().substr(11,8);
  const row=document.createElement('div');row.className='evt-row';
  row.innerHTML=`<span class="evt-ts">${ts}</span><span class="evt-src">${d.source||d.system||''}</span><span class="evt-type">${d.type||d.event||''}</span>`;
  el.prepend(row);if(el.children.length>100)el.removeChild(el.lastChild);
}

async function loadGaps(){
  const d=await api('/api/gaps?status=open');const el=document.getElementById('gaps-list');
  const gaps=Array.isArray(d)?d:[];
  if(!gaps.length){el.innerHTML='<div style="color:var(--text3);font-size:12px">No open gaps — ecology nominal</div>';return}
  el.innerHTML=gaps.slice(0,40).map(g=>`<div class="gap-card ${g.severity||'low'}"><div class="gap-type">${g.loop_type||g.type||'gap'} ${g.severity?'· '+g.severity:''} ${g.status?'· '+g.status:''}</div><div class="gap-body">${g.body||g.path||''}</div></div>`).join('');
}

async function loadTables(){
  const tables=['event_log','gaps','failures','fix_map','artifacts','crystals','agent_calls','bep_patterns','active_traces','forge_patches','escalation_log','fault_taxonomy','failure_modes'];
  const el=document.getElementById('tables-grid');
  el.innerHTML='<div style="color:var(--text3);font-size:11px;grid-column:1/-1">Loading tables...</div>';
  const rows=await Promise.all(tables.map(t=>api(`/api/memory?table=${t}&n=1`).then(d=>({t,count:Array.isArray(d)?d[0]?.total||d.length:0}))));
  el.innerHTML=tables.map(t=>`
    <div class="tbl-card" onclick="loadTableData('${t}')">
      <div class="tbl-head"><span class="tbl-name">${t}</span><button class="btn-sm" onclick="event.stopPropagation();loadTableData('${t}')">↺</button></div>
      <div class="tbl-body" id="tbl-${t}"><span style="color:var(--text3)">Click to load</span></div>
    </div>`).join('');
}

async function loadTableData(t){
  const el=document.getElementById('tbl-'+t);if(!el)return;
  el.textContent='Loading...';
  const d=await api(`/api/memory?table=${t}&n=10`);
  const rows=Array.isArray(d)?d:[];
  if(!rows.length){el.textContent='Empty';return}
  el.innerHTML=rows.map(r=>`<div style="padding:3px 0;border-bottom:1px solid var(--border);color:var(--text2)">${JSON.stringify(r).slice(0,120)}</div>`).join('');
}

async function loadFailures(){
  const d=await api('/api/failures');const el=document.getElementById('failures-list');
  const fails=Array.isArray(d)?d:(d?.failures||[]);
  if(!fails.length){el.innerHTML='<div style="color:var(--text3);font-size:12px">No failures</div>';return}
  el.innerHTML=fails.slice(0,20).map(f=>`<div class="gap-card high"><div class="gap-type">${f.source||'unknown'} · ${new Date(f.ts||0).toISOString().substr(11,8)}</div><div class="gap-body">${(f.error||'').slice(0,160)}</div></div>`).join('');
}

async function loadSnaps(){
  const d=await api('/api/snapshots');const el=document.getElementById('snaps-list');
  const snaps=Array.isArray(d)?d:(d?.snapshots||[]);
  if(!snaps.length){el.innerHTML='<div style="color:var(--text3)">No snapshots</div>';return}
  el.innerHTML=snaps.slice(0,20).map(s=>`<div style="padding:7px 0;border-bottom:1px solid var(--border);display:flex;gap:12px"><span style="color:var(--green)">${(s.snapId||'').slice(0,16)}</span><span style="color:var(--text3)">${s.rows||'?'} rows</span><span style="color:var(--text2)">${s.reason||''}</span></div>`).join('');
}

async function searchMem(){
  const q=document.getElementById('mq').value.trim();if(!q)return;
  const d=await api('/api/memory/search',{method:'POST',body:JSON.stringify({q,n:10})});
  const el=document.getElementById('mem-res');
  const hits=Array.isArray(d)?d:(d?.results||[]);
  if(!hits.length){el.textContent='No results';return}
  el.innerHTML=hits.map(h=>`<div style="padding:5px 0;border-bottom:1px solid var(--border)">${h.type||''}: ${(h.body||h.content||'').slice(0,100)}</div>`).join('');
}

async function loadMetrics(){
  const h=await api('/health');
  if(!h)return;
  const badge=document.getElementById('hbadge');
  if(h.ok||h.status==='ok'){badge.textContent='ONLINE';badge.style.color='var(--green)'}
  else{badge.textContent='OFFLINE';badge.style.color='var(--red)'}
  const el=document.getElementById('metrics');
  const gap=await api('/api/gaps?status=open');
  const fails=await api('/api/failures');
  const boxes=[
    {v:Array.isArray(gap)?gap.length:'—',l:'Open Loops'},
    {v:Array.isArray(fails)?fails.length:'—',l:'Failures'},
    {v:h.tables??'—',l:'JAA Tables'},
    {v:h.uptime?Math.floor(h.uptime/60)+'m':'—',l:'Uptime'},
  ];
  el.innerHTML=boxes.map(b=>`<div class="metric-box"><div class="metric-val">${b.v}</div><div class="metric-lbl">${b.l}</div></div>`).join('');
}

loadMetrics();setInterval(loadMetrics,15000);
connectSSE();
</script>
</body>
</html>
