<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idearium — NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--void:#06050e;--surface:#0d0c1a;--panel:#11101f;--border:#1e1c35;--border2:#2c2945;--purple:#a78bfa;--purple2:#7c5fd4;--cyan:#00e5ff;--green:#00ff88;--amber:#ffaa00;--red:#ff3355;--text:#e8e0ff;--text2:#9490c0;--text3:#4a4875;--mono:'Space Mono',monospace;--ui:'Space Grotesk',sans-serif}
html,body{height:100%;background:var(--void);color:var(--text);font-family:var(--ui);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
#topbar{height:48px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(6,5,14,.9);backdrop-filter:blur(10px);flex-shrink:0;padding:0 20px;gap:14px}
#id-glyph{font-size:22px;color:var(--purple);animation:g 3s ease-in-out infinite}
@keyframes g{0%,100%{opacity:.5}50%{opacity:1;filter:drop-shadow(0 0 10px var(--purple))}}
.id-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.15em;color:var(--purple)}
.id-sub{font-size:11px;color:var(--text3);margin-left:auto}
.hbadge{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid rgba(167,139,250,.3);color:var(--purple);background:rgba(167,139,250,.07)}
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;background:rgba(6,5,14,.6)}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab.on{color:var(--purple);border-bottom-color:var(--purple)}
#content{flex:1;overflow:hidden;display:flex}
.panel{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:20px;gap:14px;animation:in .2s ease}
.panel.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.slbl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.btn-sm{padding:5px 11px;border-radius:6px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--text2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s}
.btn-sm:hover{background:rgba(167,139,250,.1);border-color:var(--purple2)}
.btn-primary{padding:10px 22px;border-radius:8px;border:1px solid var(--purple2);background:rgba(167,139,250,.1);color:var(--purple);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:all .2s;text-transform:uppercase}
.btn-primary:hover{background:rgba(167,139,250,.18)}
input,textarea,select{background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--ui);font-size:13px;padding:10px 13px;outline:none;transition:border-color .2s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--purple2)}
textarea{resize:vertical;min-height:80px;line-height:1.5}

.idea-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.idea-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--purple);opacity:.4;transition:opacity .2s}
.idea-card:hover{border-color:var(--border2);transform:translateX(3px)}
.idea-card:hover::before{opacity:1}
.idea-card.high-tension::before{background:var(--amber);opacity:.7}
.ic-title{font-size:14px;font-weight:500;margin-bottom:8px;line-height:1.4}
.ic-body{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text3);flex-wrap:wrap}
.ic-tag{padding:2px 8px;border-radius:20px;background:rgba(167,139,250,.1);color:var(--purple);font-size:10px;font-family:var(--mono)}
.ic-tension{font-family:var(--mono);font-size:11px}
.tension-high{color:var(--amber)}
.tension-med{color:var(--purple)}
.tension-low{color:var(--text3)}

.spec-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.spec-name{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cyan);margin-bottom:5px}
.spec-desc{font-size:12px;color:var(--text2)}

.tension-bar{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.tension-fill{height:100%;background:var(--amber);transition:width .5s ease;border-radius:2px}

*::-webkit-scrollbar{width:3px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="shell">
  <div id="topbar">
    <span id="id-glyph">◐</span>
    <span class="id-title">IDEARIUM</span>
    <span class="id-sub mono">Idea Lattice · :4800</span>
    <span class="hbadge" id="hbadge">CONNECTING</span>
  </div>
  <div id="tabs">
    <button class="tab on" data-t="ideas" onclick="it('ideas')">Ideas</button>
    <button class="tab" data-t="tension" onclick="it('tension')">By Tension</button>
    <button class="tab" data-t="specs" onclick="it('specs')">Specs</button>
    <button class="tab" data-t="new" onclick="it('new')">+ New</button>
  </div>
  <div id="content">
    <div class="panel on" id="p-ideas">
      <div class="slbl">Idea Lattice — Recent <button class="btn-sm" onclick="loadIdeas('createdAt')">↺</button></div>
      <div id="ideas-list"></div>
    </div>
    <div class="panel" id="p-tension">
      <div class="slbl">By Tension — Highest Friction <button class="btn-sm" onclick="loadIdeas('tension')">↺</button></div>
      <div id="tension-list"></div>
    </div>
    <div class="panel" id="p-specs">
      <div class="slbl">Specs <button class="btn-sm" onclick="loadSpecs()">↺</button></div>
      <div id="specs-list"></div>
    </div>
    <div class="panel" id="p-new">
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px">
        <div>
          <div class="slbl" style="margin-bottom:6px">Title</div>
          <input id="new-title" placeholder="What is this idea?">
        </div>
        <div>
          <div class="slbl" style="margin-bottom:6px">Body</div>
          <textarea id="new-body" placeholder="Expand on the idea. What problem does it solve? What's the insight?" rows="4"></textarea>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <div class="slbl" style="margin-bottom:6px">Tags (comma separated)</div>
            <input id="new-tags" placeholder="e.g. cortex, memory, phase-9">
          </div>
          <div style="flex:0 0 auto">
            <div class="slbl" style="margin-bottom:6px">Status</div>
            <select id="new-status"><option value="open">Open</option><option value="held">Held</option><option value="investigating">Investigating</option></select>
          </div>
        </div>
        <button class="btn-primary" onclick="createIdea()">Create Idea →</button>
        <div id="new-result" style="font-family:var(--mono);font-size:11px;color:var(--text3);display:none"></div>
      </div>
    </div>
  </div>
</div>
<script>
const BASE='http://127.0.0.1:4800';
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H,pts=[],t=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
class Pt{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.18;this.vy=(Math.random()-.5)*.18;this.p=Math.random()*Math.PI*2;this.hue=260+Math.random()*40}}
function frame(){
  t+=.012;ctx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
    pts[i].x+=pts[i].vx;pts[i].y+=pts[i].vy;pts[i].p+=.02;
    if(pts[i].x<0||pts[i].x>W||pts[i].y<0||pts[i].y>H)pts[i]=new Pt();
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<110){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(130,100,240,${(1-d/110)*.07})`;ctx.lineWidth=.5;ctx.stroke()}
    }
    ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,1.2,0,Math.PI*2);
    ctx.fillStyle=`hsla(${pts[i].hue},70%,70%,${.1+Math.sin(pts[i].p)*.07})`;ctx.fill();
  }
  requestAnimationFrame(frame);
}
resize();window.addEventListener('resize',resize);for(let i=0;i<55;i++)pts.push(new Pt());frame();

async function api(url,opts={}){try{const r=await fetch(BASE+url,{headers:{'Content-Type':'application/json'},...opts});return await r.json()}catch{return null}}
function it(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));if(t==='ideas')loadIdeas('createdAt');if(t==='tension')loadIdeas('tension','tension-list');if(t==='specs')loadSpecs()}

function renderIdeas(ideas,elId='ideas-list'){
  const el=document.getElementById(elId);
  if(!ideas.length){el.innerHTML='<div style="color:var(--text3);font-size:12px">No ideas yet. Create one with + New.</div>';return}
  const maxT=Math.max(...ideas.map(i=>i.tension||0),1);
  el.innerHTML=ideas.slice(0,40).map(i=>{
    const t=i.tension||0;const pct=Math.round((t/maxT)*100);
    const tClass=t>0.6?'tension-high':t>0.3?'tension-med':'tension-low';
    const tags=(i.tags||[]).map(t=>`<span class="ic-tag">${t}</span>`).join('');
    return `<div class="idea-card ${t>0.6?'high-tension':''}" style="margin-bottom:10px">
      <div class="ic-title">${i.title||i.body?.slice(0,80)||'Untitled'}</div>
      ${i.body&&i.title?`<div class="ic-body">${i.body}</div>`:''}
      <div class="ic-meta">
        <span>${i.status||'open'}</span>
        ${tags}
        ${t?`<span class="ic-tension ${tClass}">tension: ${t.toFixed?t.toFixed(2):t}</span>`:''}
      </div>
      ${t?`<div class="tension-bar"><div class="tension-fill" style="width:${pct}%"></div></div>`:''}
    </div>`;
  }).join('');
}

async function loadIdeas(sort='createdAt',elId='ideas-list'){
  document.getElementById(elId).innerHTML='<div style="color:var(--text3);font-size:12px">Loading...</div>';
  const d=await api(`/api/ideas?sort=${sort}`);
  const ideas=Array.isArray(d)?d:(d?.ideas||[]);
  renderIdeas(ideas,elId);
}

async function loadSpecs(){
  const d=await api('/api/specs');const el=document.getElementById('specs-list');
  const specs=Array.isArray(d)?d:(d?.specs||[]);
  if(!specs.length){el.innerHTML='<div style="color:var(--text3);font-size:12px">No specs yet. Promote an idea to spec via the idea card.</div>';return}
  el.innerHTML=specs.slice(0,20).map(s=>`<div class="spec-card"><div class="spec-name">${s.name||s.title||s.uuid?.slice(0,16)}</div><div class="spec-desc">${(s.description||s.body||'').slice(0,160)}</div></div>`).join('');
}

async function createIdea(){
  const title=document.getElementById('new-title').value.trim();
  const body=document.getElementById('new-body').value.trim();
  const tags=document.getElementById('new-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const status=document.getElementById('new-status').value;
  if(!body&&!title)return;
  const res=document.getElementById('new-result');res.style.display='block';res.textContent='Creating...';
  const d=await api('/api/ideas',{method:'POST',body:JSON.stringify({title,body:body||title,tags,status})});
  if(d){res.textContent=`Created: ${d.uuid?.slice(0,16)||'ok'}`;res.style.color='var(--green)';
    document.getElementById('new-title').value='';document.getElementById('new-body').value='';document.getElementById('new-tags').value='';
  }else{res.textContent='Error creating idea';res.style.color='var(--red)'}
}

async function checkHealth(){
  const d=await api('/health');const badge=document.getElementById('hbadge');
  if(d?.ok||d?.status==='ok'){badge.textContent='ONLINE';badge.style.color='var(--green)';badge.style.borderColor='rgba(0,255,136,.3)'}
  else{badge.textContent='OFFLINE';badge.style.color='var(--red)';badge.style.borderColor='rgba(255,51,85,.3)'}
}
checkHealth();setInterval(checkHealth,15000);
loadIdeas();
</script>
</body>
</html>
