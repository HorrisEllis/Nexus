<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Orchestrator</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#08080a;color:#e2e2ea;
  font:12px/1.5 'Cascadia Code','Fira Mono',monospace;overflow:hidden;}
*{box-sizing:border-box;}
:root{--bg:#08080a;--bg2:#0e0e11;--bg3:#151518;--bg4:#1c1c20;--border:#222228;
  --text:#e2e2ea;--muted:#484858;--signal:#3ecf8e;--warn:#f0a500;--err:#e85d3c;
  --teal:#2dd4bf;--purple:#9b7fe8;--blue:#4a9eff;--amber:#f0a500;}
#app{display:flex;flex-direction:column;width:100%;height:100%;}

/* ── Topbar ── */
#topbar{height:44px;min-height:44px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;flex-shrink:0;}
.logo{color:var(--signal);font-weight:700;font-size:14px;letter-spacing:.06em;}
.sp{flex:1;}
.pill{font-size:10px;padding:1px 8px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);}
.pill.ok{border-color:var(--signal);color:var(--signal);}
.pill.warn{border-color:var(--warn);color:var(--warn);}
.pill.err{border-color:var(--err);color:var(--err);}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:3px 10px;
  border-radius:3px;cursor:pointer;font:inherit;font-size:11px;}
.btn:hover{border-color:var(--signal);color:var(--signal);}

/* ── Body ── */
#body{display:flex;flex:1;overflow:hidden;}

/* ── Left: system grid ── */
#systems{width:260px;min-width:260px;display:flex;flex-direction:column;
  background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:10px;}
.sys-hdr{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:6px 0 4px;}
.sys-card{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.sys-card:hover{border-color:var(--signal);}
.sys-card.selected{border-color:var(--signal);}
.sys-name{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.sys-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
.sys-dot.live{background:var(--signal);}
.sys-dot.dead{background:var(--err);}
.sys-urls{font-size:10px;color:var(--muted);}
.sys-url{display:block;color:var(--teal);cursor:pointer;text-decoration:none;}
.sys-url:hover{color:var(--signal);}
.sys-stat{font-size:10px;color:var(--muted);margin-top:3px;}

/* ── Center: channels map ── */
#center{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{padding:8px 14px;font-size:10px;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.06em;}
.tab.active{color:var(--signal);border-bottom-color:var(--signal);}
.pane{display:none;flex:1;overflow:hidden;flex-direction:column;}
.pane.active{display:flex;}
.pane-body{flex:1;overflow-y:auto;padding:10px 14px;}

/* ── Channels table ── */
.ch-row{display:flex;gap:0;margin-bottom:3px;font-size:11px;align-items:stretch;}
.ch-from{background:var(--bg3);border:1px solid var(--border);padding:4px 8px;
  border-radius:3px 0 0 3px;color:var(--purple);min-width:120px;flex-shrink:0;}
.ch-arrow{background:var(--bg4);border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:4px 6px;color:var(--muted);flex-shrink:0;}
.ch-to{background:var(--bg3);border:1px solid var(--border);border-left:none;padding:4px 8px;
  border-radius:0 3px 3px 0;color:var(--teal);min-width:120px;flex-shrink:0;}
.ch-desc{padding:4px 10px;color:var(--muted);flex:1;font-size:10px;display:flex;align-items:center;}
.ch-active{border-left:3px solid var(--signal)!important;}

/* ── Live stream ── */
.log-row{display:flex;gap:8px;font-size:10px;padding:2px 0;border-bottom:1px solid rgba(34,34,40,.5);}
.log-ts{color:var(--muted);width:72px;flex-shrink:0;}
.log-sys{width:80px;flex-shrink:0;}
.log-type{width:180px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-body{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── API explorer ── */
.api-section{margin-bottom:12px;}
.api-sys{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px;}
.api-route{display:flex;gap:8px;padding:3px 6px;border-radius:2px;cursor:pointer;
  font-size:11px;align-items:center;margin-bottom:2px;}
.api-route:hover{background:var(--bg3);}
.method{font-size:9px;font-weight:700;min-width:38px;text-align:center;padding:1px 0;border-radius:2px;}
.GET{background:rgba(74,158,255,.12);color:var(--blue);}
.POST{background:rgba(62,207,142,.12);color:var(--signal);}
.PATCH{background:rgba(240,165,0,.12);color:var(--amber);}
.DELETE{background:rgba(232,93,60,.12);color:var(--err);}
.api-path{color:var(--text);flex:1;}
.api-desc{color:var(--muted);font-size:10px;}

/* ── CLI reference ── */
.cli-group{margin-bottom:14px;}
.cli-hdr{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:5px;}
.cli-cmd{font-size:11px;padding:3px 6px;color:var(--text);display:flex;gap:10px;align-items:baseline;}
.cli-cmd:hover{background:var(--bg3);border-radius:2px;}
.cli-name{color:var(--signal);min-width:240px;flex-shrink:0;}
.cli-desc{color:var(--muted);font-size:10px;}
</style></head>
<body><div id="app">

<div id="topbar">
  <span class="logo">⬡ NEXUS</span>
  <span style="font-size:11px;color:var(--muted)">orchestrator</span>
  <span class="pill" id="sys-pill">checking…</span>
  <div class="sp"></div>
  <button class="btn" onclick="loadAll()">↺ refresh</button>
  <button class="btn" onclick="document.getElementById('pane-stream').querySelector('button')?.click()">▶ stream</button>
  <span style="font-size:10px;color:var(--muted)">:9000</span>
</div>

<div id="body">

<!-- Systems sidebar -->
<div id="systems">
  <div class="sys-hdr">Systems</div>
  <div id="sys-list"></div>
  <div class="sys-hdr" style="margin-top:8px">Quick links</div>
  <div style="font-size:11px">
    <a class="sys-url" href="http://localhost:4242" target="_blank">Emerge IDE :4242</a>
    <a class="sys-url" href="http://localhost:7820/cockpit" target="_blank">Cockpit :7820</a>
    <a class="sys-url" href="http://localhost:3748/cortex" target="_blank">Cortex UI :3748</a>
    <a class="sys-url" href="http://localhost:4800" target="_blank">Idearium :4800</a>
    <a class="sys-url" href="http://localhost:9000" target="_blank">Orchestrator :9000</a>
  </div>
</div>

<!-- Center tabs -->
<div id="center">
  <div class="tabs">
    <div class="tab active" onclick="showTab('stream')">▶ Live Stream</div>
    <div class="tab" onclick="showTab('ledger')">📒 Ledger</div>
    <div class="tab" onclick="showTab('console')">$ Console</div>
    <div class="tab" onclick="showTab('channels')">⇄ Channels</div>
    <div class="tab" onclick="showTab('api')">◉ API Map</div>
    <div class="tab" onclick="showTab('cli')">CLI Ref</div>
    <div class="tab" onclick="showTab('requests')">◈ Requests</div>
  </div>

  <!-- STREAM -->
  <div class="pane active" id="pane-stream">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)">
      <span style="font-size:10px;color:var(--muted)">channel</span>
      <input id="stream-ch" value="*" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:3px 7px;font:inherit;font-size:10px;outline:none;border-radius:3px;width:160px">
      <button class="btn" onclick="startStream()">connect</button>
      <button class="btn" onclick="stopStream()" style="color:var(--err)">stop</button>
      <span class="sp"></span>
      <button class="btn" onclick="document.getElementById('stream-log').innerHTML=''">clear</button>
      <span class="pill" id="stream-pill" style="font-size:9px">disconnected</span>
    </div>
    <div class="pane-body" style="padding:6px 10px" id="stream-log"></div>
  </div>

  <!-- CHANNELS -->
  <div class="pane" id="pane-channels">
    <div class="pane-body" id="channels-body"></div>
  </div>

  <!-- API MAP -->
  <div class="pane" id="pane-api">
    <div class="pane-body" id="api-body"></div>
  </div>

  <!-- INTENT MAP -->
  <div class="pane" id="pane-intents">
    <div class="pane-body">
      <div style="display:flex;gap:6px;padding:8px 0 12px;flex-wrap:wrap" id="intent-filter-bar">
        <button class="btn" onclick="filterIntents(null)" id="if-all" style="border-color:var(--signal);color:var(--signal)">ALL</button>
        <button class="btn" onclick="filterIntents('memory')" id="if-memory">MEMORY</button>
        <button class="btn" onclick="filterIntents('dispatch')" id="if-dispatch">DISPATCH</button>
        <button class="btn" onclick="filterIntents('observe')" id="if-observe">OBSERVE</button>
        <button class="btn" onclick="filterIntents('build')" id="if-build">BUILD</button>
        <button class="btn" onclick="filterIntents('control')" id="if-control">CONTROL</button>
      </div>
      <div id="intent-body" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </div>

  <!-- AGENT CHAT -->
  <div class="pane" id="pane-chat">
    <div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0">
        <select id="chat-provider" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);font:11px 'Cascadia Code',monospace;padding:3px 8px">
          <option value="ollama">Ollama (local)</option>
          <option value="claude">Claude</option>
          <option value="chatgpt">ChatGPT</option>
        </select>
        <select id="chat-model" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);font:11px 'Cascadia Code',monospace;padding:3px 8px">
          <option value="mistral:7b-instruct-q4_K_M">mistral:7b-instruct</option>
          <option value="qwen2.5-coder:1.5b">qwen2.5-coder</option>
        </select>
        <label style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);cursor:pointer">
          <input type="checkbox" id="chat-ctx" checked> inject context
        </label>
        <div id="chat-status-inline" style="font-size:9px;color:var(--muted);margin-left:4px"></div>
        <button class="btn" onclick="chatClear()" style="margin-left:auto">clear</button>
      </div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0"></div>
      <div style="padding:8px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:8px">
        <textarea id="chat-input" rows="3"
          placeholder="Talk to the agent… (Enter sends, Shift+Enter newline)"
          style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font:11px 'Cascadia Code',monospace;padding:6px 8px;resize:none;outline:none"
          onkeydown="chatKeydown(event)"></textarea>
        <button class="btn" onclick="chatSend()" id="chat-send-btn"
          style="align-self:flex-end;border-color:var(--signal);color:var(--signal);padding:5px 14px">→ SEND</button>
      </div>
    </div>
  </div>

  <!-- CLI REFERENCE -->
  <div class="pane" id="pane-cli">
    <div class="pane-body" id="cli-body"></div>
  </div>

  <!-- LEDGER -->
  <div class="pane" id="pane-ledger">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)">
      <select id="ledger-system" onchange="loadLedger()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:3px 7px;font:inherit;font-size:10px;border-radius:2px;outline:none">
        <option value="">all systems</option>
        <option>idearium</option><option>emerge</option><option>orchestrator</option>
      </select>
      <button class="btn" onclick="loadLedger()">↺</button>
      <span class="sp"></span>
      <span id="ledger-count" style="font-size:10px;color:var(--muted)"></span>
      <label style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px">
        <input type="checkbox" id="ledger-live" onchange="toggleLedgerLive(this.checked)" checked> live
      </label>
    </div>
    <div class="pane-body" style="padding:0" id="ledger-body">
      <div style="color:var(--muted);font-size:10px;padding:20px;text-align:center">Loading ledger…</div>
    </div>
  </div>

  <!-- CONSOLE -->
  <div class="pane" id="pane-console">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)">
      <span style="font-size:10px;color:var(--muted)">NEXUS CLI CONSOLE</span>
      <span class="sp"></span>
      <button class="btn" onclick="clearConsole()" style="font-size:9px">clear</button>
    </div>
    <div id="console-log" style="flex:1;overflow-y:auto;padding:8px 12px;font:11px/1.6 'Cascadia Code','Fira Mono',monospace;background:var(--bg)"></div>
    <div style="border-top:1px solid var(--border);padding:8px 12px;flex-shrink:0;display:flex;gap:6px;background:var(--bg2)">
      <span style="color:var(--signal);font-size:11px;align-self:center">$</span>
      <input id="console-input" style="flex:1;background:transparent;border:none;color:var(--text);font:11px/1.6 'Cascadia Code','Fira Mono',monospace;outline:none"
        placeholder="nexus status | nexus jobs | nexus gaps | node orchestrator.js watch"
        onkeydown="if(event.key==='Enter')execConsole()">
      <button class="btn primary" onclick="execConsole()" style="font-size:10px">run</button>
    </div>
  </div>

  <!-- REQUESTS -->
  <div class="pane" id="pane-requests">
    <div style="padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2);display:flex;gap:6px">
      <button class="btn" onclick="loadBridgeRequests('pending')">pending</button>
      <button class="btn" onclick="loadBridgeRequests('accepted')">accepted</button>
      <button class="btn" onclick="loadBridgeRequests('')">all</button>
      <span class="sp"></span>
      <button class="btn" onclick="purgeReqs()" style="color:var(--err)">purge</button>
    </div>
    <div class="pane-body" id="req-body"></div>
  </div>
</div>

</div></div>

<script>
const SYSTEMS = {
  cortex:   { port:3748, label:'Cortex',   color:'#2dd4bf', health:'/health' },
  guardian: { port:7820, label:'Guardian', color:'#9b7fe8', health:'/health' },
  idearium: { port:4800, label:'Idearium', color:'#4a9eff', health:'/' },
  emerge:   { port:4242, label:'Emerge',   color:'#3ecf8e', health:'/status' },
  orchestrator: { port:9000, label:'Orchestrator', color:'#3ecf8e', health:'/health' },
};

const CHANNELS = [
  { from:'guardian', channel:'guardian.gaps',            to:['cortex'],            desc:'Gaps detected in AI output' },
  { from:'guardian', channel:'guardian.ledger',          to:['jaa'],               desc:'Ledger entry written' },
  { from:'guardian', channel:'guardian.session.named',   to:['jaa'],               desc:'Chat session named by agent' },
  { from:'guardian', channel:'guardian.timeline',        to:['jaa'],               desc:'Timeline event recorded' },
  { from:'cortex',   channel:'cortex.gap.found',         to:['guardian'], desc:'Gap detected — notifies guardian ledger' },
  { from:'idearium', channel:'idearium.snapshot.pushed', to:['cortex'],            desc:'Snapshot — triggers versionium commit' },
];

const API_MAP = {
  cortex: [
    {m:'GET', p:'/health',d:'System health + JAA counts'},
    {m:'GET', p:'/sse',d:'Live event stream'},
    {m:'GET', p:'/api/events?n=N',d:'Event log tail'},
    {m:'POST',p:'/api/event',d:'Write event'},
    {m:'GET', p:'/api/gaps',d:'Open gaps'},
    {m:'GET', p:'/api/failures',d:'Failure log'},
    {m:'GET', p:'/api/memory?table=x&n=N',d:'Read JAA table'},
    {m:'POST',p:'/api/memory/search',d:'Semantic memory search'},
    {m:'POST',p:'/api/memory/forget',d:'Forget memory entry'},
    {m:'GET', p:'/api/files',d:'File store list'},
    {m:'POST',p:'/api/files',d:'Upload file (multipart)'},
    {m:'GET', p:'/api/tags?entityId=x',d:'Get entity tags'},
    {m:'POST',p:'/api/tags',d:'Tag entity via cortex'},
  ],
  guardian: [
    {m:'POST',p:'/command',d:'Dispatch job to provider'},
    {m:'GET', p:'/status/:jobId',d:'Job status'},
    {m:'GET', p:'/response/:jobId',d:'Job response'},
    {m:'GET', p:'/stream/:jobId',d:'Job token stream (SSE)'},
    {m:'GET', p:'/jobs?status=x',d:'List jobs'},
    {m:'GET', p:'/providers',d:'Connected providers'},
    {m:'GET', p:'/health',d:'Health + queued counts'},
    {m:'GET', p:'/events',d:'Live SSE stream'},
    {m:'GET', p:'/cockpit',d:'Cockpit control panel UI'},
    {m:'GET', p:'/artifacts',d:'Stored artifacts'},
    {m:'POST',p:'/artifacts',d:'Store artifact'},
    {m:'GET', p:'/ledger',d:'Ledger entries'},
    {m:'POST',p:'/ledger',d:'Write ledger entry'},
    {m:'GET', p:'/log',d:'Guardian log'},
  ],
  idearium: [
    {m:'GET', p:'/api/ideas',d:'List ideas'},
    {m:'POST',p:'/api/ideas',d:'Create idea'},
    {m:'GET', p:'/api/ideas/:uuid',d:'Get idea'},
    {m:'PATCH',p:'/api/ideas/:uuid',d:'Update idea'},
    {m:'POST',p:'/api/ideas/:uuid/tension',d:'Compute tension score'},
    {m:'POST',p:'/api/ideas/:uuid/phase',d:'Set phase'},
    {m:'POST',p:'/api/ideas/:uuid/link',d:'Link ideas'},
    {m:'GET', p:'/api/specs',d:'List specs'},
    {m:'POST',p:'/api/specs/:uuid/build',d:'Build spec'},
    {m:'GET', p:'/api/gaps',d:'Open gaps'},
    {m:'POST',p:'/api/gaps',d:'Open gap'},
    {m:'GET', p:'/api/snr',d:'System SNR'},
    {m:'POST',p:'/api/snapshots',d:'Push snapshot'},
    {m:'GET', p:'/sse',d:'Live events'},
  ],
  orchestrator: [
    {m:'GET', p:'/health',d:'All systems health'},
    {m:'GET', p:'/api/status',d:'Full system status JSON'},
    {m:'GET', p:'/api/channels',d:'Channel map'},
    {m:'GET', p:'/api/api-map',d:'Full API surface'},
    {m:'GET', p:'/api/cli',d:'CLI command reference'},
    {m:'POST',p:'/api/dispatch',d:'Dispatch to any system'},
    {m:'GET', p:'/sse',d:'Unified live stream (all systems)'},
    {m:'GET', p:'/',d:'Orchestrator UI'},
  ],
};

const CLI_CMDS = {
  unified: [
    {cmd:'nexus status',desc:'All systems health check'},
    {cmd:'nexus dispatch "prompt"',desc:'Send to chatgpt (default)'},
    {cmd:'nexus jobs',desc:'List recent guardian jobs'},
    {cmd:'nexus events --n=20',desc:'Cortex event log tail'},
    {cmd:'nexus gaps',desc:'All open gaps'},
    {cmd:'nexus ideas',desc:'List idearium ideas'},
    {cmd:'nexus idea "text"',desc:'Create idea'},
    {cmd:'nexus push "message"',desc:'Snapshot + versionium commit'},
    {cmd:'nexus snr',desc:'System SNR score'},
    {cmd:'nexus stream',desc:'Live cortex SSE'},
    {cmd:'nexus watch <jobId>',desc:'Stream guardian job tokens'},
    {cmd:'nexus watchdog',desc:'Live dashboard all systems'},
    {cmd:'nexus requests',desc:'Bridge request queue'},
    {cmd:'nexus tag <id> --tags=x,y',desc:'Tag entity'},
    {cmd:'nexus tags <id>',desc:'Get entity tags'},
    {cmd:'nexus cortex status',desc:'Cortex status + JAA counts'},
    {cmd:'nexus cortex post --type=x',desc:'Write cortex event'},
    {cmd:'nexus cortex memory <query>',desc:'Search memory'},
    {cmd:'nexus guardian dispatch --prompt=x',desc:'Dispatch job'},
    {cmd:'nexus guardian providers',desc:'Provider connection status'},
  ],
  passthrough: [
    {cmd:'nexus /guardian --help',desc:'Guardian CLI full reference'},
    {cmd:'nexus /guardian /code chatgpt "prompt"',desc:'Code command'},
    {cmd:'nexus /guardian status',desc:'Guardian status'},
    {cmd:'nexus /guardian jobs',desc:'Jobs list'},
    {cmd:'nexus /cockpit pipeline list',desc:'Pipeline list'},
    {cmd:'nexus /cockpit seam compile <file>',desc:'Compile SEAM file'},
    {cmd:'nexus /cockpit forge gap create "title"',desc:'Create gap'},
    {cmd:'nexus /cockpit jaa stats',desc:'JAA statistics'},
    {cmd:'nexus /cortex ask "question"',desc:'Ask cortex'},
    {cmd:'nexus /cortex gaps',desc:'Cortex gaps'},
    {cmd:'nexus /cortex tail event_log 20',desc:'Tail event log'},
    {cmd:'nexus /idearium idea add "text"',desc:'Add idea'},
    {cmd:'nexus /idearium idea tension <uuid>',desc:'Compute tension'},
    {cmd:'nexus /idearium spec new <uuid>',desc:'Create spec from idea'},
    {cmd:'nexus /ollama status',desc:'Ollama model list'},
    {cmd:'nexus /ollama pull qwen2.5-coder:7b',desc:'Pull model (streaming)'},
    {cmd:'nexus /ollama run "prompt"',desc:'Run inference (streaming)'},
  ],
};

// ── Render channel map ─────────────────────────────────────────────────────────
document.getElementById('channels-body').innerHTML =
  '<div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">'+CHANNELS.length+' active channels</div>' +

    let d={},alive=false;
    try{const r=await fetch('http://localhost:'+sys.port+sys.health,{signal:AbortSignal.timeout(2000)});d=await r.json();alive=true;online++;}catch(_){}
    const ms=Date.now()-start;

    if(alive&&id==='guardian') {

      const q=Object.values(d.queued||{}).reduce((a,b)=>a+b,0);
      extra=`<div class="sys-stat">${conn.length?'providers: '+conn.join(', '):'no providers connected'}${q?'  ·  '+q+' queued':''}</div>`;
    }
    if(alive&&id==='ollama') { const models=(d.models||[]).map(m=>m.name).join(', '); extra=`<div class="sys-stat">${models||'no models'}</div>`; }
    return `<div class="sys-card" id="sc-${id}" onclick="selectSystem('${id}')">

        <div class="sys-dot ${alive?'live':'dead'}"></div>${sys.label}

  }));

const consoleHistory = [];
let consoleHistIdx = -1;

function focusConsole() {
  setTimeout(() => document.getElementById('console-input')?.focus(), 50);
}

function clearConsole() {
  document.getElementById('console-log').innerHTML = '';
}

function consolePrint(text, cls = 'out') {
  const el = document.getElementById('console-log');
  const line = document.createElement('div');
  line.className = 'con-line ' + cls;
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function execConsole() {
  const input = document.getElementById('console-input');
  const raw = (input.value || '').trim();
  if (!raw) return;
  consoleHistory.unshift(raw);
  consoleHistIdx = -1;
  input.value = '';

  consolePrint('$ ' + raw, 'cmd');

  // Parse command
  const parts = raw.split(/\s+/);
  const bin   = parts[0];

  // Handle nexus CLI shorthands inline (without exec)
  if (bin === 'nexus' || bin === 'node') {
    try {
      // Map nexus commands to orchestrator API calls
      const sub = parts[1] || '';
      if (sub === 'status' || (bin === 'node' && raw.includes('status'))) {
        const d = await fetch('http://localhost:9000/api/status').then(r=>r.json());
        const systems = d.systems || {};
        consolePrint('NEXUS STATUS', 'sys');
        for (const [name, info] of Object.entries(systems)) {
          const dot = info.online ? '●' : '○';
          consolePrint(`  ${dot} ${name.padEnd(14)} :${(info.port||'?')}  ${info.online?'online':'OFFLINE'} ${info.ms||0}ms`, info.online?'out':'err');
        }
        return;
      }
      if (sub === 'jobs') {
        const d = await fetch('http://localhost:9000/api/guardian/jobs').then(r=>r.json());
        consolePrint(`JOBS (${(d.jobs||[]).length})`, 'sys');
        (d.jobs||[]).slice(0,10).forEach(j=>consolePrint(`  ${j.status.padEnd(10)} ${j.provider.padEnd(10)} ${(j.prompt||'').slice(0,50)}`));
        return;
      }
      if (sub === 'events') {
        const d = await fetch('http://localhost:9000/api/cortex/events?n=20').then(r=>r.json());
        consolePrint(`EVENTS (${(d.rows||[]).length})`, 'sys');
        (d.rows||[]).forEach(e=>consolePrint(`  ${new Date(e.ts||0).toTimeString().slice(0,8)}  ${(e.type||'').padEnd(36)}  ${JSON.stringify(e.payload||{}).slice(0,50)}`));
        return;
      }
      if (sub === 'gaps') {
        const d = await fetch('http://localhost:9000/api/idearium/gaps').then(r=>r.json());
        consolePrint(`GAPS (${(d.gaps||d||[]).length})`, 'sys');
        (d.gaps||d||[]).forEach(g=>consolePrint(`  ${g.status.padEnd(10)} ${(g.description||'').slice(0,60)}`,'err'));
        return;
      }
      if (sub === 'ideas') {
        const d = await fetch('http://localhost:9000/api/idearium/ideas').then(r=>r.json());
        consolePrint(`IDEAS (${(d.ideas||[]).length})`, 'sys');
        (d.ideas||[]).slice(0,10).forEach(i=>consolePrint(`  ${(i.phase||'seed').padEnd(12)} ${(i.text||i.title||'').slice(0,60)}`));
        return;
      }
      if (sub === 'ledger') {
        const d = await fetch('http://localhost:9000/api/ledger').then(r=>r.json());
        consolePrint(`LEDGER (${(d.entries||[]).length} entries)`, 'sys');
        (d.entries||[]).slice(0,15).forEach(e=>consolePrint(`  ${(e._system||'?').padEnd(12)} ${(e.type||'').padEnd(30)} ${JSON.stringify(e.payload||{}).slice(0,40)}`));
        return;
      }
      if (sub === 'help' || !sub) {
        consolePrint('nexus status | nexus jobs | nexus events | nexus gaps | nexus ideas | nexus ledger', 'sys');
        consolePrint('POST to /api/exec for arbitrary commands', 'sys');
        return;
      }
    } catch(e) {
      consolePrint('Error: ' + e.message, 'err');
      return;
    }
  }

  // Arbitrary exec via /api/exec
  try {
    consolePrint('executing…', 'sys');
    const d = await fetch('http://localhost:9000/api/exec', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ cmd: parts[0], args: parts.slice(1) })
    }).then(r=>r.json());
    if (d.output) {
      d.output.split('\n').forEach(line => consolePrint(line, d.ok ? 'out' : 'err'));
    }
    consolePrint('exit ' + (d.exit ?? '?'), d.ok ? 'sys' : 'err');
  } catch(e) {
    consolePrint('Exec failed: ' + e.message, 'err');
  }
}

      if (e.key === 'ArrowDown') { consoleHistIdx = Math.max(consoleHistIdx-1, -1); inp.value = consoleHistIdx>=0?consoleHistory[consoleHistIdx]:''; e.preventDefault(); }

  }
});

  return div;
}

async function chatSend() {
  if (_chatStreaming) return;
  const input    = document.getElementById('chat-input');
  const prompt   = (input?.value || '').trim();
  if (!prompt) return;
  const provider = document.getElementById('chat-provider')?.value || 'ollama';
  const model    = document.getElementById('chat-model')?.value || 'mistral:7b-instruct-q4_K_M';
  const useCtx   = document.getElementById('chat-ctx')?.checked !== false;
  const statusEl = document.getElementById('chat-status-inline');

  input.value = '';
  chatAddMessage('user', prompt);
  _chatHistory.push({ role:'user', content: prompt });

  _chatStreaming = true;
  if (statusEl) statusEl.textContent = provider === 'ollama' ? 'calling Ollama…' : 'dispatching…';

  try {
    if (provider === 'ollama') {
      // Direct Ollama call — doesn't need NCP, no browser tab required
      const r = await fetch('http://127.0.0.1:11434/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model,
          messages: _chatHistory,
          stream: false,
        }),
        signal: AbortSignal.timeout(120000),
      });
      if (!r.ok) throw new Error('Ollama returned ' + r.status);
      const d = await r.json();
      const reply = d.message?.content || d.response || '(no response)';
      _chatHistory.push({ role:'assistant', content: reply });
      chatAddMessage('assistant', reply, model + ' · ' + (d.eval_count || '?') + ' tokens');
    } else {
      // Route through guardian dispatch → NCP → browser tab
      const r = await fetch('http://127.0.0.1:9000/api/guardian/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, command: 'chat', prompt }),
      });
      const d = await r.json();
      chatAddMessage('assistant', d.id ? '⟳ Job dispatched: ' + d.id + ' — check JOBS tab for result' : (d.error || 'sent'), 'via guardian NCP');
    }
  } catch(e) {
    chatAddMessage('assistant', '✗ ' + e.message, 'error');
  } finally {
    _chatStreaming = false;
    if (statusEl) statusEl.textContent = '';
  }
}

// Wire intent map render when tab shown
const _origShowTab = showTab;
window.showTab = function(id) {
  _origShowTab(id);
  if (id === 'intents') renderIntents();
};
