<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS · CONVERSATIONS</title>
<link rel="stylesheet" href="/ui/home/home.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   CONVERSATIONS LATTICE — theme tokens lifted directly from Eravos's
   real shared/eravos-kernel.css (fire/amber/violet palette, Cinzel
   Decorative + Cormorant Garamond + Share Tech Mono, glass panels,
   gradient-text animation, spark particles) per direct instruction:
   "make a theme like Eravos." Scoped under #conv-lattice so it never
   leaks into home.css's own tokens for the rest of the shell.
   ══════════════════════════════════════════════════════════════════ */
#conv-lattice{
  --fire:#ff6a00;--fire2:#ee0979;--amber:#ffb347;--violet:#bf5fff;--cyan:#00f5ff;--teal:#00e5cc;
  --dark:#08050a;--dark2:#110810;--dark3:#1a0f18;
  --glass:rgba(255,106,0,.06);--glass2:rgba(255,255,255,.02);
  --border:rgba(255,106,0,.3);--border2:rgba(255,106,0,.15);
  --text:#ffeedd;--dim:rgba(255,238,221,.45);--dim2:rgba(255,238,221,.28);
  --fd:'Cinzel Decorative',serif;--fb:'Cormorant Garamond',serif;--fm:'Share Tech Mono',monospace;
  --good:#00e5cc;--warn:#ffb347;--bad:#ff2244;
  position:relative;height:100%;overflow:hidden;background:var(--dark);color:var(--text);font-family:var(--fb);
  border-radius:10px;
}
#conv-lattice *{box-sizing:border-box}
#conv-lattice::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 15% 10%,rgba(255,106,0,.10),transparent 55%),
             radial-gradient(ellipse 60% 70% at 88% 85%,rgba(238,9,121,.08),transparent 55%),
             radial-gradient(ellipse 40% 40% at 50% 50%,rgba(0,245,255,.03),transparent 60%);
  animation:cl-bgpulse 9s ease-in-out infinite alternate}
@keyframes cl-bgpulse{0%{opacity:.7}100%{opacity:1}}
#conv-lattice .cl-scan{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
#conv-lattice .cl-sparks{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#conv-lattice .cl-spark{position:absolute;bottom:-6px;width:3px;height:3px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 6px var(--fire);opacity:0;animation:cl-rise linear infinite}
@keyframes cl-rise{0%{transform:translateY(0) scale(1);opacity:0}12%{opacity:.9}70%{opacity:.4}
  100%{transform:translateY(-340px) translateX(var(--drift,14px)) scale(.2);opacity:0}}

#conv-lattice .cl-shell{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
#conv-lattice .cl-head{display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--border2);flex-shrink:0;background:linear-gradient(180deg,rgba(255,106,0,.05),transparent)}
#conv-lattice .cl-title{font-family:var(--fd);font-size:1.05rem;font-weight:900;letter-spacing:.05em;
  background:linear-gradient(135deg,var(--amber),var(--fire),var(--fire2),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:300%;animation:cl-gs 5s ease infinite}
@keyframes cl-gs{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#conv-lattice .cl-count{font-family:var(--fm);font-size:.68rem;color:var(--dim2);letter-spacing:.05em}
#conv-lattice .cl-tabs{display:flex;gap:2px;margin-left:auto;border:1px solid var(--border2);border-radius:9px;
  overflow:hidden;background:rgba(0,0,0,.3)}
#conv-lattice .cl-tab{padding:6px 14px;background:transparent;border:none;color:var(--dim);
  font-family:var(--fb);font-size:.82rem;cursor:pointer;transition:all .2s;white-space:nowrap}
#conv-lattice .cl-tab.active{background:linear-gradient(135deg,rgba(255,106,0,.22),rgba(238,9,121,.14));color:var(--amber)}
#conv-lattice .cl-tab:hover:not(.active){color:var(--text)}

#conv-lattice .cl-filters{display:flex;gap:8px;align-items:center;padding:10px 18px;flex-shrink:0;
  border-bottom:1px solid var(--border2);flex-wrap:wrap}
#conv-lattice select.cl-dd{appearance:none;background:rgba(0,0,0,.45) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23ffb347'/></svg>") no-repeat right 10px center;
  border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--fb);font-size:.85rem;
  padding:6px 28px 6px 12px;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
#conv-lattice select.cl-dd:hover,#conv-lattice select.cl-dd:focus{border-color:var(--fire);box-shadow:0 0 10px rgba(255,106,0,.25)}
#conv-lattice .cl-search{flex:1;min-width:140px;background:rgba(0,0,0,.4);border:1px solid var(--border2);
  border-radius:8px;color:var(--text);font-family:var(--fb);font-size:.85rem;padding:6px 12px;outline:none}
#conv-lattice .cl-search:focus{border-color:var(--fire);box-shadow:0 0 10px rgba(255,106,0,.2)}
#conv-lattice .cl-search::placeholder{color:var(--dim2)}
#conv-lattice .cl-refresh{background:linear-gradient(135deg,rgba(255,106,0,.18),rgba(238,9,121,.1));
  border:1px solid var(--border);border-radius:8px;color:var(--amber);font-family:var(--fm);font-size:.72rem;
  padding:6px 12px;cursor:pointer;letter-spacing:.05em;transition:all .2s}
#conv-lattice .cl-refresh:hover{box-shadow:0 0 14px rgba(255,106,0,.3);border-color:var(--fire)}

#conv-lattice .cl-body{flex:1;overflow:hidden;position:relative}
#conv-lattice .cl-view{position:absolute;inset:0;overflow-y:auto;padding:16px 18px;opacity:0;
  pointer-events:none;transition:opacity .25s}
#conv-lattice .cl-view.active{opacity:1;pointer-events:auto}

#conv-lattice .cl-card{border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:8px;
  padding:12px 14px;background:var(--glass2);margin-bottom:10px;transition:border-color .2s,transform .15s;
  animation:cl-cardin .35s ease both}
@keyframes cl-cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#conv-lattice .cl-card:hover{border-color:var(--border);transform:translateX(2px)}
#conv-lattice .cl-card.src-guardian{border-left-color:var(--violet)}
#conv-lattice .cl-card.src-ollama{border-left-color:var(--teal)}
#conv-lattice .cl-card-meta{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
#conv-lattice .cl-chip{font-family:var(--fm);font-size:.62rem;letter-spacing:.04em;padding:2px 9px;
  border:1px solid var(--border2);border-radius:999px;color:var(--dim)}
#conv-lattice .cl-chip.agent{border-color:var(--amber);color:var(--amber)}
#conv-lattice .cl-chip.intent{border-color:var(--cyan);color:var(--cyan)}
#conv-lattice .cl-time{margin-left:auto;font-family:var(--fm);font-size:.66rem;color:var(--dim2)}
#conv-lattice .cl-prompt{font-size:.92rem;line-height:1.5;color:var(--text);margin-bottom:4px}
#conv-lattice .cl-prompt b{color:var(--amber);font-weight:600}
#conv-lattice .cl-response{font-size:.86rem;line-height:1.55;color:var(--dim);border-left:1px solid var(--border2);
  padding-left:10px;max-height:4.6em;overflow:hidden;position:relative}
#conv-lattice .cl-response.expanded{max-height:none}
#conv-lattice .cl-expand{font-family:var(--fm);font-size:.62rem;color:var(--fire);cursor:pointer;margin-top:4px;
  display:inline-block;letter-spacing:.04em}

#conv-lattice .cl-cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#conv-lattice .cl-cal-nav{background:rgba(0,0,0,.4);border:1px solid var(--border2);border-radius:6px;
  color:var(--amber);font-family:var(--fm);width:28px;height:28px;cursor:pointer;transition:all .2s}
#conv-lattice .cl-cal-nav:hover{border-color:var(--fire);box-shadow:0 0 10px rgba(255,106,0,.25)}
#conv-lattice .cl-cal-month{font-family:var(--fd);font-size:.95rem;color:var(--amber);letter-spacing:.04em}
#conv-lattice .cl-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#conv-lattice .cl-cal-dow{font-family:var(--fm);font-size:.6rem;color:var(--dim2);text-align:center;
  padding-bottom:4px;letter-spacing:.08em}
#conv-lattice .cl-cal-day{position:relative;aspect-ratio:1;border:1px solid var(--border2);border-radius:8px;
  background:var(--glass2);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
#conv-lattice .cl-cal-day:hover{border-color:var(--border);transform:scale(1.04)}
#conv-lattice .cl-cal-day.empty{visibility:hidden;cursor:default}
#conv-lattice .cl-cal-day.has-activity{border-color:var(--border)}
#conv-lattice .cl-cal-day.selected{border-color:var(--fire);box-shadow:0 0 14px rgba(255,106,0,.35);
  background:linear-gradient(135deg,rgba(255,106,0,.12),rgba(238,9,121,.06))}
#conv-lattice .cl-cal-day.today .cl-cal-daynum{color:var(--cyan)}
#conv-lattice .cl-cal-daynum{font-family:var(--fb);font-size:.9rem;color:var(--text)}
#conv-lattice .cl-cal-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 6px var(--fire)}
#conv-lattice .cl-cal-badge{position:absolute;top:3px;right:4px;font-family:var(--fm);font-size:.52rem;
  color:var(--fire);opacity:.85}
#conv-lattice .cl-daylist{margin-top:20px;border-top:1px solid var(--border2);padding-top:16px}
#conv-lattice .cl-daylist-title{font-family:var(--fd);font-size:.85rem;color:var(--amber);margin-bottom:12px;
  letter-spacing:.03em}
#conv-lattice .cl-hour-group{margin-bottom:14px}
#conv-lattice .cl-hour-label{font-family:var(--fm);font-size:.66rem;color:var(--cyan);letter-spacing:.06em;
  margin-bottom:6px;display:flex;align-items:center;gap:8px}
#conv-lattice .cl-hour-label::after{content:'';flex:1;height:1px;background:var(--border2)}

#conv-lattice .cl-lattice-intro{font-size:.86rem;line-height:1.7;color:var(--dim);max-width:60ch;margin-bottom:18px}
#conv-lattice .cl-facets{display:flex;gap:18px;flex-wrap:wrap}
#conv-lattice .cl-facet-col{flex:1;min-width:220px}
#conv-lattice .cl-facet-title{font-family:var(--fd);font-size:.78rem;color:var(--amber);letter-spacing:.04em;
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
#conv-lattice .cl-facet-title::after{content:'';flex:1;height:1px;background:var(--border2)}
#conv-lattice .cl-node{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:5px;
  border:1px solid var(--border2);border-radius:7px;background:var(--glass2);cursor:pointer;
  transition:all .2s;font-size:.82rem}
#conv-lattice .cl-node:hover{border-color:var(--border);background:var(--glass);transform:translateX(3px)}
#conv-lattice .cl-node.selected{border-color:var(--fire);background:linear-gradient(135deg,rgba(255,106,0,.14),rgba(238,9,121,.06));
  box-shadow:0 0 10px rgba(255,106,0,.2)}
#conv-lattice .cl-node-bar{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--fire),var(--amber));
  flex-shrink:0}
#conv-lattice .cl-node-label{flex:1;color:var(--text)}
#conv-lattice .cl-node-count{font-family:var(--fm);font-size:.68rem;color:var(--dim2)}

#conv-lattice .cl-empty{text-align:center;padding:60px 20px;color:var(--dim)}
#conv-lattice .cl-empty-glyph{font-size:2.4rem;margin-bottom:12px;opacity:.4}
#conv-lattice .cl-empty-title{font-family:var(--fd);font-size:.92rem;color:var(--amber);margin-bottom:8px}
#conv-lattice .cl-loading{font-family:var(--fm);font-size:.75rem;color:var(--dim2);padding:20px;text-align:center}

#conv-lattice .cl-view::-webkit-scrollbar{width:8px}
#conv-lattice .cl-view::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
#conv-lattice .cl-view::-webkit-scrollbar-thumb:hover{background:var(--border)}

@media (prefers-reduced-motion:reduce){
  #conv-lattice *,#conv-lattice *::before,#conv-lattice *::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body style="margin:0;padding:0;background:transparent;height:100%">
<div id="conv-lattice">
  <div class="cl-scan"></div>
  <div class="cl-sparks" id="cl-sparks"></div>

  <div class="cl-shell">
    <div class="cl-head">
      <span class="cl-title">CONVERSATIONS</span>
      <span class="cl-count" id="cl-count">— exchanges</span>
      <div class="cl-tabs">
        <button class="cl-tab active" data-view="list" onclick="clSwitchView('list')">List</button>
        <button class="cl-tab" data-view="calendar" onclick="clSwitchView('calendar')">Calendar</button>
        <button class="cl-tab" data-view="lattice" onclick="clSwitchView('lattice')">Lattice</button>
      </div>
    </div>

    <div class="cl-filters">
      <select class="cl-dd" id="cl-source" onchange="clReload()">
        <option value="all">All sources</option>
        <option value="chat_log">Co-pilot only</option>
        <option value="guardian_chat_log">Routed agents only</option>
      </select>
      <select class="cl-dd" id="cl-agent" onchange="clApplyFilters()">
        <option value="">All agents</option>
      </select>
      <select class="cl-dd" id="cl-intent" onchange="clApplyFilters()">
        <option value="">All intents</option>
      </select>
      <input class="cl-search" id="cl-search" placeholder="Search prompt or response…" oninput="clApplyFilters()">
      <button class="cl-refresh" onclick="clReload()">↺ REFRESH</button>
    </div>

    <div class="cl-body">
      <div class="cl-view active" id="cl-view-list"></div>
      <div class="cl-view" id="cl-view-calendar"></div>
      <div class="cl-view" id="cl-view-lattice"></div>
    </div>
  </div>
</div>

<script src="/ui/lib/api.js"></script>
<script>
'use strict';
const P={orch:9000,gd:7820,cx:3748,br:9999,idr:4800,em:4242,arch:3747,dg:7825};
const B={orch:`http://127.0.0.1:${P.orch}`};

let clAllRows = [];
let clFiltered = [];
let clCalCursor = new Date(); clCalCursor.setDate(1);
let clSelectedDay = null;
let clSelectedFacet = null;

function clNormalize(row, source) {
  return {
    source,
    agent: row.agent || row.provider || 'unknown',
    intent: row.intent || null,
    ts: row.ts || 0,
    prompt: row.prompt || '',
    response: row.response || row.result || '',
  };
}

async function clFetchTable(table) {
  try {
    const r = await fetch(`${B.orch}/api/memory?table=${table}&n=200`).then(r => r.ok ? r.json() : null).catch(() => null);
    const rows = r?.rows || r?.result || [];
    return rows.map(row => clNormalize(row, table));
  } catch (_) { return []; }
}

async function clReload() {
  const source = document.getElementById('cl-source').value;
  document.getElementById('cl-count').textContent = 'loading…';
  for (const id of ['cl-view-list', 'cl-view-calendar', 'cl-view-lattice']) {
    document.getElementById(id).innerHTML = '<div class="cl-loading">Reading real conversation history…</div>';
  }

  const tables = source === 'all' ? ['chat_log', 'guardian_chat_log'] : [source];
  const results = await Promise.all(tables.map(clFetchTable));
  clAllRows = results.flat().sort((a, b) => (b.ts || 0) - (a.ts || 0));

  clPopulateFacetDropdowns();
  clApplyFilters();
}

function clPopulateFacetDropdowns() {
  const agents = [...new Set(clAllRows.map(r => r.agent).filter(Boolean))].sort();
  const intents = [...new Set(clAllRows.map(r => r.intent).filter(Boolean))].sort();
  const agentSel = document.getElementById('cl-agent');
  const intentSel = document.getElementById('cl-intent');
  const curAgent = agentSel.value, curIntent = intentSel.value;
  agentSel.innerHTML = '<option value="">All agents</option>' + agents.map(a => `<option value="${a}">${a}</option>`).join('');
  intentSel.innerHTML = '<option value="">All intents</option>' + intents.map(i => `<option value="${i}">${i}</option>`).join('');
  agentSel.value = curAgent; intentSel.value = curIntent;
}

function clApplyFilters() {
  const agent = document.getElementById('cl-agent').value;
  const intent = document.getElementById('cl-intent').value;
  const q = document.getElementById('cl-search').value.trim().toLowerCase();

  clFiltered = clAllRows.filter(r => {
    if (agent && r.agent !== agent) return false;
    if (intent && r.intent !== intent) return false;
    if (clSelectedFacet) {
      if (clSelectedFacet.kind === 'agent' && r.agent !== clSelectedFacet.value) return false;
      if (clSelectedFacet.kind === 'intent' && r.intent !== clSelectedFacet.value) return false;
    }
    if (q && !(r.prompt.toLowerCase().includes(q) || r.response.toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('cl-count').textContent = `${clFiltered.length} exchange${clFiltered.length === 1 ? '' : 's'}`;
  clRenderList();
  clRenderCalendar();
  clRenderLattice();
}

function clEsc(s) { return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function clHighlight(s) {
  const q = document.getElementById('cl-search').value.trim();
  const esc = clEsc(s);
  if (!q) return esc;
  try { return esc.replace(new RegExp(clEsc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<b>${m}</b>`); }
  catch (_) { return esc; }
}

function clRenderList() {
  const el = document.getElementById('cl-view-list');
  if (!clFiltered.length) {
    el.innerHTML = `<div class="cl-empty"><div class="cl-empty-glyph">&#9670;</div>
      <div class="cl-empty-title">No conversations match</div>
      <div>Adjust the filters above, or refresh &mdash; nothing here is cached fiction.</div></div>`;
    return;
  }
  el.innerHTML = clFiltered.slice(0, 150).map((r, i) => {
    const srcClass = r.source === 'guardian_chat_log' ? (r.agent === 'ollama' ? 'src-ollama' : 'src-guardian') : '';
    const d = r.ts ? new Date(r.ts) : null;
    const time = d ? d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
    const promptShort = clHighlight(r.prompt.slice(0, 240));
    const respId = `cl-resp-${i}`;
    return `<div class="cl-card ${srcClass}">
      <div class="cl-card-meta">
        <span class="cl-chip agent">${clEsc(r.agent)}</span>
        ${r.intent ? `<span class="cl-chip intent">${clEsc(r.intent)}</span>` : ''}
        <span class="cl-time">${time}</span>
      </div>
      <div class="cl-prompt">${promptShort}${r.prompt.length > 240 ? '…' : ''}</div>
      <div class="cl-response" id="${respId}">${clHighlight(r.response.slice(0, 600))}${r.response.length > 600 ? '…' : ''}</div>
      ${r.response.length > 180 ? `<span class="cl-expand" onclick="document.getElementById('${respId}').classList.toggle('expanded')">expand / collapse</span>` : ''}
    </div>`;
  }).join('');
}

function clDayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function clRenderCalendar() {
  const el = document.getElementById('cl-view-calendar');
  const y = clCalCursor.getFullYear(), m = clCalCursor.getMonth();
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

  const countsByDay = {};
  for (const r of clFiltered) { if (!r.ts) continue; const k = clDayKey(r.ts); countsByDay[k] = (countsByDay[k] || 0) + 1; }

  const monthName = clCalCursor.toLocaleString(undefined, { month: 'long', year: 'numeric' });
  const dows = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += `<div class="cl-cal-day empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${y}-${m}-${day}`;
    const count = countsByDay[key] || 0;
    const cls = ['cl-cal-day'];
    if (count > 0) cls.push('has-activity');
    if (key === todayKey) cls.push('today');
    if (key === clSelectedDay) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" onclick="clSelectDay('${key}')">
      <span class="cl-cal-daynum">${day}</span>
      ${count > 0 ? `<span class="cl-cal-dot"></span>` : ''}
      ${count > 3 ? `<span class="cl-cal-badge">${count}</span>` : ''}
    </div>`;
  }

  let dayListHtml = '';
  if (clSelectedDay) {
    const dayRows = clFiltered.filter(r => r.ts && clDayKey(r.ts) === clSelectedDay).sort((a, b) => a.ts - b.ts);
    const byHour = {};
    for (const r of dayRows) { const h = new Date(r.ts).getHours(); (byHour[h] = byHour[h] || []).push(r); }
    const hourBlocks = Object.keys(byHour).sort((a, b) => a - b).map(h => {
      const label = new Date(0, 0, 0, h).toLocaleTimeString(undefined, { hour: 'numeric', hour12: true }).replace(':00', '');
      const items = byHour[h].map(r => `<div class="cl-card" style="margin-bottom:6px;padding:8px 12px">
        <div class="cl-card-meta"><span class="cl-chip agent">${clEsc(r.agent)}</span>
        ${r.intent ? `<span class="cl-chip intent">${clEsc(r.intent)}</span>` : ''}
        <span class="cl-time">${new Date(r.ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</span></div>
        <div class="cl-prompt" style="font-size:.86rem">${clEsc(r.prompt.slice(0, 160))}${r.prompt.length > 160 ? '…' : ''}</div>
      </div>`).join('');
      return `<div class="cl-hour-group"><div class="cl-hour-label">${label}</div>${items}</div>`;
    }).join('');
    const [dy, dm, dd] = clSelectedDay.split('-').map(Number);
    dayListHtml = `<div class="cl-daylist">
      <div class="cl-daylist-title">${new Date(dy, dm, dd).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })} — ${dayRows.length} exchange${dayRows.length === 1 ? '' : 's'}</div>
      ${hourBlocks || '<div class="cl-empty" style="padding:20px"><div class="cl-empty-title">Nothing this day</div></div>'}
    </div>`;
  }

  el.innerHTML = `
    <div class="cl-cal-head">
      <button class="cl-cal-nav" onclick="clShiftMonth(-1)">‹</button>
      <span class="cl-cal-month">${monthName}</span>
      <button class="cl-cal-nav" onclick="clShiftMonth(1)">›</button>
    </div>
    <div class="cl-cal-grid">
      ${dows.map(d => `<div class="cl-cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${dayListHtml}
  `;
}
function clShiftMonth(n) { clCalCursor.setMonth(clCalCursor.getMonth() + n); clSelectedDay = null; clRenderCalendar(); }
function clSelectDay(key) { clSelectedDay = clSelectedDay === key ? null : key; clRenderCalendar(); }

function clRenderLattice() {
  const el = document.getElementById('cl-view-lattice');
  const agentCounts = {}, intentCounts = {};
  for (const r of clFiltered) {
    agentCounts[r.agent] = (agentCounts[r.agent] || 0) + 1;
    if (r.intent) intentCounts[r.intent] = (intentCounts[r.intent] || 0) + 1;
  }
  const maxAgent = Math.max(1, ...Object.values(agentCounts));
  const maxIntent = Math.max(1, ...Object.values(intentCounts));

  function nodeList(counts, max, kind) {
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([label, count]) => {
      const width = Math.max(10, Math.round((count / max) * 60));
      const sel = clSelectedFacet && clSelectedFacet.kind === kind && clSelectedFacet.value === label;
      return `<div class="cl-node ${sel ? 'selected' : ''}" onclick="clToggleFacet('${kind}','${clEsc(label)}')">
        <div class="cl-node-bar" style="width:${width}px"></div>
        <span class="cl-node-label">${clEsc(label)}</span>
        <span class="cl-node-count">${count}</span>
      </div>`;
    }).join('') || '<div class="cl-empty" style="padding:20px"><div class="cl-empty-title">No data yet</div></div>';
  }

  el.innerHTML = `
    <div class="cl-lattice-intro">Each node is a real facet of the conversation history — click one to
    filter every view by it, click again to clear. Weighted bar = share of exchanges. Two live
    dimensions today: agent and intent, straight from chat_log / guardian_chat_log — nothing here is
    inferred or fabricated.</div>
    <div class="cl-facets">
      <div class="cl-facet-col"><div class="cl-facet-title">AGENT</div>${nodeList(agentCounts, maxAgent, 'agent')}</div>
      <div class="cl-facet-col"><div class="cl-facet-title">INTENT</div>${nodeList(intentCounts, maxIntent, 'intent')}</div>
    </div>
  `;
}
function clToggleFacet(kind, value) {
  clSelectedFacet = (clSelectedFacet && clSelectedFacet.kind === kind && clSelectedFacet.value === value) ? null : { kind, value };
  clApplyFilters();
}

function clSwitchView(view) {
  document.querySelectorAll('#conv-lattice .cl-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.querySelectorAll('#conv-lattice .cl-view').forEach(v => v.classList.remove('active'));
  document.getElementById(`cl-view-${view}`).classList.add('active');
}

function clSpawnSparks() {
  const host = document.getElementById('cl-sparks');
  setInterval(() => {
    if (document.hidden) return;
    const s = document.createElement('div');
    s.className = 'cl-spark';
    s.style.left = Math.random() * 100 + '%';
    s.style.setProperty('--drift', (Math.random() * 30 - 15) + 'px');
    s.style.animationDuration = (4 + Math.random() * 3) + 's';
    host.appendChild(s);
    setTimeout(() => s.remove(), 7500);
  }, 900);
}

clSpawnSparks();
clReload();
</script>
</body>
</html>
