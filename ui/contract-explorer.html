<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — Contract Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#08080f;color:#d4d4e8;font:11px 'Cascadia Code','Fira Code',monospace;height:100%;overflow:hidden}
#topbar{height:40px;background:#0d0d1a;border-bottom:1px solid #1c1c35;display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
.logo{color:#00d4ff;font-weight:700;letter-spacing:.06em}
.pill{font-size:9px;padding:1px 8px;border-radius:10px;background:#111120;border:1px solid #1c1c35;color:#4a4a7a}
.pill.ok{border-color:#3ecf8e;color:#3ecf8e}
#app{height:calc(100vh - 40px);overflow-y:auto;padding:14px}
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">⬡ CONTRACT EXPLORER</span>
  <span class="pill" id="orch-pill">:9000</span>
  <span class="pill ok" id="peer-pill">0 peers</span>
  <span style="flex:1"></span>
  <span style="font-size:9px;color:#4a4a7a">Any UI for any system · domain agnostic</span>
</div>

<div id="app"></div>

<script src="/ui/contract-renderer.js"></script>
<script>
'use strict';

const ORCH = 'http://127.0.0.1:9000';

async function init() {
  const explorer = new ContractExplorer({ orchBase: ORCH });
  await explorer.mount(document.getElementById('app'));

  // Poll peer count
  setInterval(async () => {
    try {
      const r = await fetch(ORCH + '/api/peer/list');
      const d = await r.json();
      const pill = document.getElementById('peer-pill');
      if (pill) pill.textContent = (d.peers?.length || 0) + ' peer' + (d.peers?.length === 1 ? '' : 's');
    } catch(_) {}
  }, 10000);
}

init().catch(e => {
  document.getElementById('app').innerHTML =
    '<div style="color:#e85d3c;padding:20px">Error: ' + e.message + '</div>';
});
</script>
</body>
</html>
