# SYSTEM TEMPLATE — every Nexus system is built in this shape.
#
# James, 2026-10-05:
#   "each component only needs to connect to the registry. that cuts down immensly on context. i am trying to make this
#    need as little tokens as possible. scales as it builds, and as simple as possible."
#   "systems are dynamic and expand using the nodes. which have schemas per node type."
#   "each component has to have at least one capability, with at least one command, and events, each a node each."
#   "each system is responsible for its data, schemas, contracts, configurations, heartbeat and pulse"
#   "then bundle each capability node, in relation to any other relevant node."
#   "hardcoded has to earn its place."
#   "Maybe add, if applicant, data dir with the directory for the data, consumers, intent, data type/system like node,
#    vector, database or table, etc." · "maybe create a template or schema from that."
#
# James, 2026-10-12:
#   "like anything resuable needs a schema and template. contracts and nodes for persistent data, and expanding the
#    system. events. like nothing pretends to work, and everything is tangible until completed."
#   "each system hands the file off to the target system, using the registry and hanbdshake verification to tag the
#    progress and success or failure of the handoff and why. then if it passes can be moved to the physical input
#    folder or queue of the system that recieved the handoff."
#   "nexus is recursive, builds itself, using itself. the same architecture on every level. like it should be a
#    template." · "each module in nexus is a system with its own modules."

tree: |
  <system>/
  ├── server.js                    the API server — serves the route nodes
  ├── cli.js                       the CLI — runs the command nodes
  ├── config.js
  ├── <system>.config.json         configuration — includes the Versionium API slot
  ├── compartment.json
  ├── registry-components.js       the component registry — the spine
  ├── interaction-contract.json    the event-driven interaction contract
  ├── event-taxonomy.js
  ├── jaa-store.js                 the JAA database — the index for each node type
  ├── contracts/                   contracts — handshake verification, gated
  ├── schemas/
  │   ├── index.js
  │   └── schema.<type>            a schema for each node type
  ├── data/
  │   ├── nodes/
  │   │   ├── bundle/<capability-id>.bundle   one per capability — references its related nodes, never copies
  │   │   ├── component/<id>.component
  │   │   ├── capability/<id>.capability     at least one per component
  │   │   ├── command/<id>.command           at least one per capability
  │   │   ├── event/<id>.event               the events for that command
  │   │   ├── route/<id>.route               routes for data types, nodes, hooks, commands, toasts
  │   │   ├── hook/<id>.hook                 end points
  │   │   ├── wire/<id>.wire                 wires between hooks — the interaction space
  │   │   ├── toast/<id>.toast               notifications
  │   │   ├── module/<id>.module             one per module: its dir, its mode, the contract hash it registered with
  │   │   └── <type>/<id>.<type>             every other node type — drop in, the listener integrates it
  │   ├── node-index/              the JAA index of the nodes
  │   ├── ledger/<session>/        event ledger — per session, timestamped
  │   └── baseline/                deltas and sigmas measure against this
  ├── input/                       handoffs queued for this system — verified before they arrived (lib/handoff.js)
  ├── processing/                  a handoff a command is working on (back to input/ at boot if the work died)
  ├── done/                        finished handoffs, with the command's result
  ├── failed/                      failed handoffs, with why
  ├── output/                      receipts for the handoffs this system sent: queued · refused (why) · done · failed
  ├── modules/<module>/            each module is a system — this same tree, one level down, laid out from template/
  ├── template/
  │   └── nexus-system.template.json   the skeleton this system came from ([[key]] placeholders) — so it can nest
  ├── lib/                         the code the nodes point at — heartbeat and pulse, the listener, gates,
  │                                handshake, hashes and snapshots
  ├── spec/
  │   ├── <system>.spec
  │   └── <system>.node-taxonomy.md
  └── ui/                          floats on top — each element gated by a listener on its command

registry: |
  // registry-components.js — the spine. Every component connects only to this.
  // Each id points at a node in its own folder; the node schemas are in templates/system/schemas/.
  module.exports = {
    system: '<system>',
    components: [
      {
        type:   'component',
        id:     '<system>.<component>',
        uuid:   '<uuid>',
        file:   'lib/<component>.js',
        intent: '<what it is for, one line>',
        version: '<semver>',
        status: 'built | stub | unproven | open',
        capabilities: ['<capability-id>'],      // at least one
        hooks:        ['<hook-id>'],            // its end points
        consumers:    ['<component-id>'],       // who uses it — read from the wires into its hooks
        data: {                                 // if applicable
          dir:   'data/<dir>',
          store: 'node | vector | database | table | file',
          types: ['<node-type>'],               // what it keeps — each with its schema
        },
      },
    ],
  };

rules:
  - "every component connects only to the registry — never to another component"
  - "the registry is asked for the entries a component needs, never handed over whole"
  - "every component, hook and wire has a type, an id and a uuid"
  - "each component has at least one capability; each capability at least one command; each command its events — each a node"
  - "every node type has its own folder, its own schema and its own JAA index"
  - "routes, hooks, wires, toasts and contracts are nodes"
  - "each capability has a bundle: references to every node related to it, written by the listener, never copies"
  - "a node dropped into its folder is checked against its schema and the handshake before it is live"
  - "each system owns its own nodes, data, schemas, contracts, configuration, heartbeat and pulse, and announces itself to the other systems"
  - "systems and components are isolated: they interact only through the interaction contract — handshake verified, gated"
  - "the UI floats on top of the interaction contract and is disposable; each element is gated by a listener on its command"
  - "every event is logged in the ledger, per session, timestamped; deltas and sigmas measure deviation from the baseline"
  - "every file has a timestamp and a hash; a modified file is backed up by a Versionium snapshot"
  - "changes start at the registry and reach only what is wired to them; the registry owns the interface, the code owns the implementation"
  - "hardcoded has to earn its place"
  - "anything reusable has a schema and a template; anything that persists or expands the system is a node with a schema"
  - "work moves between systems as a handoff file, never as a bare call: registry + handshake + schema are checked before it moves, and a refusal is a receipt that says why"
  - "a handoff's state is the folder it is in — input/, processing/, done/, failed/ at the receiver; its receipt in output/ at the sender — nothing is in progress that is not a file"
  - "a system hands work only to what its registry knows: its modules (module nodes), its parent, the peers in its config"
  - "a command takes a handoff kind by declaring accepts; the contract lists every kind the system accepts"
  - "a module is a system: the same skeleton, laid out from the parent's template/, carrying the template so it can nest further; the parent knows it by one module node and meets it only through its contract and handoffs"
  # 2026-10-17 (genesis 1.5.0) — James: "the drawbridge for each compartment for each system, the only way to interact between systems" · "each system is soveriegn and self contained" · "all system relevant files should stay with the system"
  - "the registry is the interaction contract, the event bus, the queue, the dependency graph, the wiring harness and the spine: systems reach each other only through it — routes, the CLI, handoffs — with a handshake, the UI's too"
  - "a system is self-contained: it requires no file outside its own folder (lib/boundary.js), runs in its own COS compartment, and its heartbeat reports a require that leaves it"
  - "a file that serves one system lives in that system's folder; what every system uses is the kernel's"
  - "every node names its system, and its relations to other systems are nodes too, so the registry is also the dependency graph"
  - "the toasts a person should see are declared in the registry (toasts:) and served in the contract; the UI keeps no list of its own"
  - "the system's own process is the one writer of its node database; anything else reads it, or asks through the contract"
# ── ADDENDUM 2026-10-17 (0.60.126–0.60.130) — the existing systems toward this shape ─────────────────────────────────────
# James, 2026-10-17: "look at the architecture spec in idearium. thats the point of using the component registry as the spine
#   that way its easy to move them around and use it as a map." The shape above is unchanged: a new system laid out from this
#   template gets all of it. What the systems that predate the template now have, and where it lives (the kernel serves every
#   existing system until each is laid out in its own compartment):
#   - its node registry: lib/node-registry.js (the template's lib/listener.js + lib/node-index.js + jaa-store.js, for a system
#     not made from the template) — its nodes in <system>/data/nodes, indexed into <system>/data/node-index with every change
#   - its relations as nodes: lib/system-nodes.js writes .wire nodes and the .system node's depends_on / consumed_by
#   - its registry checked against its source, and its crossings counted: lib/drawbridge-registry.js, lib/system-boundary.js
#   - its tunnel and heartbeat: lib/system-registry.js tunnel() / heartbeat()
#   docs/architecture-spec/architecture-spec.spec addendum 2026-10-17 has the census; docs/2026-10-17-system-drawbridge-
#   phasemap.spec and sovereign-node P33 have the phases.
