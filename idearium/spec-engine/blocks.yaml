# idearium/spec-engine/blocks.yaml — Block-ID Schema
# UUID: nexus-idearium-blocks-v1-0000-2026-0903-jamesbrooks-001
# Version: 1.0.0
#
# §BUILT 2026-09-03 — James: "using a yaml with block ids for each block.
# each block is a slot for the chunks." Replaces the hardcoded SPEC_SECTIONS
# JS array literal (spec-engine/index.js) as the single declared source for
# the 10 standard spec sections. Each block id was already load-bearing in
# three places that had to independently agree on it (chunk.sectionId,
# the on-disk fileName `00-meta.md` pattern, RepoLayer._resolveChunk's
# path/sectionId match) — this makes that agreement explicit and
# authorable in one file instead of implicit across three.
#
# `agent` here is the per-block DEFAULT — the routing table James asked
# for. Read by spec-engine/index.js's _buildManifest() at chunk creation
# (one default per block, not per spec), overridable per-spec via
# createSpec's `sectionAgents` param, and always overridable per-chunk
# post-creation (while PENDING) via setChunkAgent(). Real dispatch still
# reads chunk.agent, not this file, at build time — this only seeds it.
#
# Seeded by Claude, not James — a starting point James said he'd correct
# once he sees it in practice, not a claimed-correct routing table.
version: "1.0.0"
blocks:
  - id: meta
    title: "Meta & Identity"
    desc: "UUID, version, phase, comp_id, seam_id, status, author, dependencies"
    agent: ollama
  - id: purpose
    title: "Purpose & Intent"
    desc: "What this component does, why it exists, what problem it solves"
    agent: ollama
  - id: axioms
    title: "Axioms Enforced"
    desc: "Which AXIOMS-v1.0 axioms this component satisfies, with evidence"
    agent: claude
  - id: schema
    title: "Data Schema"
    desc: "JAA tables, field shapes, types, constraints, decay tier"
    agent: deepseek
  - id: api
    title: "API & Routes"
    desc: "HTTP routes, request/response shapes, error codes"
    agent: claude
  - id: events
    title: "Events & Bus"
    desc: "Bus events emitted, bus events consumed, event payload shapes"
    agent: ollama
  - id: integration
    title: "Integration Points"
    desc: "What talks to this, what this talks to, seam contracts"
    agent: gemini
  - id: failure_modes
    title: "Failure Modes"
    desc: "What can fail, how it fails loudly (§1.2), recovery paths"
    agent: claude
  - id: build_order
    title: "Build Order"
    desc: "Bottom-up build sequence (§3.1), what must exist first"
    agent: ollama
  - id: tests
    title: "Tests & Verification"
    desc: "How each piece is proven (§1.1), test cases, invariants"
    agent: deepseek
  # §0.39.286 RC1 (docs/2026-10-01-routing-registry-genesis-phasemap.spec) — James: "add the components registry as an
  # 11th chunk … where its all wired in, event driven interaction contract, after the file list and tree, then the
  # registry can map the relation to each component and chunk, and also is its self the doorway, and the rest is
  # isolated modular, interacting through the interaction contract/registry … routes, cli, nodes and dir, everything
  # loom and the component registry have … the ui can also float on top … the nodes based data structure exactly like
  # guardian." Built after build_order (it reads the file list and tree), so it waits on that chunk (dependsOn).
  # `fallback:` is this block's own fallback chain (lib/pipeline-routing.js), tried before routing.chain.
  - id: registry
    title: "Component Registry & Interaction Contract"
    desc: >-
      The doorway every module goes through, written as nodes in Guardian's layout (nodes/<type>/<id>.<type>, the
      lib/node-export.js envelope: envelope, uuid, type, id, context, intent, summary, system, tags, payload).
      From build_order's file list and tree: one .component per file (id by loom's rule — path → dotted id; its
      chunk, type, layer, file); .hook per crossing point (export/import, event emit/handle, route, cli); .wire per
      relation (from_hook_id → to_hook_id, consumer ← dependency, relation); .event per event (emitted by, consumed
      by, payload); .command per HTTP route and CLI command (method, path or verb, the component that serves it);
      the node types and data dirs it uses; orphans; one .contract — the interaction contract: modules never import
      across a boundary, every crossing goes through a declared hook, event or route, so each module stays isolated
      and replaceable; one .system — the entry, ports, counts. The UI is a consumer of this registry only.
    agent: claude
    fallback: [ollama, gemini]
    dependsOn: [build_order]
