<!doctype html>
<!--
  idearium/ui/settings.html — the settings console. §0.39.279.
  James: "can you have a full enterprise grade settings menu that encompassed all the idearium compartment and agent
  settings." One page for everything a repo's agent and compartment can be told, and idearium's own config:
    Idearium   every key of the layered config (idearium/lib/config-core.cjs), with where its value comes from
               (default / file / runtime), its bounds, and reset-to-file/default.
    each repo  Agent (backend, guardian agent, Ollama model, tool scope, code-inject mode) · Prompt (every block: on/off,
               text, reset, a live preview of the first message) · Hat (the persona it wears) · Compartment & desktop
               (the COS compartment, its branch/original, the desktop VM).
  Reads GET /api/settings/console[/:uuid]; every write goes to the route that owns that setting (config, agent/settings,
  agent/blocks, desktop). Served by idearium itself, so /api is same-origin. ?repo=<uuid> opens a repo.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/access-guard.js"></script>   <!-- §0.58.0 IA3 — a page Idearium asks to sign in goes to /login.html -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/nexus-theme.css">
<script src="js/theme.js"></script>
<style>
  /* §0.39.284 W5 — James: "rebuild the themes for the settings tab" · "consistent with the main ui". The console's own
     tokens now come from css/nexus-theme.css (the main UI's palette, or the one chosen under Appearance). Before 0.39.284
     it had a palette of its own (#0a0b10 / #7c9cff accent) that matched neither idearium nor the main UI. */
  :root { --bg:var(--nx-ink); --panel:var(--nx-card); --panel2:var(--nx-card2); --line:var(--nx-edge); --text:var(--nx-text); --dim:var(--nx-dim); --faint:var(--nx-muted);
          --accent:var(--ac); --ok:var(--nx-emerald); --warn:var(--nx-warn); --bad:var(--nx-err); --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ap-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; padding:14px; }
  .ap-card { border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; background:var(--panel2); transition:border-color .18s, transform .18s, box-shadow .18s; text-align:left; color:var(--text); font:inherit; }
  .ap-card:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.35); }
  .ap-card.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 10px 26px rgba(0,0,0,.35); }
  .ap-name { font-weight:600; margin:8px 0 2px; display:flex; gap:8px; align-items:center; } .ap-desc { color:var(--dim); font-size:12px; }
  .ap-prev { border-radius:7px; overflow:hidden; border:1px solid rgba(255,255,255,.06); font:10px/1.5 var(--mono); }
  .ap-bar { display:flex; gap:10px; padding:6px 8px; } .ap-bar b { font-weight:600; } .ap-body { padding:6px 8px; display:grid; gap:4px; }
  .ap-ln { padding:0 6px; border-radius:3px; } .ap-sw { display:flex; gap:4px; padding:6px 8px 8px; } .ap-sw i { width:16px; height:16px; border-radius:4px; display:inline-block; }
  .ap-chips { display:flex; gap:8px; flex-wrap:wrap; padding:14px; }
  .ap-chip { display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px; background:var(--panel2); color:var(--text); cursor:pointer; font:inherit; transition:border-color .15s; }
  .ap-chip.on { border-color:var(--accent); } .ap-chip i { width:16px; height:16px; border-radius:50%; display:inline-block; }
  .ap-cycle { background:conic-gradient(hsl(192 100% 56%), hsl(240 100% 66%), hsl(192 100% 56%)); animation:apSpin 4s linear infinite; } @keyframes apSpin { to { transform:rotate(360deg); } }
  /* §0.39.280 — one theme: NEXUS dark, whatever the OS scheme (James: "keep the theme consistent") */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.45 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif; }
  .app { display:grid; grid-template-columns: 280px 1fr; height:calc(100vh - var(--chrome-h, 0px)); margin-top:var(--chrome-h, 0px); }
  nav { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  nav header { padding:14px 14px 8px; } nav h1 { margin:0 0 8px; font-size:15px; }
  nav input { width:100%; padding:7px 9px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font:inherit; }
  .navlist { overflow:auto; padding:6px; flex:1; }
  .navgroup { font:600 11px/1 var(--mono); color:var(--faint); text-transform:uppercase; letter-spacing:.06em; padding:12px 8px 6px; }
  .navitem { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 8px; border:0; border-radius:7px; background:none; color:var(--text); cursor:pointer; font:inherit; }
  .navitem:hover { background:var(--panel2); } .navitem.on { background:color-mix(in srgb, var(--accent) 18%, transparent); }
  .navitem .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font:10px/1.6 var(--mono); padding:0 6px; border-radius:999px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .tag.ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 50%, transparent); } .tag.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 50%, transparent); }
  .tag.acc { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 50%, transparent); }
  main { overflow:auto; min-width:0; }
  .head { position:sticky; top:0; z-index:2; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom:1px solid var(--line); padding:14px 22px 0; }
  .head h2 { margin:0; font-size:18px; } .head .sub { color:var(--dim); font-size:12px; margin:3px 0 10px; }
  .tabs { display:flex; gap:2px; } .tab { padding:8px 12px; border:0; background:none; color:var(--dim); border-bottom:2px solid transparent; cursor:pointer; font:inherit; }
  .tab.on { color:var(--text); border-bottom-color:var(--accent); }
  .body { padding:18px 22px 90px; max-width:1100px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin:0 0 14px; }
  .card > h3 { margin:0; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .card > h3 .grow { flex:1; } .card .note { color:var(--dim); font-size:12px; padding:10px 14px 0; }
  .row { display:grid; grid-template-columns: minmax(180px, 280px) 1fr auto; gap:14px; align-items:center; padding:10px 14px; border-top:1px solid var(--line); }
  .card > h3 + .row, .card > .note + .row { border-top:0; }
  .row .k { font:12px var(--mono); overflow-wrap:anywhere; } .row .d { color:var(--dim); font-size:12px; margin-top:2px; }
  .row .ctl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=number], select, textarea { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font:inherit; }
  input[type=number] { width:120px; } select { min-width:180px; } textarea { width:100%; font:12px/1.5 var(--mono); resize:vertical; }
  input.dirty, select.dirty, textarea.dirty { border-color:var(--warn); } input.bad { border-color:var(--bad); }
  button.btn { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; font:inherit; }
  button.btn:hover { border-color:var(--accent); } button.btn.primary { background:var(--accent); color:#0a0b10; border-color:var(--accent); font-weight:600; }
  button.btn:disabled { opacity:.5; cursor:default; }
  .switch { position:relative; width:36px; height:20px; display:inline-block; } .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.15s; cursor:pointer; }
  .switch span::after { content:''; position:absolute; left:3px; top:3px; width:14px; height:14px; border-radius:50%; background:var(--text); transition:.15s; }
  .switch input:checked + span { background:var(--accent); } .switch input:checked + span::after { transform:translateX(16px); }
  .block { border-top:1px solid var(--line); padding:10px 14px; } .block .bh { display:flex; align-items:center; gap:10px; }
  .block .bh .lbl { flex:1; } .block textarea { margin-top:8px; min-height:70px; } .block.off .lbl { color:var(--faint); }
  pre.preview { margin:0; padding:12px 14px; max-height:420px; overflow:auto; font:12px/1.5 var(--mono); white-space:pre-wrap; border-top:1px solid var(--line); color:var(--dim); }
  .savebar { position:fixed; right:18px; bottom:16px; display:none; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--warn); border-radius:10px; padding:10px 12px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:5; }
  .savebar.on { display:flex; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 14px; display:none; z-index:6; max-width:80vw; }
  .toast.on { display:block; } .toast.bad { border-color:var(--bad); color:var(--bad); } .toast.ok { border-color:var(--ok); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .kv { font:12px var(--mono); color:var(--dim); white-space:pre-wrap; padding:10px 14px; }
  /* §0.39.281 EC8 — the economy page */
  .econ-lims { display:flex; flex-wrap:wrap; gap:10px 16px; padding:6px 0 4px; }
  .econ-lim { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
  .econ-lim input[type=number] { width:90px; } .econ-lim select { min-width:140px; }
  .econ-chk { font:12px var(--mono); color:var(--dim); margin-right:10px; }
  .econ-graph { width:100%; max-width:640px; height:auto; margin-top:8px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } nav { max-height:40vh; } .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script>
  // §0.39.280 BS10 — ?embed=1: this console's repo view inside the repo's own Settings tab (an iframe): no nav, no
  // window title bar; everything else — the tabs, the save bar, every route — is the same page.
  if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');
  if (new URLSearchParams(location.search).get('single') === '1') document.documentElement.classList.add('single');
</script>
<style>
  html.embed .app { grid-template-columns: 1fr; height: 100vh; margin-top: 0; }
  html.embed nav { display: none; }
  /* §0.39.310 VP7 — &single=1: ONE view of the repo (the repo Settings tab's Hat / advanced / desktop buttons), no tab strip */
  html.single #tabs, html.single #sub { display: none; }
  html.embed .head { padding-top: 8px; }
</style>
<script>if (!document.documentElement.classList.contains('embed')) document.write('<script src="js/window-chrome.js" data-kind="settings" data-title="Settings console"><\/script>');</script>
<div class="app">
  <nav>
    <header><h1>⚙ Settings console</h1><input id="q" type="search" placeholder="Filter repos and settings…" autocomplete="off"></header>
    <div class="navlist" id="nav"></div>
  </nav>
  <main>
    <div class="head"><h2 id="title">Loading…</h2><div class="sub" id="sub"></div><div class="tabs" id="tabs"></div></div>
    <div class="body" id="body"><div class="empty">Loading settings…</div></div>
  </main>
</div>
<div class="savebar" id="savebar"><span id="savecount">Unsaved changes</span><button class="btn" id="discard">Discard</button><button class="btn primary" id="save">Save</button></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let CONSOLE = null, CUR = { kind: 'global', uuid: null, tab: 'agent' }, DETAIL = null, PENDING = [];

function toast(msg, kind = '') { const t = $('toast'); t.textContent = msg; t.className = `toast on ${kind}`; clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = 'toast'), 3500); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });

// ── pending changes: each is { label, run } — applied in order by Save ──
function queue(key, label, run) {
  PENDING = PENDING.filter(p => p.key !== key);
  PENDING.push({ key, label, run });
  $('savecount').textContent = `${PENDING.length} unsaved change${PENDING.length === 1 ? '' : 's'}`;
  $('savebar').classList.add('on');
}
function clearPending() { PENDING = []; $('savebar').classList.remove('on'); }
$('discard').onclick = () => { clearPending(); render(); };
$('save').onclick = async () => {
  const btn = $('save'); btn.disabled = true;
  const done = [], failed = [];
  for (const p of PENDING) { try { await p.run(); done.push(p.label); } catch (e) { failed.push(`${p.label}: ${e.message}`); } }
  btn.disabled = false; clearPending();
  if (failed.length) toast(`${failed.length} not saved — ${failed[0]}`, 'bad'); else toast(`Saved ${done.length} change${done.length === 1 ? '' : 's'}`, 'ok');
  await load(CUR.uuid);
};
window.addEventListener('beforeunload', (e) => { if (PENDING.length) { e.preventDefault(); e.returnValue = ''; } });

// ── nav ──
function renderNav() {
  const f = $('q').value.trim().toLowerCase();
  const repos = (CONSOLE.repos || []).filter(r => !f || `${r.name} ${r.uuid} ${r.provider || ''} ${r.branch || ''}`.toLowerCase().includes(f));
  const item = (on, attrs, name, tags) => `<button class="navitem${on ? ' on' : ''}" ${attrs}><span class="nm">${esc(name)}</span>${tags}</button>`;
  const originals = repos.filter(r => !r.branchOf), branches = repos.filter(r => r.branchOf);
  const tagsOf = (r) => [r.nexusSelf ? '<span class="tag warn">nexus</span>' : '', r.branchOf ? '<span class="tag acc">branch</span>' : '', r.provider ? `<span class="tag">${esc(r.provider)}</span>` : ''].join('');
  $('nav').innerHTML = `<div class="navgroup">Idearium</div>` + item(CUR.kind === 'global', 'data-global="1"', 'Global configuration', `<span class="tag">${(CONSOLE.config.keys || []).length}</span>`)
    + item(CUR.kind === 'economy', 'data-economy="1"', 'Provider economy', '<span class="tag acc">limits · learning</span>')
    + item(CUR.kind === 'routing', 'data-routing="1"', 'Routing & fallback', '<span class="tag acc">pipeline</span>')
    + item(CUR.kind === 'access', 'data-access="1"', 'Access', '<span class="tag acc">app passwords</span>')
    + item(CUR.kind === 'appearance', 'data-appearance="1"', 'Appearance', `<span class="tag">${esc((window.IdeariumTheme && IdeariumTheme.current().theme) || 'nexus')}</span>`)
    + `<div class="navgroup">Repos · compartments (${originals.length})</div>` + (originals.map(r => item(CUR.uuid === r.uuid, `data-repo="${esc(r.uuid)}"`, r.name, tagsOf(r))).join('') || '<div class="kv">none match</div>')
    + (branches.length ? `<div class="navgroup">Branches (${branches.length})</div>` + branches.map(r => item(CUR.uuid === r.uuid, `data-repo="${esc(r.uuid)}"`, r.name, tagsOf(r))).join('') : '');
  for (const b of $('nav').querySelectorAll('[data-repo]')) b.onclick = () => go('repo', b.dataset.repo);
  const g = $('nav').querySelector('[data-global]'); if (g) g.onclick = () => go('global');
  const ec = $('nav').querySelector('[data-economy]'); if (ec) ec.onclick = () => go('economy');
  const ap = $('nav').querySelector('[data-appearance]'); if (ap) ap.onclick = () => go('appearance');
  const rt = $('nav').querySelector('[data-routing]'); if (rt) rt.onclick = () => go('routing');
  const ax = $('nav').querySelector('[data-access]'); if (ax) ax.onclick = () => go('access');
}
$('q').oninput = () => { renderNav(); if (CUR.kind === 'global') render(); };

function go(kind, uuid = null) {
  if (PENDING.length && !confirm('Discard unsaved changes?')) return;
  clearPending();
  CUR = { kind, uuid, tab: CUR.tab || 'agent' };
  history.replaceState(null, '', uuid ? `?repo=${encodeURIComponent(uuid)}` : location.pathname);
  load(uuid);
}

async function load(uuid) {
  if (ECON) ECON._stale = true;   // §0.39.281 — the economy page re-reads guardian after a save
  try {
    CONSOLE = await api('/api/settings/console');
    DETAIL = uuid ? await api(`/api/settings/console/${encodeURIComponent(uuid)}`) : null;
  } catch (e) { $('body').innerHTML = `<div class="empty">Could not read the settings: ${esc(e.message)}</div>`; return; }
  renderNav(); render();
}

// ── controls ──
function ctlFor(k, onChange) {
  const v = k.value;
  if (k.type === 'boolean') return `<label class="switch"><input type="checkbox" data-k="${esc(k.key)}" ${v ? 'checked' : ''}><span></span></label>`;
  if (k.enum) return `<select data-k="${esc(k.key)}">${k.enum.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  if (k.type === 'number') return `<input type="number" data-k="${esc(k.key)}" value="${esc(v)}" ${k.min != null ? `min="${k.min}"` : ''} ${k.max != null ? `max="${k.max}"` : ''}>`;
  if (Array.isArray(v) || (v && typeof v === 'object')) return `<textarea data-k="${esc(k.key)}" data-json="1" rows="3">${esc(JSON.stringify(v, null, 1))}</textarea>`;
  return `<input type="text" data-k="${esc(k.key)}" value="${esc(v == null ? '' : v)}" placeholder="${k.type.includes('null') ? '(none)' : ''}">`;
}
function readCtl(el, k) {
  if (el.type === 'checkbox') return el.checked;
  if (el.dataset.json) return JSON.parse(el.value);
  if (k.type === 'number') { const n = Number(el.value); if (!Number.isFinite(n) || (k.min != null && n < k.min) || (k.max != null && n > k.max)) throw new Error(`${k.key}: ${k.min ?? '−∞'}…${k.max ?? '∞'}`); return n; }
  if (k.type.includes('null') && el.value === '') return null;
  return el.value;
}

// ── views ──
function render() {
  if (CUR.kind === 'economy') return renderEconomy();
  if (CUR.kind === 'appearance') return renderAppearance();
  if (CUR.kind === 'access') return renderAccess();
  if (CUR.kind === 'routing') return renderRouting();
  if (CUR.kind === 'global' || !DETAIL) return renderGlobal();
  return renderRepo();
}

function renderGlobal() {
  $('title').textContent = 'Idearium — global configuration';
  const c = CONSOLE.config;
  $('sub').innerHTML = `Layers: schema default → <span class="tag">${esc(c.configFile || 'idearium.config.json')}</span>${c.configFileExists ? '' : ' (absent)'} → runtime override. ${c.updatedAt ? `Last change ${new Date(c.updatedAt).toLocaleString()} by ${esc(c.updatedBy || '?')}.` : ''}${c.configFileError ? ` <span class="tag warn">file error: ${esc(c.configFileError)}</span>` : ''}`;
  $('tabs').innerHTML = '';
  const f = $('q').value.trim().toLowerCase();
  const groups = {};
  for (const k of (c.keys || [])) { if (f && !k.key.toLowerCase().includes(f)) continue; (groups[k.key.split('.')[0]] = groups[k.key.split('.')[0]] || []).push(k); }
  const names = Object.keys(groups);
  $('body').innerHTML = names.length ? names.map(g => `<div class="card"><h3><span class="grow">${esc(g)}</span><span class="tag">${groups[g].length}</span></h3>${groups[g].map(k => `
    <div class="row"><div><div class="k">${esc(k.key)}</div><div class="d">default ${esc(JSON.stringify(k.default))}${k.min != null || k.max != null ? ` · ${k.min ?? '−∞'}…${k.max ?? '∞'}` : ''}${k.copilot_writable ? '' : ' · agents cannot change it'}</div></div>
      <div class="ctl">${ctlFor(k)}</div>
      <div class="ctl"><span class="tag ${k.source === 'runtime' ? 'acc' : k.source === 'file' ? 'ok' : ''}" title="where this value comes from">${esc(k.source)}</span>${k.source === 'runtime' ? `<button class="btn" data-reset="${esc(k.key)}" title="drop the runtime override">reset</button>` : ''}</div></div>`).join('')}</div>`).join('')
    : '<div class="empty">No setting matches the filter.</div>';
  for (const el of $('body').querySelectorAll('[data-k]')) {
    const k = c.keys.find(x => x.key === el.dataset.k);
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      try { const val = readCtl(el, k); el.classList.remove('bad'); el.classList.add('dirty');
        queue(`cfg:${k.key}`, k.key, () => post('/api/config', { key: k.key, value: val, actor: 'settings-console' })); }
      catch (e) { el.classList.add('bad'); }
    });
  }
  for (const b of $('body').querySelectorAll('[data-reset]')) b.onclick = async () => { try { await post('/api/config/reset', { key: b.dataset.reset, actor: 'settings-console' }); toast(`${b.dataset.reset} reset`, 'ok'); load(null); } catch (e) { toast(e.message, 'bad'); } };
}

// ── §0.39.284 W5 — Appearance: the palette, the accent, the motion — idearium config ui.theme / ui.accent / ui.motion ──
// James: "can you rebuild the themes for the settings tab for idearium" · "make all the css in idearium consistent with
// the main ui". A choice applies at once (this window, and every idearium window of this browser through storage) and is
// saved to idearium's config (POST /api/config — the same key the CLI and the API set), so other machines follow it.
const AP_THEMES = [
  { id: 'nexus', name: 'NEXUS', desc: 'The main NEXUS UI — void, ink and plate, the cyan accent.', c: { bg: '#080814', card: '#0d0d1f', edge: '#1e1e3a', text: '#d0d4f0', dim: '#7070a0', ok: '#00ff88', err: '#ff3355', warn: '#ffaa00' }, main: true },

// ── §0.39.281 EC8 — the provider economy (docs/2026-09-29-provider-economy-phasemap.spec) ──
// James: "economy tags for each provider. With staging branches. Like id love an extensive configurable options for this.
// … the tokenizer and graphs to learn token constraints … Smart economy like dynamically evolving and learning routing."
// Everything here is read from guardian (GET /api/economy, /usage, /limits, /routing, through idearium) and every edit
// is one POST /api/economy patch, queued in the save bar like every other setting.
let ECON = null, ECON_PATCH = {};
function _econPatch(fn, label) {
  fn(ECON_PATCH);
  queue('economy', 'provider economy', () => post('/api/economy', { policy: ECON_PATCH, by: 'settings-console' }).then(() => { ECON_PATCH = {}; }));
}
function _econGraph(series, lim) {
  const pts = (series || []).slice(-300); if (!pts.length) return '<div class="kv">no jobs recorded yet</div>';
  const W = 520, H = 120, maxY = Math.max(lim && lim.minBad || 0, ...pts.map(p => p.tokensIn), 100) * 1.1;
  const t0 = pts[0].at, t1 = pts[pts.length - 1].at || t0 + 1;
  const X = (t) => 30 + (W - 40) * ((t - t0) / Math.max(1, t1 - t0)), Y = (v) => H - 14 - (H - 24) * (v / maxY);
  const col = { ok: 'var(--ok)', truncated: 'var(--warn)', failed: 'var(--bad)', timeout: 'var(--bad)', login: 'var(--accent)' };
  const line = (v, c, label) => v ? `<line x1="30" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="4 3"/><text x="${W - 12}" y="${Y(v) - 3}" text-anchor="end" fill="${c}" font-size="9">${label} ${v}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="econ-graph" role="img" aria-label="input tokens by outcome">
    <line x1="30" x2="30" y1="6" y2="${H - 14}" stroke="var(--line)"/><line x1="30" x2="${W - 10}" y1="${H - 14}" y2="${H - 14}" stroke="var(--line)"/>
    <text x="2" y="12" fill="var(--faint)" font-size="9">${Math.round(maxY)}</text><text x="2" y="${H - 14}" fill="var(--faint)" font-size="9">0</text>
    ${line(lim && lim.safeLimit, 'var(--ok)', 'safe')}${line(lim && lim.minBad, 'var(--bad)', 'failed at')}
    ${pts.map(p => `<circle cx="${X(p.at).toFixed(1)}" cy="${Y(p.tokensIn).toFixed(1)}" r="2.6" fill="${col[p.outcome] || 'var(--dim)'}"><title>${esc(p.outcome)} · ${p.tokensIn} tokens · ${new Date(p.at).toLocaleString()}</title></circle>`).join('')}</svg>`;
}

  $('title').textContent = 'Provider economy';

    try {

    <div class="card"><h3><span class="grow">Staging by economy</span></h3><div class="note">Code written by a provider in these tiers goes to the repo's staging branch (Versionium, repo-&lt;uuid&gt;@staging) and waits for promote, instead of being applied — for repos in auto mode. Review-mode repos wait anyway.</div>

    <div class="card"><h3><span class="grow">Learning router</span></h3><div class="note">When nobody chose a provider, NEXUS picks from what has actually worked (success, speed, cost), trying less-proven providers now and then. It starts once there are enough recorded builds.</div>
      <div class="row"><div><div class="k">explore</div><div class="d">0 = always the best so far · 1 = try widely</div></div><div class="ctl"><input type="number" step="0.05" min="0" max="1" value="${P.router.explore}" data-econ-router="explore"></div><div></div></div>
      <div class="row"><div><div class="k">min records</div><div class="d">build outcomes needed before it routes</div></div><div class="ctl"><input type="number" min="0" max="100000" value="${P.router.minRecords}" data-econ-router="minRecords"></div><div></div></div>
      <div class="kv">${Object.values(sc).length ? Object.values(sc).sort((a, b) => (a.jobType + a.provider).localeCompare(b.jobType + b.provider)).map(x => `${x.jobType.padEnd(10)} ${x.provider.padEnd(12)} success ${x.success} · ${x.ok} ok / ${x.bad} not · ${x.medianMs != null ? Math.round(x.medianMs / 1000) + 's' : '—'} median · cost ×${x.cost}`).join('\n') : 'no outcomes recorded yet'}${ex.why ? `\n\nnow, for a build: ${esc(ex.why)}` : ''}</div></div>
    <div class="card"><h3><span class="grow">Token limits learned from real jobs</span><span class="tag">${esc(ECON.limits.method || '')} · last ${ECON.limits.days || 30} days</span></h3><div class="note">Every job's input size and how it ended (● ok · ● truncated · ● failed/timeout · ● login). The safe limit sits below the smallest input that failed. Token counts are estimates (no vendor tokenizer is bundled).</div>
      ${Object.keys(lims).length ? Object.keys(lims).sort().map(limCard).join('') : '<div class="empty">No jobs recorded yet — limits appear as work runs.</div>'}</div>
    <div class="card"><h3><span class="grow">Not included, on purpose</span></h3><div class="note">Nothing here makes automated jobs look like you typing (timing tricks, forced rewording, decoy questions). That would be working around the providers' automated-use checks with your own account at risk. Limits and quiet hours above are what keep automated load on a signed-in account reasonable.</div></div>`;
  const B = $('body');
  const P0 = (n) => (ECON_PATCH.providers = ECON_PATCH.providers || {}, ECON_PATCH.providers[n] = ECON_PATCH.providers[n] || {});
  for (const el of B.querySelectorAll('[data-econ-tier]')) el.onchange = () => { el.classList.add('dirty'); _econPatch(() => { P0(el.dataset.econTier).tier = el.value; }); };
  for (const el of B.querySelectorAll('[data-econ-on]')) el.onchange = () => _econPatch(() => { P0(el.dataset.econOn).enabled = el.checked; });
  for (const el of B.querySelectorAll('[data-econ-lim]')) el.oninput = () => { const [n, k] = el.dataset.econLim.split(':'); const v = Number(el.value); if (!Number.isFinite(v)) return el.classList.add('bad');
    el.classList.remove('bad'); el.classList.add('dirty'); _econPatch(() => { const q = P0(n); q.limits = q.limits || {}; q.limits[k] = k === 'minGapMs' ? Math.round(v * 1000) : v; }); };
  for (const el of B.querySelectorAll('[data-econ-q]')) el.oninput = () => { const n = el.dataset.econQ.split(':')[0];
    const a = B.querySelector(`[data-econ-q="${n}:0"]`).value, b = B.querySelector(`[data-econ-q="${n}:1"]`).value; el.classList.add('dirty');
    _econPatch(() => { P0(n).quietHours = a === '' && b === '' ? null : [Number(a), Number(b)]; }); };
  for (const el of B.querySelectorAll('[data-econ-onlimit]')) el.onchange = () => _econPatch(() => { P0(el.dataset.econOnlimit).onLimit = el.value; });
  const jt = (t) => (ECON_PATCH.jobTypes = ECON_PATCH.jobTypes || {}, ECON_PATCH.jobTypes[t] = ECON_PATCH.jobTypes[t] || {});
  for (const el of B.querySelectorAll('[data-econ-jt]')) el.onchange = () => { const t = el.dataset.econJt.split(':')[0];
    _econPatch(() => { jt(t).tiers = [...B.querySelectorAll(`[data-econ-jt^="${t}:"]`)].filter(x => x.checked).map(x => x.dataset.econJt.split(':')[1]); }); };
  for (const el of B.querySelectorAll('[data-econ-prefer]')) el.onchange = () => _econPatch(() => { jt(el.dataset.econPrefer).prefer = el.value || null; });
  for (const el of B.querySelectorAll('[data-econ-stage]')) el.onchange = () => _econPatch(() => { ECON_PATCH.stageTiers = [...B.querySelectorAll('[data-econ-stage]')].filter(x => x.checked).map(x => x.dataset.econStage); });
  for (const el of B.querySelectorAll('[data-econ-router]')) el.oninput = () => _econPatch(() => { ECON_PATCH.router = { ...(ECON_PATCH.router || {}), [el.dataset.econRouter]: Number(el.value) }; });
}

// §0.58.0 IA3 — James: "what about a app password style login in idearium from clearglass panel, then we could accounts
// per hat/repo?" Who may act on Idearium: the mode, and app passwords — each for some repos, some capabilities, a hat.
// Made and revoked here (admin only); the password is shown once. Reads /api/access/me + /api/access/keys.
const ACCESS_CAPS = [['read_ideas', 'read'], ['write_ideas', 'write'], ['admin', 'admin (make passwords, every route)']];
async function renderAccess(made = null) {
  $('title').textContent = 'Access';
  $('sub').innerHTML = 'Who may act on Idearium. App passwords sign in a person, a tablet, a hat or a website — each held to its repos and capabilities. Save one in Clear Glass (Passwords, for http://127.0.0.1:4800) and every panel is signed in.';
  $('tabs').innerHTML = '';
  $('body').innerHTML = '<div class="empty">Reading access…</div>';
  let me, keys = null, keysErr = null;
  try { me = await api('/api/access/me'); } catch (e) { $('body').innerHTML = `<div class="empty">Could not read access: ${esc(e.message)}</div>`; return; }
  try { keys = (await api('/api/access/keys')).keys; } catch (e) { keysErr = e.message; }
  const cfg = Object.fromEntries((CONSOLE.config.keys || []).filter(k => k.key.startsWith('access.')).map(k => [k.key, k.value]));
  const mode = cfg['access.mode'] || me.mode;
  const MODES = { open: 'nobody signs in (as before 0.58)', origin: 'websites and other devices sign in — this machine\'s own pages and processes do not', password: 'everyone signs in (Nexus\'s own processes too — IA6 is not built yet, so they will be refused)' };
  const repoName = (u) => ((CONSOLE.repos || []).find(r => r.uuid === u) || {}).name || u;
  const row = (k) => `<div class="row"><div><div class="k">${esc(k.label)} ${k.revokedAt ? '<span class="tag warn">revoked</span>' : ''}${k.hat ? ` <span class="tag acc">hat ${esc(k.hat)}</span>` : ''}</div>
      <div class="d">${esc(k.id)} · ${esc(k.caps.join(', '))} · ${k.repos === '*' ? 'every repo' : esc(k.repos.map(repoName).join(', '))} · made ${new Date(k.createdAt).toLocaleString()}${k.lastUsedAt ? ` · used ${new Date(k.lastUsedAt).toLocaleString()}` : ' · never used'}</div></div>
      <div class="ctl"></div><div>${k.revokedAt ? '' : `<button class="btn" data-revoke="${esc(k.id)}">Revoke</button>`}</div></div>`;
  $('body').innerHTML = `
    <div class="card"><h3><span class="grow">You</span><span class="tag">${me.signedIn ? 'signed in' : 'this machine'}</span></h3>
      <div class="kv">${me.signedIn ? `${esc(me.who.label)}${me.who.hat ? ` · hat ${esc(me.who.hat)}` : ''} · ${esc(me.who.caps.join(', '))} · ${me.who.repos === '*' ? 'every repo' : esc(me.who.repos.join(', '))}` : 'not signed in — a page or process on this machine, full access'}</div>
      ${me.signedIn ? '<div class="row"><div></div><div class="ctl"></div><div><button class="btn" id="ax-out">Sign out</button></div></div>' : ''}</div>
    <div class="card"><h3><span class="grow">Who must sign in</span></h3>
      <div class="row"><div><div class="k">access.mode</div><div class="d" id="ax-mode-d">${esc(MODES[mode] || '')}</div></div><div class="ctl"><select id="ax-mode">${Object.keys(MODES).map(m => `<option ${m === mode ? 'selected' : ''}>${m}</option>`).join('')}</select></div><div></div></div>
      <div class="row"><div><div class="k">access.trusted_origins</div><div class="d">websites allowed without a password, comma-separated (e.g. https://my.dashboard) — loopback pages always are</div></div><div class="ctl"><input type="text" id="ax-origins" value="${esc(cfg['access.trusted_origins'] || '')}" placeholder="(none)"></div><div></div></div>
      <div class="row"><div><div class="k">access.session_days</div><div class="d">how long a sign-in lasts</div></div><div class="ctl"><input type="number" min="1" max="365" id="ax-days" value="${esc(cfg['access.session_days'] || 30)}"></div><div></div></div></div>
    <div class="card"><h3><span class="grow">App passwords</span><span class="tag">${keys ? keys.filter(k => !k.revokedAt).length : '—'} live</span></h3>
      ${made ? `<div class="note"><b>${esc(made.key.label)}</b> — copy it now, it is not shown again:<div class="kv" id="ax-pw" style="user-select:all">${esc(made.password)}</div><button class="btn" id="ax-copy">Copy</button></div>` : ''}
      ${keysErr ? `<div class="empty">${esc(keysErr)}</div>` : (keys.length ? keys.slice().reverse().map(row).join('') : '<div class="empty">No app passwords yet.</div>')}
      ${keysErr ? '' : `<div class="block"><div class="bh"><span class="lbl"><b>Make one</b></span></div>
        <div class="row"><div><div class="k">label</div><div class="d">who or what it is for — "tablet", "reviewer hat", "my dashboard"</div></div><div class="ctl"><input type="text" id="ax-label"></div><div></div></div>
        <div class="row"><div><div class="k">hat</div><div class="d">optional — the persona whose actions this is</div></div><div class="ctl"><input type="text" id="ax-hat" placeholder="(none)"></div><div></div></div>
        <div class="row"><div><div class="k">repos</div><div class="d">none ticked = every repo</div></div><div class="ctl">${(CONSOLE.repos || []).filter(r => !r.branchOf).map(r => `<label class="econ-chk"><input type="checkbox" data-ax-repo="${esc(r.uuid)}"> ${esc(r.name)}</label>`).join(' ') || '<span class="d">no repos</span>'}</div><div></div></div>
        <div class="row"><div><div class="k">may</div><div class="d">write holds read; admin holds everything</div></div><div class="ctl">${ACCESS_CAPS.map(([c, n]) => `<label class="econ-chk"><input type="checkbox" data-ax-cap="${c}" ${c !== 'admin' ? 'checked' : ''}> ${n}</label>`).join(' ')}</div><div></div></div>
        <div class="row"><div></div><div class="ctl"></div><div><button class="btn" id="ax-make">Make password</button></div></div></div>`}</div>`;
  const setCfg = async (key, value) => { try { await post('/api/config', { key, value, actor: 'user' }); toast(`${key} saved`, 'ok'); CONSOLE = await api('/api/settings/console'); } catch (e) { toast(e.message, 'bad'); } };
  $('ax-mode').onchange = () => { const v = $('ax-mode').value; if (v === 'password' && !confirm('Everyone will have to sign in, including Nexus\'s own processes (copilot, guardian) — they cannot yet (IA6). Continue?')) { $('ax-mode').value = mode; return; } $('ax-mode-d').textContent = MODES[v]; setCfg('access.mode', v); };
  $('ax-origins').onchange = () => setCfg('access.trusted_origins', $('ax-origins').value.trim());
  $('ax-days').onchange = () => setCfg('access.session_days', Number($('ax-days').value));
  const out = $('ax-out'); if (out) out.onclick = async () => { await post('/api/access/logout', {}); toast('signed out', 'ok'); renderAccess(); };
  const cp = $('ax-copy'); if (cp) cp.onclick = () => navigator.clipboard.writeText(made.password).then(() => toast('copied', 'ok'), () => toast('select it and copy', 'bad'));
  for (const b of document.querySelectorAll('[data-revoke]')) b.onclick = async () => { if (!confirm('Revoke it? Its sign-ins end at once.')) return; try { await post(`/api/access/keys/${encodeURIComponent(b.dataset.revoke)}/revoke`, {}); toast('revoked', 'ok'); renderAccess(); } catch (e) { toast(e.message, 'bad'); } };
  const mk = $('ax-make'); if (mk) mk.onclick = async () => {
    const label = $('ax-label').value.trim(); if (!label) return toast('a label is needed', 'bad');
    const repos = [...document.querySelectorAll('[data-ax-repo]')].filter(x => x.checked).map(x => x.dataset.axRepo);
    const caps = [...document.querySelectorAll('[data-ax-cap]')].filter(x => x.checked).map(x => x.dataset.axCap);
    try { const r = await post('/api/access/keys', { label, hat: $('ax-hat').value.trim() || null, repos: repos.length ? repos : '*', caps }); renderAccess(r); }
    catch (e) { toast(e.message, 'bad'); }
  };
}

const TABS = [['agent', 'Agent'], ['prompt', 'Prompt'], ['hat', 'Hat'], ['env', 'Compartment & desktop']];
// §OP2 0.57.0 — James: "can you have these settings broken up into repos? … i prefer options over hard coded". A Nexus
// system's repo (nexus/guardian …) also shows that SYSTEM's own options, asked of the system through Idearium
// (GET/POST /api/systems/:system/options → the system's /api/options). One system at a time declares them (OP1).
const SYS_PORT_NAME = { 'ollama-bridge': 'ollama' };
const SYS_OPTS = {};   // system → { loading, data, error }
function _sysOf(r) { const s = r && r.nexusSelf && r.nexusSelf.role === 'system' ? r.nexusSelf.system : null; return s ? (SYS_PORT_NAME[s] || s) : null; }
function _tabsFor(r) { const s = _sysOf(r); return s ? [...TABS, ['system', `System · ${s}`]] : TABS; }
function renderRepo() {
  const d = DETAIL, r = d.repo;
  $('title').textContent = r.name;
  $('sub').innerHTML = [`<span class="tag">${esc(r.uuid)}</span>`, r.source ? `<span class="tag">${esc(r.source)}</span>` : '', r.branchOf ? `<span class="tag acc">branch ${esc(r.branch || '')}</span>` : '', r.nexusSelf ? '<span class="tag warn">nexus — code only on approval</span>' : '',
    r.settingsFrom ? `<span class="tag warn">agent settings live in the original — edit them there</span> <button class="btn" data-open="${esc(r.settingsFrom)}">open original</button>` : '',
    (d.blind || []).length ? `<span class="tag warn" title="${esc(d.blind.map(b => `${b.source}: ${b.error}`).join('\n'))}">${d.blind.length} source(s) unreadable</span>` : ''].filter(Boolean).join(' ');
  $('tabs').innerHTML = _tabsFor(r).map(([id, name]) => `<button class="tab${CUR.tab === id ? ' on' : ''}" data-tab="${id}">${name}</button>`).join('');
  for (const b of $('tabs').querySelectorAll('[data-tab]')) b.onclick = () => { CUR.tab = b.dataset.tab; render(); };
  const view = { agent: viewAgent, prompt: viewPrompt, hat: viewHat, env: viewEnv, system: viewSystem }[CUR.tab] || viewAgent;
  $('body').innerHTML = view(d);
  for (const b of document.querySelectorAll('[data-open]')) b.onclick = () => go('repo', b.dataset.open);
  wire[CUR.tab] && wire[CUR.tab](d);
}

function viewSystem(d) {
  const sys = _sysOf(d.repo);
  if (!sys) return '<div class="empty">This repo is not a Nexus system.</div>';
  const st = SYS_OPTS[sys];
  if (!st || (!st.data && !st.error)) { _loadSystemOptions(sys); return `<div class="empty">reading ${esc(sys)}'s options…</div>`; }
  if (st.error) return `<div class="card"><h3><span class="grow">${esc(sys)}</span><span class="tag warn">unreachable</span></h3><div class="note">${esc(st.error)}</div><div class="row"><div></div><div class="ctl"><button class="btn" id="o-retry">Try again</button></div><div></div></div></div>`;
  const D = st.data;
  if (!D.declared || !(D.options || []).length) return `<div class="card"><h3><span class="grow">${esc(sys)}</span><span class="tag">no options yet</span></h3><div class="note">${esc(D.note || `${sys} has not declared its options yet.`)}</div></div>`;
  const groups = [...new Set(D.options.map(o => o.group))];
  const ctl = (o) => {
    const dis = o.source === 'env' ? 'disabled' : '';
    if (o.type === 'boolean') return `<select data-oid="${esc(o.id)}" ${dis}><option ${o.value ? 'selected' : ''} value="true">on</option><option ${!o.value ? 'selected' : ''} value="false">off</option></select>`;
    if (o.type === 'enum') return `<select data-oid="${esc(o.id)}" ${dis}>${(o.values || []).map(v => `<option ${v === o.value ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
    return `<input data-oid="${esc(o.id)}" value="${esc(String(o.value))}" ${o.type === 'number' ? 'inputmode="numeric"' : ''} ${dis} style="width:140px">`;
  };
  const human = (o) => o.unit === 'ms' && typeof o.value === 'number' ? ` (${o.value >= 60000 ? `${+(o.value / 60000).toFixed(2)} min` : `${+(o.value / 1000).toFixed(2)} s`})` : '';
  const src = (o) => o.source === 'env' ? `<span class="tag warn" title="set by the environment variable ${esc(o.overriddenBy)} — it wins over this console; unset it to edit here">env ${esc(o.overriddenBy)}</span>`
    : o.source === 'file' ? `<span class="tag acc" title="set here (${esc(sys)}/data/options.json)">set</span>` : '<span class="tag">default</span>';
  return `<div class="note" style="margin:0 0 12px">${esc(sys)}'s own options — the values its code reads, read and written through ${esc(sys)} itself. A change applies to the next job; no restart. Every change is kept in ${esc(sys)}/data/options-ledger.jsonl.</div>`
    + groups.map(g => `<div class="card"><h3><span class="grow">${esc(g)}</span></h3>${D.options.filter(o => o.group === g).map(o => `
      <div class="row"><div><div class="k">${esc(o.key)} ${src(o)}</div><div class="d">${esc(o.description)}${o.unit ? ` · ${esc(o.unit)}` : ''}${o.min != null ? ` · ${o.min}–${o.max}` : ''} · default ${esc(String(o.default))}${o.invalid ? ` · <b>ignored: ${esc(o.invalid)}</b>` : ''}</div></div>
      <div class="ctl">${ctl(o)}<span class="d">${esc(human(o))}</span></div>
      <div>${o.source === 'file' ? `<button class="btn" data-oreset="${esc(o.id)}" title="back to the default">reset</button>` : ''}</div></div>`).join('')}</div>`).join('');
}
async function _loadSystemOptions(sys, again = false) {
  if (SYS_OPTS[sys] && SYS_OPTS[sys].loading && !again) return;
  SYS_OPTS[sys] = { loading: true };
  try { SYS_OPTS[sys] = { data: await api(`/api/systems/${encodeURIComponent(sys)}/options`) }; }
  catch (e) { SYS_OPTS[sys] = { error: e.message }; }
  if (CUR.tab === 'system') render();
}
async function _setSystemOption(sys, id, value, reset = false) {
  try {
    const r = await api(`/api/systems/${encodeURIComponent(sys)}/options`, { method: 'POST', body: JSON.stringify(reset ? { id, reset: true } : { id, value }) });
    toast(reset ? `${id} back to its default` : `${id} = ${r.value}${r.note ? ` — ${r.note}` : ''}`, 'ok');
  } catch (e) { toast(e.message, 'bad'); }
  _loadSystemOptions(sys, true);
}

function viewAgent(d) {
  const a = d.agent;
  if (!a) return '<div class="empty">The agent settings could not be read (see the header).</div>';
  const ro = !!d.repo.settingsFrom;
  const opt = (list, cur) => list.map(o => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('');
  return `<div class="card"><h3><span class="grow">Who answers</span><span class="tag">${esc(a.backend || '')}</span></h3>
    <div class="note">The switch the Agent tab shows: copilot decides, Ollama only, Claude Code (headless, on this machine's own signed-in <code>claude</code>, in a copy of the repo — its changes land like any agent's: proposals here, Nexus repos always through approval), or one Guardian browser agent. The hat is the same whichever answers.</div>
    <div class="row"><div><div class="k">provider</div><div class="d">copilot · ollama · claude-code · a guardian agent</div></div><div class="ctl"><select id="a-provider" ${ro ? 'disabled' : ''}>${opt(a.providers || [], a.provider)}</select></div><div></div></div>
    <div class="row"><div><div class="k">ollama model</div><div class="d">when Ollama answers; empty = the bridge's default</div></div><div class="ctl"><select id="a-model" ${ro ? 'disabled' : ''}><option value="">(default)</option></select></div><div></div></div></div>
  <div class="card"><h3><span class="grow">Tools</span></h3>
    <div class="note">harness: the code tools + the layers (nexus.tools.tool → tools_expand) in the first message, every tool allowed · all: every tool listed · project: only the hat's own list.</div>
    <div class="row"><div><div class="k">tool scope</div></div><div class="ctl"><select id="a-scope" ${ro ? 'disabled' : ''}>${opt(a.toolScopes || CONSOLE.toolScopes || [], a.toolScope)}</select></div><div></div></div></div>
  <div class="card"><h3><span class="grow">Code the agent writes</span></h3>
    <div class="note">auto: written into the repo · review: waits for you (Nexus repos are always review) · off: kept, never written.</div>
    <div class="row"><div><div class="k">inject mode</div></div><div class="ctl"><select id="a-inject">${opt(a.modes || [], a.injectMode)}</select></div><div></div></div></div>`;
}

function viewPrompt(d) {
  const b = d.blocks;
  if (!b) return '<div class="empty">The prompt blocks could not be read.</div>';
  if (d.repo.settingsFrom) return '<div class="empty">This branch uses the original repo\'s prompt blocks — open the original to edit them.</div>';
  const when = { always: 'every backend', tools: 'Ollama + Guardian (tool loop)', guardian: 'Guardian browser agents', build: 'file builds (spec chunks)' };
  return `<div class="card"><h3><span class="grow">Prompt blocks · v${esc(b.version)}</span><button class="btn" id="p-reset">Reset all to default</button></h3>
    <div class="note">Everything the agent is sent besides its persona, in order. Only necessities are on by default (0.39.279): context is fetched with tools, not pasted.</div>
    ${b.list.map(x => `<div class="block${x.enabled ? '' : ' off'}" data-b="${esc(x.id)}"><div class="bh">
      <label class="switch"><input type="checkbox" ${x.enabled ? 'checked' : ''} data-on="${esc(x.id)}"><span></span></label>
      <div class="lbl"><div class="k">${esc(x.label)}</div><div class="d">${esc(x.id)} · ${esc(when[x.when] || x.when)}${x.edited ? ' · <b>edited</b>' : ''}${(b.placeholders[x.id] || []).length ? ` · fills ${esc(b.placeholders[x.id].join(' '))}` : ''}</div></div>
      ${x.edited ? `<button class="btn" data-breset="${esc(x.id)}">default text</button>` : ''}</div>
      <textarea rows="${Math.min(12, Math.max(2, String(x.text).split('\n').length + 1))}" data-text="${esc(x.id)}">${esc(x.text)}</textarea></div>`).join('')}</div>
  <div class="card"><h3><span class="grow">Preview the first message</span></h3>
    <div class="row"><div><div class="k">question</div></div><div class="ctl" style="flex:1"><input type="text" id="p-msg" style="flex:1;min-width:240px" value="add a retry limit to the flush lock"></div><div class="ctl"><button class="btn" id="p-preview">Preview</button></div></div>
    <pre class="preview" id="p-out">Preview shows exactly what this agent would be sent — saved blocks, not unsaved edits.</pre></div>`;
}

function viewHat(d) {
  const h = d.hat;
  if (!h) return '<div class="empty">This repo has no hat yet — it is forged the first time its agent is asked something.</div>';
  return `<div class="card"><h3><span class="grow">${esc(h.name || 'hat')}</span><span class="tag">${esc(h.baseAgent || '')}</span>${h.model ? `<span class="tag">${esc(h.model)}</span>` : ''}</h3>
    <div class="note">The persona is generated from the repo (its atlas and what the agent learned) and refreshed from the Agent tab; to write your own, edit the <b>persona</b> prompt block.</div>
    <div class="kv">${esc(h.persona)}${h.personaChars > 4000 ? `\n… ${h.personaChars - 4000} more characters` : ''}</div></div>
  <div class="card"><h3><span class="grow">Tools the hat carries</span><span class="tag">${h.toolScope.length}</span></h3><div class="kv">${esc(h.toolScope.join('\n') || '(none — every tool, by scope)')}</div></div>`;
}

function viewEnv(d) {
  const c = d.compartment, dk = d.desktop, r = d.repo;
  const st = dk && dk.ok !== false ? dk.state : null;
  return `<div class="card"><h3><span class="grow">COS compartment</span>${c ? `<span class="tag ${c.state === 'running' ? 'ok' : ''}">${esc(c.state)}</span>` : ''}</h3>
    ${c ? `<div class="kv">${esc(`name    ${c.name}\nid      ${c.id}\nroot    ${c.root || '—'}\nparent  ${c.parentId || '—'}${c.purpose ? `\npurpose ${c.purpose}` : ''}`)}</div>` : '<div class="note" style="padding-bottom:12px">No compartment attached to this repo.</div>'}</div>
  <div class="card"><h3><span class="grow">Branching</span></h3>
    <div class="kv">${esc(r.branchOf ? `This repo is branch ${r.branch || '?'} of ${r.branchOf}.\nFiles: a git worktree of the original (one history). VM disk: an overlay of the original's.` : `Original repo.${(d.branches || []).length ? `\nBranches: ${d.branches.map(b => `${b.name} (${b.branch || '?'})`).join(', ')}` : '\nNo branches yet — the Code button makes the code repo a branch of this one (Global → repos.code_repo_mode).'}`)}</div>
    ${r.branchOf ? `<div class="row"><div></div><div class="ctl"><button class="btn" data-open="${esc(r.branchOf)}">open the original</button></div><div></div></div>` : ''}</div>
  <div class="card"><h3><span class="grow">Desktop VM</span>${st ? `<span class="tag ${st === 'running' ? 'ok' : st === 'booting' ? 'warn' : ''}">${esc(st)}</span>` : ''}</h3>
    <div class="note">The compartment's VM booted headless and opened as a desktop in a Clear Glass window. RAM / CPUs / network: Global → desktop.*. Needs QEMU and a base image (node cos/testenv/provision.js --with desktop).</div>
    ${dk && dk.ports ? `<div class="kv">${esc(`VNC ${dk.ports.vncPort} · websocket ${dk.ports.wsPort}${dk.branchedFrom ? ` · disk: branch of the ${dk.branchedFrom}` : ''}${dk.repoIn && dk.repoIn !== 'none' ? ` · files: ${dk.repoIn}` : ''}${dk.error ? `\nlast exit: ${dk.error}` : ''}`)}</div>` : ''}
    <div class="row"><div></div><div class="ctl">${c ? `<button class="btn primary" id="d-open">Open desktop</button><button class="btn" id="d-stop" ${st === 'running' || st === 'booting' ? '' : 'disabled'}>Stop VM</button>` : ''}</div><div></div></div></div>`;
}

const wire = {
  async agent(d) {
    const base = `/api/repos/${encodeURIComponent(d.repo.uuid)}/agent/settings`;
    const bind = (id, key, map = (v) => v) => { const el = $(id); if (!el) return; el.onchange = () => { el.classList.add('dirty'); queue(`agent:${key}`, key, () => post(base, { [key]: map(el.value) })); }; };
    bind('a-provider', 'provider'); bind('a-scope', 'toolScope'); bind('a-inject', 'injectMode'); bind('a-model', 'ollamaModel', v => v || null);
    try {
      const m = await api('/api/ollama/models');
      const list = (m.models || []).map(x => (typeof x === 'string' ? x : x.name)).filter(Boolean);
      const el = $('a-model'); if (!el) return;
      el.innerHTML = `<option value="">(default)</option>` + list.map(n => `<option ${n === d.agent.ollamaModel ? 'selected' : ''}>${esc(n)}</option>`).join('')
        + (d.agent.ollamaModel && !list.includes(d.agent.ollamaModel) ? `<option selected>${esc(d.agent.ollamaModel)}</option>` : '');
    } catch (_) { const el = $('a-model'); if (el && d.agent.ollamaModel) el.innerHTML += `<option selected>${esc(d.agent.ollamaModel)}</option>`; }
  },
  prompt(d) {
    const base = `/api/repos/${encodeURIComponent(d.repo.uuid)}/agent/blocks`;
    const state = new Map(d.blocks.list.map(b => [b.id, { id: b.id, enabled: b.enabled, text: b.text }]));
    const stage = () => queue('blocks', 'prompt blocks', () => post(base, { blocks: [...state.values()] }));
    for (const el of document.querySelectorAll('[data-on]')) el.onchange = () => { state.get(el.dataset.on).enabled = el.checked; el.closest('.block').classList.toggle('off', !el.checked); stage(); };
    for (const el of document.querySelectorAll('[data-text]')) el.oninput = () => { state.get(el.dataset.text).text = el.value; el.classList.add('dirty'); stage(); };
    for (const b of document.querySelectorAll('[data-breset]')) b.onclick = async () => { try { await post(base, { reset: [b.dataset.breset] }); toast('restored the default text', 'ok'); load(d.repo.uuid); } catch (e) { toast(e.message, 'bad'); } };
    $('p-reset').onclick = async () => { if (!confirm('Reset every block to its default text and on/off?')) return; try { await post(base, { reset: true }); toast('all blocks reset', 'ok'); load(d.repo.uuid); } catch (e) { toast(e.message, 'bad'); } };
    $('p-preview').onclick = async () => {
      $('p-out').textContent = 'Composing…';
      try { const r = await post(`${base}/preview`, { message: $('p-msg').value });
        $('p-out').textContent = `${r.text}\n\n— ${r.chars} characters · sent by ${r.provider} (${r.backend || 'copilot'})${r.toolsFilled ? '' : ' · {tools} shown unfilled (copilot not reachable)'}`; }
      catch (e) { $('p-out').textContent = `Preview failed: ${e.message}`; }
    };
  },
  hat() {},
  system(d) {
    const sys = _sysOf(d.repo); if (!sys) return;
    const rt = $('o-retry'); if (rt) rt.onclick = () => _loadSystemOptions(sys, true);
    for (const el of document.querySelectorAll('[data-oid]')) el.onchange = () => _setSystemOption(sys, el.dataset.oid, el.value);
    for (const b of document.querySelectorAll('[data-oreset]')) b.onclick = () => _setSystemOption(sys, b.dataset.oreset, null, true);
  },
  env(d) {
    const o = $('d-open'); if (o) o.onclick = () => { const w = window.open(`/desktop.html?repo=${encodeURIComponent(d.repo.uuid)}`, `desktop-${d.repo.uuid}`, 'width=1320,height=860'); if (!w) toast('the desktop window was blocked', 'bad'); };
    const s = $('d-stop'); if (s) s.onclick = async () => { try { await api(`/api/repos/${encodeURIComponent(d.repo.uuid)}/desktop`, { method: 'DELETE', body: '{}' }); toast('VM stopping — its disk is kept', 'ok'); load(d.repo.uuid); } catch (e) { toast(e.message, 'bad'); } };
  },
};

(function start() {
  if (window.IdeariumTheme) IdeariumTheme.load('').then(() => { if (CUR.kind === 'appearance') renderAppearance(); });
  const repo = new URLSearchParams(location.search).get('repo');
  if (new URLSearchParams(location.search).get('view') === 'appearance') CUR = { kind: 'appearance', uuid: null, tab: 'agent' };
  if (new URLSearchParams(location.search).get('view') === 'access') CUR = { kind: 'access', uuid: null, tab: 'agent' };   // §0.58.0 IA3
  const _tab = new URLSearchParams(location.search).get('tab');   // §0.39.310 VP7 — open on one view
  if (repo) CUR = { kind: 'repo', uuid: repo, tab: (TABS.some(t => t[0] === _tab) || _tab === 'system') ? _tab : 'agent' };
  load(repo);
})();
</script>
</body>
