<!doctype html>
<!--
  idearium/ui/desktop.html — a repo's VM as a desktop, in Clear Glass (or any browser). §0.39.279.
  James: "once its generated, you can open it like a desktop environment". The repo's compartment VM runs headless
  (cos/workspace startDesktop); QEMU serves its screen as VNC over a websocket on 127.0.0.1:<5700+N>; noVNC (loaded
  from jsDelivr) draws it here with keyboard and mouse. ?port=<wsPort>&title=<name>&repo=<uuid>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo desktop</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --line:#232838; --text:#e5e7ef; --dim:#8b91a5; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
  :root { color-scheme: dark; }
  body { padding-top:var(--chrome-h, 0px); }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  .pill { font:11px ui-monospace, monospace; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.warn { color:var(--warn); border-color:var(--warn); } .pill.bad { color:var(--bad); border-color:var(--bad); }
  .spacer { flex:1; }
  button { background:#1b2030; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #screen { position:absolute; top:calc(var(--chrome-h, 0px) + 44px); left:0; right:0; bottom:0; }
  #msg { position:absolute; inset:calc(var(--chrome-h, 0px) + 44px) 0 0 0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--dim); padding:24px; white-space:pre-line; pointer-events:none; }
</style>
</head>
<body>
<script src="js/window-chrome.js" data-kind="desktop" data-title="Repo desktop"></script>
<header>
  <h1 id="title">Repo desktop</h1>
  <span id="state" class="pill">connecting</span>
  <span id="info" class="pill"></span>
  <span id="login" class="pill" title="The VM's desktop account (Settings → Desktop: user / password). Click to copy the password." style="display:none;cursor:pointer"></span>
  <span class="spacer"></span>
  <button id="start" title="Boot this repo's VM (its disk is a branch of the original's when it has one)">Start VM</button>
  <button id="cad" title="Send Ctrl+Alt+Del">Ctrl+Alt+Del</button>
  <button id="scale" title="Fit the desktop to the window">Fit: on</button>
  <button id="reconnect">Reconnect</button>
  <button id="stop" title="Power the VM off; its disk (the branch's changes) is kept">Stop VM</button>
</header>
<div id="screen"></div>
<div id="msg">Connecting…</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const repo = q.get('repo');
  let port = Number(q.get('port')) || 0;
  const title = q.get('title') || 'Repo desktop';
  document.title = `${title} — desktop`;
  document.getElementById('title').textContent = title;
  const $state = document.getElementById('state'), $info = document.getElementById('info'), $msg = document.getElementById('msg');
  const setState = (t, cls) => { $state.textContent = t; $state.className = 'pill ' + (cls || ''); };
  const say = (t) => { $msg.textContent = t || ''; $msg.style.display = t ? 'flex' : 'none'; };

  async function api(method) {
    if (!repo) return null;
    const r = await fetch(`/api/repos/${encodeURIComponent(repo)}/desktop`, { method, headers: { 'Content-Type': 'application/json' }, body: method === 'POST' ? '{}' : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || `HTTP ${r.status}`);
    return j.data || j;
  }
  function describe(s) {
    if (!s) return;
    if (s.ports && s.ports.wsPort) port = s.ports.wsPort;
    // §0.39.282 N20 — James: "either ask, or give me the login". The account the VM was given, and whether it took.
    const $login = document.getElementById('login');
    if (s.login && s.login.user) {
      $login.style.display = '';
      $login.textContent = `login: ${s.login.user} / ${s.login.password}${s.login.applied === 'pending' ? ' (setting…)' : String(s.login.applied || '').startsWith('failed') ? ' (not applied)' : ''}`;
      $login.title = `The VM's desktop account (Settings → Desktop: user / password). ${s.login.applied === 'set' ? 'Applied through the guest agent.' : s.login.applied || ''} Click to copy the password.`;
      $login.onclick = () => { try { navigator.clipboard.writeText(s.login.password); } catch (_) {} };
    } else if (s.login && s.login.applied) { $login.style.display = ''; $login.textContent = `login: ${s.login.applied}`; }
    $info.textContent = [s.branchedFrom ? `disk: branch of ${s.branchedFrom}` : null, s.repoIn && s.repoIn.startsWith('/') ? `files: ${s.repoIn}` : s.repoIn === 'pending' ? 'copying files…' : null, s.accel ? `accel ${s.accel}${s.accelFallback ? ` (${s.accelFallback.from} failed)` : ''}` : null, s.repoIn === 'failed' ? `files: failed — ${s.repoError || ''}` : null].filter(Boolean).join(' · ');
  }

  let RFB = null, rfb = null, fit = true;
  async function connect() {
    if (!port) { setState('no VM', 'warn'); say('This repo\'s VM is not running.\nStart VM boots it (needs QEMU and a base image: node cos/testenv/provision.js --with desktop).'); return; }
    try { RFB = RFB || (await import('https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js')).default; }
    catch (e) { setState('viewer failed', 'bad'); say(`The desktop viewer (noVNC) could not load: ${e.message}`); return; }
    if (rfb) { try { rfb.disconnect(); } catch (_) {} }
    document.getElementById('screen').replaceChildren();
    setState('connecting'); say(`Connecting to ws://127.0.0.1:${port} …`);
    rfb = new RFB(document.getElementById('screen'), `ws://127.0.0.1:${port}`);
    rfb.scaleViewport = fit; rfb.resizeSession = true; rfb.focusOnClick = true;
    rfb.addEventListener('connect', () => { setState('connected', 'ok'); say(''); });
    rfb.addEventListener('connect', () => { tries = 0; });
    rfb.addEventListener('disconnect', (e) => { if (e.detail.clean) { setState('disconnected'); say('Disconnected.'); return; } whyUnreachable(); });
  }

  // §0.39.280 — "unreachable" said nothing about WHY (James's screenshot: port 5724, accel whpx). Ask the VM's status:
  // QEMU exited → its own last stderr lines; still booting → try again (the screen is up once QEMU is, the desktop a
  // little later); a hardware accelerator that failed and was retried in software → said.
  let tries = 0;
  async function whyUnreachable() {
    let s = null; try { s = await api('GET'); describe(s); } catch (_) {}
    if (s && s.state === 'stopped') { setState('VM exited', 'bad'); say(`The VM exited (code ${s.exitCode}).${s.error ? `\nQEMU said: ${s.error}` : ''}${s.accelFallback ? `\n(${s.accelFallback.from} failed first: ${s.accelFallback.reason})` : ''}\nStart VM to try again.`); return; }
    if (s && (s.state === 'booting' || s.state === 'running') && tries < 20) {
      tries++; setState('waiting for screen', 'warn');
      say(`The VM is ${s.state}; its screen is not up yet on port ${port} (try ${tries}/20).${s.accelFallback ? `\n${s.accelFallback.from} failed — running in software (tcg), slower.` : ''}`);
      setTimeout(connect, 3000); return;
    }
    setState('unreachable', 'bad');
    say(`Could not reach the VM's screen on port ${port}.\n${s && s.state === 'none' ? 'The VM is not running — Start VM.' : 'Is it running? Start VM, then Reconnect.'}`);
  }

  document.getElementById('start').onclick = async () => {
    setState('booting', 'warn'); say('Booting the VM…');
    try { const s = await api('POST'); describe(s); setTimeout(connect, 2500); poll(); }
    catch (e) { setState('failed', 'bad'); say(e.message); }
  };
  document.getElementById('stop').onclick = async () => { try { await api('DELETE'); if (rfb) rfb.disconnect(); setState('stopped'); say('VM powered off. Its disk is kept.'); } catch (e) { say(e.message); } };
  document.getElementById('reconnect').onclick = () => { tries = 0; connect(); };
  document.getElementById('cad').onclick = () => rfb && rfb.sendCtrlAltDel();
  document.getElementById('scale').onclick = (e) => { fit = !fit; e.target.textContent = `Fit: ${fit ? 'on' : 'off'}`; if (rfb) rfb.scaleViewport = fit; };

  let polling = null;
  function poll() {
    if (polling || !repo) return;
    polling = setInterval(async () => {   // status only (files copied yet?) — the screen itself is the live websocket
      try { const s = await api('GET'); describe(s); if (s.state === 'running' || s.state === 'stopped' || s.state === 'none') { clearInterval(polling); polling = null; } } catch (_) {}
    }, 4000);
  }
  (async () => { try { const s = await api('GET'); describe(s); if (s && (s.state === 'booting' || s.state === 'running')) poll(); } catch (_) {} connect(); })();
</script>
</body>
</html>
