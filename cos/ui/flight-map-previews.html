<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Live Map</title>
<style>

  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  .bar { position:absolute; top:0; left:0; right:0; height:54px; display:flex; align-items:center; gap:8px; padding:0 18px; background:linear-gradient(#090c15,#04060bdd); border-bottom:1px solid var(--line); z-index:8; }
  .bar b { font:600 11px ui-monospace,Consolas,monospace; letter-spacing:.18em; color:var(--dim); margin-right:12px; }
  .chip { display:flex; align-items:center; gap:7px; background:#0c111c; border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 9px; cursor:pointer; user-select:none; color:var(--dim); font-size:13px; }

  .sp { flex:1; } .mono { font:12px ui-monospace,Consolas,monospace; color:var(--dim); }
  .stage { position:absolute; top:54px; left:0; right:0; bottom:86px; perspective:1600px; overflow:hidden; cursor:grab; }
  .stage.drag { cursor:grabbing; }
  .stage.with-panel { right:372px; }
  .plane { position:absolute; inset:0; transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity .3s; transform-style:preserve-3d; }
  .plane svg { width:100%; height:100%; display:block; overflow:visible; }
  .stacked .plane { transform-origin:50% 60%; }
  .stacked #p-pipe  { transform:translateY(200px) rotateX(62deg) scale(.62); }
  .stacked #p-wire  { transform:translateY(0px) rotateX(62deg) scale(.62); }
  .stacked #p-agent { transform:translateY(-200px) rotateX(62deg) scale(.62); }
  .plane.off { opacity:0; pointer-events:none; }
  .tag3d { position:absolute; left:18px; font:600 11px ui-monospace,Consolas,monospace; letter-spacing:.16em; color:var(--dim); display:none; }
  .stacked ~ .tags .tag3d { display:block; }
  .panel { position:absolute; right:14px; top:68px; bottom:100px; width:350px; background:#080b14f2; border:1px solid var(--line); border-radius:14px; padding:16px; backdrop-filter:blur(8px); overflow:auto; transform:translateX(380px); transition:transform .25s; z-index:7; }
  .panel.on { transform:none; }
  .panel h2 { margin:0; font-size:18px; } .k { font:600 10px ui-monospace,Consolas,monospace; letter-spacing:.16em; color:var(--dim); margin:14px 0 6px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .stat { background:#0d1220; border:1px solid var(--line); border-radius:10px; padding:8px; } .stat b { display:block; font-size:18px; } .stat span { font-size:11px; color:var(--dim); }
  .tools { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
  .tools button { background:#101627; color:var(--ink); border:1px solid #232c44; border-radius:8px; padding:7px 4px; font:inherit; font-size:12px; cursor:pointer; } .tools button:hover { border-color:var(--b); }
  .ev { font:12px ui-monospace,Consolas,monospace; padding:5px 0; border-top:1px solid #111829; color:#c8cee0; } .ev em { font-style:normal; color:var(--dim); margin-right:8px; }
  .spark { width:100%; height:44px; display:block; }
  .x { position:absolute; right:12px; top:10px; background:none; border:0; color:var(--dim); font-size:18px; cursor:pointer; }
  .tl { position:absolute; left:0; right:0; bottom:0; height:86px; background:#070a12; border-top:1px solid var(--line); padding:10px 18px; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; z-index:8; }
  .tl .ctl { display:flex; gap:6px; } .tl .ctl button { width:34px; height:34px; border-radius:50%; border:1px solid #232c44; background:#0d1220; color:var(--ink); cursor:pointer; font-size:13px; }
  .track { position:relative; height:52px; } .track svg { width:100%; height:100%; display:block; }
  .now { font:600 13px ui-monospace,Consolas,monospace; min-width:150px; text-align:right; }
  .trace { position:absolute; left:18px; top:68px; max-width:560px; background:#0a0e19f0; border:1px solid #3a2a3a; border-radius:12px; padding:10px 14px; font-size:13px; display:none; z-index:7; }
  .trace.on { display:block; } .trace b { color:var(--r); }
  .hint { position:absolute; left:18px; bottom:96px; color:var(--dim); font-size:12px; z-index:7; }
  @media (prefers-reduced-motion: reduce) { .mv { display:none; } }
</style>
</head>
<body>

</div>
<div class="tags"><span class="tag3d" style="top:74%">PIPELINES</span><span class="tag3d" style="top:48%">WIRING HARNESS</span><span class="tag3d" style="top:22%">AGENTS</span></div>

<aside class="panel" id="panel"><button class="x" onclick="closeP()">✕</button><div id="pbody"></div></aside>

</div>

function stateAt(T){ // tension per system and broken wires at time T, replayed from the events
  const ten={},broken=new Set(),reg={};for(const k in SY)ten[k]=SY[k].base;

// timeline
const trk=document.getElementById('trk');for(let h=6;h<=11;h++){const x=(new Date(`2026-11-18T${String(h).padStart(2,'0')}:00:00`).getTime()-T0)/(T1-T0)*1000;S('line',{x1:x,y1:6,x2:x,y2:46,stroke:'#151c2c'},trk);const l=S('text',{x:x+3,y:50,fill:'#4b5572','font-size':9},trk);l.textContent=h+':00';}
for(const k in SY){const pts=[];for(let i=0;i<=80;i++){const tt=T0+(T1-T0)*i/80;pts.push(`${i/80*1000},${40-stateAt(tt).ten[k]*30}`);}S('polyline',{points:pts.join(' '),fill:'none',stroke:'#1f2a44','stroke-width':1},trk);}
EVENTS.forEach((e,i)=>{const x=(e.at-T0)/(T1-T0)*1000;const c=S('circle',{cx:x,cy:12,r:5,fill:KC[e.k],style:'cursor:pointer'},trk);const ti=S('title',{},c);ti.textContent=new Date(e.at).toLocaleTimeString()+' · '+e.sys+' · '+e.txt;c.addEventListener('click',ev=>{ev.stopPropagation();T=e.at;draw();traceOf(i);});});
const marker=S('rect',{x:999,y:2,width:2,height:48,fill:'#e8ecf6'},trk);
trk.addEventListener('click',e=>{const r=trk.getBoundingClientRect();T=T0+(e.clientX-r.left)/r.width*(T1-T0);draw();});
function traceOf(i){const chain=[];let j=i;const seen=new Set();while(j!=null&&!seen.has(j)){seen.add(j);chain.unshift(EVENTS[j]);j=EVENTS[j].cause;}
  const after=EVENTS.filter(x=>x.cause===i);const tr=document.getElementById('trace');
  tr.innerHTML='<b>TRACE</b> · '+chain.map(x=>`${new Date(x.at).toLocaleTimeString().slice(0,5)} ${x.sys}: ${x.txt}`).join('<br>→ ')+(after.length?'<br><span style="color:#ffbe55">then caused:</span> '+after.map(x=>x.sys+': '+x.txt).join('; '):'');tr.classList.add('on');}
let timer=null;document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'⏸':'▶';clearInterval(timer);if(playing){if(T>=T1-1e3)T=T0;timer=setInterval(()=>{T=Math.min(T1,T+(T1-T0)/240);draw();if(T>=T1){playing=false;document.getElementById('play').textContent='▶';clearInterval(timer);}},60);}};
document.getElementById('back').onclick=()=>{T=T0;draw();};document.getElementById('live').onclick=()=>{T=T1;draw();document.getElementById('trace').classList.remove('on');};
// panel
const P=document.getElementById('panel'),PB=document.getElementById('pbody');let cur=null;
function spark(k){const pts=[];for(let i=0;i<=40;i++){const tt=T0+(T1-T0)*i/40;pts.push(`${i/40*300},${40-stateAt(tt).ten[k]*36}`);}const x=(T-T0)/(T1-T0)*300;return `<svg class="spark" viewBox="0 0 300 44" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="${heat(st.ten[k])}" stroke-width="1.6"/><line x1="${x}" y1="0" x2="${x}" y2="44" stroke="#e8ecf6" stroke-width=".8"/></svg>`;}
function openSys(k,keep){cur=k;const s=SY[k];const wires=WIRES.filter(w=>w.includes(k));const evs=EVENTS.filter(e=>e.sys===k&&e.at<=T).slice(-5).reverse();
  PB.innerHTML=`<div class="k">SYSTEM · ${s.c}</div><h2>${k}</h2><div style="color:${heat(st.ten[k])};font:12px ui-monospace,Consolas,monospace;margin-top:4px">CFR tension ${st.ten[k].toFixed(2)} · regime ${st.reg[k]} · RFR2 trend ${st.ten[k]>s.base?'rising':'steady'}</div>${spark(k)}
  <div class="tools"><button>Open</button><button>Diagnose</button><button>Restart</button><button>Logs</button><button>Pause</button><button>Snapshot</button></div>
  <div class="stats"><div class="stat"><b>${s.comp}</b><span>components</span></div><div class="stat"><b>${s.hooks}</b><span>hooks</span></div><div class="stat"><b style="color:${s.dang?'#ff5d7d':'#36f2b0'}">${s.dang}</b><span>dangling</span></div></div>
  <div class="k">COMPONENT REGISTRY</div>${s.comps.map((c,i)=>`<div class="ev"><em>${i<s.dang&&i<2?'✕ hook':'ok'}</em>${c}</div>`).join('')}
  <div class="k">WIRING HARNESS</div>${wires.map(w=>{const o=w[0]===k?w[1]:w[0],br=st.broken.has(w[0]+'|'+w[1]);return `<div class="ev"><em>${br?'✕ broken':'load '+Math.round(w[2]*100)+'%'}</em>${k} ↔ ${o}</div>`;}).join('')}
  <div class="k">EVENTS UP TO ${new Date(T).toLocaleTimeString().slice(0,5)}</div>${evs.map(e=>`<div class="ev"><em>${new Date(e.at).toLocaleTimeString().slice(0,5)}</em>${e.txt}</div>`).join('')||'<div class="ev">quiet</div>'}`;
  P.classList.add('on');stage.classList.add('with-panel');}
function openPipe(p){cur=null;PB.innerHTML=`<div class="k">PIPELINE · BOTTOM LAYER</div><h2>${p.n}</h2><div style="color:var(--dim);font-size:12px;margin-top:4px">${p.legs.join(' → ')} · ${p.s}</div>
  <div class="tools"><button>Run</button><button>Continue</button><button>Edit</button><button>Recorder</button><button>Diagnose</button><button>Export</button></div><div class="k">FILES MOVING</div>${p.files.map(f=>`<div class="ev">${f}</div>`).join('')}`;P.classList.add('on');stage.classList.add('with-panel');}
function closeP(){P.classList.remove('on');stage.classList.remove('with-panel');cur=null;}
document.querySelectorAll('.chip[data-l]').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');document.getElementById('p-'+b.dataset.l).classList.toggle('off',!b.classList.contains('on'));}));
document.getElementById('stackBtn').onclick=function(){this.classList.toggle('on');stage.classList.toggle('stacked');document.querySelector('.tags').previousElementSibling;};
draw();openSys('idearium');
</script>
</body>
</html>
