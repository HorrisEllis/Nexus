<!doctype html>
<html lang="en" data-theme="nexus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COS · Pipelines</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Idearium's tokens, named from its own theme file (idearium/ui/css/nexus-theme.css), as idearium/ui/index.html names them */
:root {
  --bg: var(--nx-ink); --bg1: var(--nx-plate); --bg2: var(--nx-panel); --panel: var(--nx-card); --edge: var(--nx-edge); --rim: var(--nx-rim); --void: var(--nx-void);
  --b0: var(--ac-ghost); --b1: var(--ac-dim); --b2: var(--ac-border-hi); --sky: var(--ac);
  --ok: var(--nx-ok); --amber: var(--nx-warn); --coral: var(--nx-err); --violet: var(--nx-violet);
  --text: var(--nx-text); --text2: var(--nx-dim); --text3: var(--nx-muted); --bright: var(--nx-bright);
  --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font: 13px var(--sans); height: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.app { display: grid; height: 100vh; grid-template-rows: 44px 2px 1fr; grid-template-columns: 56px 1fr; }

/* top: a picker, the run menu, the overflow menu, the live dot */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; background: var(--bg1); border-bottom: 1px solid var(--rim); }
.logo { width: 56px; text-align: center; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--bright); flex: none; }
.logo span { color: var(--sky); }
.dd { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid transparent; color: var(--text); font: 12.5px var(--sans); white-space: nowrap; transition: all .15s; }
.dd:hover, .dd.open { background: rgba(255,255,255,.04); border-color: var(--rim); }
.dd .chev { width: 12px; height: 12px; color: var(--text3); }
.dd b { font-weight: 500; color: var(--bright); max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
.dd.primary { border-color: var(--b2); background: var(--b0); color: var(--sky); }
.sd { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text3); }
.st-running .sd, .sd.running { background: var(--amber); animation: pulse 1.2s infinite; }
.grow { flex: 1; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--text2); }
.icon-btn:hover, .icon-btn.open { background: rgba(255,255,255,.05); color: var(--bright); }
.kbd { font: 10.5px var(--mono); color: var(--text3); border: 1px solid var(--rim); border-radius: 4px; padding: 1px 5px; }
.search-hint { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--rim); border-radius: 6px; color: var(--text3); font-size: 12px; min-width: 200px; }
.search-hint:hover { border-color: var(--b2); color: var(--text2); }
.progress { grid-column: 1 / -1; display: flex; background: var(--bg1); }
.progress i { flex: 1; height: 2px; margin-right: 1px; background: var(--edge); }

/* side tabs */
.side { grid-row: 3; background: var(--bg1); border-right: 1px solid var(--rim); display: flex; flex-direction: column; align-items: stretch; padding: 6px 0; gap: 1px; overflow-y: auto; scrollbar-width: none; }
.stab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 8px; color: var(--text3); font: 500 9.5px var(--mono); letter-spacing: .04em; }
.stab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.stab.on { color: var(--bright); background: var(--b0); }
.stab.on::before { content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 0 2px 2px 0; background: var(--sky); }
.stab.on svg { color: var(--sky); }
.stab .badge { position: absolute; top: 5px; right: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s infinite; }
.stab .new { position: absolute; top: 6px; right: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
.side hr { border: 0; height: 1px; background: var(--rim); margin: 6px 12px; }

/* stage */
.stage { grid-row: 3; min-width: 0; min-height: 0; display: flex; }
.work { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.canvas-wrap { position: relative; flex: 1 1 60%; min-height: 120px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--rim) 70%, transparent) 1px, transparent 0) 0 0 / 22px 22px, var(--void); }
svg.cv { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
svg.cv.drag { cursor: grabbing; }
.zoom { position: absolute; left: 12px; bottom: 12px; display: flex; border: 1px solid var(--rim); border-radius: 7px; background: var(--panel); overflow: hidden; }
.zoom button { width: 28px; height: 26px; color: var(--text2); font: 12px var(--mono); }
.zoom button:hover { background: var(--b0); color: var(--bright); }
.node rect.box { fill: var(--panel); stroke: var(--rim); }
.node:hover rect.box { stroke: var(--b2); }
.node.sel rect.box { stroke: var(--sky); stroke-width: 1.5; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--sky) 35%, transparent)); }
.node text { pointer-events: none; }
.node .lb { font: 500 12.5px var(--sans); fill: var(--bright); }
.node .sb { font: 10px var(--mono); fill: var(--text2); }
.node .ty { font: 9px var(--mono); letter-spacing: .08em; fill: var(--text3); }
.node.running .stripe, .node.running .dotc { animation: pulse 1.2s infinite; }
.wire { fill: none; stroke: var(--rim); stroke-width: 1.5; }
.wire.done { stroke: color-mix(in srgb, var(--ok) 55%, transparent); }
.wire.live { stroke: var(--amber); stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.gate { cursor: pointer; }
.gate rect { fill: var(--bg1); stroke: var(--text2); stroke-width: 1.2; }
.gate.ok rect { stroke: var(--ok); fill: color-mix(in srgb, var(--ok) 12%, var(--bg1)); }
.gate.bad rect { stroke: var(--coral); fill: color-mix(in srgb, var(--coral) 14%, var(--bg1)); }
.gate.sel rect { stroke: var(--sky); stroke-width: 2; }
.gate text { font: 9.5px var(--mono); fill: var(--text3); pointer-events: none; }
.splitter { height: 5px; flex: none; cursor: row-resize; background: var(--bg1); border-top: 1px solid var(--rim); }
.splitter:hover { background: var(--b1); }

/* console */
.console { flex: 0 0 40%; min-height: 90px; display: grid; grid-template-columns: 250px 1fr; background: var(--bg); min-width: 0; }
.console.full { flex: 1 1 auto; }
.calls { border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
.ph { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--edge); font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text2); flex: none; }
.list { overflow-y: auto; flex: 1; }
.grp { font: 600 9px var(--mono); letter-spacing: .12em; color: var(--text3); padding: 10px 12px 4px; text-transform: uppercase; }
.crow { display: grid; grid-template-columns: 8px 1fr auto; gap: 2px 9px; align-items: center; padding: 7px 12px; border-left: 2px solid transparent; width: 100%; text-align: left; }
.crow:hover { background: rgba(255,255,255,.02); }
.crow.sel { background: var(--b0); border-left-color: var(--sky); }
.crow .sd { grid-row: span 2; }
.crow.complete .sd { background: var(--ok); } .crow.failed .sd { background: var(--coral); }
.crow .nm { font-size: 12px; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .tm { font: 10.5px var(--mono); color: var(--text2); }
.crow .sub { grid-column: 2 / 4; font: 10.5px var(--mono); color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vh { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; height: 34px; border-bottom: 1px solid var(--edge); flex: none; font: 11px var(--mono); color: var(--text2); white-space: nowrap; overflow: hidden; }
.vh b { color: var(--bright); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.vh .sep { color: var(--text3); }
.code { flex: 1; overflow: auto; background: var(--void); font: 12px/1.6 var(--mono); padding: 8px 0 30px; counter-reset: ln; }
.code.nowrap .l { white-space: pre; }
.l { position: relative; padding: 0 16px 0 64px; white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
.l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 48px; text-align: right; color: var(--text3); user-select: none; }
.l.prose { color: var(--text2); font-family: var(--sans); }
.l.fence { color: var(--text3); }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--amber); vertical-align: -2px; animation: pulse 1s steps(1) infinite; }
.k { color: #c792ea; } .s { color: #c3e88d; } .c { color: #5c7a8a; font-style: italic; } .n { color: #f78c6c; } .f { color: #82aaff; } .p { color: #89ddff; }
.think { border-bottom: 1px solid var(--edge); padding: 8px 12px 8px 64px; font: 11.5px/1.55 var(--mono); color: var(--violet); max-height: 120px; overflow: auto; white-space: pre-wrap; flex: none; }
.empty { padding: 20px 14px; color: var(--text2); font-size: 12px; line-height: 1.6; }
.empty b { color: var(--text); font-weight: 500; display: block; }

/* the dock — Idearium's #dock-col / #dock-rail, as written there */
#dock-col { width: 0; flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; font-family: var(--mono); transition: width .2s; }
#dock-col.open { width: min(380px, 38vw); padding: 10px 8px 10px 10px; }
#dock-col .dk-panel { flex: 0 0 auto; display: flex; flex-direction: column; max-height: 62vh; background: var(--nx-card, var(--bg2)); border: 1px solid var(--nx-rim, rgba(255,255,255,.12)); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.45); overflow: hidden; }
#dock-col .dk-head { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-bottom: 1px solid var(--nx-rim, rgba(255,255,255,.08)); font-size: 11px; color: var(--text); cursor: default; }
#dock-col .dk-panel.folded .dk-head { border-bottom: 0; }
#dock-col .dk-head b { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
#dock-col .dk-grow { flex: 1; }
#dock-col .dk-n { color: var(--text3); font-size: 10px; }
#dock-col .dk-fold, #dock-col .dk-x { color: var(--text3); font: 12px var(--mono); padding: 0 3px; }
#dock-col .dk-fold:hover, #dock-col .dk-x:hover { color: var(--text); }
#dock-col .dk-body { overflow-y: auto; padding: 8px 10px; font-size: 11px; color: var(--text2); min-height: 40px; }
#dock-col .dk-panel.folded .dk-body { display: none; }
#dock-col .dk-sec { margin: 10px 0 4px; color: var(--text3); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
#dock-col .dk-sec:first-child { margin-top: 0; }
#dock-col .dk-empty { color: var(--text3); font-size: 11px; padding: 4px 0; line-height: 1.5; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--edge); }
.kv:first-child, .dk-sec + .kv { border-top: 0; }
.kv > span:first-child { color: var(--text2); white-space: nowrap; }
.kv > span:last-child { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.kv.row { cursor: pointer; border-radius: 4px; }
.kv.row:hover { background: rgba(255,255,255,.03); }
.pre { font: 11px/1.55 var(--mono); color: var(--text2); white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: 8px 9px; max-height: 260px; overflow: auto; }
.pre.bad { color: var(--coral); }
#dock-rail { flex: none; display: flex; flex-direction: column; gap: 4px; justify-content: center; padding: 8px 0; background: var(--bg); border-left: 1px solid var(--edge); }
#dock-rail .dk-tab { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 5px 9px 6px; background: var(--nx-card, var(--bg2)); border: 1px solid var(--nx-rim, rgba(255,255,255,.12)); border-right: 0; border-radius: 8px 0 0 8px; color: var(--text2); font: 600 10px var(--mono); letter-spacing: .08em; cursor: pointer; box-shadow: -6px 0 18px rgba(0,0,0,.35); transition: padding-right .15s, color .15s, background .15s; }
#dock-rail .dk-tab:hover { color: var(--text); padding-right: 9px; }
#dock-rail .dk-tab.on { color: var(--text); background: var(--nx-card-hi, rgba(59,130,246,.18)); border-color: var(--accent, var(--sky)); }
#dock-rail .dk-l { writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; }
#dock-rail .dk-n { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--text3); font-weight: 400; }
#dock-rail .dk-n.warn { color: var(--amber); }
.dk-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sky); animation: pulse 1.2s infinite; display: inline-block; }

/* menus: one component for dropdowns, context menus and the palette */
.menu { position: fixed; z-index: 1000; min-width: 220px; max-width: 380px; max-height: 70vh; overflow-y: auto; padding: 5px; background: var(--panel); border: 1px solid var(--rim); border-radius: 9px; box-shadow: 0 18px 50px rgba(0,0,0,.6); animation: pop .1s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-3px); } }
.menu .mi { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border-radius: 5px; color: var(--text); font-size: 12.5px; text-align: left; }
.menu .mi .lab { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu .mi .hint { font: 10.5px var(--mono); color: var(--text3); white-space: nowrap; }
.menu .mi svg { color: var(--text2); }
.menu .mi.act, .menu .mi:not([disabled]):hover { background: var(--b0); color: var(--bright); }
.menu .mi.act svg { color: var(--sky); }
.menu .mi[disabled] { color: var(--text3); cursor: default; }
.menu .mi[disabled] svg { color: var(--text3); }
.menu .mi.danger:not([disabled]) { color: var(--coral); }
.menu .sep { height: 1px; background: var(--rim); margin: 5px 4px; }
.menu .mh { padding: 6px 9px 3px; font: 600 9.5px var(--mono); letter-spacing: .1em; color: var(--text3); text-transform: uppercase; }
.menu input { width: 100%; height: 30px; margin-bottom: 4px; padding: 0 9px; border: 1px solid var(--rim); border-radius: 6px; background: var(--bg); color: var(--text); font: 12.5px var(--sans); outline: 0; }
.menu input:focus { border-color: var(--b2); }
.menu.palette { left: 50% !important; top: 70px !important; transform: translateX(-50%); width: 560px; max-width: 92vw; }
.menu .none { padding: 10px; color: var(--text3); font-size: 12px; }

.page { flex: 1; overflow: auto; padding: 18px 22px; }
.page h2 { font: 500 15px var(--sans); color: var(--bright); }
table.t { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
table.t th { text-align: left; font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text3); padding: 8px 10px; border-bottom: 1px solid var(--rim); position: sticky; top: 0; background: var(--bg); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--edge); vertical-align: top; }
table.t td.m { font: 11px var(--mono); color: var(--text2); }
table.t tbody tr { cursor: default; }
table.t tbody tr:hover td { background: rgba(255,255,255,.02); }
.mini { display: flex; gap: 2px; }
.mini i { width: 10px; height: 10px; border-radius: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.pill .sd { width: 6px; height: 6px; }
.term { font: 10.5px/1.5 var(--mono); background: var(--void); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 0; max-height: 320px; min-height: 120px; overflow: auto; }
.tl { display: grid; grid-template-columns: 58px 76px 1fr; gap: 6px; padding: 0 8px; }
.tl .tt { color: var(--text3); } .tl .ts { color: var(--sky); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tl .tx { color: var(--text2); white-space: pre-wrap; word-break: break-word; }
.tl.err .tx { color: var(--coral); } .tl.cmd .tx { color: var(--bright); } .tl.reply .tx { color: var(--text); }
.prompt { display: flex; align-items: center; gap: 6px; margin-top: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--rim); border-radius: 6px; background: var(--bg); font: 11px var(--mono); color: var(--sky); }
.prompt:focus-within { border-color: var(--b2); }
.prompt input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--bright); font: 11.5px var(--mono); }
.lin { display: grid; grid-template-columns: 12px 1fr; gap: 6px; padding: 5px 0; position: relative; }
.lin .ld { width: 7px; height: 7px; border-radius: 50%; background: var(--sky); margin-top: 4px; }
.lin::before { content: ''; position: absolute; left: 3px; top: 14px; bottom: -6px; width: 1px; background: var(--rim); }
.lin:last-child::before { display: none; }
.lin b { color: var(--bright); font-weight: 500; } .lin .lt { color: var(--text3); } .lin div div { color: var(--text2); margin-top: 1px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 7px; background: var(--panel); border: 1px solid var(--rim); color: var(--text); font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 1001; }
::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-thumb { background: var(--rim); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <div class="progress" id="progress"></div>
  <nav class="side" id="side"></nav>
  <section class="stage"><div class="work" id="work"></div><div id="dock-col"></div><div id="dock-rail"></div></section>
</div>
<script>
'use strict';
// ════ Everything on this screen is declared once below (ICONS, VIEWS, PANELS, ACTIONS, MENUS) and drawn by a few generic renderers.
// Menus, the context menus, the palette (Ctrl+K) and the shortcuts all read ACTIONS. Reads only: an action that would change a run says so.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dur = (ms) => ms == null ? '—' : ms < 1000 ? Math.round(ms) + ' ms' : ms < 60000 ? (ms / 1000).toFixed(1) + ' s' : ms < 3600e3 ? Math.floor(ms / 60000) + 'm ' + Math.round(ms % 60000 / 1000) + 's' : Math.floor(ms / 3600e3) + 'h ' + Math.round(ms % 3600e3 / 60000) + 'm';
const kfmt = (n) => n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
const ago = (t) => { if (!t) return '—'; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const model = (m) => String(m || '').replace(/^huihui_ai\//, '').replace(/-abliterated?/, '');
const bg = (j) => /probe|diagnose/.test(j.intent || '');
const store = { get(k, d) { try { const v = localStorage.getItem('cos.pipes.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem('cos.pipes.' + k, JSON.stringify(v)); } catch (_) {} } };
const toast = (t) => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); };
const COL = { done: 'var(--ok)', complete: 'var(--ok)', passed: 'var(--ok)', running: 'var(--amber)', failed: 'var(--coral)', cancelled: 'var(--coral)', paused: 'var(--violet)', waiting: 'var(--text2)' };
const col = (s) => COL[s] || 'var(--text3)';

const P = 'M'; const ICONS = {
  canvas: '<rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h3a2 2 0 0 1 2 2v5"/>',
  console: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>', runs: '<path d="M4 6h16M4 12h16M4 18h10"/>',

  { id: 'system', label: 'System', count: () => S.D ? S.D.systems.filter((s) => s.state !== 'up').length || '' : '', warn: true,
    render() { const D = S.D; return sec('Ollama') + (D.loaded.length ? D.loaded.map((m) => kv(model(m.name), (m.vramMB / 1024).toFixed(1) + ' GB VRAM')).join('') : '<div class="dk-empty">No model loaded.</div>')
      + sec('Systems') + D.systems.map((s) => `<div class="kv"><span>${esc(s.name)}</span><span style="color:${s.state === 'up' ? 'var(--ok)' : s.state === 'degraded' ? 'var(--amber)' : 'var(--text3)'}">${esc(s.state)}</span></div>`).join(''); } },
];
async function loadLin(p) { S.lin[p.id] = { loading: true }; const v = p.vars || {};
  try { S.lin[p.id] = await (await fetch(`/lineage?phase=${encodeURIComponent(v.phase || '')}&repo=${encodeURIComponent(v.repo || '')}`)).json(); } catch (_) { S.lin[p.id] = { idearium: false }; } if (S.open.has('lineage')) dock(); }
async function loadLogs() { if (!S.open.has('terminal')) return; try { const d = await (await fetch('/logs?limit=300')).json(); S.logs = (d && d.lines) || []; } catch (_) {} }
async function runCli(line) { S.cli.push({ system: 'you', ts: Date.now(), stream: 'cmd', line: 'cos> ' + line }); dock();
  let out = []; try { out = (await (await fetch('/cli', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ line }) })).json()).lines || []; } catch (e) { out = [e.message]; }
  S.cli.push(...(out.length ? out : ['(no output)']).map((l) => ({ system: 'cos', ts: Date.now(), stream: 'reply', line: String(l) }))); S.cli = S.cli.slice(-200); dock(); }
function dock() {
  const col2 = $('dock-col'), keep = {}; col2.querySelectorAll('.dk-panel').forEach((x) => keep[x.dataset.p] = x.querySelector('.dk-body').scrollTop);
  const open = PANELS.filter((x) => S.open.has(x.id)); col2.className = open.length ? 'open' : '';
  col2.innerHTML = open.map((x) => `<section class="dk-panel ${S.folded.has(x.id) ? 'folded' : ''}" data-p="${x.id}"><div class="dk-head"><button class="dk-fold">${S.folded.has(x.id) ? '▸' : '▾'}</button><b>${x.label}</b><span class="dk-grow"></span><span class="dk-n">${x.count ? x.count() : ''}</span><button class="dk-x" title="Close">×</button></div><div class="dk-body">${S.D ? x.render() : '<div class="dk-empty">Reading…</div>'}</div></section>`).join('');
  col2.querySelectorAll('.dk-panel').forEach((el) => { const id = el.dataset.p; el.querySelector('.dk-body').scrollTop = keep[id] || 0;
    const fold = () => { S.folded.has(id) ? S.folded.delete(id) : S.folded.add(id); save(); dock(); };
    el.querySelector('.dk-fold').onclick = fold; el.querySelector('.dk-head').ondblclick = fold; el.querySelector('.dk-x').onclick = () => { S.open.delete(id); save(); dock(); rail(); };
    el.querySelector('.dk-head').oncontextmenu = (e) => { e.preventDefault(); menu([{ label: S.folded.has(id) ? 'Expand' : 'Collapse', icon: 'panel', run: fold }, { label: 'Close', icon: 'stop', run: () => { S.open.delete(id); save(); dock(); rail(); } }, '-', ...fromActions(['dock.all', 'dock.none'])], { x: e.clientX, y: e.clientY }); }; });
  col2.querySelectorAll('[data-call]').forEach((x) => x.onclick = () => { S.job = x.dataset.call; S.pinned = true; if (S.view !== 'canvas' && S.view !== 'console') S.view = 'console'; draw(); });
  col2.querySelectorAll('[data-goto]').forEach((x) => x.onclick = () => choose(x.dataset.goto));
  const tm = $('term'); if (tm) tm.scrollTop = tm.scrollHeight;
  const f = $('cliForm'), inp = $('cliLine');
  if (f) { inp.oninput = () => { S.draft = inp.value; };
    inp.onkeydown = (e) => { if (e.key === 'ArrowUp' && S.hi > 0) { S.hi--; inp.value = S.draft = S.hist[S.hi] || ''; e.preventDefault(); } else if (e.key === 'ArrowDown' && S.hi < S.hist.length) { S.hi++; inp.value = S.draft = S.hist[S.hi] || ''; e.preventDefault(); } };
    f.onsubmit = (e) => { e.preventDefault(); const l = inp.value.trim(); if (!l) return; S.hist.push(l); S.hi = S.hist.length; S.draft = ''; runCli(l); }; }
}
function rail() {
  $('dock-rail').innerHTML = PANELS.map((x) => { const n = x.count ? x.count() : ''; return `<button class="dk-tab ${S.open.has(x.id) ? 'on' : ''}" data-r="${x.id}">${x.live && x.live() ? '<span class="dk-dot"></span>' : ''}<span class="dk-l">${x.label}</span>${n !== '' ? `<span class="dk-n ${x.warn ? 'warn' : ''}">${n}</span>` : ''}</button>`; }).join('');
  $('dock-rail').querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => { const k = b.dataset.r; S.open.has(k) ? S.open.delete(k) : (S.open.add(k), S.folded.delete(k)); save(); dock(); rail(); };
    b.oncontextmenu = (e) => { e.preventDefault(); menu(fromActions(['dock.all', 'dock.none']), { x: e.clientX, y: e.clientY }); }; });
}

function draw() { topbar(); side(); work(); dock(); rail(); }
async function tick() { try { S.D = await (await fetch('/data', { cache: 'no-store' })).json(); S.ok = Date.now(); } catch (_) {}
  if (S.D && !pipe() && S.D.pipelines[0]) { S.pid = S.D.pipelines[0].id; loadBase(S.pid); }
  await loadLogs();
  if (!MENU) topbar(); side(); work();
  const typing = document.activeElement && document.activeElement.id === 'cliLine';
  if (typing) { const p = PANELS.find((x) => x.id === 'terminal'), tm = $('term'), tmp = document.createElement('div'); tmp.innerHTML = p.render(); tm.innerHTML = tmp.querySelector('#term').innerHTML; tm.scrollTop = tm.scrollHeight; rail(); }
  else if (!(MENU && document.activeElement && document.activeElement.closest && document.activeElement.closest('.menu'))) { dock(); rail(); } }
// keys: Ctrl K the palette; the rest from ACTIONS' kbd; menus by arrows, Enter, Escape
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return MENU ? closeMenu() : palette(); }
  if (MENU) { if (e.key === 'Escape') closeMenu(); else if (e.key === 'ArrowDown') { e.preventDefault(); MENU.move(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); MENU.move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); const x = MENU.pick[MENU.act()]; closeMenu(); if (x && x.run) x.run(); } return; }
  if (/input|textarea/i.test((e.target.tagName || ''))) return;
  const k = e.key === '=' ? '+' : e.key === '-' ? '−' : e.key.toUpperCase(); const hit = Object.values(ACTIONS).find((a) => a.kbd === k && a.run && !(a.off && a.off())); if (hit) { e.preventDefault(); hit.run(); }
  if (e.key === 'Escape' && S.sel) select(null);
});
addEventListener('mousedown', (e) => { if (MENU && !e.target.closest('.menu') && !(MENU.anchor && MENU.anchor.contains(e.target))) closeMenu(); });
addEventListener('resize', () => { S.vp = null; S.sig = ''; work(); });
draw(); tick().then(() => S.pid && loadBase(S.pid)); setInterval(tick, 2000);
</script>
</body>
