<!doctype html>
<html lang="en" data-theme="nexus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation · COS</title>
<link rel="stylesheet" href="../core/theme.css">
<style>
/* Idearium's tokens, named from its own theme file (idearium/ui/css/nexus-theme.css), as idearium/ui/index.html names them */
:root {
  --bg: var(--nx-ink); --bg1: var(--nx-plate); --bg2: var(--nx-panel); --panel: var(--nx-card); --edge: var(--nx-edge); --rim: var(--nx-rim); --void: var(--nx-void);
  --b0: var(--ac-ghost); --b1: var(--ac-dim); --b2: var(--ac-border-hi); --sky: var(--ac);
  --ok: var(--nx-ok); --amber: var(--nx-warn); --coral: var(--nx-err); --violet: var(--nx-violet);
  --text: var(--nx-text); --text2: var(--nx-dim); --text3: var(--nx-muted); --bright: var(--nx-bright);
  --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font: 13px var(--sans); height: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.app { display: grid; height: 100vh; grid-template-rows: 44px 2px 1fr; grid-template-columns: 64px 1fr; }

/* top: a picker, the run menu, the overflow menu, the live dot */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; background: var(--bg1); border-bottom: 1px solid var(--rim); }
.logo { width: 64px; text-align: center; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--bright); flex: none; }
.logo span { color: var(--sky); }
.dd { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid transparent; color: var(--text); font: 12.5px var(--sans); white-space: nowrap; transition: all .15s; }
.dd:hover, .dd.open { background: rgba(255,255,255,.04); border-color: var(--rim); }
.dd .chev { width: 12px; height: 12px; color: var(--text3); }
.dd b { font-weight: 500; color: var(--bright); max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
.dd.primary { border-color: var(--b2); background: var(--b0); color: var(--sky); }
.sd { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text3); }
.st-running .sd, .sd.running { background: var(--amber); animation: pulse 1.2s infinite; }
.grow { flex: 1; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--text2); }
.icon-btn:hover, .icon-btn.open { background: rgba(255,255,255,.05); color: var(--bright); }
.kbd { font: 10.5px var(--mono); color: var(--text3); border: 1px solid var(--rim); border-radius: 4px; padding: 1px 5px; }
.search-hint { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--rim); border-radius: 6px; color: var(--text3); font-size: 12px; min-width: 200px; }
.search-hint:hover { border-color: var(--b2); color: var(--text2); }
.progress { grid-column: 1 / -1; display: flex; background: var(--bg1); }
.progress i { flex: 1; height: 2px; margin-right: 1px; background: var(--edge); }

/* side tabs */
.side { grid-row: 3; background: var(--bg1); border-right: 1px solid var(--rim); display: flex; flex-direction: column; align-items: stretch; padding: 6px 0; gap: 1px; overflow-y: auto; scrollbar-width: none; }
.stab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 8px; color: var(--text3); font: 500 9.5px var(--mono); letter-spacing: .04em; }
.stab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.stab.on { color: var(--bright); background: var(--b0); }
.stab.on::before { content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 0 2px 2px 0; background: var(--sky); }
.stab.on svg { color: var(--sky); }
.stab .badge { position: absolute; top: 5px; right: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s infinite; }
.stab .new { position: absolute; top: 6px; right: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
.side hr { border: 0; height: 1px; background: var(--rim); margin: 6px 12px; }

/* stage */
.stage { grid-row: 3; min-width: 0; min-height: 0; display: flex; }
.work { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.canvas-wrap { position: relative; flex: 1 1 60%; min-height: 120px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--rim) 70%, transparent) 1px, transparent 0) 0 0 / 22px 22px, var(--void); }
svg.cv { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
svg.cv.drag { cursor: grabbing; }
.zoom { position: absolute; left: 12px; bottom: 12px; display: flex; border: 1px solid var(--rim); border-radius: 7px; background: var(--panel); overflow: hidden; }
.zoom button { width: 28px; height: 26px; color: var(--text2); font: 12px var(--mono); }
.zoom button:hover { background: var(--b0); color: var(--bright); }
.node rect.box { fill: var(--panel); stroke: var(--rim); }
.node:hover rect.box { stroke: var(--b2); }
.node.sel rect.box { stroke: var(--sky); stroke-width: 1.5; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--sky) 35%, transparent)); }
.node text { pointer-events: none; }
.node .lb { font: 500 12.5px var(--sans); fill: var(--bright); }
.node .sb { font: 10px var(--mono); fill: var(--text2); }
.node .ty { font: 9px var(--mono); letter-spacing: .08em; fill: var(--text3); }
.node .ds { font: 10.5px var(--sans); fill: var(--text2); }
.node.running .stripe, .node.running .dotc { animation: pulse 1.2s infinite; }
.wire { fill: none; stroke: var(--rim); stroke-width: 1.5; }
.wire.done { stroke: color-mix(in srgb, var(--ok) 55%, transparent); }
.wire.live { stroke: var(--amber); stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.gate { cursor: pointer; }
.gate rect { fill: var(--bg1); stroke: var(--text2); stroke-width: 1.2; }
.gate.ok rect { stroke: var(--ok); fill: color-mix(in srgb, var(--ok) 12%, var(--bg1)); }
.gate.bad rect { stroke: var(--coral); fill: color-mix(in srgb, var(--coral) 14%, var(--bg1)); }
.gate.sel rect { stroke: var(--sky); stroke-width: 2; }
.gate text { font: 9.5px var(--mono); fill: var(--text3); pointer-events: none; }
.splitter { height: 5px; flex: none; cursor: row-resize; background: var(--bg1); border-top: 1px solid var(--rim); }
.splitter:hover { background: var(--b1); }

/* console */
.console { flex: 0 0 40%; min-height: 90px; display: grid; grid-template-columns: 250px 1fr; background: var(--bg); min-width: 0; }
.console.full { flex: 1 1 auto; }
.calls { border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
.ph { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--edge); font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text2); flex: none; }
.list { overflow-y: auto; flex: 1; }
.grp { font: 600 9px var(--mono); letter-spacing: .12em; color: var(--text3); padding: 10px 12px 4px; text-transform: uppercase; }
.crow { display: grid; grid-template-columns: 8px 1fr auto; gap: 2px 9px; align-items: center; padding: 7px 12px; border-left: 2px solid transparent; width: 100%; text-align: left; }
.crow:hover { background: rgba(255,255,255,.02); }
.crow.sel { background: var(--b0); border-left-color: var(--sky); }
.crow .sd { grid-row: span 2; }
.crow.complete .sd { background: var(--ok); } .crow.failed .sd { background: var(--coral); }
.crow .nm { font-size: 12px; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .tm { font: 10.5px var(--mono); color: var(--text2); }
.crow .sub { grid-column: 2 / 4; font: 10.5px var(--mono); color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vh { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; height: 34px; border-bottom: 1px solid var(--edge); flex: none; font: 11px var(--mono); color: var(--text2); white-space: nowrap; overflow: hidden; }
.vh b { color: var(--bright); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.vh .sep { color: var(--text3); }
.code { flex: 1; overflow: auto; background: var(--void); font: 12px/1.6 var(--mono); padding: 8px 0 30px; counter-reset: ln; }
.code.nowrap .l { white-space: pre; }
.l { position: relative; padding: 0 16px 0 64px; white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
.l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 48px; text-align: right; color: var(--text3); user-select: none; }
.l.prose { color: var(--text2); font-family: var(--sans); }
.l.fence { color: var(--text3); }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--amber); vertical-align: -2px; animation: pulse 1s steps(1) infinite; }
.k { color: #c792ea; } .s { color: #c3e88d; } .c { color: #5c7a8a; font-style: italic; } .n { color: #f78c6c; } .f { color: #82aaff; } .p { color: #89ddff; }
.think { border-bottom: 1px solid var(--edge); padding: 8px 12px 8px 64px; font: 11.5px/1.55 var(--mono); color: var(--violet); max-height: 120px; overflow: auto; white-space: pre-wrap; flex: none; }
.empty { padding: 20px 14px; color: var(--text2); font-size: 12px; line-height: 1.6; }
.empty b { color: var(--text); font-weight: 500; display: block; }

/* the dock — Idearium's #dock-col / #dock-rail, as written there */
#dock-col { width: 0; flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; font-family: var(--mono); transition: width .2s; }
#dock-col.open { width: min(380px, 38vw); padding: 10px 8px 10px 10px; }
#dock-col .dk-panel { flex: 0 0 auto; display: flex; flex-direction: column; max-height: 62vh; background: var(--nx-card, var(--bg2)); border: 1px solid var(--nx-rim, rgba(255,255,255,.12)); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.45); overflow: hidden; }
#dock-col .dk-head { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-bottom: 1px solid var(--nx-rim, rgba(255,255,255,.08)); font-size: 11px; color: var(--text); cursor: default; }
#dock-col .dk-panel.folded .dk-head { border-bottom: 0; }
#dock-col .dk-head b { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
#dock-col .dk-grow { flex: 1; }
#dock-col .dk-n { color: var(--text3); font-size: 10px; }
#dock-col .dk-fold, #dock-col .dk-x { color: var(--text3); font: 12px var(--mono); padding: 0 3px; }
#dock-col .dk-fold:hover, #dock-col .dk-x:hover { color: var(--text); }
#dock-col .dk-body { overflow-y: auto; padding: 8px 10px; font-size: 11px; color: var(--text2); min-height: 40px; }
#dock-col .dk-panel.folded .dk-body { display: none; }
#dock-col .dk-sec { margin: 10px 0 4px; color: var(--text3); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
#dock-col .dk-sec:first-child { margin-top: 0; }
#dock-col .dk-empty { color: var(--text3); font-size: 11px; padding: 4px 0; line-height: 1.5; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--edge); }
.kv:first-child, .dk-sec + .kv { border-top: 0; }
.kv > span:first-child { color: var(--text2); white-space: nowrap; }
.kv > span:last-child { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.kv.row { cursor: pointer; border-radius: 4px; }
.kv.row:hover { background: rgba(255,255,255,.03); }
.pre { font: 11px/1.55 var(--mono); color: var(--text2); white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: 8px 9px; max-height: 260px; overflow: auto; }
.pre.bad { color: var(--coral); }
#dock-rail { flex: none; display: flex; flex-direction: column; gap: 4px; justify-content: center; padding: 8px 0; background: var(--bg); border-left: 1px solid var(--edge); }
#dock-rail .dk-tab { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 5px 9px 6px; background: var(--nx-card, var(--bg2)); border: 1px solid var(--nx-rim, rgba(255,255,255,.12)); border-right: 0; border-radius: 8px 0 0 8px; color: var(--text2); font: 600 10px var(--mono); letter-spacing: .08em; cursor: pointer; box-shadow: -6px 0 18px rgba(0,0,0,.35); transition: padding-right .15s, color .15s, background .15s; }
#dock-rail .dk-tab:hover { color: var(--text); padding-right: 9px; }
#dock-rail .dk-tab.on { color: var(--text); background: var(--nx-card-hi, rgba(59,130,246,.18)); border-color: var(--accent, var(--sky)); }
#dock-rail .dk-l { writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; }
#dock-rail .dk-n { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--text3); font-weight: 400; }
#dock-rail .dk-n.warn { color: var(--amber); }
.dk-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sky); animation: pulse 1.2s infinite; display: inline-block; }

/* menus: one component for dropdowns, context menus and the palette */
.menu { position: fixed; z-index: 1000; min-width: 220px; max-width: 380px; max-height: 70vh; overflow-y: auto; padding: 5px; background: var(--panel); border: 1px solid var(--rim); border-radius: 9px; box-shadow: 0 18px 50px rgba(0,0,0,.6); animation: pop .1s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-3px); } }
.menu .mi { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border-radius: 5px; color: var(--text); font-size: 12.5px; text-align: left; }
.menu .mi .lab { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu .mi .hint { font: 10.5px var(--mono); color: var(--text3); white-space: nowrap; }
.menu .mi svg { color: var(--text2); }
.menu .mi.act, .menu .mi:not([disabled]):hover { background: var(--b0); color: var(--bright); }
.menu .mi.act svg { color: var(--sky); }
.menu .mi[disabled] { color: var(--text3); cursor: default; }
.menu .mi[disabled] svg { color: var(--text3); }
.menu .mi.danger:not([disabled]) { color: var(--coral); }
.menu .mi .lab small { display: block; white-space: normal; color: var(--text3); font-size: 11px; line-height: 1.4; margin-top: 1px; }
.menu .mi[disabled] .lab { white-space: normal; font-size: 11px; line-height: 1.45; }
.menu .sep { height: 1px; background: var(--rim); margin: 5px 4px; }
.menu .mh { padding: 6px 9px 3px; font: 600 9.5px var(--mono); letter-spacing: .1em; color: var(--text3); text-transform: uppercase; }
.menu input { width: 100%; height: 30px; margin-bottom: 4px; padding: 0 9px; border: 1px solid var(--rim); border-radius: 6px; background: var(--bg); color: var(--text); font: 12.5px var(--sans); outline: 0; }
.menu input:focus { border-color: var(--b2); }
.menu.palette { left: 50% !important; top: 70px !important; transform: translateX(-50%); width: 560px; max-width: 92vw; }
.menu .none { padding: 10px; color: var(--text3); font-size: 12px; }

.page { flex: 1; overflow: auto; padding: 18px 22px; }
.page h2 { font: 500 15px var(--sans); color: var(--bright); }
table.t { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
table.t th { text-align: left; font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text3); padding: 8px 10px; border-bottom: 1px solid var(--rim); position: sticky; top: 0; background: var(--bg); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--edge); vertical-align: top; }
table.t td.m { font: 11px var(--mono); color: var(--text2); }
table.t tbody tr { cursor: default; }
table.t tbody tr:hover td { background: rgba(255,255,255,.02); }
.mini { display: flex; gap: 2px; }
.mini i { width: 10px; height: 10px; border-radius: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.pill .sd { width: 6px; height: 6px; }
.term { font: 10.5px/1.5 var(--mono); background: var(--void); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 0; max-height: 320px; min-height: 120px; overflow: auto; }
.tl { display: grid; grid-template-columns: 58px 76px 1fr; gap: 6px; padding: 0 8px; }
.tl .tt { color: var(--text3); } .tl .ts { color: var(--sky); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tl .tx { color: var(--text2); white-space: pre-wrap; word-break: break-word; }
.tl.err .tx { color: var(--coral); } .tl.cmd .tx { color: var(--bright); } .tl.reply .tx { color: var(--text); }
.prompt { display: flex; align-items: center; gap: 6px; margin-top: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--rim); border-radius: 6px; background: var(--bg); font: 11px var(--mono); color: var(--sky); }
.prompt:focus-within { border-color: var(--b2); }
.prompt input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--bright); font: 11.5px var(--mono); }
.lin { display: grid; grid-template-columns: 12px 1fr; gap: 6px; padding: 5px 0; position: relative; }
.lin .ld { width: 7px; height: 7px; border-radius: 50%; background: var(--sky); margin-top: 4px; }
.lin::before { content: ''; position: absolute; left: 3px; top: 14px; bottom: -6px; width: 1px; background: var(--rim); }
.lin:last-child::before { display: none; }
.lin b { color: var(--bright); font-weight: 500; } .lin .lt { color: var(--text3); } .lin div div { color: var(--text2); margin-top: 1px; }
.fld { margin: 0 0 9px; }
.fl { display: block; font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
.fl i { color: var(--coral); font-style: normal; }
.fh { margin-top: 4px; font: 10.5px/1.45 var(--sans); color: var(--text3); }
#dock-col input:not([type=checkbox]), #dock-col select, #dock-col textarea, .libq { width: 100%; background: var(--bg); border: 1px solid var(--rim); border-radius: 5px; color: var(--bright); font: 11.5px var(--mono); padding: 6px 8px; outline: 0; }
#dock-col select { appearance: none; cursor: pointer; padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--text3) 50%), linear-gradient(135deg, var(--text3) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
#dock-col select option, #dock-col select optgroup { background: var(--bg1); color: var(--text); }
#dock-col textarea { resize: vertical; line-height: 1.5; }
#dock-col input:focus, #dock-col select:focus, #dock-col textarea:focus, .libq:focus { border-color: var(--b2); box-shadow: 0 0 0 2px var(--b0); }
.num { display: flex; align-items: center; gap: 6px; } .num input { width: 110px !important; } .num span { color: var(--text3); font-size: 10.5px; }
.chk { display: flex; align-items: center; gap: 7px; color: var(--text); font-size: 11.5px; cursor: pointer; }
.vrow { display: grid; grid-template-columns: 1fr 1.4fr 20px; gap: 5px; margin-bottom: 5px; align-items: center; }
.vrow input { padding: 5px 7px !important; }
.addrow { width: 100%; padding: 6px; border: 1px dashed var(--rim); border-radius: 5px; color: var(--text2); font: 11px var(--mono); margin-top: 2px; }
.addrow:hover { border-color: var(--b2); color: var(--sky); background: var(--b0); }
.libq { margin: 4px 0 2px; }
.libi { display: grid; grid-template-columns: 24px 1fr; gap: 6px; width: 100%; text-align: left; padding: 6px 6px; border-radius: 5px; }
.libi:hover { background: var(--b0); }
.libi b { display: block; color: var(--bright); font: 500 12px var(--sans); }
.libi small { display: block; color: var(--text3); font: 10.5px/1.4 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gl { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: var(--b0); color: var(--sky); font-size: 11px; flex: none; }
.lh { display: flex; align-items: center; gap: 16px; } .lh h2 { white-space: nowrap; } .lh .ct { color: var(--text3); font: 12px var(--mono); }
/* the pick-not-type tabs (2026-11-24): cards to click, menus to pick from */
.pcard { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 11px 12px; background: var(--nx-card, var(--bg2)); border: 1px solid var(--edge); border-radius: 8px; color: var(--text2); font: 11.5px/1.45 var(--sans); min-width: 0; }
.pcard:not([disabled]):hover { border-color: var(--sky); background: var(--b0); cursor: pointer; }
.pcard b { color: var(--bright); font: 500 12.5px var(--sans); display: flex; align-items: center; gap: 6px; } .pcard span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.pcard i { font: normal 10px var(--mono); color: var(--text3); } .pcard code, .lead code { font: 10.5px var(--mono); color: var(--sky); } .pcard .gl { color: var(--sky); }
.pg { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-top: 20px; }
.pform { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 14px; padding: 12px; border: 1px solid var(--edge); border-radius: 8px; background: var(--nx-card, var(--bg2)); }
.pform label { font: 11px var(--mono); color: var(--text3); } .psel { background: var(--bg); color: var(--text); border: 1px solid var(--rim); border-radius: 5px; padding: 5px 8px; font: 12px var(--sans); max-width: 320px; }
.lq { flex: 1; max-width: 520px; height: 32px; padding: 0 11px; border: 1px solid var(--rim); border-radius: 6px; background: var(--bg1); color: var(--bright); font: 12.5px var(--sans); outline: 0; }
.lq:focus { border-color: var(--b2); }
.page .lead { margin-top: 6px; color: var(--text2); font-size: 12px; } .page .lead b { color: var(--text); font-weight: 500; }
table.t .nm { font-weight: 500; color: var(--bright); } table.t .sub { margin-top: 2px; color: var(--text3); font-size: 11.5px; line-height: 1.45; max-width: 720px; }
.addbtn { padding: 4px 10px; border: 1px solid var(--rim); border-radius: 5px; color: var(--text2); font: 11px var(--mono); white-space: nowrap; }
.addbtn:hover { border-color: var(--b2); color: var(--sky); background: var(--b0); }
#toasts { position: fixed; right: 50px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 1001; max-width: 380px; }
#toasts .toast { position: static; transform: none; display: flex; align-items: center; gap: 9px; cursor: pointer; animation: pop .15s ease-out; }
#toasts .toast .sd { background: var(--sky); } #toasts .toast.bad .sd { background: var(--coral); } #toasts .toast.ok .sd { background: var(--ok); } #toasts .toast.warn .sd { background: var(--amber); }
#toasts .toast.bad { border-color: color-mix(in srgb, var(--coral) 40%, var(--rim)); } #toasts .toast.warn { border-color: color-mix(in srgb, var(--amber) 40%, var(--rim)); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 7px; background: var(--panel); border: 1px solid var(--rim); color: var(--text); font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 1001; }
::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-thumb { background: var(--rim); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; } ::-webkit-scrollbar-track { background: transparent; }
</style>

<body>
<div class="app">
  <header class="top" id="top"></header>
  <div class="progress" id="progress"></div>
  <nav class="side" id="side"></nav>
  <section class="stage"><div class="work" id="work"></div><div id="dock-col"></div><div id="dock-rail"></div></section>
</div>
<script>
'use strict';
// ════ Everything on this screen is declared once below (ICONS, VIEWS, PANELS, ACTIONS, MENUS) and drawn by a few generic renderers.
// Menus, the context menus, the palette (Ctrl+K) and the shortcuts all read ACTIONS. Reads only: an action that would change a run says so.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dur = (ms) => ms == null ? '—' : ms < 1000 ? Math.round(ms) + ' ms' : ms < 60000 ? (ms / 1000).toFixed(1) + ' s' : ms < 3600e3 ? Math.floor(ms / 60000) + 'm ' + Math.round(ms % 60000 / 1000) + 's' : Math.floor(ms / 3600e3) + 'h ' + Math.round(ms % 3600e3 / 60000) + 'm';
const kfmt = (n) => n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
const ago = (t) => { if (!t) return '—'; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const model = (m) => String(m || '').replace(/^huihui_ai\//, '').replace(/-abliterated?/, '');
const bg = (j) => /probe|diagnose/.test(j.intent || '');
const store = { get(k, d) { try { const v = localStorage.getItem('cos.pipes.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem('cos.pipes.' + k, JSON.stringify(v)); } catch (_) {} } };
// toasts: what needs his eye now (a system changed state, memory is low, a copy happened), stacked bottom right, gone on their own or on click
function toast(t, kind = '', ms = 3200) { let box = document.getElementById('toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const e = document.createElement('div'); e.className = 'toast ' + kind; e.innerHTML = `<span class="sd"></span><span>${esc(t)}</span>`; e.onclick = () => e.remove(); box.appendChild(e); setTimeout(() => e.remove(), ms); }
function watch(prev, D) {
  if (!prev) { const down = D.systems.filter((s) => s.state !== 'up'); if (down.length) toast(`${down.length === 1 ? down[0].name + ' is ' + down[0].state : down.length + ' systems are not up: ' + down.map((s) => s.name).join(', ')}`, 'bad', 7000); }
  else for (const s of D.systems) { const o = prev.systems.find((x) => x.name === s.name); if (o && o.state !== s.state) toast(`${s.name}: ${o.state} → ${s.state}`, s.state === 'up' ? 'ok' : 'bad', 6000); }
  const h = D.host || {}; if (h.freeMemPct != null && h.freeMemPct < 12 && Date.now() - (S.memWarn || 0) > 300000) { S.memWarn = Date.now(); toast(`Memory is low: ${(h.freeMB / 1024).toFixed(1)} GB free (${h.freeMemPct}%)`, 'warn', 7000); }
  const m = D.loaded[0], pm = prev && prev.loaded[0]; if (prev && (m && m.name) !== (pm && pm.name)) toast(m ? `Ollama loaded ${model(m.name)} (${(m.vramMB / 1024).toFixed(1)} GB)` : 'Ollama unloaded its model', '', 4000); }
const COL = { done: 'var(--ok)', complete: 'var(--ok)', passed: 'var(--ok)', running: 'var(--amber)', failed: 'var(--coral)', cancelled: 'var(--coral)', paused: 'var(--violet)', waiting: 'var(--text2)' };
const col = (s) => COL[s] || 'var(--text3)';

const P = 'M'; const ICONS = {
  canvas: '<rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h3a2 2 0 0 1 2 2v5"/>',
  console: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>', runs: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  vars: '<path d="M8 4c-2 0-3 1-3 3v2c0 1-1 2-2 2 1 0 2 1 2 2v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1 1 2 2 2-1 0-2 1-2 2v2c0 2-1 3-3 3"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  gaps: '<path d="M4 7h6v4H4zM14 13h6v4h-6z"/><path d="M10 9h2a2 2 0 0 1 2 2v4"/>', ladder: '<path d="M8 3v18M16 3v18M8 7h8M8 12h8M8 17h8"/>',
  tape: '<circle cx="7" cy="12" r="3"/><circle cx="17" cy="12" r="3"/><path d="M7 15h10"/><rect x="2" y="6" width="20" height="12" rx="2"/>', flight: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  ledger: '<path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12"/>', play: '<path d="M7 5l12 7-12 7z"/>', pause: '<path d="M8 5v14M16 5v14"/>',
  retry: '<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>', chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  chev: '<path d="M6 9l6 6 6-6"/>', radial: '<circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/>',
  phases: '<path d="M4 5h4v4H4zM10 10h4v4h-4zM16 15h4v4h-4zM8 7h2a2 2 0 0 1 2 2v1M14 12h2a2 2 0 0 1 2 2v1"/>', components: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/>', more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>', search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
  inspect: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4M11 8v6M8 11h6"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  pin: '<path d="M12 17v5M5 17h14l-2-5V5H7v7z"/>', fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  export: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', open: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', skip: '<path d="M5 5l9 7-9 7zM18 5v14"/>',
  panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>', gate: '<path d="M12 3l9 9-9 9-9-9z"/>', model: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/>',
};
const icon = (k) => `<svg class="i" viewBox="0 0 24 24">${ICONS[k] || ''}</svg>`;

// ── state ──
const S = { view: (v => ['console', 'vars', 'settings'].includes(v) ? 'canvas' : v)(store.get('view', 'canvas')), max: false, stack: [], phases: null, comps: null, cat: null, cmds: {}, trig: {}, drafts: {}, edits: {}, rev: 0, lin: {}, logs: null, cli: [], draft: '', hist: [], hi: 0, pid: store.get('pid', null), sel: null, job: null, pinned: false, all: false, follow: true, wrap: true, think: false,
  open: new Set(store.get('dock', ['inspector', 'activity'])), folded: new Set(store.get('folded', [])), split: store.get('split', .6), D: null, ok: 0, base: {}, vp: null, sig: '' };
const pipe = () => S.drafts[S.pid] || (S.D && S.D.pipelines.find((p) => p.id === S.pid));
const allPipes = () => [...(S.D ? S.D.pipelines : []), ...Object.values(S.drafts).filter((d) => !(S.D && S.D.pipelines.some((p) => p.id === d.id)))];
// ── the draft: every edit changes a copy of the pipeline; Save writes it through COS once built, Discard drops it ──
function draft() { if (!S.drafts[S.pid]) S.drafts[S.pid] = JSON.parse(JSON.stringify(S.D.pipelines.find((p) => p.id === S.pid))); return S.drafts[S.pid]; }
function edit(fn) { const p = draft(); fn(p); S.edits[p.id] = (S.edits[p.id] || 0) + 1; S.rev++; S.sig = ''; work(); topbar(); }
const catOf = (type) => S.cat && S.cat.catalogue.find((c) => c.type === type);
async function loadCat() { if (S.cat) return; S.cat = { catalogue: [], loading: true }; try { const c = await (await fetch('/api/cos/automation/catalogue')).json(); S.cat = c && c.catalogue ? c : { catalogue: [] }; } catch (_) { S.cat = { catalogue: [] }; } dock(); }
async function loadCmds(sys) { if (S.cmds[sys]) return; S.cmds[sys] = []; try { S.cmds[sys] = (await (await none()).json()).paths || []; } catch (_) {} dock(); }
function newId(p, type) { const b = String(type).replace(/_/g, '-'); let i = 1; while (p.tasks.some((t) => t.id === b + '-' + i)) i++; return b + '-' + i; }
function stepOf(type, preset) { const c = catOf(type), cfg = {}; for (const f of (c && c.fields) || []) if (f.default !== undefined) cfg[f.key] = f.default; return { label: (preset && preset.label) || (c ? c.label : type), step: { type, config: { ...cfg, ...((preset && preset.config) || {}) } } }; }
// boxes from what Nexus already holds: a phase (built by the Idearium build pipeline, for that phase), a component (called through its system), a system, a pipeline
function addPhase(x) { const bp = allPipes().find((q) => /idearium build pipeline/i.test(q.name)); if (!bp) return toast('No build pipeline in COS to build a phase with', 'bad'); addStep('pipeline', 'after', { label: x.id, config: { pipeline: bp.id, vars: { phase: x.id, map: x.map } } }); toast('Added the phase ' + x.id); }
function addComp(x) { addStep('command', 'after', { label: x.name, config: { system: x.system, method: x.method === 'POST' ? 'POST' : 'GET', endpoint: x.path || '' } }); toast('Added ' + x.name + ' (' + x.system + ')'); }
async function loadPhases() { if (S.phases) return; try { S.phases = (await (await none()).json()).phases || []; } catch (_) { S.phases = []; } work(); }
async function loadComps() { if (S.comps) return; try { S.comps = (await (await none()).json()).components || []; } catch (_) { S.comps = []; } work(); }
function fromNexus(how) { return [{ h: 'From Nexus' },
  { label: 'A system…', icon: 'chip', desc: 'A box that asks one of Nexus’s systems', run: () => setTimeout(() => menu(S.D.systems.map((s) => ({ label: s.name, dot: s.state === 'up' ? 'var(--ok)' : 'var(--amber)', hint: s.state, run: () => addStep('command', how, { label: 'Ask ' + s.name, config: { system: s.name } }) })), null, { search: true, palette: true, placeholder: 'Which system?' }), 0) },
  { label: 'Another pipeline…', icon: 'canvas', desc: 'Runs a whole pipeline as one box; double-click opens it', run: () => setTimeout(() => menu(allPipes().filter((x) => x.id !== S.pid).map((x) => ({ label: x.name, hint: x.tasks.length + ' steps', run: () => addStep('pipeline', how, { label: x.name, config: { pipeline: x.id } }) })), null, { search: true, palette: true, placeholder: 'Which pipeline?' }), 0) },
  { label: 'An If…, picked', icon: 'more', desc: 'A value, a test, an answer, what happens next', run: () => setView('conds') },
  { label: 'When it starts…', icon: 'play', desc: 'By hand, every N, at a time, on an event, on a web request', run: () => setView('sched') },
  { label: 'Every kind of step…', icon: 'panel', desc: 'The whole catalogue, as cards', run: () => setView('library') }]; }
// add a step: after the selected one (its followers now follow the new step), or beside it (a parallel branch: same inputs, nothing rewired)
function addStep(type, how = 'after', preset = null) { const sel = S.sel && S.sel.id; let nid;
  edit((p) => { nid = newId(p, type); const s = stepOf(type, preset), at = sel && p.tasks.find((t) => t.id === sel), lastId = p.tasks.length ? p.tasks[p.tasks.length - 1].id : null;
    const deps = how === 'beside' && at ? [...(at.depends_on || [])] : at ? [at.id] : lastId ? [lastId] : [];
    if (how === 'after' && at) for (const x of p.tasks) if ((x.depends_on || []).includes(at.id)) x.depends_on = x.depends_on.map((d) => d === at.id ? nid : d);
    const ix = at ? p.tasks.indexOf(at) + 1 : p.tasks.length; p.tasks.splice(ix, 0, { id: nid, label: s.label, depends_on: deps, step: s.step, gate: null, retries: 0, onFail: 'stop' }); });
  S.sel = { t: 'step', id: nid }; S.vp = null; openPanel('inspector'); }
function delStep(id) { edit((p) => { const t = p.tasks.find((x) => x.id === id); if (!t) return; for (const x of p.tasks) if ((x.depends_on || []).includes(id)) x.depends_on = [...new Set(x.depends_on.flatMap((d) => d === id ? (t.depends_on || []) : [d]))]; p.tasks.splice(p.tasks.indexOf(t), 1); }); S.sel = null; S.vp = null; dock(); }
function dupStep(id) { let nid; edit((p) => { const t = p.tasks.find((x) => x.id === id); if (!t) return; const c = JSON.parse(JSON.stringify(t)); nid = c.id = newId(p, (t.step && t.step.type) || 'step'); c.label = t.label + ' (copy)'; c.depends_on = [t.id];
  for (const x of p.tasks) if ((x.depends_on || []).includes(t.id)) x.depends_on = x.depends_on.map((d) => d === t.id ? nid : d); p.tasks.splice(p.tasks.indexOf(t) + 1, 0, c); }); S.sel = { t: 'step', id: nid }; S.vp = null; dock(); }
function catMenu(how) { if (!S.cat || !S.cat.catalogue.length) { loadCat(); return [{ label: 'Reading the step catalogue…', disabled: 'COS is answering' }]; }
  const groups = [...new Set(S.cat.catalogue.map((c) => c.group))];
  return [...fromNexus(how), ...groups.flatMap((g) => [{ h: g }, ...S.cat.catalogue.filter((c) => c.group === g).map((c) => ({ label: c.label, glyph: c.icon, hint: c.type, run: () => addStep(c.type, how) }))])]; }
const runs = (id) => S.D ? S.D.runs.filter((r) => r.pipelineId === id).sort((a, b) => (b.at || 0) - (a.at || 0)) : [];
const last = (id) => runs(id)[0] || null;
const st = (r, id) => r && r.tasks && r.tasks[id] ? r.tasks[id].status || 'pending' : 'pending';
const task = (id) => { const p = pipe(); return p && p.tasks.find((t) => t.id === id); };
const kind = (t) => t.step ? t.step.type || 'step' : 'step';
const target = (t) => { const u = t.step && t.step.config && t.step.config.url; const m = /^nexus:\/\/([a-z0-9-]+)(\/\S*)?/i.exec(String(u || '')); return m ? m[1] + (m[2] ? ' ' + m[2].replace(/^\/api/, '') : '') : (u || '—'); };
const gtext = (g) => !g ? 'pass' : Object.entries(g).map(([k, v]) => k + ' ' + (typeof v === 'string' ? v : JSON.stringify(v))).join(' · ');
const jname = (j) => j.gap ? 'gap · ' + j.gap : j.source ? j.source.replace(/^idearium\./, '') : (j.intent || 'call');
const jobs = () => S.D ? S.D.jobs.filter((j) => S.all || !bg(j)).sort((a, b) => (b.at || b.queued || 0) - (a.at || a.queued || 0)) : [];
const job = () => S.D && S.D.jobs.find((j) => j.id === S.job);
const liveRun = () => { const p = pipe(), r = p && last(p.id); return r && /running|paused/.test(r.status) ? r : null; };
const later = 'Acts once this screen is built (COS’s engine has it: PC8 slice b).';

// ════ ACTIONS — the one list every menu, the palette and the shortcuts read ════
const ACTIONS = {
  'run.start':    { label: 'Run pipeline', icon: 'play', kbd: 'R', group: 'Run', off: () => !pipe() ? 'Choose a pipeline.' : null, run: () => cosAct('pipelines/' + pipe().id + '/run', 'Started') },
  'run.pause':    { label: 'Pause', icon: 'pause', group: 'Run', off: () => !liveRun() ? 'No run in progress.' : null, run: () => cosAct('pipeline-runs/' + liveRun().id + '/pause', 'Paused') },
  'run.continue': { label: 'Continue', icon: 'play', group: 'Run', off: () => !liveRun() ? 'No paused run.' : null, run: () => cosAct('pipeline-runs/' + liveRun().id + '/continue', 'Continued') },
  'run.cancel':   { label: 'Cancel run', icon: 'stop', group: 'Run', danger: true, off: () => !liveRun() ? 'No run in progress.' : null, run: () => cosAct('pipeline-runs/' + liveRun().id + '/cancel', 'Cancelled') },
  'step.inspect': { label: 'Inspect', icon: 'inspect', kbd: 'I', group: 'Step', off: () => !S.sel ? 'Nothing selected.' : null, run: () => openPanel('inspector') },
  'step.runTo':   { label: 'Run to here', icon: 'play', group: 'Step', off: () => later },
  'step.skip':    { label: 'Skip this step', icon: 'skip', group: 'Step', off: () => later },
  'step.copyId':  { label: 'Copy id', icon: 'copy', group: 'Step', off: () => !S.sel ? 'Nothing selected.' : null, run: () => copy(S.sel.id) },
  'gate.edit':    { label: 'Edit condition…', icon: 'gate', group: 'Gate', off: () => later },
  'view.fit':     { label: 'Fit to screen', icon: 'fit', kbd: 'F', group: 'View', run: () => fit() },
  'view.in':      { label: 'Zoom in', icon: 'plus', kbd: '+', group: 'View', run: () => zoom(1.2) },
  'view.out':     { label: 'Zoom out', icon: 'minus', kbd: '−', group: 'View', run: () => zoom(1 / 1.2) },
  'view.max':     { label: () => S.max ? 'Show the canvas with the console' : 'Console full height', icon: 'console', kbd: 'C', group: 'View', run: () => { S.max = !S.max; S.sig = ''; S.vp = null; work(); } },
  'dock.cli':     { label: 'Open the terminal (COS CLI)', icon: 'console', kbd: 'T', group: 'Panels', run: () => { openPanel('terminal'); loadLogs().then(dock); setTimeout(() => { const i = $('cliLine'); if (i) i.focus(); }, 50); } },
  'step.add':     { label: 'Add a step…', icon: 'plus', kbd: 'A', group: 'Edit', run: () => setTimeout(() => menu(catMenu('after'), null, { search: true, palette: true, placeholder: S.sel ? 'Add a step after the selected one' : 'Add a step at the end' }), 0) },
  'step.beside':  { label: 'Add a parallel branch…', icon: 'gate', group: 'Edit', off: () => !(S.sel && S.sel.t === 'step') ? 'Select a step first.' : null, run: () => setTimeout(() => menu(catMenu('beside'), null, { search: true, palette: true, placeholder: 'A step beside the selected one (same inputs)' }), 0) },
  'step.if':      { label: 'Add an If… after it', icon: 'gate', group: 'Edit', off: () => !catOf('condition') ? 'No condition step in the catalogue.' : null, run: () => addStep('condition', 'after') },

      return `<div class="dk-empty">Click to add ${S.sel ? 'after the selected step' : 'at the end'}. From COS's engine: ${cats.length} kinds.</div><input class="libq" placeholder="Filter" spellcheck="false">`
        + groups.map((g) => `<div class="dk-sec">${esc(g)}</div>` + cats.filter((x) => x.group === g).map((x) => `<button class="libi" data-add="${esc(x.type)}" title="${esc(x.help || '')}"><span class="gl">${esc(x.icon)}</span><span><b>${esc(x.label)}</b><small>${esc(x.help || '')}</small></span></button>`).join('')).join(''); } },
  { id: 'vars', label: 'Variables', hidden: true, count: () => { const p = pipe(); return p ? Object.keys(p.vars || {}).length || '' : ''; },
    render() { const p = pipe(); if (!p) return '<div class="dk-empty">Choose a pipeline.</div>'; return `<div class="dk-empty">Steps read these as {{vars.<i>name</i>}}.</div>` + rows(p.vars, 'vars', 'Add a variable'); } },
  { id: 'pipeline', label: 'Pipeline', render() { const p = pipe(); if (!p) return '<div class="dk-empty">Choose a pipeline.</div>';
      return `<div class="fld"><label class="fl">Name</label><input type="text" data-pf="name" value="${esc(p.name || '')}"></div><div class="fld"><label class="fl">What it does</label><textarea data-pf="description" rows="3">${esc(p.description || '')}</textarea></div>`
        + sec('Inputs') + '<div class="dk-empty">What the pipeline is given when it starts, like which phase to build. A step uses one by naming it: {{vars.phase}}. Asked for when you press Run.</div>' + rows(p.vars, 'vars', 'Add an input')
        + sec('Settings') + rows(p.settings, 'settings', 'Add a setting') + sec('File') + kv('id', p.id) + kv('steps', p.tasks.length) + (S.edits[p.id] ? kv('draft', S.edits[p.id] + ' changes, not saved') : ''); } },
  { id: 'activity', label: 'Activity', count: () => S.D ? S.D.jobs.filter((x) => /running|queued/.test(x.status)).length + S.D.runs.filter((x) => x.status === 'running').length || '' : '', live: () => S.D && S.D.jobs.some((x) => x.status === 'running'),
    render() { const D = S.D, rr = D.runs.filter((x) => /running|paused/.test(x.status)), jj = D.jobs.filter((x) => /running|queued/.test(x.status));
      return sec('Pipeline runs') + (rr.length ? rr.map((x) => kv(x.name || x.id, x.status + ' · ' + ago(x.at), `data-goto="${esc(x.pipelineId)}"`)).join('') : '<div class="dk-empty">None.</div>')
        + sec('Model calls') + (jj.length ? jj.map((x) => kv(jname(x), x.status + ' · ' + dur(x.ms), `data-call="${esc(x.id)}"`)).join('') : '<div class="dk-empty">None.</div>'); } },
  { id: 'build', label: 'Build', live: () => S.D && S.D.build && !/passed|failed|held|error|landed/.test(S.D.build.last || ''), count: () => S.D && S.D.build ? S.D.build.gaps.filter((x) => x.state === 'passed').length + '/' + S.D.build.gaps.length : '',
    render() { const b = S.D && S.D.build; if (!b) return '<div class="dk-empty">No build has run yet.</div>';
      const c = (s) => s === 'passed' ? 'var(--ok)' : /refused|failed|held/.test(s) ? 'var(--red, #f87171)' : s === 'gap-asked' ? 'var(--sky)' : 'var(--text3)';
      const word = (s) => ({ 'gap-asked': 'writing…', 'gap-answered': 'checking', passed: 'passed', waiting: 'waiting' })[s] || s;
      return `<div class="dk-empty" style="text-align:left">${esc(b.phase || '')} · <code>${esc(b.run)}</code> · now: ${esc(b.last || '')}</div>`
        + b.gaps.map((x) => kv(`<span class="sd" style="background:${c(x.state)}"></span> ${esc(x.name)}${x.helper ? ' <i style="color:var(--violet)">broken down</i>' : ''}`, word(x.state) + ' · ' + x.asks + ' tries' + (x.model ? ' · ' + esc(String(x.model).replace(/^.*\//, '')) : ''))).join('')
        + '<div class="pg" style="margin:12px 0 4px">Its last rows</div>' + b.rows.slice().reverse().map((x) => `<div style="font:10.5px var(--mono);color:var(--text2);padding:2px 0"><span style="color:var(--text3)">${new Date(x.t).toLocaleTimeString()}</span> ${esc(x.state)}${x.gap ? ' <b>' + esc(x.gap) + '</b>' : ''}${x.note ? ' — ' + esc(x.note) : ''}</div>`).join(''); } },
  { id: 'terminal', label: 'Terminal', count: () => S.logs ? S.logs.filter((l) => l.stream === 'err').length || '' : '', warn: true, keepFocus: true,
    render() { const ls = (S.logs || []).slice(-250).concat(S.cli);
      return `<div class="term" id="term">${ls.length ? ls.map((l) => `<div class="tl ${esc(l.stream || '')}"><span class="tt">${l.ts ? new Date(l.ts).toLocaleTimeString([], { hour12: false }) : ''}</span><span class="ts">${esc(l.system || '')}</span><span class="tx">${esc(l.line)}</span></div>`).join('') : '<div class="dk-empty">Reading COS’s console…</div>'}</div>
        <form class="prompt" id="cliForm"><span>cos&gt;</span><input id="cliLine" autocomplete="off" spellcheck="false" placeholder="a command (help lists them)" value="${esc(S.draft)}"></form>`; } },
  { id: 'changes', label: 'Changes', render: () => '<div class="dk-empty">Every file the run changed, with Apply, Reject, Revert: Idearium’s work surface through the drawbridge. Not read in this preview.</div>' },
  { id: 'system', label: 'System', hidden: true, count: () => S.D ? S.D.systems.filter((s) => s.state !== 'up').length || '' : '', warn: true,
    render() { const D = S.D; return sec('Ollama') + (D.loaded.length ? D.loaded.map((m) => kv(model(m.name), (m.vramMB / 1024).toFixed(1) + ' GB VRAM')).join('') : '<div class="dk-empty">No model loaded.</div>')
      + sec('Systems') + D.systems.map((s) => `<div class="kv"><span>${esc(s.name)}</span><span style="color:${s.state === 'up' ? 'var(--ok)' : s.state === 'degraded' ? 'var(--amber)' : 'var(--text3)'}">${esc(s.state)}</span></div>`).join(''); } },
];
async function loadLogs() { if (!S.open.has('terminal')) return; try { const d = await (await fetch('/api/cos/console?limit=300')).json(); S.logs = (d && d.lines) || []; } catch (_) {} }
async function runCli(line) { S.cli.push({ system: 'you', ts: Date.now(), stream: 'cmd', line: 'cos> ' + line }); dock();
  let out = []; try { out = (await (await fetch('/api/cos/cli', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ line, by: 'person' }) })).json()).lines || []; } catch (e) { out = [e.message]; }
  S.cli.push(...(out.length ? out : ['(no output)']).map((l) => ({ system: 'cos', ts: Date.now(), stream: 'reply', line: String(l) }))); S.cli = S.cli.slice(-200); dock(); }
function dock() {
  const col2 = $('dock-col'), keep = {}; col2.querySelectorAll('.dk-panel').forEach((x) => keep[x.dataset.p] = x.querySelector('.dk-body').scrollTop);
  const open = PANELS.filter((x) => !x.hidden && S.open.has(x.id)); col2.className = open.length ? 'open' : '';
  col2.innerHTML = open.map((x) => `<section class="dk-panel ${S.folded.has(x.id) ? 'folded' : ''}" data-p="${x.id}"><div class="dk-head"><button class="dk-fold">${S.folded.has(x.id) ? '▸' : '▾'}</button><b>${x.label}</b><span class="dk-grow"></span><span class="dk-n">${x.count ? x.count() : ''}</span><button class="dk-x" title="Close">×</button></div><div class="dk-body">${S.D ? x.render() : '<div class="dk-empty">Reading…</div>'}</div></section>`).join('');
  col2.querySelectorAll('.dk-panel').forEach((el) => { const id = el.dataset.p; el.querySelector('.dk-body').scrollTop = keep[id] || 0;
    const fold = () => { S.folded.has(id) ? S.folded.delete(id) : S.folded.add(id); save(); dock(); };
    el.querySelector('.dk-fold').onclick = fold; el.querySelector('.dk-head').ondblclick = fold; el.querySelector('.dk-x').onclick = () => { S.open.delete(id); save(); dock(); rail(); };
    el.querySelector('.dk-head').oncontextmenu = (e) => { e.preventDefault(); menu([{ label: S.folded.has(id) ? 'Expand' : 'Collapse', icon: 'panel', run: fold }, { label: 'Close', icon: 'stop', run: () => { S.open.delete(id); save(); dock(); rail(); } }, '-', ...fromActions(['dock.all', 'dock.none'])], { x: e.clientX, y: e.clientY }); }; });
  col2.querySelectorAll('[data-call]').forEach((x) => x.onclick = () => { S.job = x.dataset.call; S.pinned = true; if (S.view !== 'canvas' && S.view !== 'console') S.view = 'console'; draw(); });
  col2.querySelectorAll('[data-goto]').forEach((x) => x.onclick = () => choose(x.dataset.goto));
  // the forms: every box writes into the draft as it changes; a choice that changes which fields show redraws the panel
  const val = (el) => el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value;
  col2.querySelectorAll('[data-f]').forEach((el) => { const id = S.sel && S.sel.id, pth = el.dataset.f, redraw = el.tagName === 'SELECT' || el.type === 'checkbox';
    el.addEventListener(redraw ? 'change' : 'input', () => { const v = val(el);
      edit((p) => { const t = p.tasks.find((x) => x.id === id); if (!t) return;
        if (pth === 'label') t.label = v; else if (pth === 'onFail') t.onFail = v; else if (pth === 'retries') t.retries = v || 0;
        else if (pth === 'after') t.depends_on = v ? [v, ...(t.depends_on || []).slice(1).filter((d) => d !== v)] : (t.depends_on || []).slice(1);
        else if (pth === 'cfgjson') { try { t.step.config = JSON.parse(v); } catch (_) {} }
        else if (pth.startsWith('cfg.')) { t.step = t.step || { type: 'log', config: {} }; t.step.config = { ...(t.step.config || {}), [pth.slice(4)]: v }; } });
      if (redraw) dock(); }); });
  const ty = col2.querySelector('[data-type]'); if (ty) ty.onchange = () => { const id = S.sel.id, s = stepOf(ty.value); edit((p) => { const t = p.tasks.find((x) => x.id === id); const was = catOf(t.step && t.step.type); if (!was || t.label === was.label) t.label = s.label; t.step = s.step; }); dock(); };
  col2.querySelectorAll('[data-g]').forEach((el) => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { const id = S.sel.id;
    edit((p) => { const t = p.tasks.find((x) => x.id === id); if (!t) return; const k = el.dataset.g === 'kind' ? el.value : gkind(t.gate);
      if (!k) t.gate = null; else { let v = el.dataset.g === 'value' ? el.value : (k === 'notEmpty' ? true : (t.gate && t.gate[gkind(t.gate)] !== true ? t.gate[gkind(t.gate)] : '') || ''); if (k === 'element' && typeof v === 'string') { try { v = JSON.parse(v); } catch (_) {} } t.gate = { [k]: v }; } });
    if (el.tagName === 'SELECT') dock(); }));
  const og = col2.querySelector('[data-opengate]'); if (og) og.onclick = () => ACTIONS['gate.editIt'].run();
  col2.querySelectorAll('[data-pf]').forEach((el) => el.oninput = () => edit((p) => { p[el.dataset.pf] = el.value; }));
  col2.querySelectorAll('[data-rows]').forEach((box) => { const which = box.dataset.rows;
    const read = () => { const o = {}; box.querySelectorAll('.vrow').forEach((r) => { const k = r.querySelector('[data-part=k]').value.trim(), raw = r.querySelector('[data-part=v]').value; if (!k) return; let v = raw; if (/^\s*([\[{]|true$|false$|null$|-?\d+(\.\d+)?$)/.test(raw)) { try { v = JSON.parse(raw); } catch (_) {} } o[k] = v; }); return o; };
    box.querySelectorAll('input').forEach((i) => i.oninput = () => edit((p) => { p[which] = read(); }));
    box.querySelectorAll('[data-rowdel]').forEach((b) => b.onclick = () => { b.closest('.vrow').remove(); edit((p) => { p[which] = read(); }); dock(); });
    box.querySelector('[data-rowadd]').onclick = () => { const o = read(); let n = 1; while (o['name' + n] !== undefined) n++; edit((p) => { p[which] = { ...o, ['name' + n]: '' }; }); dock(); const ins = $('dock-col').querySelectorAll(`[data-rows=${which}] [data-part=k]`); if (ins.length) { ins[ins.length - 1].focus(); ins[ins.length - 1].select(); } }; });
  col2.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => addStep(b.dataset.add, 'after'));
  const lq = col2.querySelector('.libq'); if (lq) lq.oninput = () => { const q = lq.value.toLowerCase(); col2.querySelectorAll('.libi').forEach((b) => b.style.display = b.textContent.toLowerCase().includes(q) ? '' : 'none'); };
  const tm = $('term'); if (tm) tm.scrollTop = tm.scrollHeight;
  const f = $('cliForm'), inp = $('cliLine');
  if (f) { inp.oninput = () => { S.draft = inp.value; };
    inp.onkeydown = (e) => { if (e.key === 'ArrowUp' && S.hi > 0) { S.hi--; inp.value = S.draft = S.hist[S.hi] || ''; e.preventDefault(); } else if (e.key === 'ArrowDown' && S.hi < S.hist.length) { S.hi++; inp.value = S.draft = S.hist[S.hi] || ''; e.preventDefault(); } };
    f.onsubmit = (e) => { e.preventDefault(); const l = inp.value.trim(); if (!l) return; S.hist.push(l); S.hi = S.hist.length; S.draft = ''; runCli(l); }; }
}
function rail() {
  $('dock-rail').innerHTML = PANELS.filter((x) => !x.hidden).map((x) => { const n = x.count ? x.count() : ''; return `<button class="dk-tab ${S.open.has(x.id) ? 'on' : ''}" data-r="${x.id}">${x.live && x.live() ? '<span class="dk-dot"></span>' : ''}<span class="dk-l">${x.label}</span>${n !== '' ? `<span class="dk-n ${x.warn ? 'warn' : ''}">${n}</span>` : ''}</button>`; }).join('');
  $('dock-rail').querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => { const k = b.dataset.r; S.open.has(k) ? S.open.delete(k) : (S.open.add(k), S.folded.delete(k)); save(); dock(); rail(); };
    b.oncontextmenu = (e) => { e.preventDefault(); menu(fromActions(['dock.all', 'dock.none']), { x: e.clientX, y: e.clientY }); }; });
}

function draw() { topbar(); side(); work(); dock(); rail(); }
// ════ COS (his 2026-11-24: "ui should float on top"): every read and act is a COS route; nothing here that COS does not have ════
const none = () => Promise.reject(new Error('COS has no route for this yet'));
const cosGet = async (p) => { try { return await (await fetch('/api/cos/' + p, { cache: 'no-store' })).json(); } catch (_) { return null; } };
async function cosAct(p, said) { try { const r = await (await fetch('/api/cos/automation/' + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ by: 'person' }) })).json(); toast(r && r.ok !== false ? said : (r && r.error) || 'COS refused', r && r.ok !== false ? '' : 'bad'); } catch (e) { toast(e.message, 'bad'); } tick(); }
// the Lab route reads every build on disk: once each 10 s, not each 2 s tick
const labRead = async () => { if (S.lab0 && Date.now() - S.lab0.at < 10000) return S.lab0.v; const v = await cosGet('lab'); if (v) S.lab0 = { at: Date.now(), v }; return v || (S.lab0 && S.lab0.v); };
async function cosData() {
  const [runs, sys, use, pl, lab] = await Promise.all([cosGet('automation/pipeline-runs?limit=80'), cosGet('systems'), cosGet('usage'), cosGet('automation/pipelines'), labRead()]);
  const cut = (v, n) => { const t = String(v == null ? '' : v); return t.length > n ? t.slice(0, n) + '…' : t; };
  const rr = ((runs && runs.runs) || []).map((x) => { const tasks = {}; for (const [k, v] of Object.entries(x.tasks || {})) tasks[k] = { status: v.status, ms: v.ms, error: v.error ? cut(v.error, 300) : null, out: v.output ? cut(typeof v.output === 'string' ? v.output : JSON.stringify(v.output), 1500) : null };
    return { id: x.id, pipelineId: x.pipelineId, name: x.pipelineName, status: x.status, at: x.startedAt, end: x.finishedAt, error: x.error ? cut(x.error, 300) : null, tasks }; });
  const pipes = ((pl && pl.pipelines) || []).filter((p) => !p.archived).map((p) => ({ id: p.id, name: p.name, description: p.description || '', vars: p.vars || {}, settings: p.settings || {}, updatedAt: p.updatedAt, createdAt: p.createdAt || null,
    tasks: (p.tasks || []).map((t) => ({ id: t.id, label: t.label || t.id, depends_on: t.depends_on || t.dependsOn || [], step: t.step || null, gate: t.gate || null, retries: t.retries, onFail: t.onFail, when: t.when || null, method: t.method || null })) }));
  const b = ((lab && lab.builds) || []).slice().sort((x, y) => (y.at || 0) - (x.at || 0))[0];
  const build = b ? { run: b.run, phase: b.phase, at: b.at, last: b.end || '', gaps: (b.pieces || []).map((p) => ({ name: p.name, state: p.status, asks: p.tries || 0, model: (p.models || [])[0] || null, note: cut(p.last || '', 200) })), rows: String(b.steps || '').split(' > ').filter(Boolean).slice(-40).map((x) => ({ t: null, state: x, gap: null, note: '' })) } : null;
  return { at: Date.now(), jobs: [], runs: rr, pipelines: pipes, systems: ((sys && (sys.systems || sys)) || []).map((x) => ({ name: x.name, state: x.state, port: x.port })), host: use && use.usage ? use.usage.host : null, loaded: [], build };
}
async function tick() { try { const prev = S.D; S.D = await cosData(); S.ok = Date.now(); watch(prev, S.D); } catch (_) {}
  if (S.D && !pipe() && S.D.pipelines[0]) { S.pid = S.D.pipelines[0].id; loadBase(S.pid); }
  await loadLogs();
  if (!MENU) topbar(); side(); work();
  const typing = document.activeElement && document.activeElement.id === 'cliLine';
  if (typing) { const p = PANELS.find((x) => x.id === 'terminal'), tm = $('term'), tmp = document.createElement('div'); tmp.innerHTML = p.render(); tm.innerHTML = tmp.querySelector('#term').innerHTML; tm.scrollTop = tm.scrollHeight; rail(); }
  else if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest('#dock-col') && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) && !(MENU && document.activeElement && document.activeElement.closest && document.activeElement.closest('.menu'))) { dock(); rail(); } }
// keys: Ctrl K the palette; the rest from ACTIONS' kbd; menus by arrows, Enter, Escape
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return MENU ? closeMenu() : palette(); }
  if (MENU) { if (e.key === 'Escape') closeMenu(); else if (e.key === 'ArrowDown') { e.preventDefault(); MENU.move(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); MENU.move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); const x = MENU.pick[MENU.act()]; closeMenu(); if (x && x.run) x.run(); } return; }
  if (/input|textarea/i.test((e.target.tagName || ''))) return;
  const k = e.key === '=' ? '+' : e.key === '-' ? '−' : e.key.toUpperCase(); const hit = Object.values(ACTIONS).find((a) => a.kbd === k && a.run && !(a.off && a.off())); if (hit) { e.preventDefault(); hit.run(); }
  if (e.key === 'Escape' && S.sel) select(null);
});
addEventListener('mousedown', (e) => { if (MENU && !e.target.closest('.menu') && !(MENU.anchor && MENU.anchor.contains(e.target))) closeMenu(); });
addEventListener('resize', () => { S.vp = null; S.sig = ''; work(); });
draw(); loadCat(); tick().then(() => S.pid && loadBase(S.pid)); setInterval(tick, 2000);
</script>
