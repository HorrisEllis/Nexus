<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COS</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">COS</span><span class="sub" id="root"></span></div>
  <div class="actions"><label class="pol" title="What COS does with a release that arrives: off = nothing by itself · ask = installs, asks before switching · auto = installs, and switches only when it is safe (verified, newer, idle)">Updates <select id="policy"><option value="off">off</option><option value="ask">ask</option><option value="auto">auto</option></select></label> <button id="btn-console">Command line</button> <button id="btn-import" class="primary">Import a release zip…</button></div>
</header>
<div id="strip" class="strip" role="status"></div>
<div id="banners" aria-live="polite"></div>
<main id="projects"></main>
<section id="empty" hidden>
  <h2>No projects yet</h2>
  <p>Drop a release zip anywhere on this window, or press <b>Import a release zip…</b>. Zips you save into the inbox folder are picked up on their own:</p>
  <p class="path" id="inbox-path"></p>
</section>
<section id="logs-panel" hidden>
  <div class="logs-head"><b id="logs-title">Log</b><span class="grow"></span><button id="btn-logs-close">Close</button></div>
  <pre id="logs"></pre>
</section>
<section id="console" hidden aria-label="COS command line">
  <div class="logs-head"><b>Command line</b><span class="sub" id="sh-state">idle</span><span class="grow"></span><button id="sh-stop" disabled>Stop (Ctrl+C)</button><button id="sh-close">Close</button></div>
  <pre id="sh-out" tabindex="0"></pre>
  <form id="sh-form" autocomplete="off"><span class="prompt">&gt;</span><input id="sh-in" spellcheck="false" aria-label="command" placeholder="npm run start:all   ·   nexus status   ·   help"></form>
</section>
<div id="drop" hidden><div>Drop the release zip to install it</div></div>
<script src="app.js"></script>
</body>
</html>
