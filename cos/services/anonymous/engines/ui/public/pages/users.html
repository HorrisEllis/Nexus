<div class="card">
  <div class="card-title">Users</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Handle</th><th>Email</th><th>Plan</th><th>Created</th></tr></thead>
      <tbody id="users-table"></tbody>
    </table>
  </div>
</div>
<div class="card">
  <div class="card-title">Provision a user</div>
  <div class="frow c3">
    <div><label for="user-handle">Handle</label><input id="user-handle" placeholder="alice"></div>
    <div><label for="user-email">Email</label><input id="user-email" placeholder="alice@example.com"></div>
    <div><label for="user-plan">Plan</label>
      <select id="user-plan"><option value="free">Free</option><option value="pro">Pro</option><option value="unlimited">Unlimited</option></select></div>
  </div>
  <div class="actions"><button onclick="panel.createUser()">Provision</button></div>
  <div class="hint">Creates the tenant, its storage space, and a subdomain.</div>
</div>
