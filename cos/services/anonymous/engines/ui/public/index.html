<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NexusPanel</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/panel.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/%3E%3Cpath d='M3.27 6.96 12 12.01l8.73-5.05'/%3E%3Cpath d='M12 22.08V12'/%3E%3C/svg%3E">
</head>
<body>

<!-- the field: four drifting colour bodies, fixed behind everything -->
<div class="aurora" aria-hidden="true">
  <span class="b1"></span><span class="b2"></span>
  <span class="b3"></span><span class="b4"></span>
</div>
<!-- the gloss: raking highlight, vignette, grain -->
<div class="gloss" aria-hidden="true"></div>

<button class="navtoggle sec" id="navtoggle" aria-label="Toggle navigation" aria-expanded="false"></button>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="name" id="brand-name">NexusPanel</div>
      <div class="domain" id="brand-domain">&nbsp;</div>
      <span class="ipbadge" id="sb-ip">detecting…</span>
    </div>
    <nav id="nav-links" aria-label="Panel sections"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title" id="page-title">Loading</h1>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div class="actions" id="topbar-actions" style="margin-top:0"></div>
    </div>

    <div id="page-host"></div>
  </main>

</div>

<div class="modal" id="install-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Install app</div>
    <input type="hidden" id="modal-app-id">
    <div class="frow">
      <label for="modal-domain">Domain</label>
      <input id="modal-domain" placeholder="app.example.com">
    </div>
    <div class="frow c2">
      <div><label for="modal-tenant">Tenant</label><input id="modal-tenant" value="default"></div>
      <div><label for="modal-giturl">Git URL (optional)</label><input id="modal-giturl" placeholder="https://github.com/…"></div>
    </div>
    <div class="actions">
      <button id="modal-install">Install</button>
      <button class="sec" id="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
<noscript>
  <div style="padding:40px;max-width:600px;margin:0 auto">
    <h1 style="font-size:20px;margin-bottom:10px">JavaScript is required</h1>
    <p style="color:#93a6c4;font-size:14px">NexusPanel reads live state from the
    running engines, so it needs JavaScript enabled. The platform itself keeps
    running regardless — you can manage it from the CLI with
    <code>node nexus.js status</code>.</p>
  </div>
</noscript>

</body>
</html>
